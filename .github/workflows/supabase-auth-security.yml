name: Supabase Auth Security

run-name: Supabase Auth security · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-auth-security.yml"
      - "scripts/ci/reconcile-supabase-auth-security.mjs"
      - "src/test/supabaseAuthSecurityControl.test.ts"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: irha-production-mutation
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: pvzjiozismyxqrzmtfbi

jobs:
  reconcile-auth-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SOURCE_SHA: ${{ github.sha }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_AUTH_EVIDENCE_PATH: /tmp/supabase-auth-security-evidence.json
      SUPABASE_AUTH_LOG_PATH: /tmp/supabase-auth-security.log

    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Wait for exact commit Quality Gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test "$latest_main" = "$SOURCE_SHA" || {
            echo "Source $SOURCE_SHA was superseded by $latest_main; refusing Auth mutation"
            exit 1
          }

          quality_state=""
          for attempt in $(seq 1 40); do
            quality_state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/status" --jq '[.statuses[] | select(.context == "Irha Quality Gate")][0].state // ""')"
            case "$quality_state" in
              success)
                echo "Exact commit Quality Gate is green: $SOURCE_SHA"
                break
                ;;
              failure|error)
                echo "Exact commit Quality Gate is $quality_state; refusing Auth mutation"
                exit 1
                ;;
              *)
                echo "Quality Gate not final yet (attempt $attempt/40); checking again"
                sleep 15
                ;;
            esac
          done
          test "$quality_state" = "success" || {
            echo "Exact commit Quality Gate did not become green"
            exit 1
          }

          access_token="$(printf '%s' "${SUPABASE_ACCESS_TOKEN:-}" | tr -d '[:space:]')"
          test -n "$access_token" || {
            echo "SUPABASE_ACCESS_TOKEN is unavailable; Auth security cannot be reconciled"
            exit 1
          }

      - name: Reconfirm exact current main before Auth mutation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test "$latest_main" = "$SOURCE_SHA" || {
            echo "Source $SOURCE_SHA was superseded by $latest_main; refusing Auth mutation"
            exit 1
          }

      - name: Reconcile leaked-password protection with sanitized diagnostics
        id: reconcile
        shell: bash
        run: |
          set -uo pipefail
          set +e
          node scripts/ci/reconcile-supabase-auth-security.mjs 2>&1 | tee "$SUPABASE_AUTH_LOG_PATH"
          script_exit=${PIPESTATUS[0]}
          set -e
          echo "script_exit=$script_exit" >> "$GITHUB_OUTPUT"
          echo "Reconciliation process exit code: $script_exit"

      - name: Evaluate Auth reconciliation result
        id: result
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SUPABASE_AUTH_EVIDENCE_PATH" || {
            echo "Auth reconciliation evidence is missing"
            exit 1
          }

          parity="$(jq -r '.parity // "failed"' "$SUPABASE_AUTH_EVIDENCE_PATH")"
          blocked_reason="$(jq -r '.blocked_reason // ""' "$SUPABASE_AUTH_EVIDENCE_PATH")"
          category="$(jq -r '.category // "unknown"' "$SUPABASE_AUTH_EVIDENCE_PATH")"
          http_status="$(jq -r '.error.status // ""' "$SUPABASE_AUTH_EVIDENCE_PATH")"

          case "$parity:$blocked_reason" in
            verified:*)
              echo "result_state=verified" >> "$GITHUB_OUTPUT"
              echo "status_description=Supabase leaked-password protection enabled and verified" >> "$GITHUB_OUTPUT"
              echo "Supabase leaked-password protection is enabled and verified."
              ;;
            blocked:supabase_pro_plan_required)
              echo "result_state=blocked_plan" >> "$GITHUB_OUTPUT"
              echo "status_description=Leaked-password protection requires Supabase Pro; no unsafe change" >> "$GITHUB_OUTPUT"
              echo "Supabase officially blocked leaked-password protection on the current plan."
              ;;
            *)
              echo "result_state=failed" >> "$GITHUB_OUTPUT"
              echo "status_description=Supabase Auth reconciliation failed: $category HTTP ${http_status:-n/a}" >> "$GITHUB_OUTPUT"
              echo "Unexpected Auth reconciliation failure: category=$category HTTP ${http_status:-n/a}"
              cat "$SUPABASE_AUTH_LOG_PATH" 2>/dev/null || true
              exit 1
              ;;
          esac

      - name: Preserve Auth security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-auth-security-${{ env.SOURCE_SHA }}
          path: |
            /tmp/supabase-auth-security-evidence.json
            /tmp/supabase-auth-security.log
          if-no-files-found: warn
          retention-days: 2
          compression-level: 0

      - name: Record Auth security result
        if: always()
        shell: bash
        run: |
          {
            echo "## Supabase Auth security"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Result: \`${{ steps.result.outputs.result_state || 'failed' }}\`"
            echo "- Secret output: redacted"
            echo "- Evidence: short-lived workflow artifact"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish exact commit Auth security status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RESULT_STATE: ${{ steps.result.outputs.result_state }}
          RESULT_DESCRIPTION: ${{ steps.result.outputs.status_description }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description="${RESULT_DESCRIPTION:-Supabase leaked-password protection reconciliation failed}"

          case "$RESULT_STATE" in
            verified|blocked_plan)
              state=success
              ;;
            *)
              state=failure
              ;;
          esac

          if [ "$JOB_STATUS" != "success" ] && [ "$RESULT_STATE" != "blocked_plan" ]; then
            state=failure
          fi

          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state="$state" \
            -f context="Irha Supabase Auth Security" \
            -f description="$(printf '%s' "$description" | cut -c1-140)" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null
