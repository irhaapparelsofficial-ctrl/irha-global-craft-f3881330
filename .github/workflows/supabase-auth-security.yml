name: Supabase Auth Security

run-name: Supabase Auth security · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-auth-security.yml"
      - "scripts/ci/reconcile-supabase-auth-security.mjs"
      - "src/test/supabaseAuthSecurityControl.test.ts"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: irha-production-mutation
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: pvzjiozismyxqrzmtfbi

jobs:
  reconcile-auth-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SOURCE_SHA: ${{ github.sha }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_AUTH_EVIDENCE_PATH: /tmp/supabase-auth-security-evidence.json

    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Wait for exact commit Quality Gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test "$latest_main" = "$SOURCE_SHA" || {
            echo "Source $SOURCE_SHA was superseded by $latest_main; refusing Auth mutation"
            exit 1
          }

          quality_state=""
          for attempt in $(seq 1 40); do
            quality_state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/status" --jq '[.statuses[] | select(.context == "Irha Quality Gate")][0].state // ""')"
            case "$quality_state" in
              success)
                echo "Exact commit Quality Gate is green: $SOURCE_SHA"
                break
                ;;
              failure|error)
                echo "Exact commit Quality Gate is $quality_state; refusing Auth mutation"
                exit 1
                ;;
              *)
                echo "Quality Gate not final yet (attempt $attempt/40); checking again"
                sleep 15
                ;;
            esac
          done
          test "$quality_state" = "success" || {
            echo "Exact commit Quality Gate did not become green"
            exit 1
          }

          access_token="$(printf '%s' "${SUPABASE_ACCESS_TOKEN:-}" | tr -d '[:space:]')"
          test -n "$access_token" || {
            echo "SUPABASE_ACCESS_TOKEN is unavailable; Auth security cannot be reconciled"
            exit 1
          }

      - name: Reconfirm exact current main before Auth mutation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test "$latest_main" = "$SOURCE_SHA" || {
            echo "Source $SOURCE_SHA was superseded by $latest_main; refusing Auth mutation"
            exit 1
          }

      - name: Enable and verify leaked-password protection
        run: node scripts/ci/reconcile-supabase-auth-security.mjs

      - name: Preserve Auth security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-auth-security-${{ env.SOURCE_SHA }}
          path: /tmp/supabase-auth-security-evidence.json
          if-no-files-found: warn
          retention-days: 2
          compression-level: 0

      - name: Publish exact commit Auth security status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description="Supabase leaked-password protection reconciliation failed"
          if [ "$JOB_STATUS" = "success" ]; then
            state=success
            description="Supabase leaked-password protection enabled and verified"
          fi

          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state="$state" \
            -f context="Irha Supabase Auth Security" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null
