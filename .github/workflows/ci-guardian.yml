name: Irha CI Guardian

run-name: Manual CI diagnosis · run ${{ inputs.run_id }}

# Billing-safe by design: this workflow never subscribes to workflow_run and
# never re-runs another workflow automatically. An operator explicitly supplies
# one failed run ID when diagnostic evidence is actually needed.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: GitHub Actions run ID to diagnose
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-guardian-manual-${{ inputs.run_id }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RUN_ID: ${{ inputs.run_id }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Validate requested run ID
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "run_id must be a numeric GitHub Actions run ID"
            exit 1
          }

      - name: Checkout diagnostic source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Collect exact run evidence
        shell: bash
        run: |
          set -euo pipefail

          latest_main="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > /tmp/run.json
          bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" > /tmp/jobs.json
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/failed.log 2>&1 || true

          workflow_name="$(jq -r '.name // "unknown"' /tmp/run.json)"
          conclusion="$(jq -r '.conclusion // "unknown"' /tmp/run.json)"
          head_branch="$(jq -r '.head_branch // "unknown"' /tmp/run.json)"
          head_sha="$(jq -r '.head_sha // "unknown"' /tmp/run.json)"
          run_attempt="$(jq -r '.run_attempt // 1' /tmp/run.json)"

          jq -n \
            --arg workflowName "$workflow_name" \
            --arg conclusion "$conclusion" \
            --arg headBranch "$head_branch" \
            --arg headSha "$head_sha" \
            --arg latestMain "$latest_main" \
            --argjson runAttempt "$run_attempt" \
            --slurpfile jobs /tmp/jobs.json \
            '{workflowName:$workflowName,conclusion:$conclusion,headBranch:$headBranch,headSha:$headSha,latestMain:$latestMain,runAttempt:$runAttempt,jobs:$jobs[0]}' \
            > /tmp/context.json

          node scripts/ci/classify-failure.mjs /tmp/context.json /tmp/failed.log > /tmp/classification.json
          cat /tmp/classification.json

      - name: Publish diagnostic summary
        shell: bash
        run: |
          set -euo pipefail
          workflow_name="$(jq -r '.workflowName // "unknown"' /tmp/context.json)"
          conclusion="$(jq -r '.conclusion // "unknown"' /tmp/context.json)"
          head_branch="$(jq -r '.headBranch // "unknown"' /tmp/context.json)"
          head_sha="$(jq -r '.headSha // "unknown"' /tmp/context.json)"
          classification="$(jq -r '.classification // "unknown"' /tmp/classification.json)"
          retryable="$(jq -r '.retryable // false' /tmp/classification.json)"
          recovery_action="$(jq -r '.recoveryAction // "none"' /tmp/classification.json)"
          reason="$(jq -r '.reason // "No reason reported"' /tmp/classification.json)"

          {
            echo "## Irha CI Guardian — manual diagnosis"
            echo "- Workflow: \`$workflow_name\`"
            echo "- Run: \`$RUN_ID\`"
            echo "- Conclusion: \`$conclusion\`"
            echo "- Source: \`$head_branch\` / \`$head_sha\`"
            echo "- Classification: \`$classification\`"
            echo "- Retryable according to classifier: \`$retryable\`"
            echo "- Suggested recovery action: \`$recovery_action\`"
            echo "- Reason: $reason"
            echo "- Automatic rerun performed: \`false\`"
            echo ""
            echo "This workflow is diagnostic only. Any retry or deployment must be an explicit operator action after the root cause is understood."
          } >> "$GITHUB_STEP_SUMMARY"
