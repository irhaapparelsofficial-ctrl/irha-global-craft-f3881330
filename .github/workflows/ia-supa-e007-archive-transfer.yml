    steps:
      - name: Download encrypted package
        env:
          PACKAGE_URL: ${{ matrix.url }}
          PACKAGE_SHA256: ${{ matrix.sha256 }}
          PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          file="IA-SUPA-E007-O4-part-${PART}.tar.aes256gcm"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 "$PACKAGE_URL" --output "$file"
          echo "$PACKAGE_SHA256  $file" | sha256sum --check -

      - name: Upload encrypted package artifact
        uses: actions/upload-artifact@v4
        with:
          name: IA-SUPA-E007-O4-part-${{ matrix.part }}
          path: IA-SUPA-E007-O4-part-${{ matrix.part }}.tar.aes256gcm
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

