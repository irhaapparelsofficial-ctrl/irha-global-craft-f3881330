name: Actions Storage Cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/actions-storage-cleanup.yml"
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: actions-storage-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete old workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          cutoff_epoch="$(date -u -d '1 day ago' +%s)"
          deleted=0
          kept=0
          page=1

          while :; do
            response="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${REPO}/actions/artifacts?per_page=100&page=${page}")"

            count="$(jq '.artifacts | length' <<<"$response")"
            [ "$count" -eq 0 ] && break

            while IFS=$'\t' read -r id created_at expired name; do
              created_epoch="$(date -u -d "$created_at" +%s)"
              if [ "$expired" = "true" ] || [ "$created_epoch" -lt "$cutoff_epoch" ]; then
                echo "Deleting artifact: $name ($id), created $created_at"
                gh api --method DELETE \
                  -H 'Accept: application/vnd.github+json' \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "/repos/${REPO}/actions/artifacts/${id}"
                deleted=$((deleted + 1))
              else
                kept=$((kept + 1))
              fi
            done < <(jq -r '.artifacts[] | [.id, .created_at, .expired, .name] | @tsv' <<<"$response")

            [ "$count" -lt 100 ] && break
            page=$((page + 1))
          done

          echo "Deleted artifacts: $deleted"
          echo "Kept recent artifacts: $kept"
          {
            echo "## Actions storage cleanup"
            echo "- Deleted artifacts older than 1 day: $deleted"
            echo "- Kept recent artifacts: $kept"
          } >> "$GITHUB_STEP_SUMMARY"
