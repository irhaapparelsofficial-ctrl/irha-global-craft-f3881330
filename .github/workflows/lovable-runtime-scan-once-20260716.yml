name: Lovable runtime dependency scan once

on:
  push:
    branches: [fix/lovable-free-runtime-20260716]
    paths:
      - ".github/workflows/lovable-runtime-scan-once-20260716.yml"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lovable-free-runtime-20260716
          fetch-depth: 0
      - name: Record source-only dependency matches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          {
            echo '# Lovable runtime dependency scan — 2026-07-16'
            echo
            echo 'Source matches only; build output, docs, lockfiles and this workflow are excluded.'
            echo
            echo '```text'
            grep -RInE 'LOVABLE_API_KEY|ai\.gateway\.lovable\.dev|connector-gateway\.lovable\.dev|\.lovable\.app' \
              src supabase public scripts 2>/dev/null \
              --exclude-dir=node_modules --exclude-dir=dist \
              --exclude='*.md' --exclude='*.lock' || true
            echo '```'
          } > docs/LOVABLE_RUNTIME_DEPENDENCY_SCAN_20260716.md
          rm .github/workflows/lovable-runtime-scan-once-20260716.yml
      - name: Commit sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(audit): record Lovable runtime dependency scan"
          git push origin HEAD:fix/lovable-free-runtime-20260716
