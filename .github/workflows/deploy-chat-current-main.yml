name: Deploy Chat Function Current Main

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-chat-current-main
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: pvzjiozismyxqrzmtfbi
  RELEASE_AUDIT_ISSUE: "375"

jobs:
  deploy-chat:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.number == 375 &&
       github.event.comment.body == '/deploy-chat-current-main' &&
       github.event.comment.user.login == 'irhaapparelsofficial-ctrl')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm exact current main source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          checked_out="$(git rev-parse HEAD)"
          test "$checked_out" = "$latest_main" || {
            echo "Refusing stale chat release: checked out $checked_out, current main $latest_main"
            exit 1
          }
          echo "SOURCE_SHA=$latest_main" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify repository and chat release contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || {
            echo "SUPABASE_ACCESS_TOKEN is missing"
            exit 1
          }
          grep -Fx 'project_id = "pvzjiozismyxqrzmtfbi"' supabase/config.toml
          grep -F '[functions.chat]' supabase/config.toml
          grep -F 'verify_jwt = false' supabase/config.toml
          test -s supabase/functions/chat/index.ts
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run verify:deployment-source
          npm run verify:secrets
          npm run verify:migrations
          npx tsc --noEmit
          npm test -- --passWithNoTests

      - name: Deploy only the chat Edge Function
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy chat --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions list --project-ref "$SUPABASE_PROJECT_ID" | tee /tmp/functions.txt
          grep -E '(^|[[:space:]])chat([[:space:]]|$)' /tmp/functions.txt

      - name: Record verified chat release evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment "$RELEASE_AUDIT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Verified targeted chat Edge Function release completed from exact current main \`$SOURCE_SHA\` to Supabase project \`$SUPABASE_PROJECT_ID\`. Only \`chat\` was deployed; no database migrations or other functions were applied."

      - name: Record failed chat release attempt
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$RELEASE_AUDIT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Targeted chat Edge Function release failed for source \`${SOURCE_SHA:-unknown}\`. No success evidence was recorded. Inspect: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
