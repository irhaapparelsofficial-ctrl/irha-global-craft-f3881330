name: Deploy Chat Function Current Main

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY_CHAT to deploy the chat Edge Function from exact current main
        required: true
        default: "NO"
        type: string

permissions:
  contents: read

concurrency:
  group: irha-production-mutation
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: pvzjiozismyxqrzmtfbi

jobs:
  deploy-chat:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY_CHAT'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Checkout exact dispatch source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm exact current main after acquiring production lock
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_main="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          checked_out="$(git rev-parse HEAD)"
          test "$checked_out" = "$latest_main" || {
            echo "Refusing stale chat release: checked out $checked_out, current main $latest_main"
            exit 1
          }
          echo "SOURCE_SHA=$latest_main" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify repository and chat release contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || {
            echo "SUPABASE_ACCESS_TOKEN is missing"
            exit 1
          }
          grep -Fx 'project_id = "pvzjiozismyxqrzmtfbi"' supabase/config.toml
          grep -F '[functions.chat]' supabase/config.toml
          grep -F 'verify_jwt = false' supabase/config.toml
          test -s supabase/functions/chat/index.ts
          bash scripts/ci/retry.sh 3 5 -- npm ci --legacy-peer-deps --no-audit --no-fund
          npm run verify:deployment-source
          npm run verify:secrets
          npm run verify:migrations
          npx tsc --noEmit
          npm test -- --passWithNoTests

      - name: Reconfirm current main immediately before mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_main="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test "$SOURCE_SHA" = "$latest_main" || {
            echo "Chat source $SOURCE_SHA was superseded by $latest_main"
            exit 1
          }

      - name: Deploy only the chat Edge Function with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/retry.sh 3 8 -- supabase functions deploy chat --project-ref "$SUPABASE_PROJECT_ID"
          bash scripts/ci/retry.sh 3 5 -- supabase functions list --project-ref "$SUPABASE_PROJECT_ID" | tee /tmp/functions.txt
          grep -E '(^|[[:space:]])chat([[:space:]]|$)' /tmp/functions.txt

      - name: Record targeted release summary
        shell: bash
        run: |
          {
            echo "## Chat Edge Function release"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Project: \`$SUPABASE_PROJECT_ID\`"
            echo "- Scope: chat only"
            echo "- Shared production lock: \`irha-production-mutation\`"
          } >> "$GITHUB_STEP_SUMMARY"
