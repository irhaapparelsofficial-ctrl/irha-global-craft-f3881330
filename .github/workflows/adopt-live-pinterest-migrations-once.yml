name: Adopt Live Pinterest Migrations Once

on:
  push:
    branches: [fix/supabase-types-drift]
    paths:
      - .github/workflows/adopt-live-pinterest-migrations-once.yml

permissions:
  contents: write

concurrency:
  group: irha-adopt-live-pinterest-migrations-once
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: pvzjiozismyxqrzmtfbi

jobs:
  adopt:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout focused branch
        uses: actions/checkout@v4
        with:
          ref: fix/supabase-types-drift
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Recover exact authenticated live migration artifacts
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${SUPABASE_ACCESS_TOKEN:-}" | tr -d '[:space:]')"
          test -n "$token"
          echo "::add-mask::$token"
          SUPABASE_ACCESS_TOKEN="$token" node <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';

          const projectId = 'pvzjiozismyxqrzmtfbi';
          const token = process.env.SUPABASE_ACCESS_TOKEN.trim();
          const target = [
            ['20260803204636', 'pinterest_oauth_control'],
            ['20260803204702', 'pinterest_oauth_control_verify'],
            ['20260803204750', 'pinterest_bootstrap_guard_indexes'],
            ['20260803210743', 'pinterest_operator_jobs'],
            ['20260803215802', 'pinterest_bootstrap_multiuse'],
            ['20260803215854', 'pinterest_bootstrap_multiuse_noop_check'],
            ['20260803215906', 'pinterest_bootstrap_multiuse_cleanup_noop'],
            ['20260803215920', 'pinterest_bootstrap_multiuse_runtime_marker'],
          ];
          const versions = target.map(([version]) => `'${version}'`).join(',');
          const query = `select version, name, statements from supabase_migrations.schema_migrations where version in (${versions}) order by version`;
          const response = await fetch(`https://api.supabase.com/v1/projects/${projectId}/database/query`, {
            method: 'POST',
            headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' },
            body: JSON.stringify({ query, read_only: true }),
          });
          const payload = await response.json();
          if (!response.ok) throw new Error(`Management API query failed: ${response.status}`);
          const rows = Array.isArray(payload) ? payload
            : Array.isArray(payload.result) ? payload.result
            : Array.isArray(payload.data) ? payload.data
            : Array.isArray(payload.rows) ? payload.rows
            : Array.isArray(payload.result?.rows) ? payload.result.rows
            : [];
          if (rows.length !== target.length) throw new Error(`Expected ${target.length} live migrations, got ${rows.length}`);

          const manifestPath = 'supabase/repository-migrations.json';
          const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
          const existing = new Set(manifest.migrations.map((entry) => String(entry.version)));
          const boundary = '\n-- IRHA-MIGRATION-STATEMENT-BOUNDARY --\n';
          const gitBlobSha = (buffer) => createHash('sha1').update(Buffer.from(`blob ${buffer.length}\0`)).update(buffer).digest('hex');
          const sha256 = (text) => createHash('sha256').update(text, 'utf8').digest('hex');
          const sqlLiteral = (value) => String(value).replaceAll("'", "''");

          for (let index = 0; index < target.length; index += 1) {
            const [expectedVersion, expectedName] = target[index];
            const row = rows[index];
            if (String(row.version) !== expectedVersion || String(row.name) !== expectedName) {
              throw new Error(`Live migration identity mismatch at ${expectedVersion}`);
            }
            if (existing.has(expectedVersion)) throw new Error(`Manifest already contains ${expectedVersion}`);
            const statements = Array.isArray(row.statements) ? row.statements.map(String) : [];
            if (statements.length < 1) throw new Error(`Live migration ${expectedVersion} has no retained statements`);
            const liveStatementHash = sha256(statements.join(boundary));
            const filePath = `supabase/migrations/${expectedVersion}_${expectedName}.sql`;
            const fileText = `${statements.join(`\n\n${boundary.trim()}\n\n`)}\n`;
            const fileBytes = Buffer.from(fileText, 'utf8');
            writeFileSync(filePath, fileBytes);
            const verificationQuery = `select exists (select 1 from supabase_migrations.schema_migrations where version = '${sqlLiteral(expectedVersion)}' and name = '${sqlLiteral(expectedName)}' and encode(extensions.digest(array_to_string(statements, E'\\n-- IRHA-MIGRATION-STATEMENT-BOUNDARY --\\n'), 'sha256'), 'hex') = '${liveStatementHash}') as verified`;
            manifest.migrations.push({
              version: expectedVersion,
              name: expectedName,
              path: filePath,
              git_blob_sha: gitBlobSha(fileBytes),
              execution_mode: 'verified_present',
              transactional_dry_run: false,
              verification_query: verificationQuery,
            });
          }

          manifest.migrations.sort((a, b) => String(a.version).localeCompare(String(b.version)));
          writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`, 'utf8');
          NODE

      - name: Verify repository migration adoption plan without mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          token="$(printf '%s' "${SUPABASE_ACCESS_TOKEN:-}" | tr -d '[:space:]')"
          test -n "$token"
          echo "::add-mask::$token"
          SOURCE_SHA="$(git rev-parse HEAD)" \
          SUPABASE_ACCESS_TOKEN="$token" \
          REPO_MIGRATION_MODE=plan \
          node scripts/ci/reconcile-repository-migrations.mjs

      - name: Commit exact migration artifacts and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/adopt-live-pinterest-migrations-once.yml
          git add supabase/repository-migrations.json supabase/migrations/2026080320*.sql supabase/migrations/2026080321*.sql
          git config user.name "irhaapparelsofficial-ctrl"
          git config user.email "294838484+irhaapparelsofficial-ctrl@users.noreply.github.com"
          git commit -m "fix(migrations): adopt exact live Pinterest history"
          git push origin HEAD:fix/supabase-types-drift
