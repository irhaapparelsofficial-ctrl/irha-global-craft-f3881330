name: Import Kids Lederhosen Batch 14

on:
  push:
    branches:
      - feature/bavarian-kids-lederhosen-batch-14
    paths:
      - .github/workflows/import-kids-lederhosen-batch14.yml

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/bavarian-kids-lederhosen-batch-14
          fetch-depth: 0

      - name: Install verified media tools
        run: python -m pip install --disable-pip-version-check gdown==5.2.0 Pillow==11.3.0

      - name: Download, validate and optimize original Drive images
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image
          import gdown

          assets = {
              "brown-deer-embroidered-kids-lederhosen": "1kjHKfgySoD51V7fDWu06TYEwfWfKyyTa",
              "classic-brown-lace-up-kids-lederhosen": "1SMqhZx6nr8rUR9wC7A-0yanuq7pcfdOF",
              "black-floral-embroidered-kids-lederhosen": "1Yx4xe47Nn_1ee376Z_L_0paDsUsqAP5k",
              "tan-red-lace-side-kids-lederhosen": "1zQ74b3woUpIgse8sm-4K3cFhrwyaVcqd",
              "tan-heart-embroidered-kids-lederhosen": "16EjCYEUeFH-tU8cA5Ao6SDaRPQxu5HNl",
          }

          output_dir = Path("public/media/products/kids-lederhosen")
          output_dir.mkdir(parents=True, exist_ok=True)
          temporary_dir = Path(".tmp-kids-batch14")
          temporary_dir.mkdir(exist_ok=True)

          for slug, file_id in assets.items():
              source = temporary_dir / f"{slug}.jpg"
              result = gdown.download(id=file_id, output=str(source), quiet=False)
              if not result or not source.exists() or source.stat().st_size < 10_000:
                  raise RuntimeError(f"Drive download failed validation for {slug}")

              with Image.open(source) as probe:
                  probe.verify()
              with Image.open(source) as image:
                  image = image.convert("RGB")
                  image.thumbnail((1200, 1200), Image.Resampling.LANCZOS)
                  destination = output_dir / f"{slug}.webp"
                  image.save(destination, "WEBP", quality=88, method=6)
                  if destination.stat().st_size < 8_000:
                      raise RuntimeError(f"Optimized output failed validation for {slug}")
                  print(slug, image.size, destination.stat().st_size)

      - name: Commit validated media atomically
        run: |
          rm -rf .tmp-kids-batch14
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/products/kids-lederhosen
          git rm .github/workflows/import-kids-lederhosen-batch14.yml
          git commit -m "Add verified Kids Lederhosen Drive media"
          git push origin HEAD:feature/bavarian-kids-lederhosen-batch-14
