name: Import Kids Lederhosen Batch 14

on:
  push:
    branches:
      - feature/bavarian-kids-lederhosen-batch-14
    paths:
      - .github/workflows/import-kids-lederhosen-batch14.yml

permissions:
  contents: write

concurrency:
  group: import-kids-lederhosen-batch14
  cancel-in-progress: false

jobs:
  import-media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch with verified source refs
        uses: actions/checkout@v4
        with:
          ref: feature/bavarian-kids-lederhosen-batch-14
          fetch-depth: 0

      - name: Install image validator
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0

      - name: Copy and validate repository-backed originals
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image
          import hashlib
          import subprocess

          source_ref = "origin/fix/authenticated-drive-media-recovery"
          assets = {
              "brown-deer-embroidered-kids-lederhosen": "public/media/bavarian-drive/assets/children/children-s-lederhosen/lederhosen-19.webp",
              "classic-brown-lace-up-kids-lederhosen": "public/media/bavarian-drive/assets/children/children-s-lederhosen/lederhosen-20.webp",
              "black-floral-embroidered-kids-lederhosen": "public/media/bavarian-drive/assets/children/review-only/01-1200x1200-2.webp",
              "tan-red-lace-side-kids-lederhosen": "public/media/bavarian-drive/assets/children/children-s-lederhosen/lederhosen-24.webp",
              "tan-heart-embroidered-kids-lederhosen": "public/media/bavarian-drive/assets/children/children-s-lederhosen/lederhosen-23.webp",
          }

          output_dir = Path("public/media/products/kids-lederhosen")
          temporary_dir = Path(".tmp-kids-batch14")
          temporary_dir.mkdir(exist_ok=True)

          # Preflight every source before touching the final output directory.
          staged = []
          for slug, source_path in assets.items():
              probe = subprocess.run(
                  ["git", "cat-file", "-e", f"{source_ref}:{source_path}"],
                  capture_output=True,
                  text=True,
              )
              if probe.returncode != 0:
                  raise RuntimeError(f"Verified source missing: {source_ref}:{source_path}")

              staged_path = temporary_dir / f"{slug}.webp"
              data = subprocess.check_output(["git", "show", f"{source_ref}:{source_path}"])
              staged_path.write_bytes(data)
              if staged_path.stat().st_size < 8_000:
                  raise RuntimeError(f"Source output too small for {slug}: {staged_path.stat().st_size}")

              with Image.open(staged_path) as image:
                  image.verify()
              with Image.open(staged_path) as image:
                  if image.format != "WEBP" or image.width < 800 or image.height < 800:
                      raise RuntimeError(
                          f"Invalid source for {slug}: format={image.format}, size={image.size}"
                      )

              staged.append((slug, staged_path, hashlib.sha256(data).hexdigest()))

          output_dir.mkdir(parents=True, exist_ok=True)
          for slug, staged_path, digest in staged:
              destination = output_dir / f"{slug}.webp"
              destination.write_bytes(staged_path.read_bytes())
              print(slug, destination.stat().st_size, digest)

      - name: Commit validated media atomically
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-kids-batch14
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/products/kids-lederhosen
          git rm .github/workflows/import-kids-lederhosen-batch14.yml
          git commit -m "Add verified Kids Lederhosen repository media"
          git push origin HEAD:feature/bavarian-kids-lederhosen-batch-14
