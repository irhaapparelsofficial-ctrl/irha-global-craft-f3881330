name: Temporary Search Route State Seal

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  seal:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/indexnow-material-change-parity-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_LIVE_SHA: 1dad9ac9b9f871d79e35b9b5f20d955059f46696
      CANONICAL_ORIGIN: https://irhaapparels.com

    steps:
      - name: Checkout focused repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
          persist-credentials: true

      - name: Fetch exact current production route manifest
        shell: bash
        run: |
          set -euo pipefail
          cache_bust="${EXPECTED_LIVE_SHA::12}-$RANDOM"
          curl -fsSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' \
            "$CANONICAL_ORIGIN/build.json?route_state_seal=$cache_bust" -o /tmp/live-build.json
          jq -e --arg sha "$EXPECTED_LIVE_SHA" --arg origin "$CANONICAL_ORIGIN" \
            '.source_commit == $sha and .source_identity_state == "verified" and .expected_origin == $origin' \
            /tmp/live-build.json >/dev/null
          curl -fsSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' \
            "$CANONICAL_ORIGIN/seo-route-manifest.json?route_state_seal=$cache_bust" \
            -o /tmp/live-seo-route-manifest.json
          node scripts/generate-search-route-state.mjs \
            --input /tmp/live-seo-route-manifest.json \
            --output seo/search-route-state.json

      - name: Verify package scope and commit exact baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          git show origin/main:package.json > /tmp/main-package.json
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const base = JSON.parse(fs.readFileSync('/tmp/main-package.json', 'utf8'));
          const current = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          for (const name of ['generate:market-sitemap', 'prepare:public-assets']) {
            current.scripts[name] = base.scripts[name];
          }
          assert.deepEqual(current, base, 'package.json changed outside the two approved search-state scripts');
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo/search-route-state.json
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "chore(search): record exact material route baseline"
          git push origin "HEAD:${{ github.head_ref }}"
