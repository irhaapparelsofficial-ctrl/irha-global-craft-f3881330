name: Lovable-free runtime smoke once

on:
  push:
    branches: [ops/external-hardening-20260716]
    paths:
      - ".github/workflows/lovable-free-runtime-smoke-once-20260716.yml"

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: https://pvzjiozismyxqrzmtfbi.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_FG8JlthvLLBD3W5Aj84E3g_U6Bzp9zv
      SMOKE_SESSION_ID: irha-lovable-free-smoke-20260716-final
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/external-hardening-20260716
          fetch-depth: 0

      - name: Verify public and protected runtime behavior
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "authorization: Bearer $SUPABASE_PUBLISHABLE_KEY")

          chat_payload="$(jq -nc --arg session "$SMOKE_SESSION_ID" '{sessionId:$session,messages:[{role:"user",content:"Which custom apparel product programmes can Irha Apparels manufacture for B2B buyers?"}],pageContext:{path:"/",title:"Irha Apparels"}}')"
          chat_http="$(curl -sS -D /tmp/chat-headers -o /tmp/chat-body -w '%{http_code}' -X POST \
            "${auth[@]}" \
            -H 'Origin: https://irhaapparels.com' \
            -H 'Content-Type: application/json' \
            --data "$chat_payload" \
            "$SUPABASE_URL/functions/v1/chat")"
          provider="$(awk 'BEGIN{IGNORECASE=1} /^x-irha-ai-provider:/ {gsub(/\r/,""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' /tmp/chat-headers)"
          done_marker="$(grep -c 'data: \[DONE\]' /tmp/chat-body || true)"

          sitemap_http="$(curl -sS -o /tmp/sitemap-body -w '%{http_code}' -X POST \
            "${auth[@]}" \
            -H 'Origin: https://irhaapparels.com' \
            -H 'Content-Type: application/json' \
            --data '{}' \
            "$SUPABASE_URL/functions/v1/sitemap-ping")"
          sitemap_code="$(jq -r '.code // .error // "unknown"' /tmp/sitemap-body 2>/dev/null || echo invalid-json)"

          protected_http="$(curl -sS -o /tmp/protected-body -w '%{http_code}' -X POST \
            -H 'Origin: https://irhaapparels.com' \
            -H 'Content-Type: application/json' \
            --data '{}' \
            "$SUPABASE_URL/functions/v1/multilingual-seo")"

          chat_ok=false
          sitemap_ok=false
          protected_ok=false
          if [ "$chat_http" = "200" ] && [ "$done_marker" -ge 1 ] && [ -n "$provider" ] && [ "$provider" != "lovable-ai-gateway" ]; then chat_ok=true; fi
          if [ "$sitemap_http" = "503" ] && [ "$sitemap_code" = "lovable_runtime_disabled" ]; then sitemap_ok=true; fi
          if [ "$protected_http" = "401" ] || [ "$protected_http" = "403" ]; then protected_ok=true; fi

          mkdir -p docs
          cat > docs/LOVABLE_FREE_RUNTIME_SMOKE_20260716.md <<EOF
          # Lovable-free runtime smoke — 2026-07-16

          - Chat HTTP: \`$chat_http\`
          - Chat provider: \`$provider\`
          - Chat stream completed: \`$chat_ok\`
          - Sitemap connector HTTP: \`$sitemap_http\`
          - Sitemap connector state: \`$sitemap_code\`
          - Sitemap safe-block verified: \`$sitemap_ok\`
          - Protected admin engine without JWT: \`$protected_http\`
          - Authentication gate verified: \`$protected_ok\`
          - Synthetic chat session: \`$SMOKE_SESSION_ID\`

          No secret values or response bodies are stored. The synthetic chat rows must be removed after database verification.
          EOF

          rm -f /tmp/chat-headers /tmp/chat-body /tmp/sitemap-body /tmp/protected-body
          rm .github/workflows/lovable-free-runtime-smoke-once-20260716.yml

          if [ "$chat_ok" != true ] || [ "$sitemap_ok" != true ] || [ "$protected_ok" != true ]; then
            echo "Runtime smoke failed: chat=$chat_ok sitemap=$sitemap_ok protected=$protected_ok" >&2
            exit 1
          fi

      - name: Commit sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(runtime): record Lovable-free smoke evidence"
          git push origin HEAD:ops/external-hardening-20260716
