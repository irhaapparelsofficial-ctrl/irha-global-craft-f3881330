name: GP-4 Search Route State Refresh

on:
  push:
    branches:
      - gp4/commercial-seo-20260810
    paths:
      - .github/workflows/gp4-refresh-search-route-state.yml

permissions:
  contents: write

concurrency:
  group: gp4-search-route-state-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: gp4/commercial-seo-20260810
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Regenerate material search state from the exact build
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const from = 'node scripts/generate-search-route-state.mjs --input dist/seo-route-manifest.json --output seo/search-route-state.json --check';
          const to = 'node scripts/generate-search-route-state.mjs --input dist/seo-route-manifest.json --output seo/search-route-state.json --write';
          if (!pkg.scripts.build.includes(from)) throw new Error('build search-state contract not found');
          pkg.scripts.build = pkg.scripts.build.replace(from, to);
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          npm run build
          git checkout -- package.json

      - name: Verify exact generated state and full normal build
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const path = 'seo/search-route-state.json';
          const bytes = fs.readFileSync(path);
          const state = JSON.parse(bytes.toString('utf8'));
          if (state.schemaVersion !== 1) throw new Error(`unexpected schemaVersion ${state.schemaVersion}`);
          if (state.canonicalOrigin !== 'https://irhaapparels.com') throw new Error(`unexpected origin ${state.canonicalOrigin}`);
          if (state.routeCount !== 436 || state.routes.length !== 436) throw new Error(`unexpected route count ${state.routeCount}/${state.routes.length}`);
          if (state.contentDigest !== 'sha256:9aecf09f445db5659da2bf42efa08661af08e7a556c305ae2a11d0a0d88ad1ca') throw new Error(`unexpected content digest ${state.contentDigest}`);
          const header = Buffer.from(`blob ${bytes.length}\0`);
          const blobSha = crypto.createHash('sha1').update(header).update(bytes).digest('hex');
          if (blobSha !== 'ecad0e878e273e19ad468bcc2b5b89306e355d1c') throw new Error(`unexpected git blob sha ${blobSha}`);
          console.log(`[gp4] exact generated state verified: ${blobSha}`);
          NODE
          node scripts/generate-search-route-state.mjs --input dist/seo-route-manifest.json --output seo/search-route-state.json --check
          npx tsc --noEmit
          npm test -- --passWithNoTests
          npm run build

      - name: Commit only the exact generated state
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test "$(git status --short | awk '{print $2}' | paste -sd ' ' -)" = "seo/search-route-state.json"
          git config user.name "irha-gp4-generated-state[bot]"
          git config user.email "irha-gp4-generated-state[bot]@users.noreply.github.com"
          git add seo/search-route-state.json
          git commit -m "GP-4: pin exact generated search route state"
          git push origin HEAD:gp4/commercial-seo-20260810
