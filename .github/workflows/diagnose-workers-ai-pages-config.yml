name: Diagnose Workers AI Pages Config

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: diagnose-workers-ai-pages-config
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.number == 375 &&
       github.event.comment.body == '/diagnose-workers-ai-config-current-main' &&
       github.event.comment.user.login == 'irhaapparelsofficial-ctrl')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      RELEASE_AUDIT_ISSUE: "375"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}

    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run read-only Pages config diagnostic
        id: diagnostic
        shell: bash
        run: |
          set +e
          report=/tmp/workers-ai-pages-config-diagnostic.md
          detail=/tmp/workers-ai-pages-config-detail.log
          stdout_log=/tmp/wrangler-pages-config.stdout
          stderr_log=/tmp/wrangler-pages-config.stderr
          workspace="$GITHUB_WORKSPACE"
          source_sha="$(git rev-parse HEAD 2>/dev/null || printf unknown)"
          stage="preflight"
          result="failure"
          exit_code=1
          config_file="none"

          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '[:space:]')"
          raw_account_id="$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID:-}" | tr -d '[:space:]')"
          project_name="$(printf '%s' "${CLOUDFLARE_PROJECT_NAME:-}" | tr -d '[:space:]')"

          [ -n "$token" ] && echo "::add-mask::$token"
          [ -n "$raw_account_id" ] && echo "::add-mask::$raw_account_id"

          if [ -z "$token" ]; then
            printf '%s\n' 'CLOUDFLARE_API_TOKEN is missing.' > "$detail"
          elif [ -z "$project_name" ]; then
            printf '%s\n' 'CLOUDFLARE_PROJECT_NAME is missing.' > "$detail"
          else
            stage="token-verification"
            verify_json="$(curl -sS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' https://api.cloudflare.com/client/v4/user/tokens/verify 2>"$stderr_log")"
            curl_code=$?
            if [ "$curl_code" -ne 0 ] || [ "$(printf '%s' "$verify_json" | jq -r '.success // false' 2>/dev/null)" != "true" ]; then
              printf '%s\n' 'Cloudflare token verification failed.' > "$detail"
              cat "$stderr_log" >> "$detail"
            else
              account_id="$raw_account_id"
              if ! [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
                account_id="$(printf '%s' "$raw_account_id" | grep -Eo '[0-9a-fA-F]{32}' | head -n 1 || true)"
              fi
              if ! [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
                accounts_json="$(curl -sS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/accounts?per_page=50' 2>"$stderr_log")"
                if [ "$(printf '%s' "$accounts_json" | jq -r '.success // false' 2>/dev/null)" = "true" ] && [ "$(printf '%s' "$accounts_json" | jq -r '(.result // []) | length' 2>/dev/null)" = "1" ]; then
                  account_id="$(printf '%s' "$accounts_json" | jq -r '.result[0].id // empty')"
                fi
              fi

              if ! [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
                stage="account-resolution"
                printf '%s\n' 'Cloudflare account ID could not be resolved to one account.' > "$detail"
              else
                echo "::add-mask::$account_id"
                stage="project-verification"
                project_json="$(curl -sS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/$account_id/pages/projects/$project_name" 2>"$stderr_log")"
                if [ "$(printf '%s' "$project_json" | jq -r '.success // false' 2>/dev/null)" != "true" ]; then
                  printf '%s\n' 'Cloudflare Pages project lookup failed.' > "$detail"
                  printf '%s' "$project_json" | jq -c '{success,errors}' 2>/dev/null >> "$detail"
                  cat "$stderr_log" >> "$detail"
                else
                  export CLOUDFLARE_API_TOKEN="$token"
                  export CLOUDFLARE_ACCOUNT_ID="$account_id"
                  export CLOUDFLARE_PROJECT_NAME="$project_name"
                  workdir="$(mktemp -d)"
                  cd "$workdir" || exit 1

                  stage="wrangler-download"
                  npx --yes wrangler@latest pages download config "$project_name" --force >"$stdout_log" 2>"$stderr_log"
                  exit_code=$?
                  if [ "$exit_code" -ne 0 ]; then
                    {
                      printf '%s\n' "wrangler pages download config exited with code $exit_code."
                      cat "$stderr_log"
                      cat "$stdout_log"
                    } > "$detail"
                  else
                    mapfile -t config_files < <(find . -maxdepth 1 -type f \( -name 'wrangler.toml' -o -name 'wrangler.json' -o -name 'wrangler.jsonc' \) -printf '%f\n' | sort)
                    if [ "${#config_files[@]}" -ne 1 ]; then
                      stage="config-detection"
                      exit_code=1
                      printf 'Expected exactly one downloaded config; found %s: %s\n' "${#config_files[@]}" "${config_files[*]:-none}" > "$detail"
                    else
                      config_file="${config_files[0]}"
                      stage="config-preparation"
                      node "$workspace/scripts/prepare-cloudflare-ai-pages-config.mjs" "$config_file" >"$stdout_log" 2>"$stderr_log"
                      exit_code=$?
                      if [ "$exit_code" -ne 0 ]; then
                        {
                          printf '%s\n' "prepare-cloudflare-ai-pages-config exited with code $exit_code."
                          cat "$stderr_log"
                          cat "$stdout_log"
                        } > "$detail"
                      else
                        stage="complete"
                        result="success"
                        exit_code=0
                        printf '%s\n' 'Read-only config download and AI-binding preparation succeeded in an isolated temporary directory.' > "$detail"
                      fi
                    fi
                  fi
                fi
              fi
            fi
          fi

          sanitized="$(sed -E $'s/\033\[[0-9;]*[mK]//g; s/[0-9a-fA-F]{32}/[masked-32hex]/g; s/(Bearer[[:space:]]+)[A-Za-z0-9._~-]+/\\1[masked]/g' "$detail" 2>/dev/null | tail -n 50 | head -c 6000)"
          {
            echo '## Workers AI Pages config diagnostic'
            echo
            echo "- Source: \`$source_sha\`"
            echo "- Result: \`$result\`"
            echo "- Failed/completed stage: \`$stage\`"
            echo "- Exit code: \`$exit_code\`"
            echo "- Detected config: \`$config_file\`"
            echo '- Cloudflare mutation: `none` (read-only project lookup and config download only)'
            echo
            echo '```text'
            printf '%s\n' "$sanitized"
            echo '```'
          } > "$report"

          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Record sanitized diagnostic evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s /tmp/workers-ai-pages-config-diagnostic.md
          gh issue comment "$RELEASE_AUDIT_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/workers-ai-pages-config-diagnostic.md
