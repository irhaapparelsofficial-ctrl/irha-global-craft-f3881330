name: Restore Types To Main Once

on:
  push:
    branches: [fix/supabase-types-drift]
    paths:
      - .github/workflows/restore-types-to-main-once.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout focused branch
        uses: actions/checkout@v4
        with:
          ref: fix/supabase-types-drift
          fetch-depth: 2

      - name: Restore generated types from exact base main and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- src/integrations/supabase/types.ts
          git rm .github/workflows/restore-types-to-main-once.yml
          git add src/integrations/supabase/types.ts
          git config user.name "irhaapparelsofficial-ctrl"
          git config user.email "294838484+irhaapparelsofficial-ctrl@users.noreply.github.com"
          git commit -m "chore(scope): isolate live migration adoption"
          git push origin HEAD:fix/supabase-types-drift
