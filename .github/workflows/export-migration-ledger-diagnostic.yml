name: Export Migration Ledger Diagnostic

on:
  push:
    branches:
      - diag/migration-ledger-export-20260717

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build migration manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0 \
            | sort -z \
            | xargs -0 sha256sum > diagnostics/migration-sha256.txt
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sort > diagnostics/migration-files.txt
          cp -R supabase/migrations diagnostics/migrations

      - name: Upload read-only migration ledger
        uses: actions/upload-artifact@v4
        with:
          name: migration-ledger-diagnostic-${{ github.sha }}
          path: diagnostics
          if-no-files-found: error
          retention-days: 3
