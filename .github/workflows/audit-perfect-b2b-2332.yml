name: Audit perfect B2B b490

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE_SHA: b490221ea635651ad60cc06de9a58abc9842ab10
      LIVE_ORIGIN: https://irhaapparels.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for exact production source
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            if curl -fsSL --max-time 40 -H 'Cache-Control: no-cache' "$LIVE_ORIGIN/build.json?audit=${EXPECTED_SOURCE_SHA::12}-$attempt-$RANDOM" -o live-build.json \
              && jq -e --arg sha "$EXPECTED_SOURCE_SHA" '.source_commit==$sha and .source_identity_state=="verified"' live-build.json >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Install browser
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Audit mobile desktop and support
        shell: bash
        run: |
          cat > audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const origin = process.env.LIVE_ORIGIN;
          const expectedSource = process.env.EXPECTED_SOURCE_SHA;
          const browser = await chromium.launch({ headless: true });
          const out = { expectedSource, mobile: {}, desktop: {}, routes: {}, errors: [] };

          async function acceptEssential(page, path) {
            const dialog = page.getByRole('dialog', { name: /optional cookies/i });
            const visible = await dialog.isVisible().catch(() => false);
            let background = null;
            if (visible) {
              background = await dialog.evaluate((el) => getComputedStyle(el).backgroundColor);
              await page.screenshot({ path, fullPage: false });
              await page.getByRole('button', { name: /essential only/i }).click();
              await page.waitForTimeout(500);
            }
            return { visible, background };
          }

          async function imageReady(page, alt) {
            return page.locator(`img[alt="${alt}"]`).evaluate((img) => img.complete && img.naturalWidth > 0).catch(() => false);
          }

          const mobileContext = await browser.newContext({ viewport: { width: 390, height: 844 }, locale: 'en-GB' });
          const mobile = await mobileContext.newPage();
          mobile.on('pageerror', (e) => out.errors.push(`mobile:${e.message}`));
          const mr = await mobile.goto(`${origin}/?audit_mobile=${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 90000 });
          await mobile.waitForTimeout(3500);
          const mc = await acceptEssential(mobile, '01-mobile-cookie.png');
          const mobileDims = await mobile.evaluate(() => ({ innerWidth, scrollWidth: document.documentElement.scrollWidth, bodyWidth: document.body.scrollWidth }));
          out.mobile = {
            status: mr?.status(), cookie: mc,
            logo: await mobile.locator('img[src="/irha-brand-mark.svg"]').first().isVisible().catch(() => false),
            quote: await mobile.getByText('Request quote', { exact: false }).first().isVisible().catch(() => false),
            dock: await mobile.locator('.sticky-mobile-cta').isVisible().catch(() => false),
            guideLauncher: await mobile.getByRole('button', { name: /Open Irha Live Support/i }).isVisible().catch(() => false),
            humanLauncher: await mobile.getByRole('button', { name: /Open live chat with the Irha Apparels team/i }).isVisible().catch(() => false),
            sports: await imageReady(mobile, 'Custom sportswear manufacturing'),
            leather: await imageReady(mobile, 'Custom leather apparel manufacturing'),
            dimensions: mobileDims,
          };
          await mobile.screenshot({ path: '02-mobile-home.png', fullPage: false });
          await mobile.screenshot({ path: '03-mobile-full.png', fullPage: true });
          await mobile.getByRole('button', { name: /Open live support with the AI guide or Irha human team/i }).click();
          await mobile.waitForTimeout(800);
          out.mobile.aiDialog = await mobile.locator('section[data-chat-kind="ai-guide"]').isVisible().catch(() => false);
          out.mobile.humanTab = await mobile.getByRole('button', { name: /Human Team/i }).isVisible().catch(() => false);
          await mobile.screenshot({ path: '04-mobile-support.png', fullPage: false });
          if (out.mobile.humanTab) {
            await mobile.getByRole('button', { name: /Human Team/i }).click();
            await mobile.waitForTimeout(900);
          }
          out.mobile.humanDialog = await mobile.locator('section[data-chat-kind="human"]').isVisible().catch(() => false);
          await mobile.screenshot({ path: '05-mobile-human.png', fullPage: false });
          await mobileContext.close();

          const desktopContext = await browser.newContext({ viewport: { width: 1440, height: 900 }, locale: 'en-GB' });
          const desktop = await desktopContext.newPage();
          desktop.on('pageerror', (e) => out.errors.push(`desktop:${e.message}`));
          const dr = await desktop.goto(`${origin}/?audit_desktop=${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 90000 });
          await desktop.waitForTimeout(3500);
          const dc = await acceptEssential(desktop, '06-desktop-cookie.png');
          const desktopDims = await desktop.evaluate(() => ({ innerWidth, scrollWidth: document.documentElement.scrollWidth, bodyWidth: document.body.scrollWidth }));
          const visibleWhatsApp = await desktop.locator('a[href*="wa.me"],a[href*="api.whatsapp.com"]').evaluateAll((els) => els.filter((el) => {
            const s = getComputedStyle(el); const r = el.getBoundingClientRect(); return s.display !== 'none' && s.visibility !== 'hidden' && r.width > 0 && r.height > 0;
          }).length).catch(() => 0);
          out.desktop = {
            status: dr?.status(), cookie: dc,
            logo: await desktop.locator('img[src="/irha-brand-mark.svg"]').first().isVisible().catch(() => false),
            nav: await desktop.getByRole('navigation').first().isVisible().catch(() => false),
            quote: await desktop.getByText('Request quote', { exact: false }).first().isVisible().catch(() => false),
            dock: await desktop.locator('.sticky-mobile-cta').isVisible().catch(() => false),
            guideLauncher: await desktop.getByRole('button', { name: /Open Irha Live Support/i }).isVisible().catch(() => false),
            humanLauncher: await desktop.getByRole('button', { name: /Open live chat with the Irha Apparels team/i }).isVisible().catch(() => false),
            visibleWhatsApp,
            sports: await imageReady(desktop, 'Custom sportswear manufacturing'),
            leather: await imageReady(desktop, 'Custom leather apparel manufacturing'),
            dimensions: desktopDims,
          };
          await desktop.screenshot({ path: '07-desktop-home.png', fullPage: false });
          await desktop.screenshot({ path: '08-desktop-full.png', fullPage: true });
          if (out.desktop.guideLauncher) {
            await desktop.getByRole('button', { name: /Open Irha Live Support/i }).click();
            await desktop.waitForTimeout(800);
          }
          out.desktop.aiDialog = await desktop.locator('section[data-chat-kind="ai-guide"]').isVisible().catch(() => false);
          out.desktop.humanTab = await desktop.getByRole('button', { name: /Human Team/i }).isVisible().catch(() => false);
          await desktop.screenshot({ path: '09-desktop-support.png', fullPage: false });
          for (const path of ['/products', '/inquiry', '/catalogue']) {
            const r = await desktop.goto(`${origin}${path}?audit=${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 90000 });
            await desktop.waitForTimeout(900);
            out.routes[path] = { status: r?.status(), finalUrl: desktop.url() };
          }
          await desktopContext.close();
          await browser.close();
          await writeFile('perfect-b2b-audit.json', JSON.stringify(out, null, 2));
          console.log(JSON.stringify(out, null, 2));

          const dark = (v) => !v || /rgba?\((?:0|9),\s*(?:0|9),\s*(?:0|9)/.test(v);
          const mNoOverflow = out.mobile.dimensions.scrollWidth <= out.mobile.dimensions.innerWidth + 2 && out.mobile.dimensions.bodyWidth <= out.mobile.dimensions.innerWidth + 2;
          const dNoOverflow = out.desktop.dimensions.scrollWidth <= out.desktop.dimensions.innerWidth + 2 && out.desktop.dimensions.bodyWidth <= out.desktop.dimensions.innerWidth + 2;
          const checks = [
            out.mobile.status===200,dark(out.mobile.cookie.background),out.mobile.logo,out.mobile.quote,out.mobile.dock,!out.mobile.guideLauncher,!out.mobile.humanLauncher,out.mobile.sports,out.mobile.leather,mNoOverflow,out.mobile.aiDialog,out.mobile.humanTab,out.mobile.humanDialog,
            out.desktop.status===200,dark(out.desktop.cookie.background),out.desktop.logo,out.desktop.nav,out.desktop.quote,!out.desktop.dock,out.desktop.guideLauncher,!out.desktop.humanLauncher,out.desktop.visibleWhatsApp===0,out.desktop.sports,out.desktop.leather,dNoOverflow,out.desktop.aiDialog,out.desktop.humanTab,out.errors.length===0,
          ];
          for (const route of Object.values(out.routes)) checks.push(route.status===200);
          if (checks.some((x) => !x)) process.exitCode = 1;
          EOF
          node audit.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perfect-b2b-b490-audit
          path: |
            live-build.json
            perfect-b2b-audit.json
            01-mobile-cookie.png
            02-mobile-home.png
            03-mobile-full.png
            04-mobile-support.png
            05-mobile-human.png
            06-desktop-cookie.png
            07-desktop-home.png
            08-desktop-full.png
            09-desktop-support.png
          if-no-files-found: warn
          retention-days: 2
