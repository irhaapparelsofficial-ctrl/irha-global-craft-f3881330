name: Lovable runtime lock bootstrap

on:
  push:
    branches: [fix/lovable-free-runtime-20260716]
    paths:
      - ".github/workflows/lovable-runtime-lock-bootstrap-20260716.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lovable-free-runtime-20260716
          fetch-depth: 0
      - name: Apply default-deny runtime gate and sitemap RPC hardening
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          helper = '''\nfunction irhaLovableRuntimeKey(): string | undefined {\n  if (Deno.env.get("IRHA_ENABLE_LOVABLE_RUNTIME") !== "true") return undefined;\n  return Deno.env.get("LOVABLE_API_KEY") || undefined;\n}\n'''

          changed = []
          for path in sorted(Path('supabase/functions').glob('*/index.*')):
              if path.suffix not in {'.ts', '.js'}:
                  continue
              text = path.read_text()
              if 'Deno.env.get("LOVABLE_API_KEY")' not in text and "Deno.env.get('LOVABLE_API_KEY')" not in text:
                  continue
              if 'function irhaLovableRuntimeKey()' in text:
                  continue
              text = text.replace('Deno.env.get("LOVABLE_API_KEY")', 'irhaLovableRuntimeKey()')
              text = text.replace("Deno.env.get('LOVABLE_API_KEY')", 'irhaLovableRuntimeKey()')
              imports = list(re.finditer(r'^import .*?;\s*$', text, flags=re.M))
              if imports:
                  pos = imports[-1].end()
                  text = text[:pos] + helper + text[pos:]
              else:
                  text = helper.lstrip() + '\n' + text
              path.write_text(text)
              changed.append(str(path))

          scheduler = Path('supabase/functions/scheduled-sitemap-submit/index.ts')
          scheduler_text = scheduler.read_text()
          scheduler_text = scheduler_text.replace(
              'const anonKey = Deno.env.get("SUPABASE_ANON_KEY") || "";',
              'const serviceRoleKey = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY") || "";',
          )
          scheduler_text = scheduler_text.replace(
              'if (!supabaseUrl || !anonKey || !gatewayKey)',
              'if (!supabaseUrl || !serviceRoleKey || !gatewayKey)',
          )
          scheduler_text = scheduler_text.replace(
              'const supabase = createClient(supabaseUrl, anonKey, {',
              'const supabase = createClient(supabaseUrl, serviceRoleKey, {',
          )
          if 'anonKey' in scheduler_text:
              raise SystemExit('scheduled sitemap function still uses anonKey')
          scheduler.write_text(scheduler_text)

          gsc_test = Path('src/lib/__checks__/gscDailySitemapAutomation.test.ts')
          if gsc_test.exists():
              test_text = gsc_test.read_text().replace(
                  'gsc: Boolean(Deno.env.get("LOVABLE_API_KEY"))',
                  'gsc: Boolean(irhaLovableRuntimeKey())',
              )
              gsc_test.write_text(test_text)

          public_test = Path('src/test/publicPlatformContracts.test.ts')
          if public_test.exists():
              test_text = public_test.read_text()
              old = 'expect(chatFunction).toContain("ai.gateway.lovable.dev/v1/chat/completions");'
              new = '''expect(chatFunction).toContain("ai.gateway.lovable.dev/v1/chat/completions");\n    expect(chatFunction).toContain("IRHA_ENABLE_LOVABLE_RUNTIME");'''
              if old in test_text and 'expect(chatFunction).toContain("IRHA_ENABLE_LOVABLE_RUNTIME")' not in test_text:
                  test_text = test_text.replace(old, new, 1)
              public_test.write_text(test_text)

          Path('src/lib/__checks__/lovableRuntimeDefaultDeny.test.ts').write_text('''import { readdirSync, readFileSync, statSync } from "node:fs";\nimport { join } from "node:path";\nimport { describe, expect, it } from "vitest";\n\nfunction filesUnder(root: string): string[] {\n  return readdirSync(root).flatMap((name) => {\n    const path = join(root, name);\n    return statSync(path).isDirectory() ? filesUnder(path) : [path];\n  });\n}\n\ndescribe("Lovable runtime is explicit opt-in only", () => {\n  it("gates every Edge Function key read behind a new default-deny flag", () => {\n    const sources = filesUnder("supabase/functions").filter((path) => /\\.(ts|js)$/.test(path));\n    const consumers = sources.filter((path) => readFileSync(path, "utf8").includes("LOVABLE_API_KEY"));\n    expect(consumers.length).toBeGreaterThan(0);\n\n    for (const path of consumers) {\n      const source = readFileSync(path, "utf8");\n      const directReads = source.match(/Deno\\.env\\.get\\(["']LOVABLE_API_KEY["']\\)/g) ?? [];\n      expect(source, path).toContain("IRHA_ENABLE_LOVABLE_RUNTIME");\n      expect(source, path).toContain("function irhaLovableRuntimeKey()");\n      expect(directReads.length, path).toBe(1);\n      expect(source, path).toContain('Deno.env.get("IRHA_ENABLE_LOVABLE_RUNTIME") !== "true"');\n    }\n  });\n\n  it("keeps the scheduled sitemap database client on service role", () => {\n    const source = readFileSync("supabase/functions/scheduled-sitemap-submit/index.ts", "utf8");\n    expect(source).toContain('Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")');\n    expect(source).not.toContain('Deno.env.get("SUPABASE_ANON_KEY")');\n    expect(source).toContain("createClient(supabaseUrl, serviceRoleKey");\n  });\n});\n''')

          Path('supabase/migrations/20260716035000_lock_sitemap_scheduler_rpcs.sql').write_text('''-- Sitemap scheduler RPCs are internal implementation details.\n-- The Edge Function uses service_role after this migration; browsers and generic\n-- signed-in sessions must not execute the SECURITY DEFINER functions directly.\n\nBEGIN;\n\nREVOKE EXECUTE ON FUNCTION public.claim_sitemap_submission(text)\n  FROM anon, authenticated;\nREVOKE EXECUTE ON FUNCTION public.record_sitemap_submission_result(text, boolean, integer, text)\n  FROM anon, authenticated;\n\nGRANT EXECUTE ON FUNCTION public.claim_sitemap_submission(text) TO service_role;\nGRANT EXECUTE ON FUNCTION public.record_sitemap_submission_result(text, boolean, integer, text) TO service_role;\n\nCOMMENT ON FUNCTION public.claim_sitemap_submission(text) IS\n  'Internal scheduler claim. Direct browser access is denied; scheduled-sitemap-submit calls it with service_role.';\nCOMMENT ON FUNCTION public.record_sitemap_submission_result(text, boolean, integer, text) IS\n  'Internal scheduler result recorder. Direct browser access is denied; scheduled-sitemap-submit calls it with service_role.';\n\nCOMMIT;\n''')

          result = Path('docs/LOVABLE_RUNTIME_LOCK_20260716.md')
          result.write_text('# Lovable runtime default-deny lock — 2026-07-16\n\n' +
              '- Every Edge Function source that reads `LOVABLE_API_KEY` now uses `irhaLovableRuntimeKey()`.\n' +
              '- The helper returns no key unless `IRHA_ENABLE_LOVABLE_RUNTIME=true` is explicitly configured.\n' +
              '- That new enable flag is not part of the normal production configuration.\n' +
              '- Missing alternative provider credentials continue to use existing safe fallback/error paths.\n' +
              '- Sitemap scheduler RPCs are moved to service-role-only access.\n\n' +
              'Patched source files: ' + str(len(changed)) + '\n')

          workflow = Path('.github/workflows/lovable-runtime-lock-bootstrap-20260716.yml')
          workflow.unlink()
          PY
      - name: Validate source contracts
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/lovable-runtime-lock-bootstrap-20260716.yml
          test -f src/lib/__checks__/lovableRuntimeDefaultDeny.test.ts
          test -f supabase/migrations/20260716035000_lock_sitemap_scheduler_rpcs.sql
          grep -RIl 'IRHA_ENABLE_LOVABLE_RUNTIME' supabase/functions | grep -q .
      - name: Commit lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security(runtime): make Lovable providers explicit opt-in"
          git push origin HEAD:fix/lovable-free-runtime-20260716
