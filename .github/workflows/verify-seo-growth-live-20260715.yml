name: Verify SEO growth live

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-seo-growth-live-20260715.yml"

permissions:
  contents: read

jobs:
  verify-live-seo-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify deployed SHA, German pages and indexing controls
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN="https://irhaapparels.com"
          EXPECTED_SHA="b520771c137304a12d31a7a3b5d569686eac6857"

          ready=0
          for attempt in $(seq 1 48); do
            cache_bust="${GITHUB_SHA::12}-$attempt-$RANDOM"
            if curl -fsS --connect-timeout 10 --max-time 40 "$ORIGIN/build.json?seo_growth_verify=$cache_bust" -o /tmp/build.json \
              && jq -e --arg sha "$EXPECTED_SHA" '.source_commit==$sha and .source_identity_state=="verified" and .repository=="irhaapparelsofficial-ctrl/irha-global-craft-f3881330"' /tmp/build.json >/dev/null; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" = "1" || { echo "Expected production SHA did not become live"; cat /tmp/build.json 2>/dev/null || true; exit 1; }
          echo "Exact live release verified: $EXPECTED_SHA"

          assert_page() {
            path="$1"
            phrase="$2"
            cache_bust="${GITHUB_SHA::12}-$RANDOM"
            curl -fsSL --connect-timeout 10 --max-time 40 "$ORIGIN$path?seo_growth_verify=$cache_bust" -o /tmp/page.html
            grep -F "$phrase" /tmp/page.html >/dev/null || {
              echo "Expected phrase missing from $path: $phrase"
              exit 1
            }
            grep -F "<link rel=\"canonical\" href=\"$ORIGIN$path\"" /tmp/page.html >/dev/null || {
              echo "Canonical missing from $path"
              exit 1
            }
            echo "Static page verified: $path"
          }

          assert_page "/de/bekleidungshersteller-deutschland" "Bekleidungshersteller für deutsche B2B-Einkäufer"
          assert_page "/custom-sportswear-manufacturer-germany" "Custom Sportswear Manufacturer for German B2B Buyers"
          assert_page "/de/sportbekleidung-hersteller" "Sportbekleidung Hersteller für deutsche B2B-Einkäufer"
          assert_page "/leather-apparel-manufacturer-germany" "Custom Leather Apparel Manufacturer for German Buyers"
          assert_page "/de/lederbekleidung-hersteller" "Lederbekleidung Hersteller für deutsche B2B-Einkäufer"

          curl -fsSL --connect-timeout 10 --max-time 40 "$ORIGIN/de/sportbekleidung-hersteller?hreflang_verify=${GITHUB_SHA::12}" -o /tmp/de-sports.html
          grep -F 'hreflang="de" href="https://irhaapparels.com/de/sportbekleidung-hersteller"' /tmp/de-sports.html >/dev/null
          grep -F 'hreflang="en" href="https://irhaapparels.com/custom-sportswear-manufacturer-germany"' /tmp/de-sports.html >/dev/null
          grep -F 'hreflang="x-default" href="https://irhaapparels.com/custom-sportswear-manufacturer-germany"' /tmp/de-sports.html >/dev/null
          echo "Reciprocal sportswear hreflang verified"

          curl -fsSL --connect-timeout 10 --max-time 40 "$ORIGIN/sitemap.xml?seo_growth_verify=${GITHUB_SHA::12}" -o /tmp/sitemap.xml
          for path in \
            /de/bekleidungshersteller-deutschland \
            /custom-sportswear-manufacturer-germany \
            /de/sportbekleidung-hersteller \
            /leather-apparel-manufacturer-germany \
            /de/lederbekleidung-hersteller; do
            grep -F "<loc>$ORIGIN$path</loc>" /tmp/sitemap.xml >/dev/null || { echo "Sitemap missing $path"; exit 1; }
          done
          echo "Sitemap coverage verified"

          filtered_headers="$(curl -sSI --connect-timeout 10 --max-time 40 "$ORIGIN/products/sportswear?q=football&sort=name")"
          robots_value="$(printf '%s\n' "$filtered_headers" | awk 'BEGIN{IGNORECASE=1} /^x-robots-tag:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}')"
          reason_value="$(printf '%s\n' "$filtered_headers" | awk 'BEGIN{IGNORECASE=1} /^x-irha-noindex-reason:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}')"
          test "$robots_value" = "noindex, nofollow, noarchive" || { echo "Unexpected filtered robots value: $robots_value"; printf '%s\n' "$filtered_headers"; exit 1; }
          test "$reason_value" = "functional-category-query" || { echo "Unexpected filtered noindex reason: $reason_value"; exit 1; }
          echo "Functional category HTTP noindex verified"

          tracking_headers="$(curl -sSI --connect-timeout 10 --max-time 40 "$ORIGIN/products/sportswear?utm_source=seo-live-verify")"
          if printf '%s\n' "$tracking_headers" | grep -Eiq '^x-irha-noindex-reason:[[:space:]]*functional-category-query'; then
            echo "Tracking-only category URL was incorrectly noindexed"
            printf '%s\n' "$tracking_headers"
            exit 1
          fi
          echo "Tracking-only category URL remains indexable"

          echo "Live SEO growth release verified for $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Five Germany transactional pages: canonical static HTML present" >> "$GITHUB_STEP_SUMMARY"
          echo "- English/German hreflang pairs: verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sitemap coverage: verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- Functional category variants: HTTP noindex verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tracking-only category URL: remains indexable" >> "$GITHUB_STEP_SUMMARY"
          echo "- Top-category buyer content: covered by the green production build and source tests" >> "$GITHUB_STEP_SUMMARY"
