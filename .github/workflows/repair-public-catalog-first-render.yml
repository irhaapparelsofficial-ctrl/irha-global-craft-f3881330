name: Repair public catalog first render

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'fix/critical-seo-security-20260713'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Make verified local catalog render immediately
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/hooks/usePublicCatalog.ts')
          text = path.read_text()
          old_tree = '''export function usePublicCatalogTree() {
            return useQuery({
              queryKey: K.tree,
              queryFn: fetchTree,
              staleTime: 60_000,
              gcTime: 5 * 60_000,
              refetchOnWindowFocus: true,
            });
          }'''
          new_tree = '''export function usePublicCatalogTree() {
            return useQuery({
              queryKey: K.tree,
              queryFn: fetchTree,
              initialData: cloneLocalTree,
              initialDataUpdatedAt: 0,
              staleTime: 60_000,
              gcTime: 5 * 60_000,
              refetchOnWindowFocus: true,
            });
          }'''
          old_product = '''export function usePublicProduct(categorySlug?: string, productSlug?: string) {
            return useQuery({
              queryKey: K.product(categorySlug ?? "", productSlug ?? ""),
              enabled: Boolean(categorySlug && productSlug),
              staleTime: 60_000,
              gcTime: 5 * 60_000,
              queryFn: async () => {
                const tree = await fetchTree();
                const top = tree.find((category) => category.slug === categorySlug) ?? null;
                if (!top) return null;
                const directProduct = top.directProducts.find((candidate) => candidate.slug === productSlug);
                if (directProduct) return { product: directProduct, subCategory: null, topCategory: top };
                for (const sub of top.subs) {
                  const product = sub.products.find((candidate) => candidate.slug === productSlug);
                  if (product) return { product, subCategory: sub, topCategory: top };
                }
                return null;
              },
            });
          }'''
          new_product = '''export function usePublicProduct(categorySlug?: string, productSlug?: string) {
            const localProduct = () => {
              if (!categorySlug || !productSlug) return undefined;
              const top = LOCAL_TREE.find((category) => category.slug === categorySlug) ?? null;
              if (!top) return null;
              const directProduct = top.directProducts.find((candidate) => candidate.slug === productSlug);
              if (directProduct) return { product: directProduct, subCategory: null, topCategory: top };
              for (const sub of top.subs) {
                const product = sub.products.find((candidate) => candidate.slug === productSlug);
                if (product) return { product, subCategory: sub, topCategory: top };
              }
              return null;
            };

            return useQuery({
              queryKey: K.product(categorySlug ?? "", productSlug ?? ""),
              enabled: Boolean(categorySlug && productSlug),
              initialData: localProduct,
              initialDataUpdatedAt: 0,
              staleTime: 60_000,
              gcTime: 5 * 60_000,
              queryFn: async () => {
                const tree = await fetchTree();
                const top = tree.find((category) => category.slug === categorySlug) ?? null;
                if (!top) return null;
                const directProduct = top.directProducts.find((candidate) => candidate.slug === productSlug);
                if (directProduct) return { product: directProduct, subCategory: null, topCategory: top };
                for (const sub of top.subs) {
                  const product = sub.products.find((candidate) => candidate.slug === productSlug);
                  if (product) return { product, subCategory: sub, topCategory: top };
                }
                return null;
              },
            });
          }'''
          if old_tree not in text:
              raise SystemExit('usePublicCatalogTree target block not found')
          if old_product not in text:
              raise SystemExit('usePublicProduct target block not found')
          text = text.replace(old_tree, new_tree).replace(old_product, new_product)
          path.write_text(text)
          PY
          rm .github/workflows/repair-public-catalog-first-render.yml
      - name: Verify complete application
        run: |
          npm ci
          npx tsc --noEmit
          npm test -- --passWithNoTests
          npm run build
      - name: Commit verified first-render repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/hooks/usePublicCatalog.ts .github/workflows/repair-public-catalog-first-render.yml
          git commit -m 'fix(catalog): render verified local data before network overlay'
          git push origin HEAD:${{ github.head_ref }}
