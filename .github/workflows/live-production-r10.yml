name: Live Production R10 Audit

run-name: Post-publish R10 audit · ${{ github.ref_name }} · #${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production URL to verify
        required: true
        default: https://www.irhaapparels.com
        type: string
      expected_release:
        description: Expected HTML/build release marker
        required: true
        default: frontend-live-2026-07-12-r10
        type: string
      propagation_minutes:
        description: Minutes to wait for Lovable/CDN propagation
        required: true
        default: "20"
        type: string

permissions:
  contents: read

concurrency:
  group: live-production-r10-audit
  cancel-in-progress: true

jobs:
  live-production-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Wait for published release propagation
        env:
          IRHA_BASE_URL: ${{ inputs.base_url }}
          IRHA_EXPECTED_RELEASE: ${{ inputs.expected_release }}
          IRHA_EXPECTED_RELEASE_TEXT: IRHA_FRONTEND_LIVE_2026_07_12_R10
          IRHA_PROPAGATION_MINUTES: ${{ inputs.propagation_minutes }}
        run: node scripts/wait-for-production-release.mjs

      - name: Install Playwright
        run: |
          npm install --no-save --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify published R10 website
        env:
          IRHA_BASE_URL: ${{ inputs.base_url }}
          IRHA_EXPECTED_RELEASE: ${{ inputs.expected_release }}
          IRHA_EXPECTED_RELEASE_TEXT: IRHA_FRONTEND_LIVE_2026_07_12_R10
          IRHA_LIVE_REPORT_DIR: live-production-r10-report
        run: node scripts/live-production-r10.mjs

      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-production-r10-report
          path: live-production-r10-report
          if-no-files-found: warn
          retention-days: 14
