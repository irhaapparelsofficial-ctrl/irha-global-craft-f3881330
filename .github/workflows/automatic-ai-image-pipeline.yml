name: Automatic AI Image Pipeline

on:
  push:
    branches: [main]
    paths:
      - "public/**/*.jpg"
      - "public/**/*.jpeg"
      - "public/**/*.png"
      - "public/**/*.webp"
      - "public/**/*.avif"
      - "scripts/image-ai/**"
      - "supabase/functions/image-processing-gateway/**"
      - "supabase/migrations/*automatic_ai_image_pipeline.sql"
      - ".github/workflows/automatic-ai-image-pipeline.yml"
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Protected Admin Media queue mode
        required: true
        default: canary
        type: choice
        options:
          - canary
          - drain
  issue_comment:
    types: [created]

permissions:
  contents: write
  id-token: write
  issues: read

concurrency:
  group: automatic-ai-image-pipeline-main
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  IRHA_EDSR_MODEL: models/EDSR_x2.pb
  IRHA_REMBG_MODEL: isnet-general-use
  IMAGE_GATEWAY_URL: https://pvzjiozismyxqrzmtfbi.supabase.co/functions/v1/image-processing-gateway

jobs:
  committed-images:
    name: Normalize committed source images
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[image-ai-generated]')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact source with previous commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/image-ai/requirements.txt

      - name: Cache AI models
        uses: actions/cache@v4
        with:
          path: |
            models/EDSR_x2.pb
            ~/.u2net
          key: irha-image-models-v2-${{ runner.os }}

      - name: Install locked image dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/image-ai/requirements.txt

      - name: Download Apache-2.0 EDSR x2 model when absent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models
          if [ ! -s "$IRHA_EDSR_MODEL" ]; then
            curl --fail --location --retry 4 --retry-all-errors \
              --output "$IRHA_EDSR_MODEL.tmp" \
              https://github.com/Saafke/EDSR_Tensorflow/raw/master/models/EDSR_x2.pb
            test "$(wc -c < "$IRHA_EDSR_MODEL.tmp")" -gt 1000000
            mv "$IRHA_EDSR_MODEL.tmp" "$IRHA_EDSR_MODEL"
          fi

      - name: Process new or changed public images
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          python scripts/image-ai/process_static_changes.py \
            --before "${GITHUB_EVENT_BEFORE:-}" \
            --head "$GITHUB_SHA" \
            --edsr-model "$IRHA_EDSR_MODEL" \
            --rembg-model "$IRHA_REMBG_MODEL"

      - name: Commit only verified AI studio masters and review manifests
        shell: bash
        run: |
          set -euo pipefail
          git add public/ai-master public/ai-review 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No AI image outputs changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(images): publish guarded AI studio outputs [image-ai-generated]"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying after latest-main rebase."
            sleep $((attempt * 4))
          done
          echo "Could not publish generated outputs without overwriting newer main changes."
          exit 1

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: image-ai-static-failures-${{ github.run_id }}
          path: image-ai-static-failures.json
          if-no-files-found: ignore
          retention-days: 1

  queue-plan:
    name: Resolve protected queue execution plan
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 375 &&
       github.event.comment.user.login == 'irhaapparelsofficial-ctrl' &&
       (github.event.comment.body == '/run-image-ai-canary' ||
        github.event.comment.body == '/run-image-ai-drain'))
    runs-on: ubuntu-24.04
    outputs:
      workers: ${{ steps.plan.outputs.workers }}
      batch_limit: ${{ steps.plan.outputs.batch_limit }}
      max_jobs: ${{ steps.plan.outputs.max_jobs }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - name: Build bounded plan
        id: plan
        shell: bash
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          mode="scheduled"
          workers='["1"]'
          batch_limit=2
          max_jobs=6
          comment_body=""

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            mode="${DISPATCH_MODE:-canary}"
          elif [ "$GITHUB_EVENT_NAME" = "issue_comment" ]; then
            comment_body="$(jq -r '.comment.body // empty' "$GITHUB_EVENT_PATH")"
            case "$comment_body" in
              /run-image-ai-drain) mode="drain" ;;
              /run-image-ai-canary) mode="canary" ;;
              *) echo "Unsupported issue command in event payload: ${comment_body:-missing}"; exit 1 ;;
            esac
          fi

          if [ "$mode" = "drain" ]; then
            workers='["1","2","3","4"]'
            batch_limit=3
            max_jobs=6
          elif [ "$mode" = "canary" ]; then
            workers='["1"]'
            batch_limit=2
            max_jobs=2
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "workers=$workers" >> "$GITHUB_OUTPUT"
          echo "batch_limit=$batch_limit" >> "$GITHUB_OUTPUT"
          echo "max_jobs=$max_jobs" >> "$GITHUB_OUTPUT"
          {
            echo "## AI image queue plan"
            echo "- Mode: \`$mode\`"
            echo "- Workers: \`$workers\`"
            echo "- Claim limit: \`$batch_limit\`"
            echo "- Maximum jobs per worker: \`$max_jobs\`"
            echo "- Issue command source: \`GITHUB_EVENT_PATH\`"
          } >> "$GITHUB_STEP_SUMMARY"

  admin-media-queue:
    name: Process protected Admin Media queue · worker ${{ matrix.worker }}
    needs: queue-plan
    if: needs.queue-plan.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.queue-plan.outputs.workers) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout exact protected main source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Confirm exact current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test "$checked_out" = "$latest_main" || {
            echo "Refusing stale queue worker: checked out $checked_out, current main is $latest_main"
            exit 1
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/image-ai/requirements.txt

      - name: Cache AI models
        uses: actions/cache@v4
        with:
          path: |
            models/EDSR_x2.pb
            ~/.u2net
          key: irha-image-models-v2-${{ runner.os }}

      - name: Install locked image dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/image-ai/requirements.txt

      - name: Download Apache-2.0 EDSR x2 model when absent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models
          if [ ! -s "$IRHA_EDSR_MODEL" ]; then
            curl --fail --location --retry 4 --retry-all-errors \
              --output "$IRHA_EDSR_MODEL.tmp" \
              https://github.com/Saafke/EDSR_Tensorflow/raw/master/models/EDSR_x2.pb
            test "$(wc -c < "$IRHA_EDSR_MODEL.tmp")" -gt 1000000
            mv "$IRHA_EDSR_MODEL.tmp" "$IRHA_EDSR_MODEL"
          fi

      - name: Process a bounded failure-isolated production batch
        env:
          IRHA_IMAGE_BATCH_LIMIT: ${{ needs.queue-plan.outputs.batch_limit }}
          IRHA_IMAGE_MAX_JOBS: ${{ needs.queue-plan.outputs.max_jobs }}
          IRHA_IMAGE_WORKER: ${{ matrix.worker }}
        run: python scripts/image-ai/run_queue.py

      - name: Record worker outcome
        if: always()
        shell: bash
        run: |
          {
            echo "## Protected AI image worker"
            echo "- Mode: \`${{ needs.queue-plan.outputs.mode }}\`"
            echo "- Worker: \`${{ matrix.worker }}\`"
            echo "- Claim limit: \`${{ needs.queue-plan.outputs.batch_limit }}\`"
            echo "- Maximum jobs: \`${{ needs.queue-plan.outputs.max_jobs }}\`"
            echo "- Original images: preserved"
            echo "- Stale lock policy: database-controlled reclaim after 30 minutes"
          } >> "$GITHUB_STEP_SUMMARY"
