name: Build Clean Lead Outreach V3

on:
  push:
    branches:
      - feature/lead-outreach-safe-v3
    paths:
      - ".github/workflows/build-clean-lead-outreach-v3.yml"
      - "scripts/build_clean_lead_outreach_v3.py"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest-main replacement branch
        uses: actions/checkout@v4
        with:
          ref: feature/lead-outreach-safe-v3
          fetch-depth: 0

      - name: Build deterministic candidate
        run: python scripts/build_clean_lead_outreach_v3.py

      - name: Verify focused contracts
        run: |
          set -euo pipefail
          npm install --legacy-peer-deps --no-audit --no-fund
          npx tsc --noEmit
          npx vitest run \
            src/components/admin/OutreachApprovalPanel.test.ts \
            src/test/leadOutreachSafetyContracts.test.ts \
            src/test/leadOutreachEdgeSyntax.test.ts \
            src/lib/leadIntake.test.ts \
            src/pages/AdminLeadIntake.test.ts
          npm run verify:migrations

      - name: Commit candidate and remove one-time tooling
        run: |
          set -euo pipefail
          rm .github/workflows/build-clean-lead-outreach-v3.yml
          rm scripts/build_clean_lead_outreach_v3.py
          rm -f .github/workflows/fix-clean-build-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(outreach): rebuild owner-approved workflow on latest main"
          git push origin HEAD:feature/lead-outreach-safe-v3
