name: Apply Custom Domain Release Verification

on:
  push:
    branches:
      - fix/custom-domain-release-verification

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/custom-domain-release-verification
          fetch-depth: 0

      - name: Patch production workflow with exact custom-domain verification
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/cloudflare-pages-production.yml')
          text = path.read_text()

          env_old = '''  PRODUCTION_BRANCH: main
  PRODUCTION_URL: https://irha-apparels.pages.dev
'''
          env_new = '''  PRODUCTION_BRANCH: main
  PRODUCTION_URL: https://irha-apparels.pages.dev
  CUSTOM_DOMAIN_URL: https://irhaapparels.com
  WWW_CUSTOM_DOMAIN_URL: https://www.irhaapparels.com
'''
          if text.count(env_old) != 1:
              raise SystemExit(f'expected production env marker once; found {text.count(env_old)}')
          text = text.replace(env_old, env_new, 1)

          marker = '''      - name: Verify domain configuration was not changed
'''
          if text.count(marker) != 1:
              raise SystemExit(f'expected domain verification marker once; found {text.count(marker)}')

          step = r'''      - name: Verify custom domain serves exact release
        shell: bash
        run: |
          set -euo pipefail
          expected_fingerprint="$(jq -r '.build_fingerprint // empty' /tmp/production-build.json)"
          [[ "$expected_fingerprint" =~ ^[0-9a-f]{64}$ ]]

          for base_url in "$CUSTOM_DOMAIN_URL" "$WWW_CUSTOM_DOMAIN_URL"; do
            ready=0
            host="${base_url#https://}"
            safe_host="$(printf '%s' "$host" | tr -c 'A-Za-z0-9._-' '_')"

            for attempt in $(seq 1 24); do
              cache_bust="${GITHUB_SHA::12}-$attempt-$RANDOM"
              home_file="/tmp/${safe_host}-home.html"
              header_file="/tmp/${safe_host}-headers"
              build_file="/tmp/${safe_host}-build.json"
              deployment_file="/tmp/${safe_host}-cloudflare-deployment.json"

              if curl -fsSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' \
                "$base_url/?release_check=$cache_bust" -o "$home_file" -D "$header_file" \
                && curl -fsSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' \
                "$base_url/build.json?release_check=$cache_bust" -o "$build_file" \
                && curl -fsSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' \
                "$base_url/cloudflare-deployment.json?release_check=$cache_bust" -o "$deployment_file"; then

                if grep -Eiq '^HTTP/[0-9.]+ (200|301|302|307|308)' "$header_file" \
                  && grep -Fq 'name="x-irha-release" content="frontend-live-2026-07-13-r11"' "$home_file" \
                  && grep -Eiq 'Custom Apparel Manufacturer for Global B2B Buyers|Custom Apparel Manufacturing for Global B2B Buyers' "$home_file" \
                  && jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" --arg supabase 'pvzjiozismyxqrzmtfbi' --arg fingerprint "$expected_fingerprint" \
                    '.source_commit == $sha and .source_identity_state == "verified" and .repository == $repo and .supabase_project_id == $supabase and .build_fingerprint == $fingerprint' \
                    "$build_file" >/dev/null \
                  && jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" --arg fingerprint "$expected_fingerprint" \
                    '.source_sha == $sha and .repository == $repo and .branch == "main" and .build_fingerprint == $fingerprint' \
                    "$deployment_file" >/dev/null; then
                  ready=1
                  echo "$base_url verified on attempt $attempt"
                  break
                fi
              fi

              echo "$base_url not converged yet (attempt $attempt/24)"
              sleep 10
            done

            test "$ready" = "1" || {
              echo "Custom domain did not converge to the exact production release: $base_url"
              exit 1
            }

            if grep -Eiq 'Since 2014|MOQ 50|45-Day Delivery|45-day delivery|reply within 12 hours|BSCI Audited|ISO 9001:2015|SEDEX Member' "/tmp/${safe_host}-home.html"; then
              echo "Blocked legacy production claims are present on $base_url"
              exit 1
            fi
          done

'''
          text = text.replace(marker, step + marker, 1)

          summary_old = '''            echo "- Domain count unchanged: $final_domain_count"
            echo "- DNS/custom domains were not modified by this workflow"
'''
          summary_new = '''            echo "- Domain count unchanged: $final_domain_count"
            echo "- Custom domain verified: $CUSTOM_DOMAIN_URL"
            echo "- WWW domain verified: $WWW_CUSTOM_DOMAIN_URL"
            echo "- DNS/custom domains were not modified by this workflow"
'''
          if text.count(summary_old) != 1:
              raise SystemExit(f'expected summary marker once; found {text.count(summary_old)}')
          text = text.replace(summary_old, summary_new, 1)

          path.write_text(text)
          PY

          grep -F 'CUSTOM_DOMAIN_URL: https://irhaapparels.com' .github/workflows/cloudflare-pages-production.yml
          grep -F 'Verify custom domain serves exact release' .github/workflows/cloudflare-pages-production.yml
          grep -F 'Custom domain verified: $CUSTOM_DOMAIN_URL' .github/workflows/cloudflare-pages-production.yml

      - name: Remove one-time workflow and commit exact patch
        run: |
          set -euo pipefail
          rm .github/workflows/apply-custom-domain-release-verification.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/cloudflare-pages-production.yml .github/workflows/apply-custom-domain-release-verification.yml
          git commit -m "fix(deploy): verify exact custom-domain release"
          git push origin HEAD:fix/custom-domain-release-verification
