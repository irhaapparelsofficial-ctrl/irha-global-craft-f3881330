name: Supabase Database After Quality Gate

run-name: Repository-led database sync · ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Quality Gate"]
    types: [completed]

permissions:
  contents: read
  statuses: write

concurrency:
  group: irha-production-database
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: pvzjiozismyxqrzmtfbi

jobs:
  preflight:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      should_sync: ${{ steps.ready.outputs.should_sync }}
      source_sha: ${{ steps.ready.outputs.source_sha }}
      secrets_ready: ${{ steps.ready.outputs.secrets_ready }}
      database_changed: ${{ steps.changes.outputs.database_changed }}
      pending_repository_migrations: ${{ steps.pending.outputs.pending_repository_migrations }}
      pending_count: ${{ steps.pending.outputs.pending_count }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout exact green main source for change detection
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Detect repository database changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          changed_files=/tmp/database-changed-files.txt
          if git rev-parse "${SOURCE_SHA}^" >/dev/null 2>&1; then
            git diff --name-only "${SOURCE_SHA}^" "$SOURCE_SHA" > "$changed_files"
          else
            git diff-tree --root --no-commit-id --name-only -r "$SOURCE_SHA" > "$changed_files"
          fi

          database_changed=false
          if grep -Eq '^(supabase/migrations/|supabase/repository-migrations\.json$|scripts/verify-migration-order\.mjs$|scripts/ci/reconcile-repository-migrations\.mjs$|scripts/ci/sql-transaction-body\.mjs$|\.github/workflows/supabase-database-auto\.yml$|src/test/repositoryMigrationManifestStatic\.test\.ts$)' "$changed_files"; then
            database_changed=true
          fi

          echo "database_changed=$database_changed" >> "$GITHUB_OUTPUT"
          echo "Repository database changes detected: $database_changed"
          cat "$changed_files"

      - name: Detect pending repository migration ledger work
        id: pending
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${SUPABASE_ACCESS_TOKEN:-}" | tr -d '[:space:]')"
          if [ -z "$token" ]; then
            echo "pending_repository_migrations=unknown" >> "$GITHUB_OUTPUT"
            echo "pending_count=unknown" >> "$GITHUB_OUTPUT"
            echo "Management API token unavailable; pending-ledger detection deferred without mutation."
            exit 0
          fi
          echo "::add-mask::$token"

          ledger_json="$(bash scripts/ci/retry.sh 3 5 -- curl -fsS \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -X POST \
            -d '{"query":"select version, git_blob_sha, application_state from private.irha_repository_migration_ledger order by version","read_only":true}' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query")"
          printf '%s' "$ledger_json" > /tmp/repository-migration-ledger.json

          node <<'NODE' > /tmp/pending-migration-result.txt
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('supabase/repository-migrations.json', 'utf8'));
          const payload = JSON.parse(fs.readFileSync('/tmp/repository-migration-ledger.json', 'utf8'));
          const rows = Array.isArray(payload)
            ? payload
            : Array.isArray(payload.result)
              ? payload.result
              : Array.isArray(payload.data)
                ? payload.data
                : Array.isArray(payload.rows)
                  ? payload.rows
                  : Array.isArray(payload.result?.rows)
                    ? payload.result.rows
                    : [];
          const ledger = new Map(rows.map((row) => [String(row.version), row]));
          const pending = [];
          const drift = [];
          for (const entry of manifest.migrations) {
            const row = ledger.get(entry.version);
            if (!row) {
              pending.push(entry.version);
              continue;
            }
            if (row.git_blob_sha !== entry.git_blob_sha || !['applied', 'verified_present'].includes(row.application_state)) {
              drift.push({
                version: entry.version,
                expected_sha: entry.git_blob_sha,
                actual_sha: row.git_blob_sha || null,
                state: row.application_state || null,
              });
            }
          }
          if (drift.length) {
            console.error(`Repository migration ledger drift: ${JSON.stringify(drift)}`);
            process.exit(2);
          }
          console.log(`pending_repository_migrations=${pending.length > 0 ? 'true' : 'false'}`);
          console.log(`pending_count=${pending.length}`);
          if (pending.length) console.log(`pending_versions=${pending.join(',')}`);
          NODE

          cat /tmp/pending-migration-result.txt
          grep '^pending_repository_migrations=' /tmp/pending-migration-result.txt >> "$GITHUB_OUTPUT"
          grep '^pending_count=' /tmp/pending-migration-result.txt >> "$GITHUB_OUTPUT"

      - name: Confirm exact current main and Management API readiness
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          DATABASE_CHANGED: ${{ steps.changes.outputs.database_changed }}
          PENDING_REPOSITORY_MIGRATIONS: ${{ steps.pending.outputs.pending_repository_migrations }}
        shell: bash
        run: |
          set -euo pipefail
          latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          access_token="$(printf '%s' "${SUPABASE_ACCESS_TOKEN:-}" | tr -d '[:space:]')"
          secrets_ready=true
          [ -n "$access_token" ] || secrets_ready=false

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "secrets_ready=$secrets_ready" >> "$GITHUB_OUTPUT"

          if [ "$latest_main" != "$SOURCE_SHA" ]; then
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            echo "Superseded green run skipped safely: $SOURCE_SHA; current main is $latest_main"
          elif [ "$secrets_ready" != "true" ]; then
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            echo "Exact current main is green, but SUPABASE_ACCESS_TOKEN is unavailable. Waiting without failure."
          elif [ "$DATABASE_CHANGED" != "true" ] && [ "$PENDING_REPOSITORY_MIGRATIONS" != "true" ]; then
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            echo "No database-related source change and repository migration ledger is already current."
          else
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
            echo "Exact current main has database source changes or pending repository-led migration work: $SOURCE_SHA"
          fi

      - name: Record clean non-sync state
        if: steps.ready.outputs.should_sync != 'true'
        shell: bash
        run: |
          {
            echo "## Supabase repository migration control plane"
            echo "- Quality Gate: green"
            echo "- Source: \`${{ steps.ready.outputs.source_sha }}\`"
            echo "- Database-related source changed: \`${{ steps.changes.outputs.database_changed }}\`"
            echo "- Pending repository migrations: \`${{ steps.pending.outputs.pending_repository_migrations }}\`"
            echo "- Pending count: \`${{ steps.pending.outputs.pending_count }}\`"
            echo "- Secrets ready: \`${{ steps.ready.outputs.secrets_ready }}\`"
            echo "- Result: no database mutation attempted and no red failure raised"
          } >> "$GITHUB_STEP_SUMMARY"

  sync-database:
    needs: preflight
    if: needs.preflight.outputs.should_sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      REPO_MIGRATION_PLAN_PATH: /tmp/repository-migration-plan.json
      REPO_MIGRATION_EVIDENCE_PATH: /tmp/repository-migration-evidence.json
      REPO_MIGRATION_RUNTIME_LOG: /tmp/repository-migration-runtime.log

    steps:
      - name: Checkout exact green main source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate manifest and transactionally dry-run pending migrations
        env:
          REPO_MIGRATION_MODE: plan
        shell: bash
        run: |
          set -o pipefail
          node scripts/ci/reconcile-repository-migrations.mjs 2>&1 | tee "$REPO_MIGRATION_RUNTIME_LOG"

      - name: Reconfirm exact current main immediately before database mutation
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest_main="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [ "$latest_main" = "$SOURCE_SHA" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            echo "Exact current main reconfirmed immediately before database mutation."
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "Source $SOURCE_SHA was superseded by $latest_main; database mutation skipped without failure"
          fi

      - name: Apply pending repository migrations exactly once
        if: steps.freshness.outputs.fresh == 'true'
        env:
          REPO_MIGRATION_MODE: apply
        shell: bash
        run: |
          set -o pipefail
          node scripts/ci/reconcile-repository-migrations.mjs 2>&1 | tee -a "$REPO_MIGRATION_RUNTIME_LOG"

      - name: Verify private repository migration ledger parity
        if: steps.freshness.outputs.fresh == 'true'
        env:
          REPO_MIGRATION_MODE: verify
        shell: bash
        run: |
          set -o pipefail
          node scripts/ci/reconcile-repository-migrations.mjs 2>&1 | tee -a "$REPO_MIGRATION_RUNTIME_LOG"

      - name: Preserve repository migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-repository-migration-evidence-${{ env.SOURCE_SHA }}
          path: |
            /tmp/repository-migration-plan.json
            /tmp/repository-migration-evidence.json
            /tmp/repository-migration-runtime.log
          if-no-files-found: warn
          retention-days: 2

      - name: Record control-plane outcome
        if: always()
        shell: bash
        run: |
          {
            echo "## Supabase repository migration control plane"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Project: \`$SUPABASE_PROJECT_ID\`"
            echo "- Ledger: \`private.irha_repository_migration_ledger\`"
            echo "- Concurrency lane: \`irha-production-database\`"
            echo "- Runs when database sources change or the repository ledger has pending migrations"
            echo "- Fresh at mutation time: \`${{ steps.freshness.outputs.fresh || 'not-reached' }}\`"
            if [ -s "$REPO_MIGRATION_RUNTIME_LOG" ]; then
              echo "- Runtime result: \`$(tail -n 1 "$REPO_MIGRATION_RUNTIME_LOG" | tr '\r\n' ' ' | cut -c1-180)\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish exact commit database status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DATABASE_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=error
          description="Supabase repository migration sync did not complete"
          case "$DATABASE_JOB_STATUS" in
            success)
              state=success
              description="Supabase repository migration parity verified"
              ;;
            failure)
              state=failure
              description="$(grep -Ev '^\s*$' "$REPO_MIGRATION_RUNTIME_LOG" 2>/dev/null | tail -n 1 | tr '\r\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-140 || true)"
              [ -n "$description" ] || description="Relevant database migration needs developer review"
              ;;
            cancelled)
              state=error
              description="Supabase repository migration sync cancelled"
              ;;
          esac

          bash scripts/ci/retry.sh 3 3 -- gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state="$state" \
            -f context="Irha Supabase Database Sync" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null
