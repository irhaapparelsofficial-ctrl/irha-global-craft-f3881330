name: Supabase Database After Quality Gate

run-name: Repository-led database sync · ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Quality Gate"]
    types: [completed]

permissions:
  contents: read
  statuses: write

concurrency:
  group: irha-production-mutation
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: pvzjiozismyxqrzmtfbi

jobs:
  preflight:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      should_sync: ${{ steps.ready.outputs.should_sync }}
      source_sha: ${{ steps.ready.outputs.source_sha }}
      secrets_ready: ${{ steps.ready.outputs.secrets_ready }}
      database_changed: ${{ steps.changes.outputs.database_changed }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout exact green main source for change detection
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Detect repository database changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          changed_files=/tmp/database-changed-files.txt
          if git rev-parse "${SOURCE_SHA}^" >/dev/null 2>&1; then
            git diff --name-only "${SOURCE_SHA}^" "$SOURCE_SHA" > "$changed_files"
          else
            git diff-tree --root --no-commit-id --name-only -r "$SOURCE_SHA" > "$changed_files"
          fi

          database_changed=false
          if grep -Eq '^(supabase/migrations/|supabase/repository-migrations\.json$|scripts/verify-migration-order\.mjs$|scripts/ci/reconcile-repository-migrations\.mjs$|scripts/ci/sql-transaction-body\.mjs$)' "$changed_files"; then
            database_changed=true
          fi

          echo "database_changed=$database_changed" >> "$GITHUB_OUTPUT"
          echo "Repository database changes detected: $database_changed"
          cat "$changed_files"

      - name: Confirm exact current main and Management API readiness
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          DATABASE_CHANGED: ${{ steps.changes.outputs.database_changed }}
        shell: bash
        run: |
          set -euo pipefail
          latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          access_token="$(printf '%s' "${SUPABASE_ACCESS_TOKEN:-}" | tr -d '[:space:]')"
          secrets_ready=true
          [ -n "$access_token" ] || secrets_ready=false

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "secrets_ready=$secrets_ready" >> "$GITHUB_OUTPUT"

          if [ "$latest_main" != "$SOURCE_SHA" ]; then
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            echo "Superseded green run skipped safely: $SOURCE_SHA; current main is $latest_main"
          elif [ "$DATABASE_CHANGED" != "true" ]; then
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            echo "No repository database change in $SOURCE_SHA; database sync skipped without failure."
          elif [ "$secrets_ready" != "true" ]; then
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            echo "Exact current main changed database sources, but SUPABASE_ACCESS_TOKEN is unavailable. Waiting without failure."
          else
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
            echo "Exact current main, database change and Management API readiness verified: $SOURCE_SHA"
          fi

      - name: Record clean non-sync state
        if: steps.ready.outputs.should_sync != 'true'
        shell: bash
        run: |
          {
            echo "## Supabase repository migration control plane"
            echo "- Quality Gate: green"
            echo "- Source: \`${{ steps.ready.outputs.source_sha }}\`"
            echo "- Database-related source changed: \`${{ steps.changes.outputs.database_changed }}\`"
            echo "- Secrets ready: \`${{ steps.ready.outputs.secrets_ready }}\`"
            echo "- Result: no database mutation attempted and no red failure raised"
          } >> "$GITHUB_STEP_SUMMARY"

  sync-database:
    needs: preflight
    if: needs.preflight.outputs.should_sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      REPO_MIGRATION_PLAN_PATH: /tmp/repository-migration-plan.json
      REPO_MIGRATION_EVIDENCE_PATH: /tmp/repository-migration-evidence.json

    steps:
      - name: Checkout exact green main source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate manifest and transactionally dry-run pending migrations
        env:
          REPO_MIGRATION_MODE: plan
        run: node scripts/ci/reconcile-repository-migrations.mjs

      - name: Reconfirm exact current main immediately before database mutation
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest_main="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [ "$latest_main" = "$SOURCE_SHA" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            echo "Exact current main reconfirmed immediately before database mutation."
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "Source $SOURCE_SHA was superseded by $latest_main; database mutation skipped without failure"
          fi

      - name: Apply pending repository migrations exactly once
        if: steps.freshness.outputs.fresh == 'true'
        env:
          REPO_MIGRATION_MODE: apply
        run: node scripts/ci/reconcile-repository-migrations.mjs

      - name: Verify private repository migration ledger parity
        if: steps.freshness.outputs.fresh == 'true'
        env:
          REPO_MIGRATION_MODE: verify
        run: node scripts/ci/reconcile-repository-migrations.mjs

      - name: Preserve repository migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-repository-migration-evidence-${{ env.SOURCE_SHA }}
          path: |
            /tmp/repository-migration-plan.json
            /tmp/repository-migration-evidence.json
          if-no-files-found: warn
          retention-days: 3

      - name: Record control-plane outcome
        if: always()
        shell: bash
        run: |
          {
            echo "## Supabase repository migration control plane"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Project: \`$SUPABASE_PROJECT_ID\`"
            echo "- Ledger: \`private.irha_repository_migration_ledger\`"
            echo "- API: official Supabase Management API database/query endpoint"
            echo "- Validation: manifest completeness + Git blob checksum + forbidden side-effect scan"
            echo "- Dry-run: transactional \`BEGIN ... ROLLBACK\` for every pending migration"
            echo "- Shared production lock: \`irha-production-mutation\`"
            echo "- Fresh at mutation time: \`${{ steps.freshness.outputs.fresh || 'not-reached' }}\`"
            echo "- Apply policy: one exact transaction per migration with ledger insert in the same commit"
            echo "- Legacy drifted \`supabase_migrations\` history: preserved, not deleted or rewritten"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish exact commit database status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DATABASE_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=error
          description="Supabase repository migration sync did not complete"
          case "$DATABASE_JOB_STATUS" in
            success)
              state=success
              description="Supabase repository migration parity verified"
              ;;
            failure)
              state=failure
              description="Supabase repository migration sync failed"
              ;;
            cancelled)
              state=error
              description="Supabase repository migration sync cancelled"
              ;;
          esac

          bash scripts/ci/retry.sh 3 3 -- gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state="$state" \
            -f context="Irha Supabase Database Sync" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null
