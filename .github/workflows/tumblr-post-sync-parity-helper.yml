name: Temporary Tumblr post-sync parity closure

on:
  push:
    branches:
      - fix/post-sync-tumblr-parity-20260809

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bash scripts/ci/tumblr-post-sync-parity-helper.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tumblr-post-sync-parity-output
          path: /tmp/tumblr-parity-output
          if-no-files-found: error
          retention-days: 1
