name: GP-2 Cache Lineage Root Fix

on:
  push:
    branches:
      - gp2/cache-lineage-root-fix-20260809
    paths:
      - .github/workflows/gp2-cache-lineage-root-fix.yml

permissions:
  contents: write

concurrency:
  group: gp2-cache-lineage-root-fix-20260809
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: gp2/cache-lineage-root-fix-20260809
          fetch-depth: 1

      - name: Lock current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')" = "2ead9b9d31ba633c10cacfaa6e20401d7c707009"

      - name: Apply exact root fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/cloudflare-cache-consistency.yml')
          workflow = workflow_path.read_text()
          start_marker = '      - name: Freeze exact current main and resolve immutable Quality artifact\n'
          end_marker = '      - name: Record superseded no-op\n'
          start = workflow.index(start_marker)
          end = workflow.index(end_marker, start)
          replacement = '''      - name: Freeze exact current main and resolve immutable Quality artifact
            id: freeze
            shell: bash
            run: |
              set -euo pipefail
              latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
              if [ "$SOURCE_SHA" != "$latest_main" ]; then
                echo "eligible=false" >> "$GITHUB_OUTPUT"
                echo "Superseded cache reconciliation skipped safely: source=$SOURCE_SHA current_main=$latest_main"
                exit 0
              fi

              status_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/status")"
              quality_target="$(printf '%s' "$status_json" | jq -r '[.statuses[] | select(.context == "Irha Quality Gate" and .state == "success")][0].target_url // empty')"
              test -n "$quality_target"
              quality_target="${quality_target%/}"
              case "$quality_target" in
                "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/"*) ;;
                *) echo "Unexpected Quality Gate target URL: $quality_target"; exit 1 ;;
              esac
              quality_run_id="${quality_target##*/}"
              [[ "$quality_run_id" =~ ^[0-9]+$ ]]

              quality_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$quality_run_id")"
              printf '%s' "$quality_run" | jq -e --arg sha "$SOURCE_SHA" '
                .name == "Quality Gate"
                and .head_sha == $sha
                and .head_branch == "main"
                and (.event == "push" or .event == "workflow_dispatch")
                and .conclusion == "success"
              ' >/dev/null

              expected_artifact="production-dist-$SOURCE_SHA"
              artifact_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$quality_run_id/artifacts")"
              printf '%s' "$artifact_json" | jq -e --arg name "$expected_artifact" '
                any(.artifacts[]; .name == $name and .expired == false)
              ' >/dev/null

              echo "eligible=true" >> "$GITHUB_OUTPUT"
              echo "quality_run_id=$quality_run_id" >> "$GITHUB_OUTPUT"
              echo "Exact current main frozen: $SOURCE_SHA; exact successful Quality artifact: $quality_run_id"

'''
          workflow = workflow[:start] + replacement + workflow[end:]
          workflow_path.write_text(workflow)

          test_path = Path('src/test/cloudflareCacheReleaseLineage.test.ts')
          test = test_path.read_text()
          first = test.index('  it("uses the Quality artifact recorded by the deployed Cloudflare release instead of a later same-SHA build", () => {')
          second = test.index('  it("keeps the lineage resolver valid bash", () => {', first)
          new_test = '''  it("resolves the exact successful Quality artifact without depending on a mutable deployment marker", () => {
            const workflow = read(".github/workflows/cloudflare-cache-consistency.yml");
            const script = extractRunBlock(
              workflow,
              "Freeze exact current main and resolve immutable Quality artifact",
            );

            expect(script).toContain('commits/$SOURCE_SHA/status');
            expect(script).toContain('.context == "Irha Quality Gate"');
            expect(script).toContain('.state == "success"');
            expect(script).toContain('quality_run_id="${quality_target##*/}"');
            expect(script).toContain('actions/runs/$quality_run_id/artifacts');
            expect(script).toContain('.name == $name and .expired == false');
            expect(script).toContain('.name == "Quality Gate"');
            expect(script).toContain('.head_sha == $sha');
            expect(script).toContain('.conclusion == "success"');
            expect(script).not.toContain("cloudflare-deployment.json?release_check=");
            expect(script).not.toContain("lineage_marker");
            expect(script).not.toContain("actions/workflows/quality.yml/runs?branch=main");
          });

'''
          test = test[:first] + new_test + test[second:]
          test_path.write_text(test)
          PY

          git diff --check
          grep -F 'commits/$SOURCE_SHA/status' .github/workflows/cloudflare-cache-consistency.yml >/dev/null
          grep -F 'actions/runs/$quality_run_id/artifacts' .github/workflows/cloudflare-cache-consistency.yml >/dev/null
          ! sed -n '/Freeze exact current main and resolve immutable Quality artifact/,/Record superseded no-op/p' .github/workflows/cloudflare-cache-consistency.yml | grep -F 'cloudflare-deployment.json?release_check=' >/dev/null

      - name: Seal final branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gp2-cache-lineage-root-fix.yml
          git add .github/workflows/cloudflare-cache-consistency.yml src/test/cloudflareCacheReleaseLineage.test.ts
          git diff --cached --check
          git commit -m "fix(gp2): remove mutable cache-lineage marker dependency"
          git push origin HEAD:gp2/cache-lineage-root-fix-20260809
