name: Owner Supabase Guarded Release

run-name: Guarded Supabase ${{ inputs.scope }} release · ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Select the owner-backend release scope
        required: true
        default: functions
        type: choice
        options:
          - functions
          - database
          - both
      confirm:
        description: Type APPLY_SUPABASE_RELEASE to continue
        required: true
        default: "NO"
        type: string

permissions:
  contents: read

concurrency:
  group: irha-production-mutation
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: pvzjiozismyxqrzmtfbi

jobs:
  release:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'APPLY_SUPABASE_RELEASE'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout exact dispatch source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Confirm exact current main after acquiring production lock
        id: freshness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_main="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" = "$latest_main" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            echo "SOURCE_SHA=$latest_main" >> "$GITHUB_ENV"
            echo "Exact current main confirmed: $latest_main"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "Superseded Supabase release skipped safely: checked out $checked_out, current main $latest_main"
          fi

      - name: Setup Supabase CLI
        if: steps.freshness.outputs.fresh == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify repository and owner-project lock
        if: steps.freshness.outputs.fresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || {
            echo "SUPABASE_ACCESS_TOKEN is missing"
            exit 1
          }
          grep -Fx 'project_id = "pvzjiozismyxqrzmtfbi"' supabase/config.toml
          bash scripts/ci/retry.sh 3 5 -- npm ci --legacy-peer-deps --no-audit --no-fund
          npm run verify:deployment-source
          npm run verify:secrets
          npm run verify:migrations

      - name: Link owner database for migration scope
        if: steps.freshness.outputs.fresh == 'true' && (inputs.scope == 'database' || inputs.scope == 'both')
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_PASSWORD:-}" || {
            echo "SUPABASE_DB_PASSWORD is missing"
            exit 1
          }
          bash scripts/ci/retry.sh 3 5 -- supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview pending database migrations
        if: steps.freshness.outputs.fresh == 'true' && (inputs.scope == 'database' || inputs.scope == 'both')
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked
          supabase db push --linked --dry-run

      - name: Reconfirm current main immediately before backend mutation
        if: steps.freshness.outputs.fresh == 'true'
        id: mutation_freshness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_main="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [ "$SOURCE_SHA" = "$latest_main" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "Source $SOURCE_SHA was superseded by $latest_main; backend mutation skipped without failure"
          fi

      - name: Apply pending database migrations exactly once
        if: steps.mutation_freshness.outputs.fresh == 'true' && (inputs.scope == 'database' || inputs.scope == 'both')
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked
          supabase migration list --linked

      - name: Deploy repository Edge Functions with bounded retry
        if: steps.mutation_freshness.outputs.fresh == 'true' && (inputs.scope == 'functions' || inputs.scope == 'both')
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/retry.sh 3 8 -- supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
          bash scripts/ci/retry.sh 3 5 -- supabase functions list --project-ref "$SUPABASE_PROJECT_ID"

      - name: Record control-plane outcome
        if: always()
        shell: bash
        run: |
          {
            echo "## Owner Supabase guarded release"
            echo "- Source: \`${SOURCE_SHA:-$GITHUB_SHA}\`"
            echo "- Scope: \`${{ inputs.scope }}\`"
            echo "- Project: \`$SUPABASE_PROJECT_ID\`"
            echo "- Shared production lock: \`irha-production-mutation\`"
            echo "- Fresh at lock acquisition: \`${{ steps.freshness.outputs.fresh || 'not-reached' }}\`"
            echo "- Fresh at mutation time: \`${{ steps.mutation_freshness.outputs.fresh || 'not-reached' }}\`"
            echo "- Database push policy: dry-run then one exact apply; no blind retry"
          } >> "$GITHUB_STEP_SUMMARY"
