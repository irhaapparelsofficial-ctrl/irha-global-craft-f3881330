name: Full audit hardening bootstrap

on:
  push:
    branches: [fix/full-audit-hardening-20260716]
    paths:
      - ".github/workflows/full-audit-hardening-bootstrap-20260716.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-audit-hardening-20260716
          fetch-depth: 0

      - name: Apply atomic audit hardening patch
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one patch anchor in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          redirects = Path("public/_redirects")
          text = redirects.read_text()
          alias_block = "/privacy /privacy-policy 301\n/terms /terms-of-service 301\n"
          if alias_block not in text:
              anchor = "/shipping-returns /resources 301\n"
              if text.count(anchor) != 1:
                  raise SystemExit("redirect alias anchor missing")
              redirects.write_text(text.replace(anchor, anchor + alias_block, 1))

          replace_once(
              "public/_worker.js",
              '  ["/shipping-returns", "/resources"],\n',
              '  ["/shipping-returns", "/resources"],\n  ["/privacy", "/privacy-policy"],\n  ["/terms", "/terms-of-service"],\n',
          )

          replace_once(
              "src/lib/appRuntimeIncident.ts",
              'const INCIDENT_RPC_URL = `${OWNER_SUPABASE_URL}/rest/v1/rpc/record_public_app_incident`;',
              'const INCIDENT_REPORT_URL = `${OWNER_SUPABASE_URL}/functions/v1/report-app-incident`;',
          )
          replace_once(
              "src/lib/appRuntimeIncident.ts",
              '    const response = await fetch(INCIDENT_RPC_URL, {',
              '    const response = await fetch(INCIDENT_REPORT_URL, {',
          )
          replace_once(
              "src/lib/appRuntimeIncident.ts",
              '        apikey: OWNER_SUPABASE_PUBLISHABLE_KEY,\n        "content-type": "application/json",',
              '        apikey: OWNER_SUPABASE_PUBLISHABLE_KEY,\n        authorization: `Bearer ${OWNER_SUPABASE_PUBLISHABLE_KEY}`,\n        "content-type": "application/json",',
          )

          config = Path("supabase/config.toml")
          config_text = config.read_text()
          config_block = "\n[functions.report-app-incident]\nverify_jwt = false\n"
          if "[functions.report-app-incident]" not in config_text:
              anchor = "[functions.generate-mockup]\nverify_jwt = false\n"
              if config_text.count(anchor) != 1:
                  raise SystemExit("Supabase function config anchor missing")
              config.write_text(config_text.replace(anchor, anchor + config_block, 1))

          test = Path("src/lib/__checks__/appRuntimeIncident.test.ts")
          test_text = test.read_text()
          test_text = test_text.replace(
              'it("reports through the owner Supabase RPC without loading the app client", async () => {',
              'it("reports through the public Edge gateway without loading the app client", async () => {',
          )
          test_text = test_text.replace(
              '"https://pvzjiozismyxqrzmtfbi.supabase.co/rest/v1/rpc/record_public_app_incident",',
              '"https://pvzjiozismyxqrzmtfbi.supabase.co/functions/v1/report-app-incident",',
          )
          test_text = test_text.replace(
              'expect(headers.has("authorization")).toBe(false);',
              'expect(headers.get("authorization")).toMatch(/^Bearer sb_publishable_/);',
          )
          test_text = test_text.replace(
              'expect(reporter).toContain("/rest/v1/rpc/record_public_app_incident");',
              'expect(reporter).toContain("/functions/v1/report-app-incident");\n    expect(reporter).not.toContain("/rest/v1/rpc/record_public_app_incident");',
          )
          test_text = test_text.replace(
              'expect(reporter).not.toContain("authorization");',
              'expect(reporter).toContain("authorization");',
          )
          migration_assertion = '    expect(migration).toContain("GRANT EXECUTE ON FUNCTION public.record_public_app_incident");\n'
          if 'allow_service_role_runtime_incident_reporting.sql' not in test_text:
              test_text = test_text.replace(
                  migration_assertion,
                  migration_assertion + '''    const serviceGrant = readFileSync(\n      "supabase/migrations/20260716030000_allow_service_role_runtime_incident_reporting.sql",\n      "utf8",\n    );\n    expect(serviceGrant).toContain("TO anon, authenticated, service_role");\n''',
                  1,
              )
          test.write_text(test_text)

          Path("src/lib/__checks__/publicRouteAliases.test.ts").write_text('''import { readFileSync } from "node:fs";\nimport { describe, expect, it } from "vitest";\n\nconst redirects = readFileSync("public/_redirects", "utf8");\nconst worker = readFileSync("public/_worker.js", "utf8");\n\ndescribe("public legal route aliases", () => {\n  it("permanently redirects historic privacy and terms paths", () => {\n    expect(redirects).toContain("/privacy /privacy-policy 301");\n    expect(redirects).toContain("/terms /terms-of-service 301");\n    expect(worker).toContain('["/privacy", "/privacy-policy"]');\n    expect(worker).toContain('["/terms", "/terms-of-service"]');\n  });\n\n  it("does not make legacy aliases indexable pages", () => {\n    expect(worker).not.toMatch(/EXACT_PUBLIC_PATHS[\\s\\S]*?"\\/privacy",/);\n    expect(worker).not.toMatch(/EXACT_PUBLIC_PATHS[\\s\\S]*?"\\/terms",/);\n  });\n});\n''')

          Path("src/lib/__checks__/runtimeIncidentGatewayContract.test.ts").write_text('''import { readFileSync } from "node:fs";\nimport { describe, expect, it } from "vitest";\n\nconst gateway = readFileSync("supabase/functions/report-app-incident/index.ts", "utf8");\nconst client = readFileSync("src/lib/appRuntimeIncident.ts", "utf8");\nconst config = readFileSync("supabase/config.toml", "utf8");\n\ndescribe("runtime incident Edge gateway contract", () => {\n  it("keeps the browser away from the privileged RPC", () => {\n    expect(client).toContain("/functions/v1/report-app-incident");\n    expect(client).not.toContain("/rest/v1/rpc/record_public_app_incident");\n  });\n\n  it("uses a tightly scoped public gateway with server-side credentials", () => {\n    expect(config).toContain("[functions.report-app-incident]");\n    expect(config).toMatch(/\\[functions\\.report-app-incident\\]\\s+verify_jwt = false/);\n    expect(gateway).toContain("SUPABASE_SERVICE_ROLE_KEY");\n    expect(gateway).toContain("ALLOWED_ORIGINS");\n    expect(gateway).toContain("MAX_BODY_BYTES");\n    expect(gateway).toContain("/rest/v1/rpc/record_public_app_incident");\n    expect(gateway).not.toContain("Access-Control-Allow-Origin: *");\n  });\n});\n''')

          Path("supabase/migrations/20260716030000_allow_service_role_runtime_incident_reporting.sql").write_text('''-- Phase 1 of runtime-incident RPC hardening.\n-- The old browser client remains compatible during rollout; the Edge gateway\n-- receives an explicit service-role grant before the frontend switches over.\n\nBEGIN;\n\nREVOKE ALL ON FUNCTION public.record_public_app_incident(text,text,text,text,text,text,text) FROM PUBLIC;\nGRANT EXECUTE ON FUNCTION public.record_public_app_incident(text,text,text,text,text,text,text)\n  TO anon, authenticated, service_role;\n\nCOMMENT ON FUNCTION public.record_public_app_incident(text,text,text,text,text,text,text) IS\n  'Internal rate-limited runtime incident recorder. Browser traffic is being migrated to report-app-incident; direct anon/authenticated execution is removed after live cutover verification.';\n\nCOMMIT;\n''')

          function_dir = Path("supabase/functions/report-app-incident")
          function_dir.mkdir(parents=True, exist_ok=True)
          (function_dir / "index.ts").write_text('''import "jsr:@supabase/functions-js/edge-runtime.d.ts";\n\nconst ALLOWED_ORIGINS = new Set([\n  "https://irhaapparels.com",\n  "https://www.irhaapparels.com",\n]);\nconst MAX_BODY_BYTES = 16_384;\n\nfunction corsHeaders(origin: string): HeadersInit {\n  return {\n    "Access-Control-Allow-Origin": origin,\n    "Access-Control-Allow-Headers": "apikey, authorization, content-type, x-client-info",\n    "Access-Control-Allow-Methods": "POST, OPTIONS",\n    "Access-Control-Max-Age": "600",\n    Vary: "Origin",\n  };\n}\n\nfunction json(value: unknown, status: number, origin: string): Response {\n  return new Response(JSON.stringify(value), {\n    status,\n    headers: {\n      ...corsHeaders(origin),\n      "Content-Type": "application/json; charset=utf-8",\n      "Cache-Control": "no-store",\n      "X-Content-Type-Options": "nosniff",\n    },\n  });\n}\n\nDeno.serve(async (req: Request) => {\n  const origin = req.headers.get("origin") ?? "";\n  if (!ALLOWED_ORIGINS.has(origin)) {\n    return new Response(null, { status: 403, headers: { "Cache-Control": "no-store" } });\n  }\n\n  if (req.method === "OPTIONS") {\n    return new Response(null, { status: 204, headers: corsHeaders(origin) });\n  }\n  if (req.method !== "POST") return json(false, 405, origin);\n\n  const length = Number(req.headers.get("content-length") ?? "0");\n  if (Number.isFinite(length) && length > MAX_BODY_BYTES) return json(false, 413, origin);\n\n  const raw = await req.text();\n  if (new TextEncoder().encode(raw).byteLength > MAX_BODY_BYTES) return json(false, 413, origin);\n\n  let payload: unknown;\n  try {\n    payload = JSON.parse(raw);\n  } catch {\n    return json(false, 400, origin);\n  }\n  if (!payload || typeof payload !== "object" || Array.isArray(payload)) return json(false, 400, origin);\n\n  const supabaseUrl = Deno.env.get("SUPABASE_URL") ?? "";\n  const serviceRoleKey = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY") ?? "";\n  if (!supabaseUrl || !serviceRoleKey) return json(false, 503, origin);\n\n  const forwardedFor =\n    req.headers.get("cf-connecting-ip") ??\n    req.headers.get("x-real-ip") ??\n    req.headers.get("x-forwarded-for") ??\n    "unknown";\n\n  const upstream = await fetch(`${supabaseUrl}/rest/v1/rpc/record_public_app_incident`, {\n    method: "POST",\n    headers: {\n      apikey: serviceRoleKey,\n      authorization: `Bearer ${serviceRoleKey}`,\n      "content-type": "application/json",\n      accept: "application/json",\n      origin,\n      "x-forwarded-for": forwardedFor.slice(0, 200),\n      "user-agent": (req.headers.get("user-agent") ?? "unknown").slice(0, 500),\n    },\n    body: JSON.stringify(payload),\n  });\n\n  if (!upstream.ok) return json(false, 502, origin);\n  const accepted = (await upstream.json().catch(() => false)) === true;\n  return json(accepted, 200, origin);\n});\n''')

          workflow = Path(".github/workflows/full-audit-hardening-bootstrap-20260716.yml")
          workflow.unlink()
          PY

      - name: Validate patch contents
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '/privacy /privacy-policy 301' public/_redirects
          grep -Fq '["/privacy", "/privacy-policy"]' public/_worker.js
          grep -Fq '/functions/v1/report-app-incident' src/lib/appRuntimeIncident.ts
          grep -Fq '[functions.report-app-incident]' supabase/config.toml
          test -f supabase/functions/report-app-incident/index.ts
          test -f supabase/migrations/20260716030000_allow_service_role_runtime_incident_reporting.sql
          test ! -e .github/workflows/full-audit-hardening-bootstrap-20260716.yml

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(security): harden public audit findings"
          git push origin HEAD:fix/full-audit-hardening-20260716
