name: Workers AI Guide Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "public/_worker-guide.js"
      - "public/_worker.js"
      - "scripts/install-cloudflare-ai-guide.mjs"
      - "scripts/prepare-cloudflare-ai-pages-config.mjs"
      - "scripts/smoke-cloudflare-ai-guide.mjs"
      - "src/components/LiveChat.tsx"
      - "src/lib/__checks__/cloudflareWorkersAiGuide.test.ts"
      - ".github/workflows/workers-ai-guide-gate.yml"
      - ".github/workflows/deploy-workers-ai-guide-current-main.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workers-ai-guide-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  targeted-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact event source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact lockfile dependencies with bounded retry
        run: bash scripts/ci/retry.sh 3 5 -- npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run targeted Workers AI contract test
        run: npx vitest run src/lib/__checks__/cloudflareWorkersAiGuide.test.ts --reporter=verbose

      - name: Build and verify only the Workers AI surface
        shell: bash
        run: |
          set -euo pipefail
          npx vite build
          node scripts/install-cloudflare-ai-guide.mjs
          grep -F 'import { handleIrhaGuideRequest } from "./_worker-guide.js";' dist/_worker.js
          grep -F 'pathname === "/api/guide"' dist/_worker.js
          grep -F 'env.AI.run' dist/_worker-guide.js
          grep -F 'cloudflare-workers-ai' dist/_worker-guide.js
          test "$(grep -Fc 'pathname === "/api/guide"' dist/_worker.js)" = "1"
          test "$(grep -Fc 'handleIrhaGuideRequest' dist/_worker.js)" = "2"

      - name: Record specialized-gate contract
        if: always()
        shell: bash
        run: |
          {
            echo "## Workers AI Guide Gate"
            echo "- Scope: targeted contract test and worker-route build only"
            echo "- Full typecheck, full test suite and immutable release build: owned by Quality Gate"
            echo "- Duplicate full-build notification risk: removed"
          } >> "$GITHUB_STEP_SUMMARY"

  ia-supa-e007-archive-transfer:
    uses: ./.github/workflows/ia-supa-e007-archive-transfer.yml
    permissions:
      contents: read
