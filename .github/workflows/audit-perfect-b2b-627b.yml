name: Audit perfect B2B 627b

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE_SHA: 627b196a62ef56afd40e14c2837676a4ea2bdaf8
      LIVE_ORIGIN: https://irhaapparels.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for exact verified production release
        shell: bash
        run: |
          set -euo pipefail
          matched=0
          for attempt in $(seq 1 120); do
            cache_bust="${EXPECTED_SOURCE_SHA::12}-$attempt-$RANDOM"
            if curl -fsSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' "$LIVE_ORIGIN/build.json?audit=$cache_bust" -o live-build.json \
              && jq -e --arg sha "$EXPECTED_SOURCE_SHA" '.source_commit==$sha and .source_identity_state=="verified"' live-build.json >/dev/null; then
              matched=1
              break
            fi
            sleep 10
          done
          test "$matched" = "1"
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Verify mobile and desktop buyer experience
        shell: bash
        run: |
          cat > audit-perfect.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const origin = process.env.LIVE_ORIGIN;
          const expectedSource = process.env.EXPECTED_SOURCE_SHA;
          const browser = await chromium.launch({ headless: true });
          const result = { expectedSource, mobile: {}, desktop: {}, routes: {}, errors: [] };

          async function dismissCookie(page, screenshotPath) {
            const dialog = page.getByRole('dialog', { name: /optional cookies/i });
            const visible = await dialog.isVisible().catch(() => false);
            let background = null;
            if (visible) {
              background = await dialog.evaluate((el) => getComputedStyle(el).backgroundColor);
              if (screenshotPath) await page.screenshot({ path: screenshotPath, fullPage: false });
              await page.getByRole('button', { name: /essential only/i }).click();
              await page.waitForTimeout(500);
            }
            return { visible, background };
          }

          const mobileContext = await browser.newContext({ viewport: { width: 390, height: 844 }, locale: 'en-GB' });
          const mobile = await mobileContext.newPage();
          mobile.on('pageerror', (error) => result.errors.push(`mobile:${error.message}`));
          const mobileResponse = await mobile.goto(`${origin}/?perfect_mobile=${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 90000 });
          await mobile.waitForTimeout(3500);
          const mobileCookie = await dismissCookie(mobile, '01-mobile-cookie.png');
          await mobile.waitForTimeout(700);

          const mobileLogo = await mobile.locator('img[src="/irha-brand-mark.svg"]').first().isVisible().catch(() => false);
          const mobileQuote = await mobile.getByText('Request quote', { exact: false }).first().isVisible().catch(() => false);
          const mobileDock = await mobile.locator('.sticky-mobile-cta').isVisible().catch(() => false);
          const guideLauncherVisible = await mobile.getByRole('button', { name: /Open Irha Live Support/i }).isVisible().catch(() => false);
          const humanLauncherVisible = await mobile.getByRole('button', { name: /Open live chat with the Irha Apparels team/i }).isVisible().catch(() => false);
          const sportsLoaded = await mobile.locator('img[alt="Custom sportswear manufacturing"]').evaluate((img) => img.complete && img.naturalWidth > 0).catch(() => false);
          const leatherLoaded = await mobile.locator('img[alt="Custom leather apparel manufacturing"]').evaluate((img) => img.complete && img.naturalWidth > 0).catch(() => false);
          const mobileDims = await mobile.evaluate(() => ({ innerWidth, scrollWidth: document.documentElement.scrollWidth, bodyWidth: document.body.scrollWidth }));
          await mobile.screenshot({ path: '02-mobile-home-clean.png', fullPage: false });
          await mobile.screenshot({ path: '03-mobile-home-full.png', fullPage: true });

          await mobile.getByRole('button', { name: /Open live support with the AI guide or Irha human team/i }).click();
          await mobile.waitForTimeout(700);
          const guideDialog = await mobile.locator('section[data-chat-kind="ai-guide"]').isVisible().catch(() => false);
          const aiTab = await mobile.getByText('AI Guide', { exact: true }).isVisible().catch(() => false);
          const humanTab = await mobile.getByRole('button', { name: /Human Team/i }).isVisible().catch(() => false);
          await mobile.screenshot({ path: '04-mobile-live-support.png', fullPage: false });
          if (humanTab) {
            await mobile.getByRole('button', { name: /Human Team/i }).click();
            await mobile.waitForTimeout(800);
          }
          const humanDialog = await mobile.locator('section[data-chat-kind="human"]').isVisible().catch(() => false);
          await mobile.screenshot({ path: '05-mobile-human-team.png', fullPage: false });

          result.mobile = {
            status: mobileResponse?.status(), cookie: mobileCookie, logo: mobileLogo, quote: mobileQuote,
            dock: mobileDock, guideLauncherVisible, humanLauncherVisible, sportsLoaded, leatherLoaded,
            guideDialog, aiTab, humanTab, humanDialog, dimensions: mobileDims,
          };
          await mobileContext.close();

          const desktopContext = await browser.newContext({ viewport: { width: 1440, height: 900 }, locale: 'en-GB' });
          const desktop = await desktopContext.newPage();
          desktop.on('pageerror', (error) => result.errors.push(`desktop:${error.message}`));
          const desktopResponse = await desktop.goto(`${origin}/?perfect_desktop=${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 90000 });
          await desktop.waitForTimeout(3500);
          const desktopCookie = await dismissCookie(desktop, '06-desktop-cookie.png');
          await desktop.waitForTimeout(700);
          const desktopLogo = await desktop.locator('img[src="/irha-brand-mark.svg"]').first().isVisible().catch(() => false);
          const desktopNav = await desktop.getByRole('navigation').first().isVisible().catch(() => false);
          const desktopQuote = await desktop.getByText('Request quote', { exact: false }).first().isVisible().catch(() => false);
          const desktopDock = await desktop.locator('.sticky-mobile-cta').isVisible().catch(() => false);
          const desktopGuideLauncher = await desktop.getByRole('button', { name: /Open Irha Live Support/i }).isVisible().catch(() => false);
          const desktopHumanLauncher = await desktop.getByRole('button', { name: /Open live chat with the Irha Apparels team/i }).isVisible().catch(() => false);
          const fixedWhatsApp = await desktop.locator('a[href*="wa.me"], a[href*="api.whatsapp.com"]').filter({ visible: true }).count().catch(() => 0);
          const desktopSportsLoaded = await desktop.locator('img[alt="Custom sportswear manufacturing"]').evaluate((img) => img.complete && img.naturalWidth > 0).catch(() => false);
          const desktopLeatherLoaded = await desktop.locator('img[alt="Custom leather apparel manufacturing"]').evaluate((img) => img.complete && img.naturalWidth > 0).catch(() => false);
          const desktopDims = await desktop.evaluate(() => ({ innerWidth, scrollWidth: document.documentElement.scrollWidth, bodyWidth: document.body.scrollWidth }));
          await desktop.screenshot({ path: '07-desktop-home-clean.png', fullPage: false });
          await desktop.screenshot({ path: '08-desktop-home-full.png', fullPage: true });

          if (desktopGuideLauncher) {
            await desktop.getByRole('button', { name: /Open Irha Live Support/i }).click();
            await desktop.waitForTimeout(700);
          }
          const desktopGuideDialog = await desktop.locator('section[data-chat-kind="ai-guide"]').isVisible().catch(() => false);
          const desktopHumanTab = await desktop.getByRole('button', { name: /Human Team/i }).isVisible().catch(() => false);
          await desktop.screenshot({ path: '09-desktop-live-support.png', fullPage: false });

          result.desktop = {
            status: desktopResponse?.status(), cookie: desktopCookie, logo: desktopLogo, nav: desktopNav,
            quote: desktopQuote, dock: desktopDock, guideLauncher: desktopGuideLauncher,
            humanLauncher: desktopHumanLauncher, fixedWhatsApp, sportsLoaded: desktopSportsLoaded,
            leatherLoaded: desktopLeatherLoaded, guideDialog: desktopGuideDialog,
            humanTab: desktopHumanTab, dimensions: desktopDims,
          };

          for (const path of ['/products', '/inquiry', '/catalogue']) {
            const response = await desktop.goto(`${origin}${path}?perfect_audit=${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 90000 });
            await desktop.waitForTimeout(900);
            result.routes[path] = { status: response?.status(), finalUrl: desktop.url() };
          }
          await desktopContext.close();
          await browser.close();

          await writeFile('perfect-b2b-audit.json', JSON.stringify(result, null, 2));
          console.log(JSON.stringify(result, null, 2));

          const dark = (value) => !value || /rgba?\((?:0|9),\s*(?:0|9),\s*(?:0|9)/.test(value);
          const mobileNoOverflow = result.mobile.dimensions.scrollWidth <= result.mobile.dimensions.innerWidth + 2 && result.mobile.dimensions.bodyWidth <= result.mobile.dimensions.innerWidth + 2;
          const desktopNoOverflow = result.desktop.dimensions.scrollWidth <= result.desktop.dimensions.innerWidth + 2 && result.desktop.dimensions.bodyWidth <= result.desktop.dimensions.innerWidth + 2;
          const required = [
            result.mobile.status === 200, dark(result.mobile.cookie.background), result.mobile.logo, result.mobile.quote,
            result.mobile.dock, !result.mobile.guideLauncherVisible, !result.mobile.humanLauncherVisible,
            result.mobile.sportsLoaded, result.mobile.leatherLoaded, result.mobile.guideDialog, result.mobile.aiTab,
            result.mobile.humanTab, result.mobile.humanDialog, mobileNoOverflow,
            result.desktop.status === 200, dark(result.desktop.cookie.background), result.desktop.logo, result.desktop.nav,
            result.desktop.quote, !result.desktop.dock, result.desktop.guideLauncher, !result.desktop.humanLauncher,
            result.desktop.fixedWhatsApp === 0, result.desktop.sportsLoaded, result.desktop.leatherLoaded,
            result.desktop.guideDialog, result.desktop.humanTab, desktopNoOverflow, result.errors.length === 0,
          ];
          for (const route of Object.values(result.routes)) required.push(route.status === 200);
          if (required.some((value) => !value)) process.exitCode = 1;
          EOF
          node audit-perfect.mjs
      - name: Upload final audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perfect-b2b-627b-audit
          path: |
            live-build.json
            perfect-b2b-audit.json
            01-mobile-cookie.png
            02-mobile-home-clean.png
            03-mobile-home-full.png
            04-mobile-live-support.png
            05-mobile-human-team.png
            06-desktop-cookie.png
            07-desktop-home-clean.png
            08-desktop-home-full.png
            09-desktop-live-support.png
          if-no-files-found: warn
          retention-days: 2
