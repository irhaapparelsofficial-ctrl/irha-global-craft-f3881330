name: Generate Classic Bavarian Checkered Shirt Media

on:
  push:
    branches:
      - catalog-media-classic-shirt-2026-07-16
    paths:
      - .github/workflows/generate-classic-shirt-media.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/generate-classic-shirt-media.yml

permissions:
  contents: write

concurrency:
  group: generate-classic-shirt-media
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message || '', '[classic-shirt-generated]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: catalog-media-classic-shirt-2026-07-16
          fetch-depth: 2
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install locked image dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'Pillow==11.3.0'

      - name: Generate exact-logo masters and web renditions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import urllib.request
          from pathlib import Path

          from PIL import Image

          root = "https://pvzjiozismyxqrzmtfbi.supabase.co/storage/v1/object/public/site-media/catalog-remediation/classic-bavarian-checkered-shirt"
          logo_url = "https://pvzjiozismyxqrzmtfbi.supabase.co/storage/v1/object/public/site-media/brand/irha-apparels-official-locked-logo-256.png"
          sources = {
              "front": f"{root}/classic-bavarian-checkered-shirt-design-01-front-clean-2048.png",
              "three-quarter": f"{root}/classic-bavarian-checkered-shirt-design-01-three-quarter-clean-2048.png",
              "side": f"{root}/classic-bavarian-checkered-shirt-design-01-side-clean-2048.png",
              "back": f"{root}/classic-bavarian-checkered-shirt-design-01-back-clean-2048.png",
          }

          base_dir = Path("public/product-media/classic-bavarian-checkered-shirt")
          clean_dir = base_dir / "clean"
          branded_dir = base_dir / "branded"
          web_dir = base_dir / "web"
          for directory in (clean_dir, branded_dir, web_dir):
              directory.mkdir(parents=True, exist_ok=True)

          def download(url: str) -> bytes:
              request = urllib.request.Request(url, headers={"User-Agent": "Irha-Apparels-Media-Pipeline/1.0"})
              with urllib.request.urlopen(request, timeout=90) as response:
                  if response.status != 200:
                      raise RuntimeError(f"Download failed: {response.status} {url}")
                  return response.read()

          logo_bytes = download(logo_url)
          logo_master = Image.open(io.BytesIO(logo_bytes)).convert("RGBA")
          if logo_master.width < 200 or logo_master.height < 200:
              raise RuntimeError("Official logo master is unexpectedly small")

          manifest = {
              "product": "Classic Bavarian Checkered Shirt",
              "design": "01",
              "logo_sha256": hashlib.sha256(logo_bytes).hexdigest(),
              "logo_rule": "Exact official raster; deterministic overlay only; no AI redraw",
              "views": [],
          }

          for view, source_url in sources.items():
              source_bytes = download(source_url)
              clean_path = clean_dir / f"classic-bavarian-checkered-shirt-design-01-{view}-clean-2048.png"
              clean_path.write_bytes(source_bytes)

              base = Image.open(io.BytesIO(source_bytes)).convert("RGBA")
              if base.size != (2048, 2048):
                  raise RuntimeError(f"Unexpected {view} dimensions: {base.size}")

              logo = logo_master.copy()
              target_width = 220
              target_height = round(logo.height * target_width / logo.width)
              logo = logo.resize((target_width, target_height), Image.Resampling.LANCZOS)
              alpha = logo.getchannel("A").point(lambda value: round(value * 0.72))
              logo.putalpha(alpha)

              x = base.width - logo.width - 72
              y = 72
              branded = base.copy()
              branded.alpha_composite(logo, (x, y))

              branded_path = branded_dir / f"classic-bavarian-checkered-shirt-design-01-{view}-branded-2048.png"
              branded.save(branded_path, format="PNG", compress_level=6)

              web = branded.convert("RGB")
              web.thumbnail((1600, 1600), Image.Resampling.LANCZOS)
              web_path = web_dir / f"classic-bavarian-checkered-shirt-design-01-{view}-web-1600.webp"
              web.save(web_path, format="WEBP", quality=86, method=6)

              manifest["views"].append({
                  "view": view,
                  "source_url": source_url,
                  "source_sha256": hashlib.sha256(source_bytes).hexdigest(),
                  "clean_path": str(clean_path),
                  "branded_path": str(branded_path),
                  "web_path": str(web_path),
                  "master_dimensions": list(branded.size),
                  "web_dimensions": list(web.size),
                  "logo_box": [x, y, logo.width, logo.height],
                  "branded_sha256": hashlib.sha256(branded_path.read_bytes()).hexdigest(),
                  "web_sha256": hashlib.sha256(web_path.read_bytes()).hexdigest(),
              })

          manifest_path = base_dir / "media-manifest.json"
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Verify generated media
        shell: bash
        run: |
          set -euo pipefail
          test "$(find public/product-media/classic-bavarian-checkered-shirt/clean -type f -name '*.png' | wc -l)" -eq 4
          test "$(find public/product-media/classic-bavarian-checkered-shirt/branded -type f -name '*.png' | wc -l)" -eq 4
          test "$(find public/product-media/classic-bavarian-checkered-shirt/web -type f -name '*.webp' | wc -l)" -eq 4
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          base = Path('public/product-media/classic-bavarian-checkered-shirt')
          manifest = json.loads((base / 'media-manifest.json').read_text())
          assert len(manifest['views']) == 4
          for row in manifest['views']:
              with Image.open(row['branded_path']) as image:
                  assert image.size == (2048, 2048)
              with Image.open(row['web_path']) as image:
                  assert image.size == (1600, 1600)
          print('Classic shirt media verification passed.')
          PY

      - name: Commit generated files to branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git add public/product-media/classic-bavarian-checkered-shirt
          if git diff --cached --quiet; then
            echo "Generated media already matches the committed files."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(media): add exact-logo classic shirt views [classic-shirt-generated]"
          for attempt in 1 2 3; do
            git fetch origin catalog-media-classic-shirt-2026-07-16
            git rebase origin/catalog-media-classic-shirt-2026-07-16
            if git push origin HEAD:catalog-media-classic-shirt-2026-07-16; then
              exit 0
            fi
            sleep $((attempt * 4))
          done
          exit 1
