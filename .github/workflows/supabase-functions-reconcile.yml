name: Supabase Function Reconciliation

run-name: Function reconciliation · ${{ github.sha }}

on:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: read

concurrency:
  group: irha-production-mutation
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: pvzjiozismyxqrzmtfbi
  PLAN_FILE: supabase/reconciliation/sec-m03-function-reconciliation.json
  PARITY_REFRESH_FILE: supabase/reconciliation/sec-m03-parity-refresh.json

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      SOURCE_SHA: ${{ github.sha }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.39.2

      - name: Require successful exact-SHA Quality Gate
        shell: bash
        run: |
          set -euo pipefail
          gate_state="pending"
          for attempt in $(seq 1 80); do
            status_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/status")"
            gate_state="$(printf '%s' "$status_json" | jq -r '[.statuses[] | select(.context == "Irha Quality Gate")][0].state // "pending"')"
            case "$gate_state" in
              success)
                break
                ;;
              failure|error)
                echo "::error title=Quality Gate failed::Exact SHA $SOURCE_SHA has Irha Quality Gate state $gate_state"
                exit 1
                ;;
            esac
            if [ "$attempt" -eq 80 ]; then
              echo "::error title=Quality Gate unresolved::Exact SHA $SOURCE_SHA did not receive a successful Irha Quality Gate status"
              exit 1
            fi
            sleep 15
          done
          test "$gate_state" = "success"

      - name: Validate reconciliation scope and freshness
        shell: bash
        run: |
          set -euo pipefail
          latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test "$latest_main" = "$SOURCE_SHA"
          test -s "$PLAN_FILE"
          test -s "$PARITY_REFRESH_FILE"
          test "$(jq -r '.schema_version' "$PLAN_FILE")" = "1"
          test "$(jq -r '.project_id' "$PLAN_FILE")" = "$SUPABASE_PROJECT_ID"
          test "$(jq -r '.execution_id' "$PLAN_FILE")" = "IA-CTRL-E001"
          test "$(jq '.functions | length' "$PLAN_FILE")" = "3"
          test "$(jq -r '.schema_version' "$PARITY_REFRESH_FILE")" = "1"
          test "$(jq -r '.project_id' "$PARITY_REFRESH_FILE")" = "$SUPABASE_PROJECT_ID"
          test "$(jq -r '.execution_id' "$PARITY_REFRESH_FILE")" = "IA-CTRL-E001R"
          test "$(jq '.functions | length' "$PARITY_REFRESH_FILE")" = "5"

          jq -r '.functions[].name' "$PLAN_FILE" | sort -u > /tmp/planned-functions.txt
          test "$(wc -l < /tmp/planned-functions.txt | tr -d ' ')" = "3"
          printf '%s\n' generate-mockup live-chat notification-dispatcher public-lead-gateway site-visitor | sort > /tmp/approved-parity-refresh.txt
          jq -r '.functions[].name' "$PARITY_REFRESH_FILE" | sort -u > /tmp/planned-parity-refresh.txt
          cmp -s /tmp/approved-parity-refresh.txt /tmp/planned-parity-refresh.txt

          jq -r '.functions[][0]' supabase/deployment-parity/functions-f3.json | sort -u > /tmp/blocked-f3.txt
          jq -r '.functions[][0]' supabase/deployment-parity/functions-f6.json | sort -u > /tmp/blocked-f6.txt
          jq -r '.functions[][0]' supabase/deployment-parity/functions-f4.json | sort -u > /tmp/repository-only.txt
          cat /tmp/blocked-f3.txt /tmp/blocked-f6.txt /tmp/repository-only.txt | sort -u > /tmp/blocked-functions.txt

          while IFS= read -r function_name; do
            test -n "$function_name"
            grep -Fqx "[functions.$function_name]" supabase/config.toml
            ! grep -Fqx "$function_name" /tmp/blocked-functions.txt
            test -f "supabase/functions/$function_name/index.ts"
          done < /tmp/planned-functions.txt

          while IFS=$'\t' read -r function_name registry source_path; do
            test -n "$function_name"
            test -f "$registry"
            test -f "$source_path"
            ! grep -Fqx "$function_name" /tmp/blocked-functions.txt
          done < <(jq -r '.functions[] | [.name, .registry, .repository_source] | @tsv' "$PARITY_REFRESH_FILE")

      - name: Verify project identity and compute bounded deployment set
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${SUPABASE_ACCESS_TOKEN:-}" | tr -d '[:space:]')"
          test -n "$token"
          echo "::add-mask::$token"

          project_json="$(curl --retry 3 --retry-all-errors -fsS \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID")"
          test "$(printf '%s' "$project_json" | jq -r '.id // empty')" = "$SUPABASE_PROJECT_ID"

          curl --retry 3 --retry-all-errors -fsS \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/functions" \
            -o /tmp/functions-before.raw.json
          jq -e 'type == "array" and all(.[]; ((.name // .slug) | type == "string") and (.version | type == "number"))' \
            /tmp/functions-before.raw.json > /dev/null
          jq -S . /tmp/functions-before.raw.json > /tmp/functions-before.json
          : > /tmp/functions-to-deploy.txt

          while IFS=$'\t' read -r function_name minimum_version; do
            live_version="$(jq -r --arg name "$function_name" '[.[] | select((.name // .slug) == $name) | (.version // 0)] | max // 0' /tmp/functions-before.json)"
            if [ "$live_version" -lt "$minimum_version" ]; then
              printf '%s\n' "$function_name" >> /tmp/functions-to-deploy.txt
            fi
          done < <(jq -r '.functions[] | [.name, (.minimum_version|tostring)] | @tsv' "$PLAN_FILE")

          deploy_count="$(wc -l < /tmp/functions-to-deploy.txt | tr -d ' ')"
          echo "deploy_count=$deploy_count" >> "$GITHUB_OUTPUT"
          jq -Rsc 'split("\n") | map(select(length > 0))' /tmp/functions-to-deploy.txt > /tmp/functions-to-deploy.json

      - name: Deploy only under-version approved functions
        if: steps.plan.outputs.deploy_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r function_name; do
            test -n "$function_name"
            verify_jwt="$(jq -r --arg name "$function_name" '.functions[] | select(.name == $name) | .verify_jwt' "$PLAN_FILE")"
            args=(functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_ID")
            if [ "$verify_jwt" = "false" ]; then
              args+=(--no-verify-jwt)
            fi
            supabase "${args[@]}"
          done < /tmp/functions-to-deploy.txt

      - name: Verify minimum live versions
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${SUPABASE_ACCESS_TOKEN:-}" | tr -d '[:space:]')"
          test -n "$token"
          echo "::add-mask::$token"

          inventory_ready=false
          for attempt in $(seq 1 20); do
            curl --retry 3 --retry-all-errors -fsS \
              -H "Authorization: Bearer $token" \
              -H 'Content-Type: application/json' \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/functions" \
              -o /tmp/functions-after.raw.json
            jq -e 'type == "array" and all(.[]; ((.name // .slug) | type == "string") and (.version | type == "number"))' \
              /tmp/functions-after.raw.json > /dev/null
            jq -S . /tmp/functions-after.raw.json > /tmp/functions-after.json

            inventory_ready=true
            while IFS=$'\t' read -r function_name minimum_version; do
              live_version="$(jq -r --arg name "$function_name" '[.[] | select((.name // .slug) == $name) | (.version // 0)] | max // 0' /tmp/functions-after.json)"
              if [ "$live_version" -lt "$minimum_version" ]; then
                inventory_ready=false
              fi
            done < <(jq -r '.functions[] | [.name, (.minimum_version|tostring)] | @tsv' "$PLAN_FILE")

            if [ "$inventory_ready" = true ]; then
              break
            fi
            sleep 3
          done

          if [ "$inventory_ready" != true ]; then
            while IFS=$'\t' read -r function_name minimum_version; do
              live_version="$(jq -r --arg name "$function_name" '[.[] | select((.name // .slug) == $name) | (.version // 0)] | max // 0' /tmp/functions-after.json)"
              if [ "$live_version" -lt "$minimum_version" ]; then
                echo "::error title=Function reconciliation incomplete::$function_name version $live_version is below required $minimum_version"
              fi
            done < <(jq -r '.functions[] | [.name, (.minimum_version|tostring)] | @tsv' "$PLAN_FILE")
            exit 1
          fi

      - name: Verify exact deployed sources and refresh approved registries
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${SUPABASE_ACCESS_TOKEN:-}" | tr -d '[:space:]')"
          test -n "$token"
          echo "::add-mask::$token"
          mkdir -p /tmp/sec-m03-live-functions

          while IFS= read -r function_name; do
            curl --retry 3 --retry-all-errors -fsS \
              -H "Authorization: Bearer $token" \
              -H 'Content-Type: application/json' \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/functions/$function_name" \
              -o "/tmp/sec-m03-live-functions/$function_name.json"
            jq -e --arg name "$function_name" \
              '(.slug == $name or .name == $name) and (.version | type == "number") and (.verify_jwt | type == "boolean") and (.ezbr_sha256 | type == "string") and (.files | type == "array")' \
              "/tmp/sec-m03-live-functions/$function_name.json" > /dev/null
          done < /tmp/planned-parity-refresh.txt

          SEC_M03_PARITY_REFRESH_PLAN="$PARITY_REFRESH_FILE" \
          SEC_M03_LIVE_FUNCTION_DIRECTORY=/tmp/sec-m03-live-functions \
          SEC_M03_SOURCE_EVIDENCE=/tmp/sec-m03-deployed-source-evidence.json \
          SOURCE_SHA="$SOURCE_SHA" \
            node scripts/ci/verify-sec-m03-deployed-sources.mjs

          SEC_M03_PARITY_REFRESH_PLAN="$PARITY_REFRESH_FILE" \
          SEC_M03_LIVE_INVENTORY=/tmp/functions-after.json \
          SEC_M03_REGISTRY_EVIDENCE=/tmp/sec-m03-registry-refresh-evidence.json \
          SOURCE_SHA="$SOURCE_SHA" \
            node scripts/ci/refresh-sec-m03-live-parity.mjs

      - name: Generate exact post-deploy type and parity evidence
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.39.2 gen types typescript \
            --project-id "$SUPABASE_PROJECT_ID" \
            --schema public > /tmp/supabase-types.ts
          test -s /tmp/supabase-types.ts
          ! grep -E '(sb_secret_|service_role[^A-Za-z0-9]|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,})' /tmp/supabase-types.ts
          node scripts/ci/verify-supabase-type-supplement.mjs /tmp/supabase-types.ts

          cp /tmp/supabase-types.ts src/integrations/supabase/types.ts
          node scripts/ci/run-sec-m03-parity-generation.mjs

          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg project_id "$SUPABASE_PROJECT_ID" \
            --slurpfile plan "$PLAN_FILE" \
            --slurpfile parity_refresh "$PARITY_REFRESH_FILE" \
            --slurpfile before /tmp/functions-before.json \
            --slurpfile deployed /tmp/functions-to-deploy.json \
            --slurpfile after /tmp/functions-after.json \
            --slurpfile source_evidence /tmp/sec-m03-deployed-source-evidence.json \
            --slurpfile registry_evidence /tmp/sec-m03-registry-refresh-evidence.json \
            '{source_sha: $source_sha, project_id: $project_id, plan: $plan[0], parity_refresh: $parity_refresh[0], before: $before[0], deployed: $deployed[0], after: $after[0], source_evidence: $source_evidence[0], registry_evidence: $registry_evidence[0]}' \
            > /tmp/sec-m03-function-reconciliation-evidence.json

      - name: Upload exact reconciliation and parity closure evidence
        uses: actions/upload-artifact@v4
        with:
          name: sec-m03-parity-closure-${{ env.SOURCE_SHA }}
          path: |
            /tmp/sec-m03-function-reconciliation-evidence.json
            /tmp/sec-m03-deployed-source-evidence.json
            /tmp/sec-m03-registry-refresh-evidence.json
            /tmp/functions-before.json
            /tmp/functions-after.json
            /tmp/supabase-types.ts
            supabase/reconciliation/sec-m03-parity-refresh.json
            supabase/deployment-parity/functions-f1.json
            supabase/deployment-parity/functions-f2.json
            supabase/deployment-parity/migration-provenance.json
            supabase/deployment-parity/manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Record result
        if: always()
        shell: bash
        run: |
          {
            echo "## SEC-M03 function reconciliation"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Project: \`$SUPABASE_PROJECT_ID\`"
            echo "- Plan: \`$PLAN_FILE\`"
            echo "- Deployment count: \`${{ steps.plan.outputs.deploy_count || 'not-reached' }}\`"
            echo "- Scope: generate-mockup, live-chat, site-visitor only"
            echo "- Shared helper: bundled dependency, never deployed as a function"
            echo "- Pre-existing source-matched parity: notification-dispatcher v8 and public-lead-gateway v8"
            echo "- Exact-SHA Quality Gate: required before mutation"
            echo "- Inventory and source: authenticated Supabase Management API JSON"
            echo "- Post-deploy canonical parity export: required"
          } >> "$GITHUB_STEP_SUMMARY"
