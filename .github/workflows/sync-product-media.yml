name: Sync Product Media

on:
  push:
    branches: [main]
    paths:
      - "scripts/product-media-manifest.json"
      - "scripts/sync-product-media.mjs"
      - ".github/workflows/sync-product-media.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/product-media-manifest.json"
      - "scripts/sync-product-media.mjs"
      - ".github/workflows/sync-product-media.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch and optimize product media
        run: node scripts/sync-product-media.mjs

      - name: Upload validation artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: product-media-validation
          path: public/product-media
          if-no-files-found: error

      - name: Commit first-party media assets
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- public/product-media; then
            echo "No media changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/product-media
          git commit -m "Sync first-party product media"
          git push
