name: Sync Product Media

on:
  push:
    branches: [main]
    paths:
      - "scripts/product-media-manifest.json"
      - "scripts/sync_product_media.py"
      - "scripts/media-sync-trigger.txt"
      - ".github/workflows/sync-product-media.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/product-media-manifest.json"
      - "scripts/sync_product_media.py"
      - "scripts/media-sync-trigger.txt"
      - ".github/workflows/sync-product-media.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir Pillow==11.3.0

      - name: Fetch and optimize product media
        run: python scripts/sync_product_media.py

      - name: Upload validation artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: product-media-validation
          path: public/product-media
          if-no-files-found: error

      - name: Commit validated media to PR branch
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/product-media
          if git diff --cached --quiet; then
            echo "No media changes to commit."
            exit 0
          fi
          git commit -m "Sync first-party product media"
          git push origin "HEAD:$HEAD_REF"

      - name: Commit first-party media assets
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- public/product-media; then
            echo "No media changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/product-media
          git commit -m "Sync first-party product media"
          git push
