name: Audit release status cc153c30

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/audit-release-status-cc153c30.yml"

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Print recent main Quality Gate and Cloudflare runs
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: cc153c30219f94a57f12e5ed7cc1c8407bcb38e0
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=100" > /tmp/runs.json
          jq --arg sha "$EXPECTED_SHA" '
            .workflow_runs
            | map(select(.name == "Quality Gate" or .name == "Cloudflare Production After Quality Gate"))
            | map({id,name,event,status,conclusion,head_sha,head_branch,created_at,updated_at,html_url})
            | .[:20]
          ' /tmp/runs.json
          echo "EXPECTED_SHA_RUNS"
          jq --arg sha "$EXPECTED_SHA" '
            .workflow_runs
            | map(select(.head_sha == $sha))
            | map({id,name,event,status,conclusion,head_sha,created_at,updated_at,html_url})
          ' /tmp/runs.json
