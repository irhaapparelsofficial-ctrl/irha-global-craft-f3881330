name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: quality-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}${{ github.event_name != 'pull_request' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  sec_m02_read_only_capture:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 783
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Supabase project identity
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          project_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            https://api.supabase.com/v1/projects/pvzjiozismyxqrzmtfbi)"
          jq -e '.id == "pvzjiozismyxqrzmtfbi" and .status == "ACTIVE_HEALTHY"' <<<"$project_json" >/dev/null

      - name: Generate authoritative public-schema types
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.39.2 gen types typescript \
            --project-id pvzjiozismyxqrzmtfbi \
            --schema public > /tmp/supabase-types.ts
          test -s /tmp/supabase-types.ts
          sha256sum /tmp/supabase-types.ts | tee /tmp/supabase-types.sha256
          ! grep -E '(sb_secret_|service_role[^A-Za-z0-9]|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,})' /tmp/supabase-types.ts
          install -m 0644 /tmp/supabase-types.ts src/integrations/supabase/types.ts

      - name: Generate canonical migration provenance ledger
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: pvzjiozismyxqrzmtfbi
          MIGRATION_PROVENANCE_MODE: write
          MIGRATION_PROVENANCE_OUTPUT: /tmp/migration-provenance.json
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/generate-migration-provenance.mjs | tee /tmp/migration-provenance-summary.json
          test -s /tmp/migration-provenance.json
          jq -e '.payload.totals.live == 374 and .payload.totals.P5 == 0' /tmp/migration-provenance.json >/dev/null
          sha256sum /tmp/migration-provenance.json | tee /tmp/migration-provenance-file.sha256
          install -m 0644 /tmp/migration-provenance.json supabase/deployment-parity/migration-provenance.json

      - name: Capture canonical deployment manifest result
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: pvzjiozismyxqrzmtfbi
          SUPABASE_MANIFEST_MODE: write
          SUPABASE_MANIFEST_OUTPUT: /tmp/supabase-manifest.json
        shell: bash
        run: |
          set +e
          node scripts/ci/generate-supabase-manifest.mjs > /tmp/supabase-manifest-run.log 2>&1
          status=$?
          set -e
          cat /tmp/supabase-manifest-run.log
          printf '%s\n' "$status" > /tmp/supabase-manifest-status.txt
          if [ "$status" -eq 0 ]; then
            test -s /tmp/supabase-manifest.json
            jq -e '.database.public.tables == 158 and .database.live_migrations.count == 374 and .edge_functions.deployed_count == 87 and .migration_provenance.totals.P5 == 0' /tmp/supabase-manifest.json >/dev/null
            sha256sum /tmp/supabase-manifest.json | tee /tmp/supabase-manifest-file.sha256
            install -m 0644 /tmp/supabase-manifest.json supabase/deployment-parity/manifest.json
          else
            printf 'manifest generation failed with status %s\n' "$status" > /tmp/supabase-manifest-file.sha256
          fi

      - name: Upload SEC-M02 authoritative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-m02-authoritative-evidence-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/supabase-types.ts
            /tmp/supabase-types.sha256
            /tmp/migration-provenance.json
            /tmp/migration-provenance-summary.json
            /tmp/migration-provenance-file.sha256
            /tmp/supabase-manifest.json
            /tmp/supabase-manifest-run.log
            /tmp/supabase-manifest-status.txt
            /tmp/supabase-manifest-file.sha256
          if-no-files-found: warn
          retention-days: 1
          compression-level: 6

      - name: Refuse sealing after manifest failure
        shell: bash
        run: test "$(cat /tmp/supabase-manifest-status.txt)" = "0"

      - name: Seal exact generated evidence on the PR branch
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$HEAD_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"
          paths=(
            src/integrations/supabase/types.ts
            supabase/deployment-parity/migration-provenance.json
            supabase/deployment-parity/manifest.json
          )
          if [ -z "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo "Authoritative generated evidence already matches the PR branch."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          git commit -m "chore(security): seal authoritative Supabase evidence"
          git push origin "HEAD:$HEAD_BRANCH"

  quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout current source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact lockfile dependencies
        run: bash scripts/ci/retry.sh 2 3 -- npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Verify dependency manifests stayed immutable
        run: git diff --exit-code -- package.json package-lock.json

      - name: Verify deployment source lock
        run: node scripts/verify-deployment-source.mjs

      - name: Verify secret safety
        run: node scripts/verify-secret-safety.mjs

      - name: Verify migration registry
        run: node scripts/verify-migration-order.mjs

      - name: Verify committed Supabase deployment parity
        run: node scripts/verify-supabase-parity.mjs

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint SEC-M02 changed executable source
        run: npx eslint scripts/verify-supabase-parity.mjs scripts/ci/generate-migration-provenance.mjs scripts/ci/generate-supabase-manifest.mjs scripts/ci/audit-production-artifacts.mjs

      - name: Verify repository lint debt did not worsen
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npx eslint . --format json > /tmp/eslint-full.json
          lint_status=$?
          set -e
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/eslint-full.json', 'utf8'));
          const totals = report.reduce((sum, file) => ({
            errors: sum.errors + file.errorCount,
            warnings: sum.warnings + file.warningCount,
          }), { errors: 0, warnings: 0 });
          fs.writeFileSync('/tmp/eslint-totals.json', `${JSON.stringify(totals, null, 2)}\n`);
          if (totals.errors > 445 || totals.warnings > 30) {
            throw new Error(`repository lint debt worsened: ${totals.errors} errors, ${totals.warnings} warnings`);
          }
          console.log(JSON.stringify(totals));
          NODE
          test "$lint_status" -ne 0 || true

      - name: Unit and integration tests
        shell: bash
        run: |
          set -euo pipefail
          npm test -- --reporter=verbose 2>&1 | tee quality-test.log

      - name: Build deployable website
        shell: bash
        run: |
          set -euo pipefail
          npm --ignore-scripts run build 2>&1 | tee quality-build.log

      - name: Audit immutable production artifact
        env:
          ARTIFACT_AUDIT_MODE: directory
          ARTIFACT_DIRECTORY: dist
        run: node scripts/ci/audit-production-artifacts.mjs | tee /tmp/artifact-audit.json

      - name: Verify minimum deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/build.json
          test -s dist/release.txt
          test -s dist/_redirects
          test -s dist/_headers
          test -s dist/catalog-route-manifest.json
          jq -e --arg sha "$GITHUB_SHA" '.source_commit == $sha and .source_identity_state == "verified"' dist/build.json >/dev/null
          jq -e '.schemaVersion == 1 and .productCount == 254 and (.products | length) == 254' dist/catalog-route-manifest.json >/dev/null

      - name: Upload failed quality diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-failure-${{ github.sha }}
          path: |
            quality-test.log
            quality-build.log
            /tmp/eslint-full.json
            /tmp/eslint-totals.json
            /tmp/artifact-audit.json
          if-no-files-found: warn
          retention-days: 2
          compression-level: 0

      - name: Publish main build artifact
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: production-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 2
          compression-level: 6

      - name: Record release result
        if: always()
        shell: bash
        run: |
          {
            echo "## Buyer-ready Quality Gate"
            echo "- Source: \`$GITHUB_SHA\`"
            echo "- Dependency, source-lock, secret and migration gates: required"
            echo "- Static Supabase parity: required"
            echo "- TypeScript and changed-file strict ESLint: required"
            echo "- Repository lint baseline: must not exceed 445 errors / 30 warnings"
            echo "- Unit and integration tests: required"
            echo "- Production build, immutable identity and source-map/public-artifact audit: required"
            echo "- Production writes: none"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish exact commit Quality Gate status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=error
          description="Buyer-ready Quality Gate did not complete"
          case "$QUALITY_JOB_STATUS" in
            success)
              state=success
              description="Source, parity, lint baseline, tests, build and artifact audit passed"
              ;;
            failure)
              state=failure
              description="$({
                cat quality-test.log 2>/dev/null || true
                cat quality-build.log 2>/dev/null || true
              } | grep -Ei 'FAIL|AssertionError|Error:|failed|missing|mismatch|refusing|cannot|unable' | tail -n 1 | tr '\r\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-140 || true)"
              [ -n "$description" ] || description="Buyer-ready Quality Gate failed; open diagnostic artifact"
              ;;
            cancelled)
              state=error
              description="Superseded by a newer commit"
              ;;
          esac
          bash scripts/ci/retry.sh 2 2 -- gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="Irha Quality Gate" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null
