name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: quality-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout exact event source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies with bounded retry
        run: bash scripts/ci/retry.sh 3 5 -- npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify deployment source lock
        run: npm run verify:deployment-source

      - name: Verify secret safety
        run: npm run verify:secrets

      - name: Verify migration order
        run: npm run verify:migrations

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          npm test -- --passWithNoTests --reporter=verbose 2>&1 | tee vitest-diagnostics.log

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-diagnostics-${{ github.run_id }}
          path: vitest-diagnostics.log
          if-no-files-found: error
          retention-days: 1

      - name: Build immutable release
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-diagnostics.log

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_id }}
          path: build-diagnostics.log
          if-no-files-found: error
          retention-days: 1

      - name: Verify built release identity and canonical host
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:release-identity
          grep -F 'name="x-irha-release" content="frontend-live-2026-07-13-r11"' dist/index.html
          grep -F '"expected_origin": "https://irhaapparels.com"' dist/build.json
          grep -F 'Sitemap: https://irhaapparels.com/sitemap.xml' dist/robots.txt
          jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" \
            '.source_commit == $sha and .source_identity_state == "verified" and .repository == $repo and .supabase_project_id == "pvzjiozismyxqrzmtfbi"' \
            dist/build.json >/dev/null

          if grep -R -nF --include='*.html' --include='*.js' --include='*.json' --include='*.txt' --include='*.xml' 'https://www.irhaapparels.com' dist; then
            echo "Built output still contains the redirecting www host"
            exit 1
          fi
          if grep -R -nF --include='*.html' --include='*.js' --include='*.json' --include='*.txt' --include='*.xml' 'mlefxgyaqoisvdmoiapq' dist; then
            echo "Built output references the retired Lovable Cloud database"
            exit 1
          fi
          if ! grep -R -qF --include='*.js' 'pvzjiozismyxqrzmtfbi' dist/assets; then
            echo "Built frontend is missing the immutable owner Supabase identity"
            exit 1
          fi

      - name: Guard production text output against legacy claims
        shell: bash
        run: |
          set -euo pipefail
          terms=(
            "Since 2014"
            "MOQ 50"
            "45-day delivery"
            "45-Day Production"
            "reply within 12 hours"
            "OEKO-TEX® 100"
            "BSCI Audited"
            "ISO 9001:2015"
            "SEDEX Member"
          )
          mapfile -d '' files < <(
            find dist -type f \
              \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' -o -name '*.txt' -o -name '*.xml' \) \
              -print0
          )
          files+=(index.html)
          for term in "${terms[@]}"; do
            if grep -niF -- "$term" "${files[@]}"; then
              echo "Forbidden legacy production claim found in deployable text output: $term"
              exit 1
            fi
          done

      - name: Publish exact main build artifact
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: production-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 3
          compression-level: 6

      - name: Record validation-only contract
        if: always()
        shell: bash
        run: |
          {
            echo "## Quality Gate"
            echo "- Source: \`$GITHUB_SHA\`"
            echo "- Required checks: source lock, secret scan, migrations, typecheck, tests, build, release identity and legacy-claim guard"
            echo "- Deployment secrets required: \`false\`"
            echo "- Production writes: none"
            echo "- Deployment authority: guarded downstream workflows"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish exact commit Quality Gate status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=error
          description="Quality Gate did not complete"
          case "$QUALITY_JOB_STATUS" in
            success)
              state=success
              description="Quality Gate passed"
              ;;
            failure)
              state=failure
              description="Quality Gate failed"
              ;;
            cancelled)
              state=error
              description="Quality Gate cancelled"
              ;;
          esac

          bash scripts/ci/retry.sh 3 3 -- gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="Irha Quality Gate" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null
