name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: quality-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: bash scripts/ci/retry.sh 2 3 -- npm install --legacy-peer-deps --no-audit --no-fund

      - name: Advisory TypeScript check
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Build deployable website
        shell: bash
        run: |
          set -euo pipefail
          npm --ignore-scripts run build 2>&1 | tee quality-build.log

      - name: Upload failed build diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-build-diagnostic-${{ github.sha }}
          path: quality-build.log
          if-no-files-found: warn
          retention-days: 2
          compression-level: 0

      - name: Verify minimum deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/build.json
          test -s dist/release.txt
          test -s dist/_redirects
          test -s dist/_headers
          jq -e --arg sha "$GITHUB_SHA" \
            '.source_commit == $sha and .source_identity_state == "verified"' \
            dist/build.json >/dev/null

      - name: Publish main build artifact
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: production-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 2
          compression-level: 6

      - name: Record fast-release result
        if: always()
        shell: bash
        run: |
          {
            echo "## Fast Quality Gate"
            echo "- Source: \`$GITHUB_SHA\`"
            echo "- Blocking check: deployable production build"
            echo "- TypeScript check: \`${{ steps.typecheck.outcome || 'not-run' }}\` (advisory)"
            echo "- Full tests, migration dry-runs and image processing: non-blocking/manual"
            echo "- Production writes: none"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish exact commit Quality Gate status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=error
          description="Fast build gate did not complete"
          case "$QUALITY_JOB_STATUS" in
            success)
              state=success
              description="Deployable website build passed"
              ;;
            failure)
              state=failure
              description="Website production build failed"
              ;;
            cancelled)
              state=error
              description="Superseded by a newer commit"
              ;;
          esac

          bash scripts/ci/retry.sh 2 2 -- gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="Irha Quality Gate" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null
