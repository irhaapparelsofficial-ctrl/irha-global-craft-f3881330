name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --passWithNoTests

      - name: Build
        run: npm run build

      - name: Guard production output against legacy claims
        shell: bash
        run: |
          set -euo pipefail
          terms=(
            "Since 2014"
            "MOQ 50"
            "45-day delivery"
            "45-Day Production"
            "reply within 12 hours"
            "OEKO-TEX® 100"
            "BSCI Audited"
            "ISO 9001:2015"
            "SEDEX Member"
          )
          for term in "${terms[@]}"; do
            if grep -RniF "$term" dist index.html; then
              echo "Forbidden legacy production claim found in deployable output: $term"
              exit 1
            fi
          done
