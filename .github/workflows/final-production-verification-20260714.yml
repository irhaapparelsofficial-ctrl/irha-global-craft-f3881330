name: Final Production Verification

on:
  push:
    branches:
      - ops/final-production-verification-20260714
    paths:
      - .github/workflows/final-production-verification-20260714.yml

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      APEX: https://irhaapparels.com
      WWW: https://www.irhaapparels.com
    steps:
      - name: Verify raw redirects, routes, source identity and live-chat bundle
        shell: bash
        run: |
          set -euo pipefail
          cache_bust="final-${GITHUB_SHA::12}-$RANDOM"

          get_code="$(curl -sS --max-redirs 0 -o /dev/null -D /tmp/www-get.headers -w '%{http_code}' "$WWW/products/sportswear?canonical_test=$cache_bust")"
          test "$get_code" = "301"
          grep -Eiq '^location: https://irhaapparels\.com/products/sportswear\?canonical_test=' /tmp/www-get.headers
          grep -Eiq '^x-irha-canonical-redirect: www-to-apex' /tmp/www-get.headers

          post_code="$(curl -sS --max-redirs 0 -o /dev/null -D /tmp/www-post.headers -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"synthetic":true}' "$WWW/inquiry?canonical_test=$cache_bust")"
          test "$post_code" = "308"
          grep -Eiq '^location: https://irhaapparels\.com/inquiry\?canonical_test=' /tmp/www-post.headers
          grep -Eiq '^x-irha-canonical-redirect: www-to-apex' /tmp/www-post.headers

          test "$(curl -sS -o /tmp/home.html -w '%{http_code}' "$APEX/?canonical_test=$cache_bust")" = "200"
          test "$(curl -sS -o /tmp/admin.html -w '%{http_code}' "$APEX/admin/live-chat?canonical_test=$cache_bust")" = "200"
          test "$(curl -sS -o /tmp/products.html -w '%{http_code}' "$APEX/products?canonical_test=$cache_bust")" = "200"
          test "$(curl -sS -o /tmp/catalogue.html -w '%{http_code}' "$APEX/catalogue?canonical_test=$cache_bust")" = "200"
          test "$(curl -sS -o /tmp/inquiry.html -w '%{http_code}' "$APEX/inquiry?canonical_test=$cache_bust")" = "200"
          test "$(curl -sS -o /tmp/sitemap.xml -w '%{http_code}' "$APEX/sitemap.xml?canonical_test=$cache_bust")" = "200"
          grep -q '<urlset' /tmp/sitemap.xml

          curl -sS "$APEX/build.json?canonical_test=$cache_bust" -o /tmp/build.json
          source_commit="$(jq -r '.source_commit // empty' /tmp/build.json)"
          identity_state="$(jq -r '.source_identity_state // empty' /tmp/build.json)"
          built_at="$(jq -r '.built_at // empty' /tmp/build.json)"
          test "$identity_state" = "verified"
          case "$source_commit" in
            1da2b1e8e46be0e34751eb6e5e2934b5a08c8926|1f9b1b33265996f7ee20ae82158dc58713b68ebd) ;;
            *) echo "Unexpected production source: $source_commit"; exit 1 ;;
          esac

          main_js="$(grep -Eo 'src="[^"]+index-[^"]+\.js"' /tmp/home.html | head -n1 | sed -E 's/^src="|"$//g')"
          test -n "$main_js"
          curl -sS "$APEX$main_js?canonical_test=$cache_bust" -o /tmp/main.js
          grep -Fq 'Live Team' /tmp/main.js
          grep -Fq '/admin/live-chat' /tmp/main.js
          grep -Fq '/functions/v1/live-chat' /tmp/main.js
          grep -Fq 'Irha Live Team' /tmp/main.js

          cat > /tmp/comment.md <<EOF
          ## Final production verification

          - Raw `www` GET: **301** to apex, same path/query
          - Raw `www` POST: **308** to apex, method-preserving
          - Apex homepage, products, catalogue, inquiry and admin live-chat route: **200**
          - Sitemap: **200** with XML URL set
          - Compiled apex bundle contains `Live Team`, `/admin/live-chat`, the Supabase live-chat endpoint and `Irha Live Team`
          - Production source: `$source_commit`
          - Source identity: `$identity_state`
          - Built at: `$built_at`

          No production setting or data was changed by this verification workflow.
          EOF
          cat /tmp/comment.md
          gh issue comment 375 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
