name: Final Production Verification

on:
  push:
    branches:
      - ops/final-production-verification-20260714
    paths:
      - .github/workflows/final-production-verification-20260714.yml

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      APEX: https://irhaapparels.com
      WWW: https://www.irhaapparels.com
      EXPECTED_SOURCE: 1f9b1b33265996f7ee20ae82158dc58713b68ebd
    steps:
      - name: Capture evidence, then validate production
        shell: bash
        run: |
          set -u
          cache_bust="final-${GITHUB_SHA::12}-$RANDOM"

          get_code="$(curl -sS --http1.1 --connect-timeout 10 --max-time 30 -o /dev/null -D /tmp/www-get.headers -w '%{http_code}' "$WWW/products/sportswear?canonical_test=$cache_bust" || printf 'curl_error')"
          post_code="$(curl -sS --http1.1 --connect-timeout 10 --max-time 30 -o /dev/null -D /tmp/www-post.headers -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"synthetic":true}' "$WWW/inquiry?canonical_test=$cache_bust" || printf 'curl_error')"

          get_location="$(grep -i -m1 '^location:' /tmp/www-get.headers 2>/dev/null | cut -d: -f2- | sed -E 's/^[[:space:]]*//; s/\r$//' || true)"
          get_marker="$(grep -i -m1 '^x-irha-canonical-redirect:' /tmp/www-get.headers 2>/dev/null | cut -d: -f2- | sed -E 's/^[[:space:]]*//; s/\r$//' || true)"
          post_location="$(grep -i -m1 '^location:' /tmp/www-post.headers 2>/dev/null | cut -d: -f2- | sed -E 's/^[[:space:]]*//; s/\r$//' || true)"
          post_marker="$(grep -i -m1 '^x-irha-canonical-redirect:' /tmp/www-post.headers 2>/dev/null | cut -d: -f2- | sed -E 's/^[[:space:]]*//; s/\r$//' || true)"

          home_code="$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/home.html -w '%{http_code}' "$APEX/?canonical_test=$cache_bust" || printf 'curl_error')"
          admin_code="$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/admin.html -w '%{http_code}' "$APEX/admin/live-chat?canonical_test=$cache_bust" || printf 'curl_error')"
          products_code="$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/products.html -w '%{http_code}' "$APEX/products?canonical_test=$cache_bust" || printf 'curl_error')"
          catalogue_code="$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/catalogue.html -w '%{http_code}' "$APEX/catalogue?canonical_test=$cache_bust" || printf 'curl_error')"
          inquiry_code="$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/inquiry.html -w '%{http_code}' "$APEX/inquiry?canonical_test=$cache_bust" || printf 'curl_error')"
          sitemap_code="$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/sitemap.xml -w '%{http_code}' "$APEX/sitemap.xml?canonical_test=$cache_bust" || printf 'curl_error')"
          curl -sS --connect-timeout 10 --max-time 30 "$APEX/build.json?canonical_test=$cache_bust" -o /tmp/build.json || printf '{}' > /tmp/build.json
          source_commit="$(jq -r '.source_commit // empty' /tmp/build.json 2>/dev/null || true)"
          identity_state="$(jq -r '.source_identity_state // empty' /tmp/build.json 2>/dev/null || true)"
          built_at="$(jq -r '.built_at // empty' /tmp/build.json 2>/dev/null || true)"

          main_js="$(grep -Eo 'src="[^"]+index-[^"]+\.js"' /tmp/home.html 2>/dev/null | head -n1 | sed -E 's/^src="|"$//g' || true)"
          bundle_live_team=false
          bundle_admin_route=false
          bundle_endpoint=false
          bundle_title=false
          if test -n "$main_js" && curl -sS --connect-timeout 10 --max-time 60 "$APEX$main_js?canonical_test=$cache_bust" -o /tmp/main.js; then
            grep -Fq 'Live Team' /tmp/main.js && bundle_live_team=true
            grep -Fq '/admin/live-chat' /tmp/main.js && bundle_admin_route=true
            grep -Fq '/functions/v1/live-chat' /tmp/main.js && bundle_endpoint=true
            grep -Fq 'Irha Live Team' /tmp/main.js && bundle_title=true
          fi

          {
            echo '## Final production verification — captured evidence'
            echo
            echo "- Raw www GET status: \`$get_code\`"
            echo "- Raw www GET location: \`$get_location\`"
            echo "- Raw www GET marker: \`$get_marker\`"
            echo "- Raw www POST status: \`$post_code\`"
            echo "- Raw www POST location: \`$post_location\`"
            echo "- Raw www POST marker: \`$post_marker\`"
            echo "- Apex routes — home \`$home_code\`, admin live chat \`$admin_code\`, products \`$products_code\`, catalogue \`$catalogue_code\`, inquiry \`$inquiry_code\`, sitemap \`$sitemap_code\`"
            echo "- Production source: \`$source_commit\`"
            echo "- Source identity: \`$identity_state\`"
            echo "- Built at: \`$built_at\`"
            echo "- Bundle checks — Live Team \`$bundle_live_team\`, admin route \`$bundle_admin_route\`, endpoint \`$bundle_endpoint\`, title \`$bundle_title\`"
            echo
            echo 'No production setting or data was changed by this verification workflow.'
          } > /tmp/comment.md
          cat /tmp/comment.md
          gh issue comment 375 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

          failed=0
          test "$get_code" = "301" || failed=1
          test "$get_location" = "https://irhaapparels.com/products/sportswear?canonical_test=$cache_bust" || failed=1
          test "$get_marker" = "www-to-apex" || failed=1
          test "$post_code" = "308" || failed=1
          test "$post_location" = "https://irhaapparels.com/inquiry?canonical_test=$cache_bust" || failed=1
          test "$post_marker" = "www-to-apex" || failed=1
          test "$home_code" = "200" || failed=1
          test "$admin_code" = "200" || failed=1
          test "$products_code" = "200" || failed=1
          test "$catalogue_code" = "200" || failed=1
          test "$inquiry_code" = "200" || failed=1
          test "$sitemap_code" = "200" || failed=1
          grep -q '<urlset' /tmp/sitemap.xml || failed=1
          test "$source_commit" = "$EXPECTED_SOURCE" || failed=1
          test "$identity_state" = "verified" || failed=1
          test "$bundle_live_team" = "true" || failed=1
          test "$bundle_admin_route" = "true" || failed=1
          test "$bundle_endpoint" = "true" || failed=1
          test "$bundle_title" = "true" || failed=1

          if test "$failed" = "1"; then
            echo 'Production verification captured unexpected values; see issue #375 evidence comment.'
            exit 1
          fi
          echo 'Final production verification passed.'
