name: Final Production Verification

on:
  push:
    branches:
      - ops/final-production-verification-20260714
    paths:
      - .github/workflows/final-production-verification-20260714.yml

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      APEX: https://irhaapparels.com
      WWW: https://www.irhaapparels.com
    steps:
      - name: Verify raw redirects, routes, source identity and live-chat bundle
        shell: bash
        run: |
          set -euo pipefail
          cache_bust="final-${GITHUB_SHA::12}-$RANDOM"

          get_code="$(curl -sS --http1.1 -o /dev/null -D /tmp/www-get.headers -w '%{http_code}' "$WWW/products/sportswear?canonical_test=$cache_bust")"
          get_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' /tmp/www-get.headers)"
          get_marker="$(awk 'BEGIN{IGNORECASE=1} /^x-irha-canonical-redirect:/{sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' /tmp/www-get.headers)"
          echo "www GET status=$get_code location=$get_location marker=$get_marker"
          sed -n '1,30p' /tmp/www-get.headers
          test "$get_code" = "301"
          test "$get_location" = "https://irhaapparels.com/products/sportswear?canonical_test=$cache_bust"
          test "$get_marker" = "www-to-apex"

          post_code="$(curl -sS --http1.1 -o /dev/null -D /tmp/www-post.headers -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"synthetic":true}' "$WWW/inquiry?canonical_test=$cache_bust")"
          post_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' /tmp/www-post.headers)"
          post_marker="$(awk 'BEGIN{IGNORECASE=1} /^x-irha-canonical-redirect:/{sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' /tmp/www-post.headers)"
          echo "www POST status=$post_code location=$post_location marker=$post_marker"
          sed -n '1,30p' /tmp/www-post.headers
          test "$post_code" = "308"
          test "$post_location" = "https://irhaapparels.com/inquiry?canonical_test=$cache_bust"
          test "$post_marker" = "www-to-apex"

          home_code="$(curl -sS -o /tmp/home.html -w '%{http_code}' "$APEX/?canonical_test=$cache_bust")"
          admin_code="$(curl -sS -o /tmp/admin.html -w '%{http_code}' "$APEX/admin/live-chat?canonical_test=$cache_bust")"
          products_code="$(curl -sS -o /tmp/products.html -w '%{http_code}' "$APEX/products?canonical_test=$cache_bust")"
          catalogue_code="$(curl -sS -o /tmp/catalogue.html -w '%{http_code}' "$APEX/catalogue?canonical_test=$cache_bust")"
          inquiry_code="$(curl -sS -o /tmp/inquiry.html -w '%{http_code}' "$APEX/inquiry?canonical_test=$cache_bust")"
          sitemap_code="$(curl -sS -o /tmp/sitemap.xml -w '%{http_code}' "$APEX/sitemap.xml?canonical_test=$cache_bust")"
          printf 'apex home=%s admin=%s products=%s catalogue=%s inquiry=%s sitemap=%s\n' "$home_code" "$admin_code" "$products_code" "$catalogue_code" "$inquiry_code" "$sitemap_code"
          test "$home_code" = "200"
          test "$admin_code" = "200"
          test "$products_code" = "200"
          test "$catalogue_code" = "200"
          test "$inquiry_code" = "200"
          test "$sitemap_code" = "200"
          grep -q '<urlset' /tmp/sitemap.xml

          curl -sS "$APEX/build.json?canonical_test=$cache_bust" -o /tmp/build.json
          source_commit="$(jq -r '.source_commit // empty' /tmp/build.json)"
          identity_state="$(jq -r '.source_identity_state // empty' /tmp/build.json)"
          built_at="$(jq -r '.built_at // empty' /tmp/build.json)"
          echo "production source=$source_commit identity=$identity_state built_at=$built_at"
          test "$identity_state" = "verified"
          test "$source_commit" = "1f9b1b33265996f7ee20ae82158dc58713b68ebd"

          main_js="$(grep -Eo 'src="[^"]+index-[^"]+\.js"' /tmp/home.html | head -n1 | sed -E 's/^src="|"$//g')"
          test -n "$main_js"
          curl -sS "$APEX$main_js?canonical_test=$cache_bust" -o /tmp/main.js
          grep -Fq 'Live Team' /tmp/main.js
          grep -Fq '/admin/live-chat' /tmp/main.js
          grep -Fq '/functions/v1/live-chat' /tmp/main.js
          grep -Fq 'Irha Live Team' /tmp/main.js

          {
            echo '## Final production verification'
            echo
            echo '- Raw `www` GET: **301** to apex, same path/query'
            echo '- Raw `www` POST: **308** to apex, method-preserving'
            echo '- Apex homepage, products, catalogue, inquiry and admin live-chat route: **200**'
            echo '- Sitemap: **200** with XML URL set'
            echo '- Compiled apex bundle contains `Live Team`, `/admin/live-chat`, the Supabase live-chat endpoint and `Irha Live Team`'
            echo "- Production source: \`$source_commit\`"
            echo "- Source identity: \`$identity_state\`"
            echo "- Built at: \`$built_at\`"
            echo
            echo 'No production setting or data was changed by this verification workflow.'
          } > /tmp/comment.md
          cat /tmp/comment.md
          gh issue comment 375 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
