name: Delete exposed diagnostic workflow runs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/security-delete-exposed-audit-runs-20260716.yml"

permissions:
  actions: write
  contents: read

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete diagnostic runs containing sensitive output
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 29440937731 29440964620; do
            status="$(curl -sS -o /tmp/delete-${run_id}.json -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            case "$status" in
              204|404) ;;
              *) echo "Failed to delete workflow run $run_id (HTTP $status)"; exit 1 ;;
            esac
          done
          echo "Sensitive diagnostic workflow runs deleted." >> "$GITHUB_STEP_SUMMARY"
