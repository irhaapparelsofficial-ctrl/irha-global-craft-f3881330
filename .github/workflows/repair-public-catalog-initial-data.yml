name: Repair public catalog initial render

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'fix/critical-seo-security-20260713'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Seed committed catalog before database overlay
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/hooks/usePublicCatalog.ts')
          source = path.read_text()

          old_tree = '''export function usePublicCatalogTree() {
            return useQuery({
              queryKey: K.tree,
              queryFn: fetchTree,
              staleTime: 60_000,
              gcTime: 5 * 60_000,
              refetchOnWindowFocus: true,
            });
          }
          '''
          new_tree = '''export function usePublicCatalogTree() {
            return useQuery({
              queryKey: K.tree,
              queryFn: fetchTree,
              initialData: cloneLocalTree,
              initialDataUpdatedAt: 0,
              staleTime: 60_000,
              gcTime: 5 * 60_000,
              refetchOnWindowFocus: true,
            });
          }
          '''
          if old_tree not in source:
              raise SystemExit('usePublicCatalogTree target not found')
          source = source.replace(old_tree, new_tree, 1)

          product_marker = '''export function usePublicProduct(categorySlug?: string, productSlug?: string) {
            return useQuery({
              queryKey: K.product(categorySlug ?? "", productSlug ?? ""),
              enabled: Boolean(categorySlug && productSlug),
              staleTime: 60_000,
          '''
          product_replacement = '''function localProductFallback(categorySlug?: string, productSlug?: string) {
            if (!categorySlug || !productSlug) return undefined;
            const tree = cloneLocalTree();
            const top = tree.find((category) => category.slug === categorySlug);
            if (!top) return undefined;
            const directProduct = top.directProducts.find((candidate) => candidate.slug === productSlug);
            if (directProduct) return { product: directProduct, subCategory: null, topCategory: top };
            for (const subCategory of top.subs) {
              const product = subCategory.products.find((candidate) => candidate.slug === productSlug);
              if (product) return { product, subCategory, topCategory: top };
            }
            return undefined;
          }

          export function usePublicProduct(categorySlug?: string, productSlug?: string) {
            return useQuery({
              queryKey: K.product(categorySlug ?? "", productSlug ?? ""),
              enabled: Boolean(categorySlug && productSlug),
              initialData: () => localProductFallback(categorySlug, productSlug),
              initialDataUpdatedAt: 0,
              staleTime: 60_000,
          '''
          if product_marker not in source:
              raise SystemExit('usePublicProduct target not found')
          source = source.replace(product_marker, product_replacement, 1)
          path.write_text(source)
          PY
      - name: Verify complete application
        run: |
          npm ci
          npx tsc --noEmit
          npm test -- --passWithNoTests
          npm run build
      - name: Commit verified catalog repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-public-catalog-initial-data.yml
          git add src/hooks/usePublicCatalog.ts
          git commit -m 'fix(catalog): render committed products before database overlay'
          git push origin HEAD:${{ github.head_ref }}
