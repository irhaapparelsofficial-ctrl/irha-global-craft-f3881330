name: Live crawler parity check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
    steps:
      - name: Check safe Cloudflare access and crawler response
        shell: bash
        run: |
          set -u
          token="${CLOUDFLARE_API_TOKEN:-${CF_API_TOKEN:-}}"
          zone_id="${CLOUDFLARE_ZONE_ID:-${CF_ZONE_ID:-}}"
          echo "Cloudflare API token: $([ -n "$token" ] && echo configured || echo missing)"
          echo "Cloudflare zone ID secret: $([ -n "$zone_id" ] && echo configured || echo missing)"
          if [ -n "$token" ]; then
            response=$(curl -sS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/zones?name=irhaapparels.com')
            success=$(printf '%s' "$response" | jq -r '.success // false')
            discovered=$(printf '%s' "$response" | jq -r '.result[0].id // empty')
            echo "Cloudflare zone lookup: $success"
            if [ -n "$discovered" ]; then
              zone_id="$discovered"
              echo "Cloudflare zone discovered successfully"
            else
              printf '%s' "$response" | jq -r '.errors[]?.message // empty' | head -5
            fi
          fi
          echo '--- DNS ---'
          echo 'NS:'; dig +short NS irhaapparels.com || true
          echo 'A apex:'; dig +short A irhaapparels.com || true
          echo 'CNAME www:'; dig +short CNAME www.irhaapparels.com || true
          echo '--- Live browser release ---'
          browser_code=$(curl -sSL -A 'Mozilla/5.0' -D browser.headers -o browser.html -w '%{http_code}' 'https://irhaapparels.com/' || true)
          echo "browser HTTP $browser_code"
          grep -o '<title>[^<]*</title>' browser.html | head -1 || true
          grep -o 'name="x-irha-release" content="[^"]*"' browser.html | head -1 || true
          grep -o 'name="x-irha-project-id" content="[^"]*"' browser.html | head -1 || true
          grep -o 'name="x-irha-supabase-project-id" content="[^"]*"' browser.html | head -1 || true
          grep -iE '^(content-security-policy|permissions-policy|x-frame-options|x-content-type-options|referrer-policy):' browser.headers || true
          echo '--- Product raw HTML ---'
          product_code=$(curl -sSL -A 'Mozilla/5.0' -o product.html -w '%{http_code}' 'https://irhaapparels.com/products/leisure-nightwear/plush-bathrobe-sleep-robe' || true)
          echo "product HTTP $product_code"
          grep -o '<title>[^<]*</title>' product.html | head -1 || true
          grep -o 'irha-static-crawler-shell' product.html | head -1 || true
          grep -o 'Loading product[^<]*' product.html | head -1 || true
          echo '--- User-agent responses (spoof tests only) ---'
          for agent in 'OAI-SearchBot/1.0' 'ChatGPT-User/1.0' 'GPTBot/1.0' 'Googlebot/2.1 (+http://www.google.com/bot.html)'; do
            code=$(curl -sSL -A "$agent" -o body.html -w '%{http_code}' 'https://irhaapparels.com/' || true)
            title=$(grep -o '<title>[^<]*</title>' body.html | head -1 || true)
            echo "$agent => HTTP $code $title"
          done
