name: Live crawler parity check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live fallback bodies and sitemap evidence
        shell: bash
        run: |
          set -u
          base='https://irhaapparels.com'
          echo 'LEGACY_BODY_FALLBACKS'
          for path in \
            '/buyer-trust-center' \
            '/buyer-trust-centre' \
            '/buyer-resources' \
            '/buyer-faq' \
            '/shipping-returns' \
            '/products/d22ac15e-d657-4a4c-804c-fb8697ceb050/plush-bathrobe-sleep-robe'; do
            code=$(curl -sS -A 'Mozilla/5.0' -D headers.txt -o body.html -w '%{http_code}' "$base$path" || true)
            title=$(grep -o '<title>[^<]*</title>' body.html | head -1 || true)
            robots=$(grep -o '<meta name="robots" content="[^"]*"' body.html | head -1 || true)
            canonical=$(grep -o '<link rel="canonical" href="[^"]*"' body.html | head -1 || true)
            refresh=$(grep -o '<meta http-equiv="refresh" content="[^"]*"' body.html | head -1 || true)
            marker=$(grep -o 'data-irha-static-redirect="[^"]*"' body.html | head -1 || true)
            echo "$path | HTTP=$code | $title | $robots | $canonical | $refresh | $marker"
          done
          echo 'SITEMAP_EVIDENCE'
          curl -sSL "$base/sitemap.xml?audit=$(date +%s)" -o sitemap.xml
          echo "urls=$(grep -c '<url>' sitemap.xml || true)"
          echo "lastmod_count=$(grep -c '<lastmod>' sitemap.xml || true)"
          echo 'unique_lastmod_values:'
          grep -o '<lastmod>[^<]*' sitemap.xml | sort -u | head -10 || true
          echo "uuid_urls=$(grep -c 'd22ac15e-d657-4a4c-804c-fb8697ceb050' sitemap.xml || true)"
          echo 'CSP_META'
          curl -sSL "$base/?audit=$(date +%s)" -o home.html
          grep -o '<meta http-equiv="Content-Security-Policy" content="[^"]*"' home.html | head -1 || true
          echo 'CANONICAL_ROUTE'
          curl -sSL "$base/products/leisure-nightwear/plush-bathrobe-sleep-robe?audit=$(date +%s)" -o product.html
          grep -o '<title>[^<]*</title>' product.html | head -1 || true
          grep -o '<link rel="canonical" href="[^"]*"' product.html | head -1 || true
          grep -o 'data-irha-route-shell="[^"]*"' product.html | head -1 || true
