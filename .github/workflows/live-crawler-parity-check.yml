name: Live crawler parity check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose DNS and production crawler responses
        shell: bash
        run: |
          set -u
          echo '--- DNS ---'
          echo 'NS:'; dig +short NS irhaapparels.com || true
          echo 'A apex:'; dig +short A irhaapparels.com || true
          echo 'AAAA apex:'; dig +short AAAA irhaapparels.com || true
          echo 'CNAME www:'; dig +short CNAME www.irhaapparels.com || true
          echo 'A www:'; dig +short A www.irhaapparels.com || true
          echo 'TXT apex:'; dig +short TXT irhaapparels.com || true
          echo '--- HTTP ---'
          fetch() {
            label="$1"; agent="$2"; url="$3"; output="$4"
            code=$(curl -sSL -A "$agent" -o "$output" -w '%{http_code}' "$url" || true)
            echo "$label HTTP $code bytes $(wc -c < "$output" 2>/dev/null || echo 0)"
          }
          fetch browser 'Mozilla/5.0' 'https://irhaapparels.com/' browser.html
          fetch oai 'OAI-SearchBot/1.0' 'https://irhaapparels.com/' ai.html
          fetch google 'Googlebot/2.1 (+http://www.google.com/bot.html)' 'https://irhaapparels.com/' google.html
          fetch lovable 'Mozilla/5.0' 'https://irha-global-craft-f3881330.lovable.app/' lovable.html
          echo '--- Titles ---'
          grep -o '<title>[^<]*</title>' browser.html | head -1 || true
          grep -o '<title>[^<]*</title>' google.html | head -1 || true
          grep -o '<title>[^<]*</title>' lovable.html | head -1 || true
          echo '--- OAI response ---'
          cat ai.html || true
