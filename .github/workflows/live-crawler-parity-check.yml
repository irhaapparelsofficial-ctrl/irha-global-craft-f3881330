name: Live crawler parity check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare route HTML across hosts
        shell: bash
        run: |
          set -u
          path='/products/leisure-nightwear/plush-bathrobe-sleep-robe'
          for base in 'https://irhaapparels.com' 'https://irha-global-craft.lovable.app' 'https://id-preview--da72a40a-7df3-44c3-a72d-f180d9ffcd25.lovable.app'; do
            code=$(curl -sSL -A 'Mozilla/5.0' -D headers.txt -o body.html -w '%{http_code}' "$base$path" || true)
            title=$(grep -o '<title>[^<]*</title>' body.html | head -1 || true)
            canonical=$(grep -o '<link rel="canonical" href="[^"]*"' body.html | head -1 || true)
            marker=$(grep -o 'data-irha-route-shell="[^"]*"' body.html | head -1 || true)
            loading=$(grep -o 'Loading product[^<]*' body.html | head -1 || true)
            release=$(grep -o 'name="x-irha-release" content="[^"]*"' body.html | head -1 || true)
            echo "HOST=$base"
            echo "HTTP=$code"
            echo "TITLE=$title"
            echo "CANONICAL=$canonical"
            echo "MARKER=$marker"
            echo "LOADING=$loading"
            echo "RELEASE=$release"
            echo 'HEADERS:'
            grep -iE '^(content-security-policy|permissions-policy|x-frame-options|x-content-type-options|referrer-policy):' headers.txt || true
            echo '---'
          done
