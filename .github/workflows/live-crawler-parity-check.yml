name: Live crawler parity check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose production crawler responses
        shell: bash
        run: |
          set -u
          fetch() {
            label="$1"; agent="$2"; url="$3"; output="$4"
            code=$(curl -sSL -A "$agent" -o "$output" -w '%{http_code}' "$url" || true)
            echo "$label HTTP $code bytes $(wc -c < "$output" 2>/dev/null || echo 0)"
          }
          fetch browser 'Mozilla/5.0' 'https://irhaapparels.com/' browser.html
          fetch oai 'OAI-SearchBot/1.0' 'https://irhaapparels.com/' ai.html
          fetch google 'Googlebot/2.1 (+http://www.google.com/bot.html)' 'https://irhaapparels.com/' google.html
          fetch robots 'Mozilla/5.0' 'https://irhaapparels.com/robots.txt' robots.txt
          fetch llms 'Mozilla/5.0' 'https://irhaapparels.com/llms.txt' llms.txt
          fetch sitemap 'Mozilla/5.0' 'https://irhaapparels.com/sitemap.xml' sitemap.xml
          echo '--- Browser title ---'
          grep -o '<title>[^<]*</title>' browser.html | head -1 || true
          echo '--- OAI title/H1/canonical ---'
          grep -o '<title>[^<]*</title>' ai.html | head -1 || true
          grep -o '<h1[^>]*>[^<]*</h1>' ai.html | head -1 || true
          grep -o '<link rel="canonical"[^>]*>' ai.html | head -1 || true
          echo '--- Google title ---'
          grep -o '<title>[^<]*</title>' google.html | head -1 || true
          echo '--- Crawler markers ---'
          grep -E 'OAI-SearchBot|Sitemap:' robots.txt || true
          grep -E 'Two production hubs|Bavarian & Leather' llms.txt || true
          echo '--- Response previews ---'
          head -c 300 browser.html || true; echo
          head -c 300 ai.html || true; echo
