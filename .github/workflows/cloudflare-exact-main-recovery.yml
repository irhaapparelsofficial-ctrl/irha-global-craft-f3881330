name: Cloudflare Exact Main Recovery

run-name: Exact-main Cloudflare recovery · ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: cloudflare-exact-main-recovery-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.sha }}
  PAGES_BRANCH: main
  PAGES_URL: https://irha-apparels.pages.dev
  CANONICAL_ORIGIN: https://irhaapparels.com
  WWW_ORIGIN: https://www.irhaapparels.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}

    steps:
      - name: Publish pending recovery status
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state=pending \
            -f context="Irha Cloudflare Recovery" \
            -f description="Waiting for exact-main verified artifact" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null

      - name: Resolve exact-main eligibility and deployment readiness
        id: eligibility
        shell: bash
        run: |
          set -euo pipefail
          latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          eligible=true
          if [ "$latest_main" != "$SOURCE_SHA" ]; then
            eligible=false
            echo "Superseded recovery skipped before validation: source=$SOURCE_SHA current_main=$latest_main"
          else
            token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '[:space:]')"
            project_name="$(printf '%s' "${CLOUDFLARE_PROJECT_NAME:-}" | tr -d '[:space:]')"
            test -n "$token" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
            test -n "$project_name" || { echo "CLOUDFLARE_PROJECT_NAME is missing"; exit 1; }
            [[ "$project_name" =~ ^[a-z0-9][a-z0-9-]*[a-z0-9]$ ]] || {
              echo "CLOUDFLARE_PROJECT_NAME is invalid"
              exit 1
            }
            echo "Exact current main and Cloudflare secret readiness verified."
          fi
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

      - name: Wait for successful exact-main Quality Gate
        id: quality
        if: steps.eligibility.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          quality_run_id=""
          superseded=false
          for attempt in $(seq 1 90); do
            latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
            if [ "$latest_main" != "$SOURCE_SHA" ]; then
              superseded=true
              echo "Main advanced while waiting for Quality Gate: source=$SOURCE_SHA current_main=$latest_main"
              break
            fi

            runs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs?branch=main&per_page=50")"
            quality_run_id="$(printf '%s' "$runs_json" | jq -r --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")][0].id // empty')"
            if [ -n "$quality_run_id" ]; then
              break
            fi
            echo "Exact-main Quality Gate not green yet (attempt $attempt/90)."
            sleep 10
          done

          echo "superseded=$superseded" >> "$GITHUB_OUTPUT"
          if [ "$superseded" = "true" ]; then
            exit 0
          fi
          test -n "$quality_run_id" || {
            echo "No successful Quality Gate found for $SOURCE_SHA"
            exit 1
          }
          echo "run_id=$quality_run_id" >> "$GITHUB_OUTPUT"
          echo "Using exact-main Quality Gate run: $quality_run_id"

      - name: Download immutable verified release
        if: steps.eligibility.outputs.eligible == 'true' && steps.quality.outputs.superseded != 'true'
        uses: actions/download-artifact@v4
        with:
          name: production-dist-${{ env.SOURCE_SHA }}
          path: dist
          run-id: ${{ steps.quality.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify immutable artifact and create deployment marker
        if: steps.eligibility.outputs.eligible == 'true' && steps.quality.outputs.superseded != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/build.json
          test -s dist/release.txt
          test -s dist/_redirects
          test -s dist/_headers

          jq -e --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" \
            '.source_commit == $sha and .source_identity_state == "verified" and .repository == $repo and .supabase_project_id == "pvzjiozismyxqrzmtfbi" and .expected_origin == "https://irhaapparels.com"' \
            dist/build.json >/dev/null

          fingerprint="$(jq -r '.build_fingerprint // empty' dist/build.json)"
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]] || {
            echo "Invalid release fingerprint"
            exit 1
          }
          echo "RELEASE_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"

          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$PAGES_BRANCH" \
            --arg build_fingerprint "$fingerprint" \
            --arg purpose "exact-main-recovery" \
            --arg quality_run_id "${{ steps.quality.outputs.run_id }}" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{source_sha:$source_sha,repository:$repository,branch:$branch,build_fingerprint:$build_fingerprint,purpose:$purpose,quality_run_id:$quality_run_id,generated_at:$generated_at}' \
            > dist/cloudflare-deployment.json

      - name: Normalize Cloudflare credentials
        if: steps.eligibility.outputs.eligible == 'true' && steps.quality.outputs.superseded != 'true'
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '[:space:]')"
          raw_account_id="$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID:-}" | tr -d '[:space:]')"
          project_name="$(printf '%s' "${CLOUDFLARE_PROJECT_NAME:-}" | tr -d '[:space:]')"

          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_PROJECT_NAME=$project_name" >> "$GITHUB_ENV"

          account_id="$raw_account_id"
          if ! [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            account_id="$(printf '%s' "$raw_account_id" | grep -Eo '[0-9a-fA-F]{32}' | head -n 1 || true)"
          fi
          if [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::add-mask::$account_id"
            echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          else
            echo "CLOUDFLARE_ACCOUNT_ID=" >> "$GITHUB_ENV"
          fi

      - name: Reconfirm exact main before production mutation
        id: freshness
        if: steps.eligibility.outputs.eligible == 'true' && steps.quality.outputs.superseded != 'true'
        shell: bash
        run: |
          set -euo pipefail
          latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          fresh=false
          if [ "$latest_main" = "$SOURCE_SHA" ]; then
            fresh=true
            echo "Exact current main reconfirmed immediately before deployment."
          else
            echo "Superseded recovery skipped before deployment: source=$SOURCE_SHA current_main=$latest_main"
          fi
          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"

      - name: Deploy exact verified artifact to Cloudflare Pages
        if: steps.eligibility.outputs.eligible == 'true' && steps.quality.outputs.superseded != 'true' && steps.freshness.outputs.fresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist \
            --project-name="$CLOUDFLARE_PROJECT_NAME" \
            --branch="$PAGES_BRANCH" \
            --commit-hash="$SOURCE_SHA" \
            --commit-dirty=false

      - name: Verify Pages, apex and canonical www behavior
        if: steps.eligibility.outputs.eligible == 'true' && steps.quality.outputs.superseded != 'true' && steps.freshness.outputs.fresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pages_ready=false
          apex_ready=false

          for attempt in $(seq 1 36); do
            latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
            if [ "$latest_main" != "$SOURCE_SHA" ]; then
              echo "Verification superseded by newer main: source=$SOURCE_SHA current_main=$latest_main"
              exit 0
            fi

            for entry in "$PAGES_URL pages" "$CANONICAL_ORIGIN apex"; do
              origin="${entry% *}"
              label="${entry##* }"
              build_file="/tmp/${label}-build.json"
              status="$(curl -sSL --connect-timeout 10 --max-time 40 \
                -H 'Cache-Control: no-cache' \
                -o "$build_file" -w '%{http_code}' \
                "$origin/build.json?release_check=${SOURCE_SHA::12}-$attempt-$RANDOM" || true)"
              if [ "$status" = "200" ] \
                && jq -e --arg sha "$SOURCE_SHA" --arg fingerprint "$RELEASE_FINGERPRINT" \
                  '.source_commit == $sha and .source_identity_state == "verified" and .build_fingerprint == $fingerprint' \
                  "$build_file" >/dev/null 2>&1; then
                if [ "$label" = "pages" ]; then pages_ready=true; else apex_ready=true; fi
              fi
            done

            if [ "$pages_ready" = "true" ] && [ "$apex_ready" = "true" ]; then
              break
            fi
            echo "Release not converged yet: pages=$pages_ready apex=$apex_ready attempt=$attempt/36"
            sleep 10
          done

          test "$pages_ready" = "true" || { echo "Pages did not serve exact release"; exit 1; }
          test "$apex_ready" = "true" || { echo "Apex did not serve exact release"; exit 1; }

          headers=/tmp/www-headers.txt
          status="$(curl -sS --connect-timeout 10 --max-time 40 --max-redirs 0 \
            -D "$headers" -o /tmp/www-body.txt -w '%{http_code}' \
            "$WWW_ORIGIN/products?release_check=${SOURCE_SHA::12}" || true)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); value=$0} END{print value}' "$headers")"
          case "$status" in 301|302|307|308) ;; *) cat "$headers"; exit 1 ;; esac
          case "$location" in https://irhaapparels.com/*) ;; *) cat "$headers"; exit 1 ;; esac

          echo "Pages and apex exact-source parity verified."
          echo "www canonical redirect verified: $status $location"

      - name: Publish final recovery status
        if: always()
        env:
          RECOVERY_JOB_STATUS: ${{ job.status }}
          ELIGIBLE: ${{ steps.eligibility.outputs.eligible }}
          SUPERSEDED_WHILE_WAITING: ${{ steps.quality.outputs.superseded }}
          FRESH_BEFORE_DEPLOY: ${{ steps.freshness.outputs.fresh }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description="Cloudflare exact-main recovery failed"

          if [ "$ELIGIBLE" = "false" ] || [ "$SUPERSEDED_WHILE_WAITING" = "true" ] || [ "$FRESH_BEFORE_DEPLOY" = "false" ]; then
            state=success
            description="Superseded Cloudflare recovery skipped safely"
          elif [ "$RECOVERY_JOB_STATUS" = "success" ]; then
            state=success
            description="Cloudflare exact-main release verified"
          elif [ "$RECOVERY_JOB_STATUS" = "cancelled" ]; then
            state=error
            description="Cloudflare exact-main recovery cancelled"
          fi

          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state="$state" \
            -f context="Irha Cloudflare Recovery" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null
