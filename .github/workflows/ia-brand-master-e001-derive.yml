name: IA Brand Master E001 Derive

on:
  push:
    branches:
      - fix/ia-brand-master-e001
    paths:
      - .github/workflows/ia-brand-master-e001-derive.yml

permissions:
  contents: write

concurrency:
  group: ia-brand-master-e001-derive
  cancel-in-progress: false

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout focused branch
        uses: actions/checkout@v4
        with:
          ref: fix/ia-brand-master-e001
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Generate and verify official derivatives
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-official-brand-assets.mjs
          printf '%s  %s\n' '32eee79bc7038c53cff36bab46193c77e78702d7eef7883e8f94b145999a1b87' 'public/brand/irha-apparels-official-master.png' | sha256sum -c -
          test "$(wc -c < public/brand/irha-apparels-official-master.png | tr -d ' ')" = '1023183'
          test "$(file --brief --mime-type public/brand/irha-apparels-official-runtime-512.png)" = 'image/png'
          grep -Fq 'data-master-sha256="32eee79bc7038c53cff36bab46193c77e78702d7eef7883e8f94b145999a1b87"' public/favicon.svg

      - name: Commit deterministic derivatives and retire bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            public/brand/irha-apparels-official-runtime-512.png \
            public/brand/brand-master.json \
            public/favicon-16x16.png \
            public/favicon-32x32.png \
            public/favicon-48x48.png \
            public/apple-touch-icon.png \
            public/icon-192x192.png \
            public/icon-512x512.png \
            public/favicon.svg \
            public/irha-brand-mark.svg
          git rm .github/workflows/ia-brand-master-e001-derive.yml
          git commit -m 'chore(brand): generate official master derivatives'
          git push origin HEAD:fix/ia-brand-master-e001
