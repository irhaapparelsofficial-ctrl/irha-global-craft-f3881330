name: Supabase Deployment Parity

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "supabase/deployment-parity/**"
      - ".github/workflows/supabase-parity.yml"

permissions:
  contents: write

env:
  CI: "true"

jobs:
  gp4v-parity-reconcile:
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_PROJECT_ID: pvzjiozismyxqrzmtfbi
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Checkout GP-4V head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Reconcile only the two sealed import bundle identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/deployment-parity/functions-f6.json')
          s = p.read_text()
          replacements = {
            'ca6fed79716ddb35d274872432e7de176e86e3cf472d16e38bbeeb93a97ca313': 'b13e59c8d3e2dae2a1684739b0ccffef36d5673234c54fa4f7fa274be2e9ac5b',
            'c802775305251ceac91a2308a6d70eb7643ae5acb3f74396d5375c8ff199ee35': '9dc970c46e0625426d587fd42f4bac9836fd7904faa89f2c5d4a073bd26bbb08',
          }
          for old, new in replacements.items():
            if s.count(old) != 1:
              raise SystemExit(f'expected exactly one registry occurrence of {old}')
            s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Generate exact live deployment manifest
        env:
          SUPABASE_MANIFEST_MODE: write
        run: node scripts/ci/generate-supabase-manifest.mjs

      - name: Verify generated parity evidence
        run: node scripts/verify-supabase-parity.mjs

      - name: Restore canonical workflow and commit exact parity evidence
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/supabase-parity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/deployment-parity/functions-f6.json supabase/deployment-parity/manifest.json .github/workflows/supabase-parity.yml
          if git diff --cached --quiet; then
            echo "No parity reconciliation changes remain"
            exit 0
          fi
          git commit -m "GP-4V: reconcile sealed media import parity"
          git push origin "HEAD:${HEAD_BRANCH}"
