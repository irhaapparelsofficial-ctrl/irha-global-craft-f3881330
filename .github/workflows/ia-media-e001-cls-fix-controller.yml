name: IA Media E001 CLS Fix Controller

on:
  pull_request:
    branches:
      - codex/ia-media-e001-recovery-base-v4
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-cls:
    if: github.event.pull_request.head.ref == 'codex/ia-media-e001-cls-fix-controller'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_MAIN: 770569e087badea7d38e60b3582426264c514bdf
      CLEAN_SHA: ccbb0598720d6d7d6bb51f0bca483530ba9cefbf
      CLEAN_BRANCH: codex/ia-media-e001-clean-recovery
      TARGET_BRANCH: codex/ia-media-e001-cls-fix-content

    steps:
      - name: Checkout exact clean recovery source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CLEAN_SHA }}
          fetch-depth: 0

      - name: Verify immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$CLEAN_BRANCH" "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse HEAD)" = "$CLEAN_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse "origin/$CLEAN_BRANCH")" = "$CLEAN_SHA"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$CLEAN_SHA"
          test "$(git rev-parse "$CLEAN_SHA^")" = "$EXPECTED_MAIN"

      - name: Add stable product loading shell
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/pages/CanonicalProductDetail.tsx")
          text = path.read_text(encoding="utf-8")
          condition = "  if (isLoading || (isFetching && !data) || (taxonomyRelease.isLoading && !taxonomyRelease.data)) {\n"
          next_guard = "  if (error || !data)"
          start = text.find(condition)
          end = text.find(next_guard, start + len(condition)) if start >= 0 else -1
          if start < 0 or end < 0:
              raise SystemExit(f"loading-state structural anchors missing: start={start}, end={end}")
          old = text[start:end]
          if old.count("Loading product…") != 1 or "return <div" not in old:
              raise SystemExit("loading-state block shape changed")

          new = "\n".join([
              "  if (isLoading || (isFetching && !data) || (taxonomyRelease.isLoading && !taxonomyRelease.data)) {",
              "    return (",
              "      <section",
              "        className=\"pb-32 pt-36 sm:pt-40 md:pb-20\"",
              "        aria-busy=\"true\"",
              "        aria-label=\"Loading product\"",
              "      >",
              "        <div className=\"container-luxe\">",
              "          <div",
              "            className=\"mb-6 h-4 w-64 max-w-[75vw] rounded bg-muted/30 sm:mb-8\"",
              "            aria-hidden=\"true\"",
              "          />",
              "          <div className=\"grid gap-8 xl:grid-cols-12 xl:gap-14\">",
              "            <div className=\"min-w-0 xl:col-span-7\">",
              "              <div",
              "                className=\"aspect-square rounded-2xl border border-border/70 bg-[#0d0d0d] sm:aspect-[5/4] lg:aspect-[4/5]\"",
              "                aria-hidden=\"true\"",
              "              />",
              "              <div className=\"mt-3 flex gap-3 overflow-hidden pb-2 sm:mt-4\" aria-hidden=\"true\">",
              "                {Array.from({ length: 6 }, (_, index) => (",
              "                  <span",
              "                    key={index}",
              "                    className=\"h-20 w-20 shrink-0 rounded-xl border border-border/60 bg-card sm:h-24 sm:w-24\"",
              "                  />",
              "                ))}",
              "              </div>",
              "              <div className=\"mt-3 h-10 max-w-xl rounded bg-muted/20\" aria-hidden=\"true\" />",
              "            </div>",
              "            <div className=\"xl:col-span-5\">",
              "              <div className=\"h-3 w-28 rounded bg-muted/30\" aria-hidden=\"true\" />",
              "              <div className=\"mt-4 h-12 w-4/5 rounded bg-muted/40\" aria-hidden=\"true\" />",
              "              <div className=\"mt-4 h-20 rounded bg-muted/20\" aria-hidden=\"true\" />",
              "              <div className=\"mt-6 grid grid-cols-2 gap-3\" aria-hidden=\"true\">",
              "                <span className=\"h-14 rounded bg-muted/20\" />",
              "                <span className=\"h-14 rounded bg-muted/20\" />",
              "              </div>",
              "            </div>",
              "          </div>",
              "          <span className=\"sr-only\">Loading product…</span>",
              "        </div>",
              "      </section>",
              "    );",
              "  }",
              "",
          ])
          path.write_text(text[:start] + new + text[end:], encoding="utf-8")
          PY

          git diff --check
          test "$(git status --short | wc -l | tr -d ' ')" = "1"
          test -n "$(git status --short -- src/pages/CanonicalProductDetail.tsx)"

      - name: Install exact dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Verify focused source quality
        shell: bash
        run: |
          set -euo pipefail
          npx eslint src/pages/CanonicalProductDetail.tsx
          npx tsc --noEmit

      - name: Push focused fix branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CanonicalProductDetail.tsx
          git commit -m "fix(ux): stabilize product loading layout"
          test "$(git diff --name-only "$CLEAN_SHA" HEAD)" = "src/pages/CanonicalProductDetail.tsx"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
