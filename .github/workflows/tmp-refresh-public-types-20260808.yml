name: Temporary Public Types Refresh 20260808

on:
  push:
    branches: [fix/public-types-parity-20260808]

permissions:
  contents: write

concurrency:
  group: temporary-public-types-refresh-20260808
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: pvzjiozismyxqrzmtfbi
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout refresh branch
        uses: actions/checkout@v4
        with:
          ref: fix/public-types-parity-20260808
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.39.2

      - name: Generate and verify official public types
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          supabase gen types typescript \
            --project-id "$SUPABASE_PROJECT_ID" \
            --schema public > /tmp/supabase-types.ts
          test -s /tmp/supabase-types.ts
          ! grep -E '(sb_secret_|service_role[^A-Za-z0-9]|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,})' /tmp/supabase-types.ts
          cp /tmp/supabase-types.ts src/integrations/supabase/types.ts
          node scripts/ci/verify-supabase-type-supplement.mjs /tmp/supabase-types.ts

      - name: Commit exact generated projection to refresh branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/integrations/supabase/types.ts; then
            echo "Official public types are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/integrations/supabase/types.ts
          git commit -m "fix(types): refresh official Supabase public projection"
          git push origin HEAD:fix/public-types-parity-20260808
