name: IA-CTRL-E001R2 Patch Baseline

on:
  push:
    branches:
      - codex/ia-ctrl-e001r2-parity-seal

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ia-ctrl-e001r2-parity-seal
      - name: Update authenticated migration baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/ci/generate-migration-provenance.mjs')
          text = path.read_text()
          old = '''  if (result.payload.totals.live !== 374) {
              throw new ProvenanceError("LIVE_COUNT_DRIFT", `Expected 374 live migrations, found ${result.payload.totals.live}`);
            }'''
          new = '''  if (result.payload.totals.live !== 375) {
              throw new ProvenanceError("LIVE_COUNT_DRIFT", `Expected 375 live migrations, found ${result.payload.totals.live}`);
            }'''
          if old not in text:
              raise SystemExit('Expected 374-migration assertion not found exactly')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/ia-ctrl-e001r2-patch-baseline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ci/generate-migration-provenance.mjs .github/workflows/ia-ctrl-e001r2-patch-baseline.yml
          git commit -m "test(parity): require 375 live migrations"
          git push origin HEAD:codex/ia-ctrl-e001r2-parity-seal
