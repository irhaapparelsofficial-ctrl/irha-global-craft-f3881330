name: Apply Trachten Shirts Batch 01

on:
  push:
    branches:
      - trachten-shirts-batch-01
    paths:
      - "scripts/patch_add_batch06_catalog.py"
      - ".github/workflows/apply-trachten-shirts-batch-01.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: trachten-shirts-batch-01
          fetch-depth: 0

      - name: Apply Batch 06 catalog registration
        run: python scripts/patch_add_batch06_catalog.py

      - name: Validate Batch 06 media manifest
        run: python -m json.tool scripts/product-media-batch-06.json >/dev/null

      - name: Commit registration and remove one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-trachten-shirts-batch-01.yml
          git rm scripts/patch_add_batch06_catalog.py
          git add src/hooks/usePublicCatalog.ts
          git commit -m "Register Trachten Shirts batch 01"
          git push origin HEAD:trachten-shirts-batch-01
