name: GP-4V-R2 Video Acceptance

run-name: GP-4V-R2 video acceptance · ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}

on:
  pull_request:
    paths:
      - "src/components/SEO.tsx"
      - "src/components/factory/FactoryCapabilityMedia.tsx"
      - "src/components/sections/HomeManufacturingEditorial.tsx"
      - "src/pages/FactoryCapabilityVideo.tsx"
      - "src/pages/Manufacturing.tsx"
      - "src/pages/BuyerTrust.tsx"
      - "src/pages/FactoryVideoCall.tsx"
      - "src/App.tsx"
      - "src/lib/routeContent.mjs"
      - "src/test/factoryVideoIntegration.test.ts"
      - "src/test/gp4vR2SeoOwnership.test.ts"
      - "scripts/generate-static-route-shells.ts"
      - "scripts/apply-authoritative-seo-manifest.ts"
      - "scripts/finalize-phase1-public-contract.mjs"
      - "scripts/finalize-spa-seo-ownership.mjs"
      - "scripts/version-official-brand-assets.mjs"
      - "scripts/patch-cloudflare-route-shell-assets.mjs"
      - "scripts/generate-sitemap.ts"
      - "scripts/ci/gp4v-r1-*.mjs"
      - "scripts/ci/gp4v-r2-*.mjs"
      - "scripts/ci/apply-safe-auto-fixes.mjs"
      - ".github/workflows/gp4v-r1-video-acceptance.yml"
      - ".github/workflows/cloudflare-pages-preview.yml"
      - "package.json"
  workflow_run:
    workflows: ["Cloudflare Production Status"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: gp4v-r2-video-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  media-delivery-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify public MP4 type, length and byte ranges
        run: node scripts/ci/gp4v-r1-media-http-check.mjs

  candidate-browser:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
      PREVIEW_BRANCH: gp4v-r2-${{ github.event.pull_request.number }}
      EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build exact candidate with verified source identity
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run build

      - name: Normalize isolated HTTPS candidate environment
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          account_id="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          project_name="$(printf '%s' "$CLOUDFLARE_PROJECT_NAME" | tr -d '[:space:]')"
          test -n "$token" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$account_id" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$project_name" || { echo "CLOUDFLARE_PROJECT_NAME is missing"; exit 1; }
          [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]] || { echo "CLOUDFLARE_ACCOUNT_ID is invalid"; exit 1; }
          [[ "$project_name" =~ ^[a-z0-9][a-z0-9-]*[a-z0-9]$ ]] || { echo "CLOUDFLARE_PROJECT_NAME is invalid"; exit 1; }
          [[ "$EXACT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Exact PR head SHA is invalid"; exit 1; }
          echo "::add-mask::$token"
          echo "::add-mask::$account_id"
          {
            echo "CLOUDFLARE_API_TOKEN=$token"
            echo "CLOUDFLARE_ACCOUNT_ID=$account_id"
            echo "CLOUDFLARE_PROJECT_NAME=$project_name"
            echo "PREVIEW_URL=https://${PREVIEW_BRANCH}.${project_name}.pages.dev"
          } >> "$GITHUB_ENV"

      - name: Deploy exact PR head to isolated HTTPS preview
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg source "$EXACT_HEAD_SHA" '.source_commit == $source and .source_identity_state == "verified"' dist/build.json >/dev/null
          npx --yes wrangler@4 pages deploy dist \
            --project-name="$CLOUDFLARE_PROJECT_NAME" \
            --branch="$PREVIEW_BRANCH" \
            --commit-hash="$EXACT_HEAD_SHA" \
            --commit-dirty=false

      - name: Resolve immutable exact-head HTTPS deployment
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$EXACT_HEAD_SHA" node scripts/resolve-cloudflare-preview-deployment.mjs

      - name: Verify immutable exact-head HTTPS candidate
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 24); do
            if curl -fsS --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' \
              "$PREVIEW_URL/build.json?gp4v_r2=${EXACT_HEAD_SHA::12}-$attempt" -o /tmp/gp4v-r2-build.json \
              && jq -e --arg source "$EXACT_HEAD_SHA" '.source_commit == $source and .source_identity_state == "verified"' /tmp/gp4v-r2-build.json >/dev/null; then
              ready=1
              echo "Immutable exact-head HTTPS candidate verified on attempt $attempt"
              break
            fi
            sleep 5
          done
          test "$ready" = "1" || { echo "Immutable exact-head HTTPS candidate did not converge"; exit 1; }

      - name: Install browser acceptance runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install --with-deps webkit
          google-chrome --version

      - name: Run strict exact-head HTTPS candidate browser journey
        shell: bash
        run: |
          set -euo pipefail
          BROWSER_ORIGIN="$PREVIEW_URL" \
          CANONICAL_ORIGIN="https://irhaapparels.com" \
          EXPECTED_SHA="$EXACT_HEAD_SHA" \
          node scripts/ci/gp4v-r2-browser-acceptance.mjs

      - name: Print playback diagnostic on failure
        if: failure()
        shell: bash
        run: |
          if [ -s /tmp/gp4v-r2-playback-diagnostic.json ]; then
            cat /tmp/gp4v-r2-playback-diagnostic.json
          fi

  live-production-browser:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Reject duplicate completed acceptance for the same exact production SHA
        id: relevance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          prior_count="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/gp4v-r1-video-acceptance.yml/runs" \
            -f event=workflow_run \
            -f head_sha="$SOURCE_SHA" \
            -f per_page=100 \
            --jq "[.workflow_runs[] | select(.id != ($CURRENT_RUN_ID | tonumber)) | select(.status == \"completed\")] | length")"
          if [ "$prior_count" -gt 0 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Exact SHA $SOURCE_SHA already has a completed GP-4V-R2 live acceptance run; expensive duplicate execution skipped."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Exact SHA $SOURCE_SHA has no prior completed GP-4V-R2 live acceptance; executing authoritative journey."
          fi

      - name: Checkout exact production workflow head
        if: steps.relevance.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup Node 24
        if: steps.relevance.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify public MP4 type, length and byte ranges
        if: steps.relevance.outputs.should_run == 'true'
        run: node scripts/ci/gp4v-r1-media-http-check.mjs

      - name: Install browser acceptance runtime
        if: steps.relevance.outputs.should_run == 'true'
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install --with-deps webkit
          google-chrome --version

      - name: Verify exact live canonical, playback, seeking, real enlargement, exit and WebKit layouts
        if: steps.relevance.outputs.should_run == 'true'
        env:
          BROWSER_ORIGIN: https://irha-apparels.pages.dev
          CANONICAL_ORIGIN: https://irhaapparels.com
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/ci/gp4v-r2-browser-acceptance.mjs
