name: Apply Long Leather Pants Batch 02

on:
  push:
    branches:
      - long-leather-pants-batch-02
    paths:
      - "scripts/patch_add_batch05_catalog.py"
      - ".github/workflows/apply-long-leather-pants-batch-02.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: long-leather-pants-batch-02
          fetch-depth: 0

      - name: Apply Batch 05 catalog registration
        run: python scripts/patch_add_batch05_catalog.py

      - name: Validate Batch 05 media manifest
        run: python -m json.tool scripts/product-media-batch-05.json >/dev/null

      - name: Commit registration and remove one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-long-leather-pants-batch-02.yml
          git rm scripts/patch_add_batch05_catalog.py
          git add src/hooks/usePublicCatalog.ts
          git commit -m "Register Long Leather Pants batch 02"
          git push origin HEAD:long-leather-pants-batch-02
