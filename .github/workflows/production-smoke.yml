name: Production Smoke

run-name: Explicit post-publish production smoke · ${{ github.ref_name }} · #${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production URL to verify
        required: true
        default: https://irhaapparels.com
        type: string
      propagation_minutes:
        description: Maximum minutes to wait for Lovable/CDN propagation
        required: true
        default: "20"
        type: string
      expected_release:
        description: Release ID expected after the explicit Lovable publish
        required: true
        default: frontend-live-2026-07-13-r11
        type: string
      expected_release_text:
        description: Plain-text release marker expected after publish
        required: true
        default: IRHA_FRONTEND_LIVE_2026_07_13_R11
        type: string
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: explicit-production-smoke
  cancel-in-progress: true

env:
  IRHA_EXPECTED_RELEASE: ${{ inputs.expected_release || 'frontend-live-2026-07-13-r11' }}
  IRHA_EXPECTED_RELEASE_TEXT: ${{ inputs.expected_release_text || 'IRHA_FRONTEND_LIVE_2026_07_13_R11' }}
  IRHA_EXPECTED_PROJECT_ID: da72a40a-7df3-44c3-a72d-f180d9ffcd25
  IRHA_EXPECTED_SUPABASE_PROJECT_ID: pvzjiozismyxqrzmtfbi
  IRHA_EXPECTED_REPOSITORY: irhaapparelsofficial-ctrl/irha-global-craft-f3881330
  IRHA_EXPECTED_ORIGIN: https://irhaapparels.com
  IRHA_PRIMARY_URL: https://irhaapparels.com
  IRHA_DOMAIN_ALIASES: https://www.irhaapparels.com

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[production-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout published source branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Wait for explicitly published release and source identity
        env:
          IRHA_BASE_URL: ${{ inputs.base_url || 'https://irhaapparels.com' }}
          IRHA_PROPAGATION_MINUTES: ${{ inputs.propagation_minutes || '20' }}
        run: node scripts/wait-for-production-release.mjs

      - name: Verify apex and www domain consistency
        run: node scripts/verify-production-domains.mjs

      - name: Verify production pages, crawler controls and owner backend
        env:
          IRHA_BASE_URL: ${{ inputs.base_url || 'https://irhaapparels.com' }}
        run: node scripts/production-smoke-v2.mjs

      - name: Record verification contract
        if: always()
        run: |
          echo "This workflow is explicit and strict." >> "$GITHUB_STEP_SUMMARY"
          echo "It runs after manual dispatch or an approved [production-smoke] main commit marker." >> "$GITHUB_STEP_SUMMARY"
          echo "Normal pull requests remain gated by deterministic typecheck, tests and build—not by the live domain." >> "$GITHUB_STEP_SUMMARY"
