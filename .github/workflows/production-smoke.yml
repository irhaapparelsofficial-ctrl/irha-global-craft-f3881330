name: Production Smoke

run-name: Post-publish production smoke · ${{ github.ref_name }} · #${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production URL to verify
        required: true
        default: https://www.irhaapparels.com
        type: string
      propagation_minutes:
        description: Minutes to wait for Lovable/CDN propagation
        required: true
        default: "20"
        type: string
  push:
    branches: [main]
    paths:
      - docs/POST_PUBLISH_VERIFY.md

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

env:
  IRHA_EXPECTED_RELEASE: frontend-live-2026-07-12-r10
  IRHA_EXPECTED_RELEASE_TEXT: IRHA_FRONTEND_LIVE_2026_07_12_R10
  IRHA_EXPECTED_PROJECT_ID: da72a40a-7df3-44c3-a72d-f180d9ffcd25
  IRHA_EXPECTED_REPOSITORY: irhaapparelsofficial-ctrl/irha-global-craft-f3881330
  IRHA_EXPECTED_ORIGIN: https://www.irhaapparels.com
  IRHA_PRIMARY_URL: https://www.irhaapparels.com
  IRHA_DOMAIN_ALIASES: https://irhaapparels.com

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Wait for published release and source identity
        env:
          IRHA_BASE_URL: ${{ inputs.base_url || 'https://www.irhaapparels.com' }}
          IRHA_PROPAGATION_MINUTES: ${{ inputs.propagation_minutes || '20' }}
        run: node scripts/wait-for-production-release.mjs

      - name: Verify apex and www domain consistency
        run: node scripts/verify-production-domains.mjs

      - name: Verify production pages, source identity, crawler controls and lead gateway
        env:
          IRHA_BASE_URL: ${{ inputs.base_url || 'https://www.irhaapparels.com' }}
        run: node scripts/production-smoke-v2.mjs
