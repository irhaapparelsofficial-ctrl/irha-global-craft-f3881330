name: Production Smoke

run-name: Explicit post-publish production smoke · ${{ github.ref_name }} · #${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production URL to verify
        required: true
        default: https://irhaapparels.com
        type: string
      propagation_minutes:
        description: Maximum minutes to wait for CDN propagation
        required: true
        default: "20"
        type: string
      expected_release:
        description: Expected release ID
        required: true
        default: frontend-live-2026-07-13-r11
        type: string
      expected_release_text:
        description: Expected plain-text release marker
        required: true
        default: IRHA_FRONTEND_LIVE_2026_07_13_R11
        type: string

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

env:
  IRHA_EXPECTED_RELEASE: ${{ inputs.expected_release }}
  IRHA_EXPECTED_RELEASE_TEXT: ${{ inputs.expected_release_text }}
  IRHA_EXPECTED_PROJECT_ID: da72a40a-7df3-44c3-a72d-f180d9ffcd25
  IRHA_EXPECTED_SUPABASE_PROJECT_ID: pvzjiozismyxqrzmtfbi
  IRHA_EXPECTED_REPOSITORY: irhaapparelsofficial-ctrl/irha-global-craft-f3881330
  IRHA_EXPECTED_ORIGIN: https://irhaapparels.com
  IRHA_PRIMARY_URL: https://irhaapparels.com
  IRHA_DOMAIN_ALIASES: https://www.irhaapparels.com

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout current main verification scripts
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Wait for exact release and source identity
        env:
          IRHA_BASE_URL: ${{ inputs.base_url }}
          IRHA_PROPAGATION_MINUTES: ${{ inputs.propagation_minutes }}
        run: node scripts/wait-for-production-release.mjs

      - name: Verify apex and www domain consistency
        run: node scripts/verify-production-domains.mjs

      - name: Verify production pages, crawler controls and owner backend
        env:
          IRHA_BASE_URL: ${{ inputs.base_url }}
        run: node scripts/production-smoke-v2.mjs

      - name: Record explicit audit contract
        if: always()
        shell: bash
        run: |
          {
            echo "## Production Smoke"
            echo "- Trigger: manual deep audit only"
            echo "- Normal pushes: handled by Quality Gate and Cloudflare production verification"
            echo "- Automatic duplicate live audits: disabled"
            echo "- Target: \`${{ inputs.base_url }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
