name: Import Bavarian Drive media

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/import-bavarian-drive-media.yml"
      - "tools/import_bavarian_drive_media.py"
      - "tools/run_bavarian_drive_import.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bavarian-drive-media-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  import-media:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image importer dependencies
        run: python -m pip install --upgrade gdown Pillow

      - name: Align importer with current gdown API
        run: sed -i '/remaining_ok=True,/d' tools/import_bavarian_drive_media.py

      - name: Validate importer syntax
        run: python -m py_compile tools/import_bavarian_drive_media.py tools/run_bavarian_drive_import.py

      - name: Scan, deduplicate and optimize every Drive image
        id: import
        shell: bash
        run: |
          set +e
          set -o pipefail
          mkdir -p docs/import-evidence
          python tools/run_bavarian_drive_import.py \
            --drive-url "https://drive.google.com/drive/folders/10pBXyaJyJgdt3nLe-opOcXW58ZE9ryug" \
            --output "public/media/bavarian-drive" \
            --sql-output "supabase/manual/20260713_bavarian_drive_media_import.sql" \
            2>&1 | tee docs/import-evidence/bavarian-drive-latest.log
          status=${PIPESTATUS[0]}
          echo "$status" > docs/import-evidence/bavarian-drive-status.txt
          exit 0

      - name: Verify generated import evidence
        run: |
          test "$(cat docs/import-evidence/bavarian-drive-status.txt)" = "0"
          test -s docs/import-evidence/bavarian-drive-download-failures.json
          test -s public/media/bavarian-drive/manifest.json
          test -s public/media/bavarian-drive/scan-report.json
          test -s public/media/bavarian-drive/index.html
          test -s supabase/manual/20260713_bavarian_drive_media_import.sql
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('public/media/bavarian-drive/scan-report.json').read_text())
          downloads = json.loads(Path('docs/import-evidence/bavarian-drive-download-failures.json').read_text())
          assert report['image_candidate_count'] > 0, report
          assert report['accepted_count'] > 0, report
          assert downloads['downloaded_count'] > 0, downloads
          print(json.dumps({'scan': report, 'downloads': downloads}, indent=2))
          PY

      - name: Preserve generated media artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bavarian-drive-media-import
          path: |
            docs/import-evidence/
            public/media/bavarian-drive/
            supabase/manual/20260713_bavarian_drive_media_import.sql
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14

      - name: Commit generated web media and evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git add tools/import_bavarian_drive_media.py tools/run_bavarian_drive_import.py docs/import-evidence public/media/bavarian-drive supabase/manual/20260713_bavarian_drive_media_import.sql
          if git diff --cached --quiet; then
            echo "Generated media is already current."
            exit 0
          fi
          git commit -m "feat: publish scanned Bavarian Drive media [skip ci]"
          git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
