name: Import Bavarian Drive media

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/import-bavarian-drive-media.yml"
      - "tools/import_bavarian_drive_media.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bavarian-drive-media-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  import-media:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image importer dependencies
        run: python -m pip install --upgrade gdown Pillow

      - name: Validate importer syntax
        run: python -m py_compile tools/import_bavarian_drive_media.py

      - name: Scan, deduplicate and optimize every Drive image
        run: |
          python tools/import_bavarian_drive_media.py \
            --drive-url "https://drive.google.com/drive/folders/10pBXyaJyJgdt3nLe-opOcXW58ZE9ryug" \
            --output "public/media/bavarian-drive" \
            --sql-output "supabase/manual/20260713_bavarian_drive_media_import.sql"

      - name: Verify generated import evidence
        run: |
          test -s public/media/bavarian-drive/manifest.json
          test -s public/media/bavarian-drive/scan-report.json
          test -s public/media/bavarian-drive/index.html
          test -s supabase/manual/20260713_bavarian_drive_media_import.sql
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('public/media/bavarian-drive/scan-report.json').read_text())
          assert report['image_candidate_count'] > 0, report
          assert report['accepted_count'] > 0, report
          print(json.dumps(report, indent=2))
          PY

      - name: Commit generated web media and mapping report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/bavarian-drive supabase/manual/20260713_bavarian_drive_media_import.sql
          if git diff --cached --quiet; then
            echo "Generated media is already current."
            exit 0
          fi
          git commit -m "feat: publish scanned Bavarian Drive media [skip ci]"
          git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
