name: Security & Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan every Monday at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # ─── Stage 1: Quality Gates ─────────────────────────────────────────
  lint-typecheck:
    name: ESLint + TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bunx eslint . --max-warnings=0

      - name: TypeScript typecheck
        run: bunx tsc --noEmit -p tsconfig.app.json

  supabase-validate:
    name: Supabase Config & Migrations Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate supabase/config.toml exists
        run: |
          if [ ! -f supabase/config.toml ]; then
            echo "::error::Missing supabase/config.toml"
            exit 1
          fi
          echo "✅ supabase/config.toml found"

      - name: Lint SQL migrations (syntax sanity)
        run: |
          shopt -s nullglob
          fail=0
          for f in supabase/migrations/*.sql; do
            if [ ! -s "$f" ]; then
              echo "::error file=$f::Empty migration file"
              fail=1
            fi
          done
          exit $fail

      - name: Check for public tables missing GRANT statements
        run: |
          shopt -s nullglob
          fail=0
          for f in supabase/migrations/*.sql; do
            if grep -qiE "create\s+table\s+(public\.|if\s+not\s+exists\s+public\.)" "$f"; then
              if ! grep -qiE "grant\s+" "$f"; then
                echo "::error file=$f::CREATE TABLE in public schema without GRANT statement"
                fail=1
              fi
            fi
          done
          exit $fail

      - name: Start Supabase locally (validates config + migrations)
        run: supabase db start
        continue-on-error: true

  # ─── Stage 2: Security Scans (gated by quality gates) ───────────────
  dependency-audit:
    name: Dependency Audit (npm audit)
    needs: [lint-typecheck, supabase-validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Node (for npm audit)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run npm audit (high & critical)
        run: |
          npm audit --audit-level=high --production || AUDIT_EXIT=$?
          echo "AUDIT_EXIT=${AUDIT_EXIT:-0}" >> $GITHUB_ENV
          npm audit --json > audit-report.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 30

      - name: Fail on high/critical vulnerabilities
        if: env.AUDIT_EXIT != '0'
        run: |
          echo "::error::High or critical vulnerabilities detected. See audit-report.json artifact."
          exit 1

  secret-scan:
    name: Secret Leak Scan (Gitleaks)
    needs: [lint-typecheck, supabase-validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL Static Analysis
    needs: [lint-typecheck, supabase-validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  dependency-review:
    name: Dependency Review (PR only)
    if: github.event_name == 'pull_request'
    needs: [lint-typecheck, supabase-validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  # ─── Stage 3: Summary ───────────────────────────────────────────────
  scan-summary:
    name: Scan Summary
    needs: [dependency-audit, secret-scan, codeql, dependency-review, lint-typecheck, supabase-validate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report status
        run: |
          echo "## 🛡️ Security & Quality Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quality Gates" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| ESLint + TypeScript | ${{ needs.lint-typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Supabase Config Validation | ${{ needs.supabase-validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Security Scans" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | ${{ needs.dependency-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan (Gitleaks) | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL Static Analysis | ${{ needs.codeql.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Review | ${{ needs.dependency-review.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Findings appear in the **Security** tab of the repository." >> $GITHUB_STEP_SUMMARY

      - name: Generate machine-readable scan-summary.json
        id: gen_json
        run: |
          cat > scan-summary.json <<EOF
          {
            "repository": "${{ github.repository }}",
            "sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "event": "${{ github.event_name }}",
            "run_id": "${{ github.run_id }}",
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "quality_gates": {
              "lint_typecheck": "${{ needs.lint-typecheck.result }}",
              "supabase_validate": "${{ needs.supabase-validate.result }}"
            },
            "security_scans": {
              "dependency_audit": "${{ needs.dependency-audit.result }}",
              "secret_scan": "${{ needs.secret-scan.result }}",
              "codeql": "${{ needs.codeql.result }}",
              "dependency_review": "${{ needs.dependency-review.result }}"
            }
          }
          EOF
          cat scan-summary.json

      - name: Upload scan-summary.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan-summary
          path: scan-summary.json
          retention-days: 30

      - name: Post / update PR comment with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('scan-summary.json', 'utf8'));
            const icon = (s) => s === 'success' ? '✅' : s === 'failure' ? '❌' : s === 'skipped' ? '⏭️' : '⚠️';
            const marker = '<!-- lovable-security-scan-summary -->';
            const body = [
              marker,
              '## 🛡️ Security & Quality Scan Results',
              '',
              `**Commit:** \`${data.sha.substring(0,7)}\` · [View run](${data.run_url})`,
              '',
              '### Quality Gates',
              '| Check | Status |',
              '|-------|--------|',
              `| ESLint + TypeScript | ${icon(data.quality_gates.lint_typecheck)} ${data.quality_gates.lint_typecheck} |`,
              `| Supabase Config Validation | ${icon(data.quality_gates.supabase_validate)} ${data.quality_gates.supabase_validate} |`,
              '',
              '### Security Scans',
              '| Check | Status |',
              '|-------|--------|',
              `| Dependency Audit | ${icon(data.security_scans.dependency_audit)} ${data.security_scans.dependency_audit} |`,
              `| Secret Scan (Gitleaks) | ${icon(data.security_scans.secret_scan)} ${data.security_scans.secret_scan} |`,
              `| CodeQL Static Analysis | ${icon(data.security_scans.codeql)} ${data.security_scans.codeql} |`,
              `| Dependency Review | ${icon(data.security_scans.dependency_review)} ${data.security_scans.dependency_review} |`,
              '',
              '_Machine-readable `scan-summary.json` is attached as a workflow artifact._',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if any check failed
        run: |
          if [[ "${{ needs.dependency-audit.result }}" == "failure" || "${{ needs.secret-scan.result }}" == "failure" || "${{ needs.codeql.result }}" == "failure" || "${{ needs.dependency-review.result }}" == "failure" || "${{ needs.lint-typecheck.result }}" == "failure" || "${{ needs.supabase-validate.result }}" == "failure" ]]; then
            echo "::error::One or more checks failed."
            exit 1
          fi

