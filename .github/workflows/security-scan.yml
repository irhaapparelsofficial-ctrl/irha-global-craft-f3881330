name: Security & Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan every Monday at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  dependency-audit:
    name: Dependency Audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Node (for npm audit)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run npm audit (high & critical)
        run: |
          npm audit --audit-level=high --production || AUDIT_EXIT=$?
          echo "AUDIT_EXIT=${AUDIT_EXIT:-0}" >> $GITHUB_ENV
          npm audit --json > audit-report.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 30

      - name: Fail on high/critical vulnerabilities
        if: env.AUDIT_EXIT != '0'
        run: |
          echo "::error::High or critical vulnerabilities detected. See audit-report.json artifact."
          exit 1

  secret-scan:
    name: Secret Leak Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  dependency-review:
    name: Dependency Review (PR only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  lint-typecheck:
    name: ESLint + TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bunx eslint . --max-warnings=0

      - name: TypeScript typecheck
        run: bunx tsc --noEmit -p tsconfig.app.json

  supabase-validate:
    name: Supabase Config & Migrations Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate supabase/config.toml exists
        run: |
          if [ ! -f supabase/config.toml ]; then
            echo "::error::Missing supabase/config.toml"
            exit 1
          fi
          echo "✅ supabase/config.toml found"

      - name: Lint SQL migrations (syntax sanity)
        run: |
          shopt -s nullglob
          fail=0
          for f in supabase/migrations/*.sql; do
            if [ ! -s "$f" ]; then
              echo "::error file=$f::Empty migration file"
              fail=1
            fi
          done
          exit $fail

      - name: Check for public tables missing GRANT statements
        run: |
          shopt -s nullglob
          fail=0
          for f in supabase/migrations/*.sql; do
            if grep -qiE "create\s+table\s+(public\.|if\s+not\s+exists\s+public\.)" "$f"; then
              if ! grep -qiE "grant\s+" "$f"; then
                echo "::error file=$f::CREATE TABLE in public schema without GRANT statement"
                fail=1
              fi
            fi
          done
          exit $fail

      - name: Start Supabase locally (validates config + migrations)
        run: supabase db start
        continue-on-error: true

  scan-summary:
    name: Scan Summary
    needs: [dependency-audit, secret-scan, codeql, lint-typecheck, supabase-validate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report status
        run: |
          echo "## 🛡️ Security & Quality Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | ${{ needs.dependency-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan (Gitleaks) | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL Static Analysis | ${{ needs.codeql.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ESLint + TypeScript | ${{ needs.lint-typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Supabase Config Validation | ${{ needs.supabase-validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Findings appear in the **Security** tab of the repository." >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.dependency-audit.result }}" == "failure" || "${{ needs.secret-scan.result }}" == "failure" || "${{ needs.codeql.result }}" == "failure" || "${{ needs.lint-typecheck.result }}" == "failure" || "${{ needs.supabase-validate.result }}" == "failure" ]]; then
            echo "::error::One or more checks failed."
            exit 1
          fi
