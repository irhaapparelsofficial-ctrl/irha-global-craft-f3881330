name: Generate Premium Embroidered Lederhosen Media

on:
  push:
    branches:
      - catalog-media-premium-embroidered-lederhosen-2026-07-17
    paths:
      - scripts/generate_premium_embroidered_lederhosen_media.py
      - .github/workflows/generate-premium-embroidered-lederhosen-media.yml

permissions:
  contents: write

concurrency:
  group: generate-premium-embroidered-lederhosen-media
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message || '', '[premium-lederhosen-generated]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: catalog-media-premium-embroidered-lederhosen-2026-07-17
          fetch-depth: 2
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install locked image dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'Pillow==11.3.0'

      - name: Generate exact-logo media pack
        id: generate
        run: python scripts/generate_premium_embroidered_lederhosen_media.py 2>&1 | tee premium-embroidered-lederhosen-generator.log

      - name: Verify generated media
        if: steps.generate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          base = Path('public/product-media/premium-embroidered-lederhosen')
          manifest = json.loads((base / 'media-manifest.json').read_text())
          assert [row['view'] for row in manifest['views']] == ['front', 'three-quarter', 'side', 'back']
          assert len(list((base / 'clean').glob('*.png'))) == 4
          assert len(list((base / 'branded').glob('*.png'))) == 4
          assert len(list((base / 'web').glob('*.webp'))) == 4
          for row in manifest['views']:
              with Image.open(row['clean_path']) as image:
                  assert image.size == (2048, 2048)
              with Image.open(row['branded_path']) as image:
                  assert image.size == (2048, 2048)
              with Image.open(row['web_path']) as image:
                  assert image.size == (1600, 1600)
          print('Premium embroidered Lederhosen media verification passed.')
          PY

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-embroidered-lederhosen-media-${{ github.run_id }}
          path: |
            premium-embroidered-lederhosen-generator.log
            public/product-media/premium-embroidered-lederhosen
          if-no-files-found: warn
          retention-days: 14

      - name: Commit generated assets
        if: steps.generate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git add public/product-media/premium-embroidered-lederhosen
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(media): add premium embroidered Lederhosen pack [premium-lederhosen-generated]"
          git push origin HEAD:catalog-media-premium-embroidered-lederhosen-2026-07-17
