name: Live Post-Publish Womens QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright
        run: |
          npm install --no-save --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify latest published website
        env:
          IRHA_BASE_URL: https://www.irhaapparels.com
          IRHA_LIVE_REPORT_DIR: live-post-publish-report
        run: node scripts/live-post-publish-womens.mjs

      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-post-publish-womens-report
          path: live-post-publish-report
          if-no-files-found: warn
          retention-days: 7
