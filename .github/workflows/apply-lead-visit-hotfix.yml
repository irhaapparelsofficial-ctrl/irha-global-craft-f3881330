name: Apply lead visit hotfix

on:
  push:
    branches:
      - hotfix/lead-visit-baku-time
    paths:
      - scripts/apply-lead-visit-hotfix.py
      - .github/workflows/apply-lead-visit-hotfix.yml

permissions:
  contents: write

concurrency:
  group: apply-lead-visit-hotfix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/lead-visit-baku-time
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply exact asserted patch
        run: python scripts/apply-lead-visit-hotfix.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run focused safety regression
        run: npx vitest run src/test/leadReviewActivation.test.ts

      - name: Commit verified hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No patch changes produced"; exit 1; }
          git commit -m "hotfix(lead-review): preserve Baku visit time safely"
          git push origin HEAD:hotfix/lead-visit-baku-time
