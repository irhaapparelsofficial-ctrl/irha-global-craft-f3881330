name: Apply quality-gated production once

on:
  push:
    branches:
      - fix/quality-gated-production-20260714
    paths:
      - .github/workflows/apply-quality-gated-production-once.yml

permissions:
  contents: write

concurrency:
  group: apply-quality-gated-production-once
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: fix/quality-gated-production-20260714
          fetch-depth: 0

      - name: Patch release chain atomically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return source.replace(old, new, 1)

          production_path = Path('.github/workflows/cloudflare-pages-production.yml')
          production = production_path.read_text()

          production = replace_once(
              production,
              '  push:\n    branches: [main]\n',
              '  workflow_run:\n    workflows: ["Quality Gate"]\n    types: [completed]\n    branches: [main]\n',
              'production trigger',
          )
          production = replace_once(
              production,
              "      github.event_name == 'push' ||\n      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY')",
              "      (github.event_name == 'workflow_run' &&\n       github.event.workflow_run.conclusion == 'success' &&\n       github.event.workflow_run.head_branch == 'main') ||\n      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY')",
              'production job guard',
          )

          source_expression = '$' + "{{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
          project_line = '      CLOUDFLARE_PROJECT_NAME: $' + '{{ secrets.CLOUDFLARE_PROJECT_NAME }}\n'
          production = replace_once(
              production,
              project_line,
              project_line + f'      SOURCE_COMMIT_SHA: {source_expression}\n',
              'approved source environment',
          )

          old_ref = '          ref: $' + '{{ github.sha }}'
          new_ref = '          ref: $' + '{{ env.SOURCE_COMMIT_SHA }}' + '\n          fetch-depth: 0'
          production = replace_once(production, old_ref, new_ref, 'approved checkout ref')

          setup_node = '      - name: Setup Node\n'
          verify_source = '''      - name: Verify approved SHA is still exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT_SHA"
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT_SHA" || {
            echo "Approved Quality Gate SHA is no longer current main"
            exit 1
          }

'''
          production = replace_once(
              production,
              setup_node,
              verify_source + setup_node,
              'current-main verification step',
          )
          production = production.replace('$GITHUB_SHA', '$SOURCE_COMMIT_SHA')

          required = [
              'workflow_run:',
              'workflows: ["Quality Gate"]',
              "github.event.workflow_run.conclusion == 'success'",
              'SOURCE_COMMIT_SHA:',
              'ref: $' + '{{ env.SOURCE_COMMIT_SHA }}',
              'Approved Quality Gate SHA is no longer current main',
          ]
          for marker in required:
              if marker not in production:
                  raise SystemExit(f'missing production marker: {marker}')
          if '  push:\n    branches: [main]' in production:
              raise SystemExit('unsafe direct main-push production trigger remains')
          if '$GITHUB_SHA' in production:
              raise SystemExit('workflow-run wrapper SHA is still used for deployment parity')
          production_path.write_text(production)

          identity_path = Path('scripts/release-identity.ts')
          identity = identity_path.read_text()
          identity = replace_once(
              identity,
              'export const SOURCE_COMMIT_ENV_KEYS = [\n  "GITHUB_SHA",\n  "CF_PAGES_COMMIT_SHA",\n  "VERCEL_GIT_COMMIT_SHA",\n  "LOVABLE_GIT_COMMIT_SHA",\n  "SOURCE_COMMIT_SHA",\n] as const;',
              'export const SOURCE_COMMIT_ENV_KEYS = [\n  "SOURCE_COMMIT_SHA",\n  "GITHUB_SHA",\n  "CF_PAGES_COMMIT_SHA",\n  "VERCEL_GIT_COMMIT_SHA",\n  "LOVABLE_GIT_COMMIT_SHA",\n] as const;',
              'source identity priority',
          )
          identity_path.write_text(identity)

          test_path = Path('src/lib/__checks__/releaseIdentity.test.ts')
          test = test_path.read_text()
          anchor = '''  it("falls back to the checked-out Git head without inventing an identity", () => {'''
          new_test = '''  it("prefers an explicitly approved source over workflow wrapper identities", () => {
    const identity = resolveSourceIdentity(
      {
        SOURCE_COMMIT_SHA: SHA_C,
        GITHUB_SHA: SHA_A,
        CF_PAGES_COMMIT_SHA: SHA_B,
      },
      () => SHA_B,
    );

    expect(identity).toEqual({
      sourceCommit: SHA_C,
      sourceCommitShort: SHA_C.slice(0, 12),
      sourceIdentityState: "verified",
    });
  });

'''
          test = replace_once(test, anchor, new_test + anchor, 'source priority regression test')
          test_path.write_text(test)
          PY

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify targeted release contracts
        run: |
          npx vitest run src/lib/__checks__/releaseIdentity.test.ts
          npx tsc --noEmit

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-quality-gated-production-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/cloudflare-pages-production.yml scripts/release-identity.ts src/lib/__checks__/releaseIdentity.test.ts .github/workflows/apply-quality-gated-production-once.yml
          git diff --cached --check
          git commit -m "fix(release): deploy only after green current-main quality gate"
          git push origin HEAD:fix/quality-gated-production-20260714
