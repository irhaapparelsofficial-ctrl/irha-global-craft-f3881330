name: IA SEC E003 Narrowed Transform

on:
  push:
    branches:
      - sec/ia-sec-e003-durable-rate-limits
    paths:
      - scripts/ci/ia-sec-e003-retry2.py
      - .github/workflows/ia-sec-e003-retry2.yml
  pull_request:
    branches:
      - main
    types: [synchronize]
    paths:
      - scripts/ci/ia-sec-e003-retry2.py
      - .github/workflows/ia-sec-e003-retry2.yml

permissions:
  contents: write

concurrency:
  group: ia-sec-e003-narrowed-transform
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sec/ia-sec-e003-durable-rate-limits
          fetch-depth: 0

      - name: Apply narrowed deterministic integrations
        run: python3 scripts/ci/ia-sec-e003-retry2.py

      - name: Remove temporary controls and commit
        run: |
          rm scripts/ci/ia-sec-e003-retry2.py
          rm .github/workflows/ia-sec-e003-retry2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "security: integrate durable edge rate limits"
          git push origin HEAD:sec/ia-sec-e003-durable-rate-limits
