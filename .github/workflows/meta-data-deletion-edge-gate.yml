name: Meta Data Deletion Edge Gate

run-name: Meta deletion edge gate · ${{ github.ref_name }} · #${{ github.run_number }}

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/meta-data-deletion-edge-gate.yml"
      - "public/_headers"
      - "public/_routes.json"
      - "public/_worker.js"
      - "public/docs/data-deletion.html"

permissions:
  contents: read

concurrency:
  group: meta-data-deletion-edge-gate
  cancel-in-progress: true

env:
  PREVIEW_BRANCH: meta-compliance

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact lockfile dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build exact source
        run: npm run build

      - name: Verify routing contract before deploy
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/_worker.js
          test -s dist/_routes.json
          test -s dist/_headers
          grep -Fq '"/docs/*.md"' dist/_routes.json
          if grep -Fxq '    "/docs/*",' dist/_routes.json; then
            echo "Broad /docs/* Worker exclusion would bypass the compliance handler"
            exit 1
          fi
          grep -Fxq '/docs/*.md' dist/_headers
          if grep -Fxq '/docs/*' dist/_headers; then
            echo "Broad /docs/* static header rule would overlap HTML compliance routes"
            exit 1
          fi
          grep -Fq 'pathname === "/docs/data-deletion"' dist/_worker.js
          grep -Fq '"X-Irha-Data-Deletion-Source": "worker-direct-html"' dist/_worker.js

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          account_id="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          project_name="$(printf '%s' "$CLOUDFLARE_PROJECT_NAME" | tr -d '[:space:]')"
          test -n "$token" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$account_id" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$project_name" || { echo "CLOUDFLARE_PROJECT_NAME is missing"; exit 1; }
          echo "::add-mask::$token"
          echo "::add-mask::$account_id"
          {
            echo "CLOUDFLARE_API_TOKEN=$token"
            echo "CLOUDFLARE_ACCOUNT_ID=$account_id"
            echo "CLOUDFLARE_PROJECT_NAME=$project_name"
            echo "PREVIEW_URL=https://${PREVIEW_BRANCH}.${project_name}.pages.dev"
          } >> "$GITHUB_ENV"

      - name: Deploy isolated compliance preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist \
            --project-name="$CLOUDFLARE_PROJECT_NAME" \
            --branch="$PREVIEW_BRANCH" \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=false

      - name: Verify deployed edge behavior
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 30); do
            nonce="${GITHUB_SHA::12}-$attempt"
            if curl -fsS --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' \
              "$PREVIEW_URL/build.json?meta_edge=$nonce" -o /tmp/build.json \
              && jq -e --arg source "$GITHUB_SHA" '.source_commit == $source' /tmp/build.json >/dev/null; then
              ready=1
              break
            fi
            echo "Preview alias has not converged yet ($attempt/30)"
            sleep 8
          done
          test "$ready" = "1" || { echo "Compliance preview did not converge to this commit"; exit 1; }

          nonce="${GITHUB_SHA::12}-final"
          curl -fsS --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' \
            "$PREVIEW_URL/docs/data-deletion?meta_edge=$nonce" \
            -o /tmp/data-deletion.html -D /tmp/data-deletion.headers

          grep -Eiq '^HTTP/[0-9.]+ 200' /tmp/data-deletion.headers
          grep -Eiq '^content-type:[[:space:]]*text/html([[:space:]]*;|[[:space:]]*$)' /tmp/data-deletion.headers || {
            echo "FAIL: data-deletion is not text/html"
            cat /tmp/data-deletion.headers
            exit 1
          }
          if grep -Eiq '^content-type:.*text/markdown' /tmp/data-deletion.headers; then
            echo "FAIL: Markdown MIME leaked onto HTML compliance route"
            cat /tmp/data-deletion.headers
            exit 1
          fi
          grep -Eiq '^x-irha-data-deletion-source:[[:space:]]*worker-direct-html' /tmp/data-deletion.headers || {
            echo "FAIL: request bypassed the Worker compliance handler"
            cat /tmp/data-deletion.headers
            exit 1
          }
          grep -Fq '<title>User Data Deletion — Irha Apparels</title>' /tmp/data-deletion.html
          grep -Fq '<h1>User Data Deletion</h1>' /tmp/data-deletion.html

          curl -fsS --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' \
            "$PREVIEW_URL/docs/mcp.md?meta_edge=$nonce" \
            -o /tmp/mcp.md -D /tmp/mcp.headers
          grep -Eiq '^HTTP/[0-9.]+ 200' /tmp/mcp.headers
          grep -Eiq '^content-type:[[:space:]]*text/markdown([[:space:]]*;|[[:space:]]*$)' /tmp/mcp.headers || {
            echo "FAIL: Markdown documentation lost text/markdown MIME"
            cat /tmp/mcp.headers
            exit 1
          }

          curl -sS --connect-timeout 10 --max-time 30 --max-redirs 0 -H 'Cache-Control: no-cache' \
            "$PREVIEW_URL/docs/data-deletion.html?meta_edge=$nonce" \
            -o /dev/null -D /tmp/legacy.headers || true
          grep -Eiq '^HTTP/[0-9.]+ 301' /tmp/legacy.headers || {
            echo "FAIL: legacy .html URL is not a permanent redirect"
            cat /tmp/legacy.headers
            exit 1
          }
          grep -Eiq '^location:[[:space:]]*https://irhaapparels\.com/docs/data-deletion([?].*)?[[:space:]]*$' /tmp/legacy.headers || {
            echo "FAIL: legacy .html URL does not redirect to canonical clean URL"
            cat /tmp/legacy.headers
            exit 1
          }

          echo "PASS: compliance HTML, Worker routing, Markdown isolation and canonical redirect are correct"
