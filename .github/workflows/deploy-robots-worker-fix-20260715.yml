name: Deploy robots worker routing fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-robots-worker-fix-20260715.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-robots-worker-fix-20260715
  cancel-in-progress: false

env:
  PAGES_URL: https://irha-apparels.pages.dev
  APEX_URL: https://irhaapparels.com
  PROJECT_NAME: irha-apparels

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install and validate exact source
        run: |
          set -euo pipefail
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run verify:deployment-source
          npm run verify:secrets
          npm run verify:migrations
          npx tsc --noEmit
          npm test -- --passWithNoTests
          npm run build
          npm run verify:release-identity

      - name: Verify robots routing in built release
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/_routes.json
          test -s dist/_worker.js
          node <<'NODE'
          const fs = require('fs');
          const routes = JSON.parse(fs.readFileSync('dist/_routes.json', 'utf8'));
          if (!routes.include?.includes('/*')) throw new Error('Pages worker catch-all include is missing');
          if (routes.exclude?.includes('/robots.txt')) throw new Error('robots.txt is still excluded from Pages worker');
          const worker = fs.readFileSync('dist/_worker.js', 'utf8');
          for (const required of ['X-Irha-Robots-Source', 'worker-valid', 'Content-Signal']) {
            if (!worker.includes(required)) throw new Error(`Worker robots contract missing ${required}`);
          }
          NODE

      - name: Deploy exact build
        run: npx --yes wrangler@4 pages deploy dist --project-name="$PROJECT_NAME" --branch=main

      - name: Verify exact release and robots response
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 30); do
            nonce="${GITHUB_SHA::12}-$attempt-$RANDOM"
            if curl -fsS --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' "$PAGES_URL/build.json?verify=$nonce" -o /tmp/pages-build.json \
              && curl -fsS --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' "$APEX_URL/build.json?verify=$nonce" -o /tmp/apex-build.json \
              && jq -e --arg sha "$GITHUB_SHA" '.source_commit==$sha and .source_identity_state=="verified"' /tmp/pages-build.json >/dev/null \
              && jq -e --arg sha "$GITHUB_SHA" '.source_commit==$sha and .source_identity_state=="verified"' /tmp/apex-build.json >/dev/null; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" = 1

          nonce="${GITHUB_SHA::12}-$RANDOM"
          curl -sS --connect-timeout 10 --max-time 40 -D /tmp/robots.headers -o /tmp/robots.txt "$APEX_URL/robots.txt?verify=$nonce"
          status="$(awk 'NR==1 {print $2}' /tmp/robots.headers)"
          marker="$(awk 'BEGIN{IGNORECASE=1} /^x-irha-robots-source:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/robots.headers)"
          cache="$(awk 'BEGIN{IGNORECASE=1} /^cache-control:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/robots.headers)"
          test "$status" = 200
          test "$marker" = worker-valid
          case "$cache" in *no-transform*) ;; *) echo "robots no-transform missing: $cache"; exit 1 ;; esac
          grep -F 'User-agent: *' /tmp/robots.txt
          grep -F 'Sitemap: https://irhaapparels.com/sitemap.xml' /tmp/robots.txt
          if grep -qi '^Content-Signal:' /tmp/robots.txt; then
            echo 'Cloudflare Content-Signal is still present'
            cat /tmp/robots.txt
            exit 1
          fi

          {
            echo '## Robots worker routing release verified'
            echo
            echo "- Source SHA: \`$GITHUB_SHA\`"
            echo '- Apex and pages.dev source identity: exact match'
            echo '- `/robots.txt`: HTTP 200'
            echo '- Worker marker: `worker-valid`'
            echo '- Cache policy: includes `no-transform`'
            echo '- Canonical sitemap directive: present'
            echo '- `Content-Signal`: absent'
          } > /tmp/evidence.md

      - name: Record evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 375 --repo "$GITHUB_REPOSITORY" --body-file /tmp/evidence.md
