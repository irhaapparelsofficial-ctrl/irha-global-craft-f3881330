name: GP-2 Parity Candidate Evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "supabase/config.toml"
      - "supabase/deployment-parity/**"
      - ".github/workflows/gp2-parity-candidate.yml"

permissions:
  contents: read

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_PROJECT_ID: pvzjiozismyxqrzmtfbi
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate exact production parity candidate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          npx --yes supabase@2.39.2 gen types typescript \
            --project-id "$SUPABASE_PROJECT_ID" \
            --schema public > src/integrations/supabase/types.ts
          test -s src/integrations/supabase/types.ts
          MIGRATION_PROVENANCE_MODE=write node scripts/ci/generate-migration-provenance.mjs
          SUPABASE_MANIFEST_MODE=write node scripts/ci/generate-supabase-manifest.mjs
          node scripts/verify-supabase-parity.mjs

      - name: Upload exact candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: gp2-parity-candidate-${{ github.event.pull_request.head.sha }}
          path: |
            src/integrations/supabase/types.ts
            supabase/deployment-parity/migration-provenance.json
            supabase/deployment-parity/manifest.json
          if-no-files-found: error
          retention-days: 2
