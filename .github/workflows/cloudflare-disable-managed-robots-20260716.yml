name: Disable Cloudflare managed robots policy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-disable-managed-robots-20260716.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: cloudflare-managed-robots-off
  cancel-in-progress: false

jobs:
  disable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE_NAME: irhaapparels.com
      ISSUE_NUMBER: "375"
    steps:
      - name: Disable managed robots and Content Signals
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '[:space:]')"
          test -n "$token"
          echo "::add-mask::$token"
          auth=(-H "Authorization: Bearer $token" -H 'Content-Type: application/json')

          zones="$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME&status=active&per_page=10")"
          test "$(jq -r '.success // false' <<<"$zones")" = true
          test "$(jq -r '(.result // []) | length' <<<"$zones")" = 1
          zone_id="$(jq -r '.result[0].id' <<<"$zones")"
          [[ "$zone_id" =~ ^[0-9a-fA-F]{32}$ ]]
          echo "::add-mask::$zone_id"

          current="$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/bot_management")"
          test "$(jq -r '.success // false' <<<"$current")" = true

          if [[ "$(jq -r '.result.is_robots_txt_managed // false' <<<"$current")" != "false" ]] || \
             [[ "$(jq -r '.result.cf_robots_variant // "off"' <<<"$current")" != "off" ]]; then
            updated="$(curl -fsS -X PUT "${auth[@]}" \
              --data '{"is_robots_txt_managed":false,"cf_robots_variant":"off"}' \
              "https://api.cloudflare.com/client/v4/zones/$zone_id/bot_management")"
            test "$(jq -r '.success // false' <<<"$updated")" = true
          fi

          verified="$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/bot_management")"
          test "$(jq -r '.success // false' <<<"$verified")" = true
          test "$(jq -r '.result.is_robots_txt_managed // false' <<<"$verified")" = false
          test "$(jq -r '.result.cf_robots_variant // "off"' <<<"$verified")" = off

      - name: Verify live robots response
        shell: bash
        run: |
          set -euo pipefail
          clean=0
          for attempt in $(seq 1 30); do
            url="https://irhaapparels.com/robots.txt?verify=robots-off-${GITHUB_SHA::12}-$attempt-$RANDOM"
            if curl -fsSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' "$url" -o /tmp/robots.txt; then
              if ! grep -qiE 'content-signal|BEGIN Cloudflare Managed|content signals policy' /tmp/robots.txt \
                 && grep -Fq 'Sitemap: https://irhaapparels.com/sitemap.xml' /tmp/robots.txt; then
                clean=1
                break
              fi
            fi
            sleep 10
          done
          test "$clean" = 1
          echo "Cloudflare managed robots and Content Signals are disabled." >> "$GITHUB_STEP_SUMMARY"

      - name: Record sanitized evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body=$(cat <<'EOF'
          ## Cloudflare managed robots policy disabled

          - `is_robots_txt_managed`: `false`
          - `cf_robots_variant`: `off`
          - Live `robots.txt`: no `Content-Signal`
          - Canonical sitemap directive: present
          - No DNS, Pages project, application code, database, product, pricing, catalogue, media or customer data changed.
          EOF
          )
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
