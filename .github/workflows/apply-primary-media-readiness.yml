name: Apply Primary Media Readiness

on:
  push:
    branches: [feature/primary-media-readiness]
    paths:
      - "scripts/patch-primary-media-readiness.mjs"
      - ".github/workflows/apply-primary-media-readiness.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/primary-media-readiness
          fetch-depth: 0
      - name: Apply exact readiness patch
        run: node scripts/patch-primary-media-readiness.mjs
      - name: Remove one-time patch machinery
        run: git rm scripts/patch-primary-media-readiness.mjs .github/workflows/apply-primary-media-readiness.yml
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/catalog-media-bootstrap/index.ts src/components/admin/CatalogMediaBootstrapPanel.tsx src/components/admin/SocialPublishingCenter.tsx
          if git diff --cached --quiet; then
            echo "No source changes were required."
            exit 0
          fi
          git commit -m "Prioritize primary catalog media and expose publish blockers"
          git push origin HEAD:feature/primary-media-readiness
