name: Edge incident gateway smoke once

on:
  push:
    branches: [ops/external-hardening-20260716]
    paths:
      - ".github/workflows/edge-incident-smoke-once-20260716.yml"

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/external-hardening-20260716
          fetch-depth: 0

      - name: Exercise live success and denial paths
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://pvzjiozismyxqrzmtfbi.supabase.co/functions/v1/report-app-incident'
          incident="IRHA-SMOKE$(date +%H%M%S)-A1B2C3"
          payload="$(jq -nc --arg id "$incident" '{_incident_id:$id,_route:"/audit-smoke",_error_name:"AuditSmoke",_error_message:"synthetic verification",_component_stack:null,_user_agent:"github-actions-smoke",_source_sha:null}')"

          invalid_http="$(curl -sS -o /tmp/invalid-body -w '%{http_code}' -X POST \
            -H 'Origin: https://invalid.example' \
            -H 'Content-Type: application/json' \
            --data "$payload" "$endpoint")"

          valid_http="$(curl -sS -o /tmp/valid-body -w '%{http_code}' -X POST \
            -H 'Origin: https://irhaapparels.com' \
            -H 'Content-Type: application/json' \
            --data "$payload" "$endpoint")"
          valid_body="$(cat /tmp/valid-body | tr -d '[:space:]')"

          invalid_ok=false
          valid_ok=false
          [ "$invalid_http" = "403" ] && invalid_ok=true
          [ "$valid_http" = "200" ] && [ "$valid_body" = "true" ] && valid_ok=true

          mkdir -p docs
          cat > docs/EDGE_GATEWAY_SMOKE_20260716.md <<EOF
          # Runtime incident Edge gateway smoke — 2026-07-16

          - Incident reference: \`$incident\`
          - Invalid-origin HTTP: \`$invalid_http\`
          - Invalid-origin blocked: \`$invalid_ok\`
          - Valid-origin HTTP: \`$valid_http\`
          - Valid-origin accepted: \`$valid_ok\`

          The incident is synthetic and must be removed from \`app_runtime_incidents\` and its matching CRM notification after database verification.
          EOF

          rm -f /tmp/invalid-body /tmp/valid-body
          rm .github/workflows/edge-incident-smoke-once-20260716.yml

          if [ "$invalid_ok" != true ] || [ "$valid_ok" != true ]; then
            echo 'Smoke contract failed' >&2
            exit 1
          fi

      - name: Commit sanitized smoke evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(ops): record incident gateway smoke evidence"
          git push origin HEAD:ops/external-hardening-20260716
