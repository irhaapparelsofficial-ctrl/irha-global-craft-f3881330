name: Fix Generate Mockup Responder Once

on:
  push:
    branches:
      - fix/generate-mockup-cors-20260717
    paths:
      - ".github/workflows/fix-generate-mockup-responder-once.yml"

permissions:
  contents: write

concurrency:
  group: fix-generate-mockup-responder-once
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor == 'irhaapparelsofficial-ctrl'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/generate-mockup-cors-20260717
          fetch-depth: 1
          persist-credentials: true

      - name: Correct local responder
        run: node scripts/ci/fix-generate-mockup-responder.mjs

      - name: Verify non-recursive responder
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq '=> jsonResponse(body, status, headers);' supabase/functions/generate-mockup/index.ts
          ! grep -Fq '=> respond(body, status, headers);' supabase/functions/generate-mockup/index.ts

      - name: Remove one-time correction machinery
        shell: bash
        run: |
          rm scripts/ci/fix-generate-mockup-responder.mjs
          rm .github/workflows/fix-generate-mockup-responder-once.yml

      - name: Commit corrected source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "fix(mockup): use request-scoped CORS responder"
          git push origin HEAD:fix/generate-mockup-cors-20260717
