name: Deploy Workers AI Guide Current Main

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-workers-ai-guide-current-main
  cancel-in-progress: false

env:
  PAGES_BRANCH: main
  PAGES_URL: https://irha-apparels.pages.dev
  CANONICAL_ORIGIN: https://irhaapparels.com
  RELEASE_AUDIT_ISSUE: "375"

jobs:
  deploy-ai-guide:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.number == 375 &&
       github.event.comment.body == '/deploy-workers-ai-current-main' &&
       github.event.comment.user.login == 'irhaapparelsofficial-ctrl')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm exact current main source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          checked_out="$(git rev-parse HEAD)"
          test "$checked_out" = "$latest_main" || {
            echo "Refusing stale AI release: checked out $checked_out, current main $latest_main"
            exit 1
          }
          echo "SOURCE_SHA=$latest_main" >> "$GITHUB_ENV"
          echo "PREVIEW_BRANCH=workers-ai-${latest_main:0:12}" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact lockfile dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Verify source, tests and production build
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:deployment-source
          npm run verify:secrets
          npm run verify:migrations
          npx tsc --noEmit
          npm test -- --passWithNoTests
          npm run build
          npm run verify:release-identity
          grep -F 'handleIrhaGuideRequest' dist/_worker.js
          grep -F 'pathname === "/api/guide"' dist/_worker.js
          grep -F 'env.AI.run' dist/_worker-guide.js
          grep -F 'cloudflare-workers-ai' dist/_worker-guide.js

      - name: Resolve Cloudflare account and Pages project
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '[:space:]')"
          raw_account_id="$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID:-}" | tr -d '[:space:]')"
          project_name="$(printf '%s' "${CLOUDFLARE_PROJECT_NAME:-}" | tr -d '[:space:]')"

          test -n "$token" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$project_name" || { echo "CLOUDFLARE_PROJECT_NAME is missing"; exit 1; }
          echo "::add-mask::$token"

          verify_json="$(curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' https://api.cloudflare.com/client/v4/user/tokens/verify)"
          test "$(printf '%s' "$verify_json" | jq -r '.success // false')" = "true"

          account_id="$raw_account_id"
          if ! [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            account_id="$(printf '%s' "$raw_account_id" | grep -Eo '[0-9a-fA-F]{32}' | head -n 1 || true)"
          fi
          if ! [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            accounts_json="$(curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/accounts?per_page=50')"
            test "$(printf '%s' "$accounts_json" | jq -r '.success // false')" = "true"
            test "$(printf '%s' "$accounts_json" | jq -r '(.result // []) | length')" = "1"
            account_id="$(printf '%s' "$accounts_json" | jq -r '.result[0].id // empty')"
          fi
          [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]] || { echo "Cloudflare account ID could not be resolved"; exit 1; }
          echo "::add-mask::$account_id"

          project_json="$(curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/$account_id/pages/projects/$project_name")"
          test "$(printf '%s' "$project_json" | jq -r '.success // false')" = "true"
          test "$(printf '%s' "$project_json" | jq -r '.result.name // empty')" = "$project_name"
          test "$(printf '%s' "$project_json" | jq -r '.result.production_branch // empty')" = "$PAGES_BRANCH"

          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_PROJECT_NAME=$project_name" >> "$GITHUB_ENV"

      - name: Download existing Pages configuration and add only AI binding
        shell: bash
        run: |
          set -euo pipefail
          rm -f wrangler.toml wrangler.json wrangler.jsonc
          npx --yes wrangler@latest pages download config "$CLOUDFLARE_PROJECT_NAME"

          mapfile -t config_files < <(
            find . -maxdepth 1 -type f \
              \( -name 'wrangler.toml' -o -name 'wrangler.json' -o -name 'wrangler.jsonc' \) \
              -printf '%f\n' | sort
          )
          test "${#config_files[@]}" = "1" || {
            echo "Expected exactly one downloaded Wrangler config, found ${#config_files[@]}: ${config_files[*]:-none}"
            exit 1
          }

          wrangler_config="${config_files[0]}"
          node scripts/prepare-cloudflare-ai-pages-config.mjs "$wrangler_config"
          case "$wrangler_config" in
            wrangler.toml)
              grep -Fx '[ai]' "$wrangler_config"
              grep -Fx 'binding = "AI"' "$wrangler_config"
              ;;
            wrangler.json|wrangler.jsonc)
              grep -Eq '"ai"[[:space:]]*:' "$wrangler_config"
              grep -Eq '"binding"[[:space:]]*:[[:space:]]*"AI"' "$wrangler_config"
              ;;
            *)
              echo "Unsupported downloaded Wrangler config: $wrangler_config"
              exit 1
              ;;
          esac
          test -f "$wrangler_config"
          echo "WRANGLER_CONFIG=$wrangler_config" >> "$GITHUB_ENV"
          echo "Root Pages configuration will be auto-discovered by Wrangler: $wrangler_config"

      - name: Deploy immutable preview with Workers AI binding
        shell: bash
        run: |
          set -uo pipefail
          npx --yes wrangler@latest pages deploy dist \
            --project-name "$CLOUDFLARE_PROJECT_NAME" \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$SOURCE_SHA" \
            --commit-dirty=false 2>&1 | tee /tmp/preview-deploy.log
          deploy_code="${PIPESTATUS[0]}"
          if [ "$deploy_code" -ne 0 ]; then
            echo "Preview deployment failed with exit code $deploy_code"
            exit "$deploy_code"
          fi

          preview_url="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev' /tmp/preview-deploy.log | tail -n 1 || true)"
          if [ -z "$preview_url" ]; then
            deployments_json="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT_NAME/deployments?env=preview&per_page=25")"
            preview_url="$(printf '%s' "$deployments_json" | jq -r --arg branch "$PREVIEW_BRANCH" '[.result[] | select(.deployment_trigger.metadata.branch == $branch)] | sort_by(.created_on) | reverse | .[0].url // empty')"
          fi
          [[ "$preview_url" =~ ^https://[a-zA-Z0-9.-]+\.pages\.dev$ ]] || {
            echo "Could not resolve the preview deployment URL"
            exit 1
          }
          echo "PREVIEW_URL=$preview_url" >> "$GITHUB_ENV"

      - name: Verify preview source and two-turn real AI conversation
        shell: bash
        run: |
          set -uo pipefail
          preview_sha=""
          for attempt in {1..18}; do
            preview_sha="$(curl -fsS "$PREVIEW_URL/build.json" | jq -r '.source_commit // empty' 2>/dev/null || true)"
            [ "$preview_sha" = "$SOURCE_SHA" ] && break
            sleep 5
          done
          if [ "$preview_sha" != "$SOURCE_SHA" ]; then
            echo "Preview source mismatch: expected $SOURCE_SHA, got ${preview_sha:-missing}" | tee /tmp/preview-smoke.log
            exit 1
          fi
          node scripts/smoke-cloudflare-ai-guide.mjs "$PREVIEW_URL" 2>&1 | tee /tmp/preview-smoke.log
          smoke_code="${PIPESTATUS[0]}"
          if [ "$smoke_code" -ne 0 ]; then
            echo "Preview smoke failed with exit code $smoke_code"
            exit "$smoke_code"
          fi

      - name: Reconfirm exact current main before production
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test "$SOURCE_SHA" = "$latest_main" || {
            echo "Main advanced from $SOURCE_SHA to $latest_main; preview remains isolated and production is skipped"
            exit 1
          }

      - name: Reconcile verified preview AI binding into production
        shell: bash
        run: |
          set -euo pipefail
          project_url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT_NAME"
          before_json=/tmp/pages-project-before.json
          patch_json=/tmp/pages-ai-binding-patch.json
          patch_response=/tmp/pages-ai-binding-patch-response.json
          reconcile_log=/tmp/binding-reconcile.log

          prepared=false
          for attempt in {1..8}; do
            curl -fsS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              "$project_url" > "$before_json"
            if node scripts/reconcile-cloudflare-pages-ai-binding.mjs prepare "$before_json" "$patch_json" > "$reconcile_log" 2>&1; then
              prepared=true
              break
            fi
            sleep 3
          done
          if [ "$prepared" != "true" ]; then
            cat "$reconcile_log"
            exit 1
          fi
          cat "$reconcile_log"
          changed="$(sed -n 's/^changed=//p' "$reconcile_log")"
          test "$changed" = "true" || test "$changed" = "false"

          if [ "$changed" = "true" ]; then
            http_status="$(curl -sS \
              -o "$patch_response" \
              -w '%{http_code}' \
              -X PATCH \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary "@$patch_json" \
              "$project_url")"
            if [[ ! "$http_status" =~ ^2[0-9][0-9]$ ]]; then
              echo "Cloudflare Pages production AI binding PATCH failed with HTTP $http_status"
              jq -c '{success, errors: [.errors[]? | {code, message}]}' "$patch_response" 2>/dev/null || true
              exit 1
            fi
            test "$(jq -r '.success // false' "$patch_response")" = "true"
          fi

          verified=false
          for attempt in {1..8}; do
            curl -fsS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              "$project_url" > /tmp/pages-project-after.json
            if node scripts/reconcile-cloudflare-pages-ai-binding.mjs verify /tmp/pages-project-after.json >> "$reconcile_log" 2>&1; then
              verified=true
              break
            fi
            sleep 3
          done
          if [ "$verified" != "true" ]; then
            cat "$reconcile_log"
            exit 1
          fi
          echo "Verified deployment_configs.production.ai_bindings.AI matches the preview-proven binding."

      - name: Deploy exact verified build to production
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy dist \
            --project-name "$CLOUDFLARE_PROJECT_NAME" \
            --branch "$PAGES_BRANCH" \
            --commit-hash "$SOURCE_SHA" \
            --commit-dirty=false

      - name: Verify apex, pages.dev and real AI production contract
        shell: bash
        run: |
          set -uo pipefail
          apex_sha=""
          pages_sha=""
          for attempt in {1..24}; do
            apex_sha="$(curl -fsS "$CANONICAL_ORIGIN/build.json" | jq -r '.source_commit // empty' 2>/dev/null || true)"
            pages_sha="$(curl -fsS "$PAGES_URL/build.json" | jq -r '.source_commit // empty' 2>/dev/null || true)"
            if [ "$apex_sha" = "$SOURCE_SHA" ] && [ "$pages_sha" = "$SOURCE_SHA" ]; then break; fi
            sleep 5
          done
          if [ "$apex_sha" != "$SOURCE_SHA" ] || [ "$pages_sha" != "$SOURCE_SHA" ]; then
            echo "Production source mismatch: expected $SOURCE_SHA, apex=${apex_sha:-missing}, pages=${pages_sha:-missing}" | tee /tmp/production-smoke.log
            exit 1
          fi
          node scripts/smoke-cloudflare-ai-guide.mjs "$CANONICAL_ORIGIN" 2>&1 | tee /tmp/production-smoke.log
          smoke_code="${PIPESTATUS[0]}"
          if [ "$smoke_code" -ne 0 ]; then
            echo "Production smoke failed with exit code $smoke_code"
            exit "$smoke_code"
          fi

      - name: Record verified Workers AI release evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$RELEASE_AUDIT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Verified Cloudflare Workers AI guide release completed from exact current main \`$SOURCE_SHA\`. Downloaded existing Pages configuration \`$WRANGLER_CONFIG\` was preserved, the preview-proven \`AI\` binding was reconciled into production without deleting other production AI bindings, and preview \`$PREVIEW_URL\` passed source identity plus two-turn non-repetition smoke tests before production. Apex and pages.dev both serve the same source and the provider header is \`cloudflare-workers-ai\`."

      - name: Record failed Workers AI release attempt
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report=/tmp/workers-ai-release-failure.md
          sanitize() {
            sed -E $'s/\033\[[0-9;]*[mK]//g; s/[0-9a-fA-F]{32}/[masked-32hex]/g; s/(Bearer[[:space:]]+)[A-Za-z0-9._~-]+/\1[masked]/g'
          }
          {
            echo "Workers AI guide release failed for source \`${SOURCE_SHA:-unknown}\`."
            echo
            echo "Preview-first safeguards prevented an unverified production claim."
            echo
            echo "Inspect: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            if [ -s /tmp/preview-smoke.log ]; then
              echo
              echo "Sanitized preview smoke output:"
              echo
              echo '```text'
              sanitize < /tmp/preview-smoke.log | tail -n 80 | head -c 8000
              echo
              echo '```'
            fi
            if [ -s /tmp/binding-reconcile.log ]; then
              echo
              echo "Sanitized production binding reconciliation output:"
              echo
              echo '```text'
              sanitize < /tmp/binding-reconcile.log | tail -n 80 | head -c 8000
              echo
              echo '```'
            fi
            if [ -s /tmp/production-smoke.log ]; then
              echo
              echo "Sanitized production smoke output:"
              echo
              echo '```text'
              sanitize < /tmp/production-smoke.log | tail -n 80 | head -c 8000
              echo
              echo '```'
            fi
            if [ -s /tmp/preview-deploy.log ]; then
              echo
              echo "Sanitized preview deploy tail:"
              echo
              echo '```text'
              sanitize < /tmp/preview-deploy.log | tail -n 80 | head -c 8000
              echo
              echo '```'
            fi
          } > "$report"
          gh issue comment "$RELEASE_AUDIT_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$report"
