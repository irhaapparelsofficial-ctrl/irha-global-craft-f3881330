name: Cloudflare Production Status

run-name: Live release proof · reconcile-${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows: ["Cloudflare Current Main Reconcile"]
    types: [completed]

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: cloudflare-production-status-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

env:
  UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
  UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
  PAGES_URL: https://irha-apparels.pages.dev
  CANONICAL_ORIGIN: https://irhaapparels.com
  WWW_ORIGIN: https://www.irhaapparels.com

jobs:
  prove-live-release:
    if: github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Resolve original release SHA and upstream relevance
        id: relevance
        shell: bash
        run: |
          set -euo pipefail
          upstream_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID")"
          display_title="$(printf '%s' "$upstream_json" | jq -r '.display_title // ""')"
          source_sha="$(printf '%s' "$display_title" | grep -Eo '[0-9a-f]{40}' | tail -n 1 || true)"
          latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID/jobs?filter=latest&per_page=100")"
          executed_jobs="$(printf '%s' "$jobs_json" | jq '[.jobs[] | select(.conclusion != "skipped")] | length')"

          relevant=false
          current=false
          if [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] && [ "$executed_jobs" -gt 0 ]; then
            relevant=true
            if [ "$source_sha" = "$latest_main" ]; then current=true; fi
          fi

          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "latest_main=$latest_main" >> "$GITHUB_OUTPUT"
          echo "executed_jobs=$executed_jobs" >> "$GITHUB_OUTPUT"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"

          if [ "$relevant" != "true" ]; then
            echo "Non-release Cloudflare reconcile ignored: title=$display_title executed_jobs=$executed_jobs"
          elif [ "$current" != "true" ]; then
            echo "Superseded Cloudflare proof skipped safely: source=$source_sha current_main=$latest_main"
          else
            echo "Exact current-main Cloudflare reconcile identified: source=$source_sha run=$UPSTREAM_RUN_ID"
          fi

      - name: Record ignored non-release run
        if: steps.relevance.outputs.relevant != 'true'
        shell: bash
        run: |
          {
            echo "## Cloudflare Production Status"
            echo "- Reconcile run: \`$UPSTREAM_RUN_ID\`"
            echo "- Executed upstream jobs: \`${{ steps.relevance.outputs.executed_jobs }}\`"
            echo "- Result: ignored because every upstream job was skipped or no original release SHA was present"
            echo "- Commit status mutation: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish upstream reconciliation failure without duplicate failure email
        if: >-
          steps.relevance.outputs.relevant == 'true' &&
          steps.relevance.outputs.current == 'true' &&
          env.UPSTREAM_CONCLUSION != 'success'
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state=failure \
            -f context="Irha Cloudflare Production" \
            -f description="Cloudflare reconciliation did not complete" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID" \
            >/dev/null
          echo "Upstream Cloudflare failure was recorded on the exact commit; this observer exits cleanly to avoid a duplicate failure email."

      - name: Publish exact-live verification pending
        if: >-
          steps.relevance.outputs.relevant == 'true' &&
          steps.relevance.outputs.current == 'true' &&
          env.UPSTREAM_CONCLUSION == 'success'
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state=pending \
            -f context="Irha Cloudflare Production" \
            -f description="Verifying exact merged release and public artifacts" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null

      - name: Verify pages.dev, apex and www against exact merged SHA
        id: live
        if: >-
          steps.relevance.outputs.relevant == 'true' &&
          steps.relevance.outputs.current == 'true' &&
          env.UPSTREAM_CONCLUSION == 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "verified=false" >> "$GITHUB_OUTPUT"
          echo "superseded=false" >> "$GITHUB_OUTPUT"
          echo "apex_challenged=false" >> "$GITHUB_OUTPUT"
          echo "www_challenged=false" >> "$GITHUB_OUTPUT"

          cloudflare_challenge() {
            headers="$1"
            body="$2"
            if grep -Fqi 'cf-mitigated: challenge' "$headers" 2>/dev/null; then return 0; fi
            if grep -Fqi 'server: cloudflare' "$headers" 2>/dev/null \
              && grep -Fqi 'Just a moment...' "$body" 2>/dev/null; then return 0; fi
            return 1
          }

          current_main_or_supersede() {
            latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
            if [ "$latest_main" != "$SOURCE_SHA" ]; then
              echo "superseded=true" >> "$GITHUB_OUTPUT"
              echo "Live proof superseded safely: source=$SOURCE_SHA current_main=$latest_main"
              exit 0
            fi
          }

          verify_origin() {
            origin="$1"
            label="$2"
            allow_challenge="$3"
            output="/tmp/${label}-build.json"
            headers="/tmp/${label}-build.headers"
            challenge_seen=false

            for attempt in $(seq 1 30); do
              current_main_or_supersede
              cache_bust="${SOURCE_SHA::12}-$attempt-$RANDOM"
              status="$(curl -sSL --connect-timeout 10 --max-time 35 \
                -H 'Cache-Control: no-cache' \
                -D "$headers" -o "$output" -w '%{http_code}' \
                "$origin/build.json?release_check=$cache_bust" || true)"
              if [ "$status" = "200" ] \
                && jq -e --arg sha "$SOURCE_SHA" \
                  '.source_commit == $sha and .source_identity_state == "verified" and (.build_fingerprint | type == "string" and test("^[0-9a-f]{64}$"))' \
                  "$output" >/dev/null 2>&1; then
                echo "$label serves exact merged SHA $SOURCE_SHA"
                return 0
              fi

              if cloudflare_challenge "$headers" "$output"; then
                challenge_seen=true
                if [ "$allow_challenge" = "true" ]; then break; fi
              fi

              echo "$label not exact yet: status=$status attempt=$attempt/30"
              sleep 8
            done

            if [ "$allow_challenge" = "true" ] && [ "$challenge_seen" = "true" ]; then
              echo "${label}_challenged=true" >> "$GITHUB_OUTPUT"
              echo "::warning::GitHub-hosted $label observer received a verified Cloudflare challenge. Exact Pages identity remains mandatory and independent public verification is required for this custom domain."
              return 0
            fi

            echo "::error title=Exact production release not proven::$label did not serve merged SHA $SOURCE_SHA"
            head -c 600 "$output" 2>/dev/null || true
            echo
            return 1
          }

          verify_origin "$PAGES_URL" pages false
          verify_origin "$CANONICAL_ORIGIN" apex true
          current_main_or_supersede

          headers=/tmp/www-headers.txt
          body=/tmp/www-body.txt
          status="$(curl -sS --connect-timeout 10 --max-time 35 --max-redirs 0 \
            -D "$headers" -o "$body" -w '%{http_code}' \
            "$WWW_ORIGIN/products?release_check=${SOURCE_SHA::12}-$RANDOM" || true)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); value=$0} END{print value}' "$headers")"

          www_verified=false
          case "$status" in
            301|302|307|308)
              case "$location" in
                https://irhaapparels.com/*) www_verified=true ;;
              esac
              ;;
          esac

          if [ "$www_verified" = "true" ]; then
            echo "www canonical redirect verified: status=$status location=$location"
          elif cloudflare_challenge "$headers" "$body"; then
            echo "www_challenged=true" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub-hosted www observer received a verified Cloudflare challenge. Independent public verification remains required for the canonical redirect."
          else
            echo "::error title=Canonical redirect failed::Unexpected non-challenge www response status=$status location=$location"
            exit 1
          fi

          echo "verified=true" >> "$GITHUB_OUTPUT"
          echo "Exact Pages production SHA verified; custom domains are either directly verified or explicitly challenge-classified."

      - name: Checkout exact release source for artifact audit
        if: >-
          steps.relevance.outputs.relevant == 'true' &&
          steps.relevance.outputs.current == 'true' &&
          env.UPSTREAM_CONCLUSION == 'success' &&
          steps.live.outputs.verified == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.relevance.outputs.source_sha }}
          persist-credentials: false

      - name: Audit live JavaScript, CSS and source-map exposure
        id: artifacts
        if: >-
          steps.relevance.outputs.relevant == 'true' &&
          steps.relevance.outputs.current == 'true' &&
          env.UPSTREAM_CONCLUSION == 'success' &&
          steps.live.outputs.verified == 'true'
        env:
          ARTIFACT_AUDIT_MODE: remote
          ARTIFACT_ORIGINS: https://irha-apparels.pages.dev
          EXPECTED_SHA: ${{ steps.relevance.outputs.source_sha }}
          APEX_CHALLENGED: ${{ steps.live.outputs.apex_challenged }}
        shell: bash
        run: |
          set -euo pipefail
          echo "verified=false" >> "$GITHUB_OUTPUT"
          if [ "$APEX_CHALLENGED" != "true" ]; then
            export ARTIFACT_ORIGINS="$ARTIFACT_ORIGINS,https://irhaapparels.com"
          fi
          node scripts/ci/audit-production-artifacts.mjs | tee /tmp/live-artifact-audit.json
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Upload live release proof
        if: always() && steps.live.outputs.verified == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: exact-live-proof-${{ steps.relevance.outputs.source_sha }}
          path: |
            /tmp/pages-build.json
            /tmp/pages-build.headers
            /tmp/apex-build.json
            /tmp/apex-build.headers
            /tmp/www-headers.txt
            /tmp/www-body.txt
            /tmp/live-artifact-audit.json
          if-no-files-found: warn
          retention-days: 3

      - name: Publish exact live production status
        if: >-
          always() &&
          steps.relevance.outputs.relevant == 'true' &&
          steps.relevance.outputs.current == 'true' &&
          env.UPSTREAM_CONCLUSION == 'success'
        env:
          VERIFIED: ${{ steps.live.outputs.verified }}
          SUPERSEDED: ${{ steps.live.outputs.superseded }}
          ARTIFACT_VERIFIED: ${{ steps.artifacts.outputs.verified }}
          APEX_CHALLENGED: ${{ steps.live.outputs.apex_challenged }}
          WWW_CHALLENGED: ${{ steps.live.outputs.www_challenged }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SUPERSEDED" = "true" ]; then
            echo "A newer main commit superseded this proof; no stale final status published."
            exit 0
          fi

          state=failure
          description="Exact release or public-artifact audit is not proven"
          if [ "$VERIFIED" = "true" ] && [ "$ARTIFACT_VERIFIED" = "true" ]; then
            state=success
            if [ "$APEX_CHALLENGED" = "true" ] || [ "$WWW_CHALLENGED" = "true" ]; then
              description="Exact Pages release live; custom-domain GitHub observer challenged; artifact audit passed"
            else
              description="Exact merged release is live; source-map and public-artifact audit passed"
            fi
          fi

          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state="$state" \
            -f context="Irha Cloudflare Production" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null

          apex_state=verified
          www_state=verified
          [ "$APEX_CHALLENGED" = "true" ] && apex_state=challenged
          [ "$WWW_CHALLENGED" = "true" ] && www_state=challenged

          {
            echo "## Cloudflare Production Status"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Reconcile run: \`$UPSTREAM_RUN_ID\`"
            echo "- pages.dev exact SHA: \`$VERIFIED\`"
            echo "- apex GitHub observer: \`$apex_state\`"
            echo "- www canonical observer: \`$www_state\`"
            echo "- live source-map/public-artifact audit: \`$ARTIFACT_VERIFIED\`"
            echo "- Commit status: \`$state\`"
          } >> "$GITHUB_STEP_SUMMARY"

          test "$VERIFIED" = "true"
          test "$ARTIFACT_VERIFIED" = "true"