name: Verify live indexing and performance release

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-live-indexing-performance-20260715.yml"

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify corrected live preload and asset
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN="https://irhaapparels.com"
          FIX_SHA="c0c418266e5d1c73a509bb53a8fcf638637c273a"
          LCP_PATH="/thumbnails/product-media/distressed-brown-short-lederhosen/01-hero-front.webp.webp"

          build_json="$(curl -fsS "$ORIGIN/build.json?verify=${GITHUB_SHA::12}")"
          served_sha="$(printf '%s' "$build_json" | jq -r '.source_commit')"
          identity="$(printf '%s' "$build_json" | jq -r '.source_identity_state')"
          echo "served_sha=$served_sha identity=$identity"
          test "$served_sha" = "$FIX_SHA"
          test "$identity" = "verified"

          curl -fsSL "$ORIGIN/?verify=${GITHUB_SHA::12}" -o /tmp/home.html
          grep -F "data-irha-home-lcp" /tmp/home.html >/dev/null
          grep -F "href=\"$LCP_PATH\"" /tmp/home.html >/dev/null
          grep -F '/de/bekleidungshersteller-deutschland' /tmp/home.html >/dev/null
          echo "home_markup=pass"

          curl -fsSL "$ORIGIN/de/bekleidungshersteller-deutschland?verify=${GITHUB_SHA::12}" -o /tmp/germany.html
          grep -F '<link rel="canonical" href="https://irhaapparels.com/de/bekleidungshersteller-deutschland"' /tmp/germany.html >/dev/null
          if grep -F 'data-irha-home-lcp' /tmp/germany.html >/dev/null; then exit 1; fi
          echo "germany_shell=pass"

          result="$(curl -sSL -o /tmp/lcp.webp -w '%{http_code}|%{content_type}|%{size_download}' "$ORIGIN$LCP_PATH")"
          echo "asset=$result"
          status="${result%%|*}"
          rest="${result#*|}"
          content_type="${rest%%|*}"
          test "$status" = "200"
          test "$content_type" = "image/webp"

          echo "Corrected LCP preload and WebP asset verified." >> "$GITHUB_STEP_SUMMARY"
