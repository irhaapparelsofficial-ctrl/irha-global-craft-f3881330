name: Enable Supabase Leaked Password Protection

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: enable-supabase-password-protection
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: pvzjiozismyxqrzmtfbi
  RELEASE_AUDIT_ISSUE: "375"

jobs:
  enable-and-verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.number == 375 &&
       github.event.comment.body == '/enable-supabase-password-protection' &&
       github.event.comment.user.login == 'irhaapparelsofficial-ctrl')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Enable and verify leaked-password protection
        id: protect
        shell: bash
        run: |
          set -uo pipefail
          bash scripts/ci/enable-supabase-hibp.sh 2>&1 | tee /tmp/hibp-result.log
          command_code="${PIPESTATUS[0]}"

          plan_blocked=false
          if [ "$command_code" -ne 0 ] && \
             grep -Fq 'Supabase Auth Management API PATCH failed with HTTP 402:' /tmp/hibp-result.log && \
             grep -Fq 'available on Pro Plans and up' /tmp/hibp-result.log; then
            plan_blocked=true
          elif [ "$command_code" -ne 0 ]; then
            echo "Supabase password-protection command failed with exit code $command_code"
            exit "$command_code"
          fi

          if [ "$plan_blocked" = "true" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "blocker=pro-plan-required" >> "$GITHUB_OUTPUT"
            echo "before=false" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "after=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Supabase password protection"
              echo "- Project: \`$SUPABASE_PROJECT_ID\`"
              echo "- Verified enabled: \`false\`"
              echo "- External blocker: \`Supabase Pro Plan required\`"
              echo "- Result: intentionally waiting without a red CI failure"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          before="$(sed -n 's/^before=//p' /tmp/hibp-result.log)"
          changed="$(sed -n 's/^changed=//p' /tmp/hibp-result.log)"
          after="$(sed -n 's/^after=//p' /tmp/hibp-result.log)"
          test "$after" = "true"
          echo "blocked=false" >> "$GITHUB_OUTPUT"
          echo "blocker=" >> "$GITHUB_OUTPUT"
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          {
            echo "## Supabase password protection"
            echo "- Project: \`$SUPABASE_PROJECT_ID\`"
            echo "- Previously enabled: \`$before\`"
            echo "- Changed: \`$changed\`"
            echo "- Verified enabled: \`$after\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record verified outcome
        if: success() && steps.protect.outputs.blocked != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$RELEASE_AUDIT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Supabase leaked-password protection is verified enabled for owner project \`$SUPABASE_PROJECT_ID\`. Previous: \`${{ steps.protect.outputs.before }}\`; changed now: \`${{ steps.protect.outputs.changed }}\`; final: \`${{ steps.protect.outputs.after }}\`."

      - name: Record external plan blocker
        if: success() && steps.protect.outputs.blocked == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$RELEASE_AUDIT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Supabase leaked-password protection remains disabled because the Supabase Management API returned HTTP 402: this feature requires a Pro Plan or higher. Repository code and the access token are valid; the workflow is intentionally waiting without a red CI failure. Upgrade owner project \`$SUPABASE_PROJECT_ID\`, then rerun \`/enable-supabase-password-protection\`."

      - name: Record guarded failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          report=/tmp/supabase-hibp-failure.md
          {
            echo "Supabase leaked-password protection could not be verified because of an unexpected control-plane failure."
            echo
            echo "Inspect protected run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            if [ -s /tmp/hibp-result.log ]; then
              echo
              echo "Sanitized Management API result:"
              echo
              echo '```text'
              sed -E 's/[A-Za-z0-9._~-]{20,}/[masked]/g' /tmp/hibp-result.log | tail -n 40 | head -c 4000
              echo
              echo '```'
            fi
          } > "$report"
          gh issue comment "$RELEASE_AUDIT_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$report"
