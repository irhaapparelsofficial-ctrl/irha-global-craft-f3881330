name: Enable Supabase Leaked Password Protection

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: enable-supabase-password-protection
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: pvzjiozismyxqrzmtfbi
  RELEASE_AUDIT_ISSUE: "375"

jobs:
  enable-and-verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.number == 375 &&
       github.event.comment.body == '/enable-supabase-password-protection' &&
       github.event.comment.user.login == 'irhaapparelsofficial-ctrl')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Enable and verify leaked-password protection
        id: protect
        shell: bash
        run: |
          set -uo pipefail
          log=/tmp/hibp-result.log
          bash scripts/ci/enable-supabase-hibp.sh >"$log" 2>&1
          status=$?

          if [ "$status" -ne 0 ]; then
            reason="$(sed -E 's/(Bearer[[:space:]]+)[A-Za-z0-9._~-]+/\1[masked]/g; s/[0-9a-fA-F]{32,}/[masked-hex]/g' "$log" | tail -n 6 | tr '\n\r' '  ' | head -c 1200)"
            echo "failure_reason=$reason" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$reason" >&2
            exit "$status"
          fi

          output="$(cat "$log")"
          before="$(printf '%s\n' "$output" | sed -n 's/^before=//p')"
          changed="$(printf '%s\n' "$output" | sed -n 's/^changed=//p')"
          after="$(printf '%s\n' "$output" | sed -n 's/^after=//p')"
          test "$after" = "true"
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          {
            echo "## Supabase password protection"
            echo "- Project: \`$SUPABASE_PROJECT_ID\`"
            echo "- Previously enabled: \`$before\`"
            echo "- Changed: \`$changed\`"
            echo "- Verified enabled: \`$after\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record verified outcome
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$RELEASE_AUDIT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Supabase leaked-password protection is verified enabled for owner project \`$SUPABASE_PROJECT_ID\`. Previous: \`${{ steps.protect.outputs.before }}\`; changed now: \`${{ steps.protect.outputs.changed }}\`; final: \`${{ steps.protect.outputs.after }}\`."

      - name: Record guarded failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          FAILURE_REASON: ${{ steps.protect.outputs.failure_reason }}
        shell: bash
        run: |
          report=/tmp/hibp-failure.md
          {
            echo "Supabase leaked-password protection could not be verified for \`$SUPABASE_PROJECT_ID\`."
            echo
            echo "Sanitized Management API result:"
            echo
            echo '```text'
            printf '%s\n' "${FAILURE_REASON:-No sanitized reason was captured.}"
            echo '```'
            echo
            echo "Inspect protected run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$report"
          gh issue comment "$RELEASE_AUDIT_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$report"
