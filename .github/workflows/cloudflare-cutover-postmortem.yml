name: Cloudflare Cutover Postmortem

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-cutover-postmortem.yml"

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    if: github.event.pull_request.head.ref == 'verify/cloudflare-cutover-postmortem-20260714'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_JOB_ID: '87073753970'

    steps:
      - name: Download and sanitize previous cutover logs
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$SOURCE_JOB_ID/logs" \
            -o /tmp/source.log

          grep -E 'Waiting:|Cutover failed|restoring original|Pages production|Unexpected existing|Create domain error|DNS update error|Pre-cutover|Apex/www|Process completed|exit code|live_restored|rollback|domains=|deployment=|www=' \
            /tmp/source.log \
            | tail -n 240 \
            | sed -E 's/[0-9a-fA-F]{32,64}/[redacted-id]/g' \
            > /tmp/cloudflare-cutover-postmortem.txt || true

          test -s /tmp/cloudflare-cutover-postmortem.txt || {
            echo 'No matching diagnostic lines found' > /tmp/cloudflare-cutover-postmortem.txt
          }

          cat /tmp/cloudflare-cutover-postmortem.txt

      - name: Upload sanitized postmortem
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-cutover-postmortem
          path: /tmp/cloudflare-cutover-postmortem.txt
          retention-days: 7
