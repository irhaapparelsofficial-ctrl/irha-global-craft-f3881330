name: IA-CTRL-E001R2 Evidence Seal

on:
  push:
    branches:
      - codex/ia-ctrl-e001r2-parity-seal
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: ia-ctrl-e001r2-evidence-seal
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: pvzjiozismyxqrzmtfbi
  PARITY_REFRESH_FILE: supabase/reconciliation/sec-m03-parity-refresh.json

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout focused evidence branch
        uses: actions/checkout@v4
        with:
          ref: codex/ia-ctrl-e001r2-parity-seal
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify repository and project identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "fe98058939e86c53c9e83bca4b1868de87225a2c"
          test "$(git rev-parse origin/main)" = "fe98058939e86c53c9e83bca4b1868de87225a2c"
          token="$(printf '%s' "${SUPABASE_ACCESS_TOKEN:-}" | tr -d '[:space:]')"
          test -n "$token"
          echo "::add-mask::$token"
          project_json="$(curl --retry 3 --retry-all-errors -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID")"
          test "$(printf '%s' "$project_json" | jq -r '.id')" = "$SUPABASE_PROJECT_ID"
          test "$(printf '%s' "$project_json" | jq -r '.status')" = "ACTIVE_HEALTHY"

      - name: Fetch authoritative live function evidence
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${SUPABASE_ACCESS_TOKEN:-}" | tr -d '[:space:]')"
          mkdir -p /tmp/sec-m03-live-functions /tmp/sec-m03-live-body
          curl --retry 3 --retry-all-errors -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/functions" -o /tmp/functions-after.raw.json
          jq -S . /tmp/functions-after.raw.json > /tmp/functions-after.json
          jq -r '.functions[].name' "$PARITY_REFRESH_FILE" | sort -u > /tmp/planned-parity-refresh.txt
          while IFS= read -r function_name; do
            metadata="/tmp/sec-m03-live-body/$function_name.metadata.json"
            headers="/tmp/sec-m03-live-body/$function_name.headers"
            body="/tmp/sec-m03-live-body/$function_name.body"
            output="/tmp/sec-m03-live-functions/$function_name.json"
            curl --retry 3 --retry-all-errors -fsS \
              -H "Authorization: Bearer $token" \
              -H 'Content-Type: application/json' \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/functions/$function_name" \
              -o "$metadata"
            curl --retry 3 --retry-all-errors -fsS \
              -D "$headers" \
              -H "Authorization: Bearer $token" \
              -H 'Accept: multipart/form-data' \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/functions/$function_name/body" \
              -o "$body"
            FUNCTION_METADATA="$metadata" FUNCTION_HEADERS="$headers" FUNCTION_BODY="$body" FUNCTION_OUTPUT="$output" python3 - <<'PY'
          import json
          import os
          from email import policy
          from email.parser import BytesParser

          metadata_path = os.environ["FUNCTION_METADATA"]
          headers_path = os.environ["FUNCTION_HEADERS"]
          body_path = os.environ["FUNCTION_BODY"]
          output_path = os.environ["FUNCTION_OUTPUT"]

          with open(metadata_path, "r", encoding="utf-8") as handle:
              metadata = json.load(handle)
          with open(headers_path, "rb") as handle:
              header_lines = handle.read().decode("iso-8859-1").splitlines()
          content_types = [
              line.split(":", 1)[1].strip()
              for line in header_lines
              if line.lower().startswith("content-type:")
          ]
          if not content_types or not content_types[-1].lower().startswith("multipart/form-data"):
              raise SystemExit(f"Unexpected function body content type: {content_types[-1] if content_types else 'missing'}")
          with open(body_path, "rb") as handle:
              raw_body = handle.read()
          message = BytesParser(policy=policy.default).parsebytes(
              f"Content-Type: {content_types[-1]}\r\nMIME-Version: 1.0\r\n\r\n".encode("ascii") + raw_body
          )
          files = []
          for part in message.iter_parts():
              filename = part.get_filename()
              if not filename:
                  continue
              payload = part.get_payload(decode=True)
              files.append({"name": filename, "content": payload.decode("utf-8")})
          if not files:
              raise SystemExit("No source files found in function body")
          metadata["files"] = files
          with open(output_path, "w", encoding="utf-8") as handle:
              json.dump(metadata, handle, sort_keys=True)
              handle.write("\n")
          PY
            jq -e --arg name "$function_name" '(.slug == $name or .name == $name) and (.version | type == "number") and (.verify_jwt | type == "boolean") and (.ezbr_sha256 | type == "string") and (.files | type == "array") and (.files | length > 0)' "$output" > /dev/null
          done < /tmp/planned-parity-refresh.txt

      - name: Verify exact deployed sources and refresh approved registries
        shell: bash
        run: |
          set -euo pipefail
          SEC_M03_PARITY_REFRESH_PLAN="$PARITY_REFRESH_FILE" \
          SEC_M03_LIVE_FUNCTION_DIRECTORY=/tmp/sec-m03-live-functions \
          SEC_M03_SOURCE_EVIDENCE=/tmp/sec-m03-deployed-source-evidence.json \
          SOURCE_SHA="$(git rev-parse HEAD)" \
            node scripts/ci/verify-sec-m03-deployed-sources.mjs
          SEC_M03_PARITY_REFRESH_PLAN="$PARITY_REFRESH_FILE" \
          SEC_M03_LIVE_INVENTORY=/tmp/functions-after.json \
          SEC_M03_REGISTRY_EVIDENCE=/tmp/sec-m03-registry-refresh-evidence.json \
          SOURCE_SHA="$(git rev-parse HEAD)" \
            node scripts/ci/refresh-sec-m03-live-parity.mjs

      - name: Generate official public types and canonical evidence
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.39.2 gen types typescript --project-id "$SUPABASE_PROJECT_ID" --schema public > /tmp/supabase-types.ts
          test -s /tmp/supabase-types.ts
          ! grep -E '(sb_secret_|service_role[^A-Za-z0-9]|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,})' /tmp/supabase-types.ts
          cp /tmp/supabase-types.ts src/integrations/supabase/types.ts
          node scripts/ci/verify-supabase-type-supplement.mjs /tmp/supabase-types.ts
          node scripts/ci/run-sec-m03-parity-generation.mjs

      - name: Enforce focused generated evidence scope
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --name-only | sort > /tmp/changed.txt
          cat > /tmp/allowed.txt <<'EOF'
          src/integrations/supabase/types.ts
          supabase/deployment-parity/functions-f1.json
          supabase/deployment-parity/functions-f2.json
          supabase/deployment-parity/manifest.json
          supabase/deployment-parity/migration-provenance.json
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          comm -23 /tmp/changed.txt /tmp/allowed.txt | tee /tmp/unexpected.txt
          test ! -s /tmp/unexpected.txt
          grep -q 'cleanup_edge_rate_limit_state' src/integrations/supabase/types.ts
          grep -q 'consume_edge_rate_limit' src/integrations/supabase/types.ts
          ! grep -q 'edge_rate_limit_state:' src/integrations/supabase/types.ts
          test "$(jq '.functions | length' supabase/deployment-parity/functions-f1.json)" = "33"
          test "$(jq '.functions | length' supabase/deployment-parity/functions-f2.json)" = "14"
          test "$(jq -r '.edge_functions.registries.F5.count' supabase/deployment-parity/manifest.json)" = "0"
          test "$(jq -r '.database.live_migrations.count' supabase/deployment-parity/manifest.json)" = "375"
          test "$(jq -r '.database.public.function_signatures' supabase/deployment-parity/manifest.json)" = "204"
          sha256sum src/integrations/supabase/types.ts supabase/deployment-parity/functions-f1.json supabase/deployment-parity/functions-f2.json supabase/deployment-parity/manifest.json supabase/deployment-parity/migration-provenance.json

      - name: Commit sealed evidence and remove temporary generator
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ia-ctrl-e001r2-evidence-seal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/integrations/supabase/types.ts src/integrations/supabase/client.ts scripts/ci/verify-supabase-type-supplement.mjs src/integrations/supabase/secM03Database.ts supabase/deployment-parity/functions-f1.json supabase/deployment-parity/functions-f2.json supabase/deployment-parity/manifest.json supabase/deployment-parity/migration-provenance.json .github/workflows/ia-ctrl-e001r2-evidence-seal.yml
          git commit -m "chore(parity): seal SEC-M03 post-deployment evidence"
          git push origin HEAD:codex/ia-ctrl-e001r2-parity-seal
