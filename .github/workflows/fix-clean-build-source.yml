name: Fix Clean Rebuild Source List

on:
  push:
    branches:
      - feature/lead-outreach-safe-v3
    paths:
      - ".github/workflows/fix-clean-build-source.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lead-outreach-safe-v3
      - name: Remove unavailable historical document from restore list
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/build-clean-lead-outreach-v3.yml')
          text = path.read_text()
          old = '            docs/OWNER_APPROVED_OUTREACH_V2.md \\\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected unavailable document line once; found {text.count(old)}')
          path.write_text(text.replace(old, '', 1))
          PY
      - name: Commit exact workflow correction
        run: |
          set -euo pipefail
          rm .github/workflows/fix-clean-build-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-clean-lead-outreach-v3.yml .github/workflows/fix-clean-build-source.yml
          git commit -m "ops: correct clean rebuild source list"
          git push origin HEAD:feature/lead-outreach-safe-v3
