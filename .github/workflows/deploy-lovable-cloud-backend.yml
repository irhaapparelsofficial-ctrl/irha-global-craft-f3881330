name: Deploy Lovable Cloud Backend

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-lovable-cloud-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lovable-cloud-backend-production
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: mlefxgyaqoisvdmoiapq
  FUNCTIONS_BASE_URL: https://mlefxgyaqoisvdmoiapq.supabase.co/functions/v1

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deployment credentials exist
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" ]]; then
            echo "::error::Missing repository/environment secret SUPABASE_ACCESS_TOKEN. Add the Lovable Cloud project's Supabase access token; do not connect a different project."
            exit 1
          fi
          if [[ -z "${SUPABASE_DB_PASSWORD}" ]]; then
            echo "::error::Missing repository/environment secret SUPABASE_DB_PASSWORD for Lovable Cloud project ${SUPABASE_PROJECT_REF}."
            exit 1
          fi

      - name: Verify repository project ref
        shell: bash
        run: |
          set -euo pipefail
          grep -q "project_id = \"${SUPABASE_PROJECT_REF}\"" supabase/config.toml || {
            echo "::error::supabase/config.toml does not target the approved Lovable Cloud project ${SUPABASE_PROJECT_REF}."
            exit 1
          }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link exact Lovable Cloud backend
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase link \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --password "${SUPABASE_DB_PASSWORD}"

      - name: Show migration state
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase migration list --linked --password "${SUPABASE_DB_PASSWORD}"

      - name: Dry-run repository migrations
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase db push \
            --include-all \
            --dry-run \
            --password "${SUPABASE_DB_PASSWORD}"

      - name: Apply repository migrations
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase db push --include-all --password "${SUPABASE_DB_PASSWORD}"

      - name: Deploy public lead gateway
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions deploy public-lead-gateway \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --no-verify-jwt

      - name: Non-destructive production smoke test
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$({ curl --silent --show-error \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --header 'Origin: https://www.irhaapparels.com' \
            --data '{"action":"production_smoke_invalid_action","payload":{}}' \
            "${FUNCTIONS_BASE_URL}/public-lead-gateway"; } || true)"
          body="$(cat "${response_file}")"
          echo "HTTP ${status}"
          echo "${body}"
          if [[ "${status}" != "400" ]]; then
            echo "::error::public-lead-gateway expected HTTP 400, received ${status}."
            exit 1
          fi
          if ! grep -qi 'Unsupported action' "${response_file}"; then
            echo "::error::public-lead-gateway response did not contain Unsupported action."
            exit 1
          fi

      - name: Deployment summary
        run: |
          {
            echo "## Lovable Cloud backend deployment"
            echo "- Project ref: \`${SUPABASE_PROJECT_REF}\`"
            echo "- Repository migrations: applied"
            echo "- Edge Function: \`public-lead-gateway\` deployed with JWT verification disabled"
            echo "- Non-destructive smoke test: passed"
          } >> "$GITHUB_STEP_SUMMARY"
