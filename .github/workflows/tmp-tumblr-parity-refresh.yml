name: Temporary Tumblr Parity Refresh

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/tmp-tumblr-parity-refresh.yml

permissions:
  contents: write

concurrency:
  group: tumblr-parity-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SUPABASE_PROJECT_ID: pvzjiozismyxqrzmtfbi
  PARITY_REFRESH_FILE: supabase/reconciliation/sec-m03-parity-refresh.json
  HEAD_BRANCH: fix/tumblr-post-sync-parity-closure-20260809

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/tumblr-post-sync-parity-closure-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.39.2

      - name: Extend reviewed parity-refresh metadata deterministically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          plan_path = Path('supabase/reconciliation/sec-m03-parity-refresh.json')
          plan = json.loads(plan_path.read_text())
          expected_existing = {
              'generate-mockup',
              'live-chat',
              'notification-dispatcher',
              'public-lead-gateway',
              'site-visitor',
          }
          actual_existing = {entry['name'] for entry in plan['functions']}
          if actual_existing != expected_existing:
              raise SystemExit(f'unexpected pre-fix parity plan: {sorted(actual_existing)}')

          plan['functions'].extend([
              {
                  'name': 'tumblr-oauth-callback',
                  'registry': 'supabase/deployment-parity/functions-f1.json',
                  'repository_source': 'supabase/functions/tumblr-oauth-callback/index.ts',
                  'minimum_version': 1,
                  'verify_jwt': False,
                  'require_shared_limiter': False,
                  'provenance': 'Repository-adopted Tumblr OAuth callback from production parity merge #891; exact deployed source verified before registry refresh',
              },
              {
                  'name': 'tumblr-operator',
                  'registry': 'supabase/deployment-parity/functions-f1.json',
                  'repository_source': 'supabase/functions/tumblr-operator/index.ts',
                  'minimum_version': 14,
                  'verify_jwt': False,
                  'require_shared_limiter': False,
                  'provenance': 'Repository-adopted Tumblr operator from production parity merge #891; exact deployed source verified before registry refresh',
              },
              {
                  'name': 'tumblr-operator-get',
                  'registry': 'supabase/deployment-parity/functions-f1.json',
                  'repository_source': 'supabase/functions/tumblr-operator-get/index.ts',
                  'minimum_version': 1,
                  'verify_jwt': False,
                  'require_shared_limiter': False,
                  'provenance': 'Repository-adopted Tumblr operator result proxy from production parity merge #891; exact deployed source verified before registry refresh',
              },
          ])
          plan_path.write_text(json.dumps(plan, indent=2) + '\n')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          test_path = Path('src/test/secM03ParityControl.test.ts')
          test = test_path.read_text()
          test = replace_once(
              test,
              '''  it("accepts only five explicitly proven parity refresh rows", () => {\n    expect(parityPlan.functions.map((entry: { name: string }) => entry.name).sort()).toEqual([\n      "generate-mockup",\n      "live-chat",\n      "notification-dispatcher",\n      "public-lead-gateway",\n      "site-visitor",\n    ]);\n    expect(sourceVerifier).toContain("Exact deployed source mismatch");\n    expect(sourceVerifier).toContain("Durable limiter helper mismatch");\n    expect(registryRefresh).toContain("Registry row missing");\n    expect(registryRefresh).toContain("Exact hash mismatch");\n  });\n''',
              '''  it("accepts only reviewed parity refresh rows including repository-adopted Tumblr functions", () => {\n    expect(parityPlan.functions.map((entry: { name: string }) => entry.name).sort()).toEqual([\n      "generate-mockup",\n      "live-chat",\n      "notification-dispatcher",\n      "public-lead-gateway",\n      "site-visitor",\n      "tumblr-oauth-callback",\n      "tumblr-operator",\n      "tumblr-operator-get",\n    ]);\n    expect(sourceVerifier).toContain("Exact deployed source mismatch");\n    expect(sourceVerifier).toContain("Durable limiter helper mismatch");\n    expect(registryRefresh).toContain("Registry row missing");\n    expect(registryRefresh).toContain("Exact hash mismatch");\n    expect(workflow).toContain("Unsupported parity refresh registry");\n    expect(workflow).toContain('test "$source_path" = "supabase/functions/$function_name/index.ts"');\n    expect(workflow).not.toContain("approved-parity-refresh");\n  });\n''',
              'parity plan contract test',
          )
          test = replace_once(
              test,
              '    expect(workflow).toContain("Pre-existing source-matched parity: notification-dispatcher v8 and public-lead-gateway v8");\n',
              '    expect(workflow).toContain("Parity refresh: reviewed F1/F2 repository sources, including adopted Tumblr functions");\n',
              'summary contract test',
          )
          anchor = '''  it("derives exact production migration parity without a fixed migration count", () => {\n'''
          tumblr_test = '''  it("locks current Tumblr production functions to source-matched F1 parity while keeping refresh version-monotonic", () => {\n    const expectedTumblr = [\n      ["tumblr-oauth-callback", 2, false, "bb6792fce1a9499245e250148ccfc724e2375dbbd07476ad90caa29ab74e90c7"],\n      ["tumblr-operator", 15, false, "4eb790dcaf1dc596443a9991ff0f30d41364eb6eb0c80939d73a606cdd84da1b"],\n      ["tumblr-operator-get", 2, false, "82d3e61455d022123345c628caeb1ac61aa64f6da766970703e8b00909a9637c"],\n    ] as const;\n\n    for (const [name, liveVersion, verifyJwt, sourceHash] of expectedTumblr) {\n      const row = f1Registry.functions.find((entry: unknown[]) => entry[0] === name);\n      expect(row?.slice(0, 4)).toEqual([name, liveVersion, verifyJwt, sourceHash]);\n      expect(supabaseConfig).toContain(`[functions.${name}]\\nverify_jwt = ${verifyJwt}`);\n      const refresh = parityPlan.functions.find((entry: { name: string }) => entry.name === name);\n      expect(refresh).toMatchObject({\n        registry: "supabase/deployment-parity/functions-f1.json",\n        repository_source: `supabase/functions/${name}/index.ts`,\n        verify_jwt: false,\n      });\n      expect(refresh).not.toHaveProperty("exact_version");\n      expect(refresh).not.toHaveProperty("exact_hash");\n    }\n  });\n\n'''
          test = replace_once(test, anchor, tumblr_test + anchor, 'Tumblr live parity contract test')
          test_path.write_text(test)
          PY

      - name: Verify exact live sources and regenerate canonical parity metadata
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${SUPABASE_ACCESS_TOKEN:-}" | tr -d '[:space:]')"
          test -n "$token"
          echo "::add-mask::$token"

          project_json="$(curl --retry 3 --retry-all-errors -fsS \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID")"
          test "$(printf '%s' "$project_json" | jq -r '.id // empty')" = "$SUPABASE_PROJECT_ID"

          curl --retry 3 --retry-all-errors -fsS \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/functions" \
            -o /tmp/functions-after.raw.json
          jq -e 'type == "array" and all(.[]; ((.name // .slug) | type == "string") and (.version | type == "number"))' \
            /tmp/functions-after.raw.json > /dev/null
          jq -S . /tmp/functions-after.raw.json > /tmp/functions-after.json

          SUPABASE_ACCESS_TOKEN="$token" \
          SEC_M03_PARITY_REFRESH_PLAN="$PARITY_REFRESH_FILE" \
          SEC_M03_LIVE_FUNCTION_DIRECTORY=/tmp/sec-m03-live-functions \
            node scripts/ci/fetch-supabase-edge-sources.mjs

          SEC_M03_PARITY_REFRESH_PLAN="$PARITY_REFRESH_FILE" \
          SEC_M03_LIVE_FUNCTION_DIRECTORY=/tmp/sec-m03-live-functions \
          SEC_M03_SOURCE_EVIDENCE=/tmp/sec-m03-deployed-source-evidence.json \
          SOURCE_SHA="${{ github.event.pull_request.head.sha }}" \
            node scripts/ci/verify-sec-m03-deployed-sources.mjs

          SEC_M03_PARITY_REFRESH_PLAN="$PARITY_REFRESH_FILE" \
          SEC_M03_LIVE_INVENTORY=/tmp/functions-after.json \
          SEC_M03_REGISTRY_EVIDENCE=/tmp/sec-m03-registry-refresh-evidence.json \
          SOURCE_SHA="${{ github.event.pull_request.head.sha }}" \
            node scripts/ci/refresh-sec-m03-live-parity.mjs

          npx --yes supabase@2.39.2 gen types typescript \
            --project-id "$SUPABASE_PROJECT_ID" \
            --schema public > /tmp/supabase-types.ts
          test -s /tmp/supabase-types.ts
          node scripts/ci/verify-supabase-type-supplement.mjs /tmp/supabase-types.ts
          cp /tmp/supabase-types.ts src/integrations/supabase/types.ts

          SUPABASE_ACCESS_TOKEN="$token" node scripts/ci/run-sec-m03-parity-generation.mjs
          rm -rf supabase/.temp
          git diff --check

      - name: Enforce bounded non-workflow diff and seal generated files
        shell: bash
        run: |
          set -euo pipefail
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > /tmp/changed-files.txt

          cat > /tmp/allowed-files.txt <<'EOF'
          src/integrations/supabase/types.ts
          src/test/secM03ParityControl.test.ts
          supabase/deployment-parity/functions-f1.json
          supabase/deployment-parity/functions-f2.json
          supabase/deployment-parity/manifest.json
          supabase/deployment-parity/migration-provenance.json
          supabase/reconciliation/sec-m03-parity-refresh.json
          EOF
          sort -u /tmp/allowed-files.txt -o /tmp/allowed-files.txt
          unexpected="$(comm -23 /tmp/changed-files.txt /tmp/allowed-files.txt)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected generated file(s):\n%s\n' "$unexpected" >&2
            exit 1
          fi

          grep -Fxq 'src/test/secM03ParityControl.test.ts' /tmp/changed-files.txt
          grep -Fxq 'supabase/deployment-parity/functions-f1.json' /tmp/changed-files.txt
          grep -Fxq 'supabase/deployment-parity/manifest.json' /tmp/changed-files.txt
          grep -Fxq 'supabase/reconciliation/sec-m03-parity-refresh.json' /tmp/changed-files.txt

          git config user.name 'irhaapparelsofficial-ctrl'
          git config user.email '294838484+irhaapparelsofficial-ctrl@users.noreply.github.com'
          git add \
            src/integrations/supabase/types.ts \
            src/test/secM03ParityControl.test.ts \
            supabase/deployment-parity/functions-f1.json \
            supabase/deployment-parity/functions-f2.json \
            supabase/deployment-parity/manifest.json \
            supabase/deployment-parity/migration-provenance.json \
            supabase/reconciliation/sec-m03-parity-refresh.json
          git commit -m 'fix(parity): refresh post-sync Tumblr registry metadata'
          git push origin HEAD:"$HEAD_BRANCH"
