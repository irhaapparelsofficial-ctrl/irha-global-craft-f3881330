name: Verify Cloudflare Custom Domains Final

run-name: Final Cloudflare domain certification · ${{ github.ref_name }} · #${{ github.run_number }}

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-cloudflare-custom-domains-final.yml"

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
      GH_READ_TOKEN: ${{ github.token }}
      APEX: irhaapparels.com
      WWW: www.irhaapparels.com
      PAGES_HOST: irha-apparels.pages.dev
      PAGES_URL: https://irha-apparels.pages.dev

    steps:
      - name: Verify Pages domains, DNS, SSL and exact live release
        shell: bash
        run: |
          set -Eeuo pipefail
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          account_id="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          project_name="$(printf '%s' "$CLOUDFLARE_PROJECT_NAME" | tr -d '[:space:]')"
          test -n "$token"
          [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]
          test -n "$project_name"
          echo "::add-mask::$token"
          echo "::add-mask::$account_id"

          project_url="https://api.cloudflare.com/client/v4/accounts/$account_id/pages/projects/$project_name"
          project_json="$(curl -sS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' "$project_url")"
          test "$(printf '%s' "$project_json" | jq -r '.success // false')" = true
          test "$(printf '%s' "$project_json" | jq -r '.result.production_branch // empty')" = main

          for host in "$APEX" "$WWW"; do
            encoded="$(printf '%s' "$host" | jq -sRr @uri)"
            domain_json="$(curl -sS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' "$project_url/domains/$encoded")"
            test "$(printf '%s' "$domain_json" | jq -r '.success // false')" = true
            test "$(printf '%s' "$domain_json" | jq -r '.result.name // empty')" = "$host"
            test "$(printf '%s' "$domain_json" | jq -r '.result.status // empty')" = active
            printf '%s' "$domain_json" | jq '.result | {name,status,validation_data,verification_data}' > "/tmp/domain-${host}.json"
          done

          zones_json="$(curl -sS -G -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            --data-urlencode "name=$APEX" --data-urlencode "account.id=$account_id" \
            --data-urlencode 'status=active' --data-urlencode 'per_page=10' \
            'https://api.cloudflare.com/client/v4/zones')"
          test "$(printf '%s' "$zones_json" | jq -r '.success // false')" = true
          test "$(printf '%s' "$zones_json" | jq -r '.result | length')" = 1
          zone_id="$(printf '%s' "$zones_json" | jq -r '.result[0].id')"
          echo "::add-mask::$zone_id"

          records_json="$(curl -sS -G -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            --data-urlencode 'per_page=100' "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records")"
          test "$(printf '%s' "$records_json" | jq -r '.success // false')" = true
          printf '%s' "$records_json" | jq --arg apex "$APEX" --arg www "$WWW" \
            '[.result[] | select(.name == $apex or .name == $www) | {type,name,content,proxied,ttl}] | sort_by(.name,.type,.content)' \
            > /tmp/final-web-dns.json
          jq -e --arg apex "$APEX" --arg www "$WWW" --arg target "$PAGES_HOST" \
            '([.[] | select(.type == "CNAME" and .name == $apex and .content == $target and .proxied == true)] | length) == 1 and ([.[] | select(.type == "CNAME" and .name == $www and .content == $target and .proxied == true)] | length) == 1' \
            /tmp/final-web-dns.json >/dev/null

          printf '%s' "$records_json" | jq -e --arg apex "$APEX" \
            '([.result[] | select(.name == $apex and .type == "MX" and (.content | test("^route[123]\\.mx\\.cloudflare\\.net$")))] | length) == 3 and any(.result[]; .name == $apex and .type == "TXT" and (.content | contains("include:_spf.mx.cloudflare.net"))) and ([.result[] | select(.name == $apex and .type == "TXT" and (.content | contains("google-site-verification")))] | length) >= 2' \
            >/dev/null

          verified=0
          for attempt in $(seq 1 60); do
            current_main="$(curl -fsS -H "Authorization: Bearer $GH_READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main" | jq -r '.sha')"
            bust="${current_main::12}-$attempt"
            curl -fsS --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' "$PAGES_URL/build.json?verify=$bust" -o /tmp/pages-build.json 2>/dev/null || true
            curl -fsS --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' "$PAGES_URL/cloudflare-deployment.json?verify=$bust" -o /tmp/pages-deployment.json 2>/dev/null || true
            apex_code="$(curl -LsS --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' -o /tmp/apex-home.html -w '%{http_code}' "https://$APEX/?verify=$bust" 2>/dev/null || true)"
            curl -LsS --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' -o /tmp/apex-build.json "https://$APEX/build.json?verify=$bust" 2>/dev/null || true
            curl -LsS --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' -o /tmp/apex-deployment.json "https://$APEX/cloudflare-deployment.json?verify=$bust" 2>/dev/null || true
            www_effective="$(curl -LsS --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' -o /tmp/www-home.html -w '%{url_effective}' "https://$WWW/?verify=$bust" 2>/dev/null || true)"

            pages_source="$(jq -r '.source_sha // empty' /tmp/pages-deployment.json 2>/dev/null || true)"
            pages_build="$(jq -r '.build_fingerprint // empty' /tmp/pages-deployment.json 2>/dev/null || true)"
            pages_runtime="$(jq -r '.runtime_fingerprint // empty' /tmp/pages-deployment.json 2>/dev/null || true)"
            apex_source="$(jq -r '.source_sha // empty' /tmp/apex-deployment.json 2>/dev/null || true)"
            apex_build="$(jq -r '.build_fingerprint // empty' /tmp/apex-deployment.json 2>/dev/null || true)"
            apex_runtime="$(jq -r '.runtime_fingerprint // empty' /tmp/apex-deployment.json 2>/dev/null || true)"
            www_ok=0
            case "$www_effective" in "https://$APEX/"*) www_ok=1;; esac

            if [ "$apex_code" = 200 ] && [ "$www_ok" = 1 ] && [ "$pages_source" = "$current_main" ] && [ "$apex_source" = "$pages_source" ] \
              && [ "$apex_build" = "$pages_build" ] && [ "$apex_runtime" = "$pages_runtime" ] \
              && [[ "$pages_build" =~ ^[0-9a-f]{64}$ ]] && [[ "$pages_runtime" =~ ^[0-9a-f]{64}$ ]] \
              && jq -e --arg repo "$GITHUB_REPOSITORY" --arg supabase pvzjiozismyxqrzmtfbi '.repository == $repo and .supabase_project_id == $supabase' /tmp/pages-build.json >/dev/null 2>&1 \
              && jq -e --arg repo "$GITHUB_REPOSITORY" --arg supabase pvzjiozismyxqrzmtfbi '.repository == $repo and .supabase_project_id == $supabase' /tmp/apex-build.json >/dev/null 2>&1; then
              verified=1
              break
            fi
            sleep 10
          done
          test "$verified" = 1 || { echo 'Live domains did not converge to exact current main Pages release'; exit 1; }

          jq -n \
            --arg source_sha "$pages_source" --arg build_fingerprint "$pages_build" --arg runtime_fingerprint "$pages_runtime" \
            --slurpfile apex_domain "/tmp/domain-$APEX.json" --slurpfile www_domain "/tmp/domain-$WWW.json" \
            --slurpfile dns /tmp/final-web-dns.json \
            '{status:"success",source_sha:$source_sha,build_fingerprint:$build_fingerprint,runtime_fingerprint:$runtime_fingerprint,domains:[$apex_domain[0],$www_domain[0]],dns:$dns[0],www_redirects_to_apex:true,email_dns_preserved:true,verified_at:(now|todateiso8601)}' \
            > /tmp/cloudflare-final-certification.json

          {
            echo '## Cloudflare final custom-domain certification'
            echo "- Apex: Active, SSL validated, HTTP 200"
            echo "- www: Active and redirects to apex"
            echo "- DNS: both proxied CNAMEs target \`$PAGES_HOST\`"
            echo "- Exact current main: \`$pages_source\`"
            echo "- Owner Supabase identity: verified"
            echo "- MX/SPF/Google verification records: preserved"
            echo 'No mutation was performed by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final certification
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-final-custom-domain-certification
          path: /tmp/cloudflare-final-certification.json
          retention-days: 14
