name: Final sync mobile performance branch

on:
  push:
    branches: [perf/mobile-buyer-routes-20260716]
    paths:
      - ".github/workflows/final-sync-mobile-perf-20260716.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/mobile-buyer-routes-20260716
          fetch-depth: 0
      - name: Merge latest main and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          rm .github/workflows/final-sync-mobile-perf-20260716.yml
          git add -A
          git commit -m "chore: remove final performance sync workflow"
          git push origin HEAD:perf/mobile-buyer-routes-20260716
