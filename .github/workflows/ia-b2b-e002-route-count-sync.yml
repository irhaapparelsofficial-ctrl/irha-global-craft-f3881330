name: IA-B2B-E002 Route Count Sync

on:
  push:
    branches:
      - feat/ia-b2b-e002-buyer-confidence
    paths:
      - .github/workflows/ia-b2b-e002-route-count-sync.yml

permissions:
  contents: write

jobs:
  sync-route-invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout focused branch
        uses: actions/checkout@v4
        with:
          ref: feat/ia-b2b-e002-buyer-confidence
          fetch-depth: 0

      - name: Align exact static-route invariants
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "scripts/enrich-generic-static-route-shells.mjs": [
                  ("canonicalPaths.size !== 407", "canonicalPaths.size !== 411"),
                  ("Expected 407 canonical sitemap routes", "Expected 411 canonical sitemap routes"),
              ],
              "scripts/finalize-image-seo.mjs": [
                  ("EXPECTED_SITEMAP_URLS = 407", "EXPECTED_SITEMAP_URLS = 411"),
              ],
              "scripts/verify-built-crawler-shell.mjs": [
                  ("sitemapCount === 407", "sitemapCount === 411"),
                  ("Expected 407 sitemap URLs", "Expected 411 sitemap URLs"),
                  ("htmlFiles.length >= 407", "htmlFiles.length >= 411"),
                  ("Expected at least 407 rendered HTML files", "Expected at least 411 rendered HTML files"),
              ],
              "scripts/verify-built-image-seo.mjs": [
                  ("EXPECTED_SITEMAP_URLS = 407", "EXPECTED_SITEMAP_URLS = 411"),
                  ("EXPECTED_HTML = 413", "EXPECTED_HTML = 417"),
              ],
              "scripts/verify-route-content-fidelity.mjs": [
                  ("EXPECTED_SITEMAP = 407", "EXPECTED_SITEMAP = 411"),
              ],
              "src/test/routeContentStaticFidelity.test.ts": [
                  ("407", "411"),
                  ("413", "417"),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              original = path.read_text(encoding="utf-8")
              updated = original
              for old, new in pairs:
                  if old not in updated:
                      raise SystemExit(f"Missing expected invariant in {filename}: {old}")
                  updated = updated.replace(old, new)
              path.write_text(updated, encoding="utf-8")
          PY

      - name: Commit focused invariant update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/enrich-generic-static-route-shells.mjs \
            scripts/finalize-image-seo.mjs \
            scripts/verify-built-crawler-shell.mjs \
            scripts/verify-built-image-seo.mjs \
            scripts/verify-route-content-fidelity.mjs \
            src/test/routeContentStaticFidelity.test.ts
          git diff --cached --check
          git commit -m "test(routes): align exact inventory with buyer-confidence pages"
          git push origin HEAD:feat/ia-b2b-e002-buyer-confidence
