name: Live exact release audit 813dc823

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE_SHA: 813dc8235c2c8d6e74a1e2f5aede0c7fb625f2d0
      LIVE_ORIGIN: https://irhaapparels.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for exact live source
        shell: bash
        run: |
          set -euo pipefail
          matched=0
          for attempt in $(seq 1 90); do
            cache_bust="${EXPECTED_SOURCE_SHA::12}-$attempt-$RANDOM"
            if curl -fsSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' "$LIVE_ORIGIN/build.json?audit=$cache_bust" -o live-build.json \
              && jq -e --arg sha "$EXPECTED_SOURCE_SHA" '.source_commit==$sha and .source_identity_state=="verified"' live-build.json >/dev/null; then
              matched=1
              echo "Exact live source verified on attempt $attempt"
              break
            fi
            echo "Production not converged yet ($attempt/90)"
            sleep 10
          done
          test "$matched" = "1"
          cat live-build.json
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Capture live iPhone evidence
        shell: bash
        continue-on-error: true
        run: |
          cat > capture-live-audit.mjs <<'EOF'
          import { chromium, devices } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const origin = process.env.LIVE_ORIGIN;
          const expectedSource = process.env.EXPECTED_SOURCE_SHA;
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ ...devices['iPhone 13'], locale: 'en-GB' });
          const page = await context.newPage();
          const consoleErrors = [];
          page.on('console', (message) => {
            if (message.type() === 'error') consoleErrors.push(message.text());
          });

          async function open(path) {
            const response = await page.goto(`${origin}${path}${path.includes('?') ? '&' : '?'}live_audit=${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 90000 });
            await page.locator('body').waitFor({ state: 'visible', timeout: 30000 });
            await page.waitForTimeout(1800);
            return response;
          }

          const homeResponse = await open('/');
          await page.screenshot({ path: 'live-813-viewport.png' });

          const totalHeight = await page.evaluate(() => document.body.scrollHeight);
          for (let y = 0; y <= totalHeight; y += 520) {
            await page.evaluate((nextY) => window.scrollTo(0, nextY), y);
            await page.waitForTimeout(260);
          }
          await page.evaluate(() => window.scrollTo(0, 0));
          await page.waitForTimeout(1200);
          await page.screenshot({ path: 'live-813-full.png', fullPage: true });

          const routeResults = {};
          for (const path of ['/products', '/inquiry', '/catalogue']) {
            const response = await open(path);
            routeResults[path] = { status: response?.status(), finalUrl: page.url(), title: await page.title() };
          }

          await open('/');
          const info = {
            expectedSource,
            home: { status: homeResponse?.status(), finalUrl: page.url(), title: await page.title() },
            h1: await page.locator('h1').first().textContent(),
            logoVisible: await page.locator('img[src="/irha-brand-mark.svg"]').first().isVisible().catch(() => false),
            requestQuoteVisible: await page.locator('a[href^="/inquiry"]').filter({ hasText: /request quote/i }).first().isVisible().catch(() => false),
            cookieVisible: await page.getByText('Optional cookies', { exact: true }).isVisible().catch(() => false),
            viewport: await page.viewportSize(),
            routeResults,
            consoleErrors: consoleErrors.slice(0, 20),
          };
          info.failures = [];
          if (info.home.status !== 200) info.failures.push(`home status ${info.home.status}`);
          if (!info.logoVisible) info.failures.push('official logo not visible');
          if (!info.requestQuoteVisible) info.failures.push('request quote action not visible');
          for (const [path, result] of Object.entries(routeResults)) {
            if (result.status !== 200) info.failures.push(`${path} status ${result.status}`);
          }
          await writeFile('live-813-view.json', JSON.stringify(info, null, 2));
          console.log(JSON.stringify(info, null, 2));
          await browser.close();
          if (info.failures.length) process.exitCode = 1;
          EOF
          node capture-live-audit.mjs
      - name: Upload exact live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-813dc823-audit
          path: |
            live-build.json
            live-813-view.json
            live-813-viewport.png
            live-813-full.png
          if-no-files-found: warn
          retention-days: 2
