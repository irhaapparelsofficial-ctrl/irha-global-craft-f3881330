name: Verify live mobile performance
# Verification revision: 6

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-live-mobile-performance-20260715.yml"
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  lighthouse:
    if: >-
      github.event_name == 'push' ||
      (github.event.issue.number == 375 &&
       github.event.comment.body == '/verify-mobile-performance' &&
       github.event.comment.user.login == 'irhaapparelsofficial-ctrl')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ORIGIN: https://irhaapparels.com
      BUYER_PATH: /de/bekleidungshersteller-deutschland
    steps:
      - name: Collect raw canonical and slash responses
        shell: bash
        run: |
          set -euo pipefail
          cache_bust="${GITHUB_SHA::12}-$RANDOM"
          curl -sS --connect-timeout 10 --max-time 40 \
            -D /tmp/canonical.headers \
            -o /tmp/canonical.html \
            "$ORIGIN$BUYER_PATH?static_verify=$cache_bust"
          curl -sS --connect-timeout 10 --max-time 40 \
            -D /tmp/slash.headers \
            -o /tmp/slash.html \
            "$ORIGIN$BUYER_PATH/?static_verify=$cache_bust"

          node <<'NODE'
          const fs = require('fs');
          const origin = process.env.ORIGIN;
          const path = process.env.BUYER_PATH;
          const canonicalHeaders = fs.readFileSync('/tmp/canonical.headers', 'utf8');
          const slashHeaders = fs.readFileSync('/tmp/slash.headers', 'utf8');
          const canonicalHtml = fs.readFileSync('/tmp/canonical.html', 'utf8');
          const slashHtml = fs.readFileSync('/tmp/slash.html', 'utf8');

          const statusChain = (headers) => [...headers.matchAll(/^HTTP\/\S+\s+(\d+)/gmi)].map((m) => Number(m[1]));
          const header = (headers, name) => {
            const re = new RegExp(`^${name}:\\s*(.+)$`, 'gmi');
            const matches = [...headers.matchAll(re)];
            return (matches.at(-1)?.[1] || '').trim();
          };
          const bool = (value) => value ? 'yes' : 'no';
          const canonicalStatuses = statusChain(canonicalHeaders);
          const slashStatuses = statusChain(slashHeaders);
          const canonicalStatus = canonicalStatuses.at(-1) || 0;
          const slashStatus = slashStatuses.at(-1) || 0;
          const diagnostic = [
            '## Raw static Germany route diagnostic',
            '',
            `- Tested canonical: \`${origin}${path}\``,
            `- Canonical status chain: \`${canonicalStatuses.join(' → ') || 'none'}\``,
            `- Canonical Location: \`${header(canonicalHeaders, 'location') || 'none'}\``,
            `- Canonical Content-Location: \`${header(canonicalHeaders, 'content-location') || 'none'}\``,
            `- Canonical static marker: \`${header(canonicalHeaders, 'x-irha-static-buyer-shell') || 'none'}\``,
            `- Canonical route marker: \`${header(canonicalHeaders, 'x-irha-route-status') || 'none'}\``,
            `- Canonical content type: \`${header(canonicalHeaders, 'content-type') || 'none'}\``,
            `- Canonical HTML bytes: ${Buffer.byteLength(canonicalHtml)}`,
            `- Canonical static HTML marker present: ${bool(canonicalHtml.includes('data-irha-static-buyer-shell="true"'))}`,
            `- Canonical German H1 present: ${bool(canonicalHtml.includes('Bekleidungshersteller für deutsche B2B-Einkäufer'))}`,
            `- Canonical application script present: ${bool(/<script\b(?![^>]*type=["']application\/ld\+json["'])/i.test(canonicalHtml))}`,
            '',
            `- Tested slash duplicate: \`${origin}${path}/\``,
            `- Slash status chain: \`${slashStatuses.join(' → ') || 'none'}\``,
            `- Slash Location: \`${header(slashHeaders, 'location') || 'none'}\``,
            `- Slash canonical marker: \`${header(slashHeaders, 'x-irha-canonical-redirect') || 'none'}\``,
            `- Slash HTML bytes: ${Buffer.byteLength(slashHtml)}`,
            '',
          ].join('\n');
          fs.writeFileSync('/tmp/http-diagnostic.md', diagnostic);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, diagnostic);
          fs.writeFileSync('/tmp/http-values.json', JSON.stringify({
            canonicalStatus,
            slashStatus,
            slashLocation: header(slashHeaders, 'location'),
            staticMarker: header(canonicalHeaders, 'x-irha-static-buyer-shell'),
          }));
          NODE

      - name: Record raw diagnostic before assertions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 375 --repo "$GITHUB_REPOSITORY" --body-file /tmp/http-diagnostic.md

      - name: Assert canonical HTTP and runtime-free HTML contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const origin = process.env.ORIGIN;
          const path = process.env.BUYER_PATH;
          const values = JSON.parse(fs.readFileSync('/tmp/http-values.json', 'utf8'));
          const html = fs.readFileSync('/tmp/canonical.html', 'utf8');

          if (values.canonicalStatus !== 200) throw new Error(`Canonical buyer URL returned ${values.canonicalStatus}, expected 200`);
          if (values.slashStatus !== 301) throw new Error(`Slash duplicate returned ${values.slashStatus}, expected 301`);
          if (!values.slashLocation.startsWith(`${origin}${path}?`)) throw new Error(`Unexpected slash redirect: ${values.slashLocation}`);
          if (values.staticMarker !== 'runtime-free') throw new Error(`Missing static buyer marker: ${values.staticMarker}`);
          if (!html.includes('data-irha-static-buyer-shell="true"')) throw new Error('Static buyer HTML marker missing');
          if (!html.includes(`<link rel="canonical" href="${origin}${path}"`)) throw new Error('Canonical tag missing or incorrect');
          if (!html.includes('Bekleidungshersteller für deutsche B2B-Einkäufer')) throw new Error('German buyer H1 missing');
          if (!html.includes('application/ld+json')) throw new Error('JSON-LD missing');
          const withoutJsonLd = html.replace(/<script\b[^>]*type=["']application\/ld\+json["'][^>]*>[\s\S]*?<\/script>/gi, '');
          if (/<script\b/i.test(withoutJsonLd)) throw new Error('Application JavaScript leaked into static buyer HTML');
          if (/rel=["'](?:stylesheet|modulepreload)["']/i.test(html)) throw new Error('Application CSS/module preload leaked into static buyer HTML');

          const proof = [
            '## Static Germany buyer-page HTTP proof',
            '',
            '- Canonical URL: HTTP 200',
            '- Static response marker: `runtime-free`',
            '- Trailing-slash duplicate: HTTP 301',
            `- Slash redirect target: \`${values.slashLocation}\``,
            `- HTML transfer: ${Buffer.byteLength(html)} bytes`,
            '- Application JavaScript: 0',
            '- Application stylesheets/module preloads: 0',
            '- Canonical, German H1 and JSON-LD: present',
            '',
          ].join('\n');
          fs.writeFileSync('/tmp/static-proof.md', proof);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, proof);
          NODE

      - name: Run mobile Lighthouse against canonical static page
        shell: bash
        run: |
          set -euo pipefail
          npx --yes lighthouse@12.8.2 \
            "$ORIGIN$BUYER_PATH?lh_verify=${GITHUB_SHA::12}" \
            --output=json \
            --output-path=/tmp/lighthouse.json \
            --only-categories=performance,seo,accessibility,best-practices \
            --form-factor=mobile \
            --screenEmulation.mobile=true \
            --throttling-method=simulate \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"

          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/lighthouse.json', 'utf8'));
          const audits = report.audits || {};
          const score = (id) => Math.round((report.categories[id]?.score ?? 0) * 100);
          const metric = (id) => audits[id]?.displayValue ?? 'n/a';
          const waste = (id) => Math.round((audits[id]?.details?.overallSavingsBytes || 0) / 1024);
          const summary = [
            '## Live mobile Lighthouse — runtime-free Germany page',
            '',
            `Release tested: \`${report.finalDisplayedUrl}\``,
            '',
            `- Performance: ${score('performance')}`,
            `- Accessibility: ${score('accessibility')}`,
            `- Best Practices: ${score('best-practices')}`,
            `- SEO: ${score('seo')}`,
            `- FCP: ${metric('first-contentful-paint')}`,
            `- LCP: ${metric('largest-contentful-paint')}`,
            `- TBT: ${metric('total-blocking-time')}`,
            `- CLS: ${metric('cumulative-layout-shift')}`,
            `- Speed Index: ${metric('speed-index')}`,
            `- TTFB: ${metric('server-response-time')}`,
            `- Main-thread work: ${metric('mainthread-work-breakdown')}`,
            `- JavaScript execution: ${metric('bootup-time')}`,
            `- Unused JS savings: ${waste('unused-javascript')} KiB`,
            `- Unused CSS savings: ${waste('unused-css-rules')} KiB`,
            `- Total transfer: ${metric('total-byte-weight')}`,
            '',
          ].join('\n');
          fs.writeFileSync('/tmp/lighthouse-summary.md', summary);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE

      - name: Upload Lighthouse JSON
        uses: actions/upload-artifact@v4
        with:
          name: runtime-free-live-mobile-lighthouse
          path: /tmp/lighthouse.json
          retention-days: 3

      - name: Record verified evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat /tmp/static-proof.md /tmp/lighthouse-summary.md > /tmp/combined-evidence.md
          gh issue comment 375 --repo "$GITHUB_REPOSITORY" --body-file /tmp/combined-evidence.md
