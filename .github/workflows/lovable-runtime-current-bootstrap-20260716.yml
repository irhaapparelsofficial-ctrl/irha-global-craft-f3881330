name: Current-main Lovable runtime lock bootstrap

on:
  push:
    branches: [fix/lovable-free-runtime-current-20260716]
    paths:
      - ".github/workflows/lovable-runtime-current-bootstrap-20260716.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lovable-free-runtime-current-20260716
          fetch-depth: 0
      - name: Apply default-deny runtime gate without changing scheduler architecture
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          helper = '''\nfunction irhaLovableRuntimeKey(): string | undefined {\n  if (Deno.env.get("IRHA_ENABLE_LOVABLE_RUNTIME") !== "true") return undefined;\n  return Deno.env.get("LOVABLE_API_KEY") || undefined;\n}\n'''

          changed = []
          for path in sorted(Path('supabase/functions').glob('*/index.*')):
              if path.suffix not in {'.ts', '.js'}:
                  continue
              text = path.read_text()
              if 'Deno.env.get("LOVABLE_API_KEY")' not in text and "Deno.env.get('LOVABLE_API_KEY')" not in text:
                  continue
              if 'function irhaLovableRuntimeKey()' in text:
                  continue
              text = text.replace('Deno.env.get("LOVABLE_API_KEY")', 'irhaLovableRuntimeKey()')
              text = text.replace("Deno.env.get('LOVABLE_API_KEY')", 'irhaLovableRuntimeKey()')
              imports = list(re.finditer(r'^import .*?;\s*$', text, flags=re.M))
              if imports:
                  pos = imports[-1].end()
                  text = text[:pos] + helper + text[pos:]
              else:
                  text = helper.lstrip() + '\n' + text
              path.write_text(text)
              changed.append(str(path))

          exact_replacements = {
              Path('src/lib/__checks__/gscDailySitemapAutomation.test.ts'): [
                  ('gsc: Boolean(Deno.env.get("LOVABLE_API_KEY"))', 'gsc: Boolean(irhaLovableRuntimeKey())'),
              ],
              Path('src/lib/__checks__/secureSitemapScheduler.test.ts'): [
                  ('expect(edge).toContain(\'Deno.env.get("LOVABLE_API_KEY")\');', 'expect(edge).toContain("irhaLovableRuntimeKey()");\n    expect(edge).toContain("IRHA_ENABLE_LOVABLE_RUNTIME");'),
              ],
              Path('src/test/publicPlatformContracts.test.ts'): [
                  ('expect(chatFunction).toContain("ai.gateway.lovable.dev/v1/chat/completions");', 'expect(chatFunction).toContain("ai.gateway.lovable.dev/v1/chat/completions");\n    expect(chatFunction).toContain("IRHA_ENABLE_LOVABLE_RUNTIME");'),
              ],
          }
          for path, replacements in exact_replacements.items():
              if not path.exists():
                  continue
              text = path.read_text()
              for old, new in replacements:
                  if old in text and new not in text:
                      text = text.replace(old, new, 1)
              path.write_text(text)

          Path('src/lib/__checks__/lovableRuntimeDefaultDeny.test.ts').write_text('''import { readdirSync, readFileSync, statSync } from "node:fs";\nimport { join } from "node:path";\nimport { describe, expect, it } from "vitest";\n\nfunction filesUnder(root: string): string[] {\n  return readdirSync(root).flatMap((name) => {\n    const path = join(root, name);\n    return statSync(path).isDirectory() ? filesUnder(path) : [path];\n  });\n}\n\ndescribe("Lovable runtime is explicit opt-in only", () => {\n  it("gates every Edge Function key read behind a new default-deny flag", () => {\n    const sources = filesUnder("supabase/functions").filter((path) => /\\.(ts|js)$/.test(path));\n    const consumers = sources.filter((path) => readFileSync(path, "utf8").includes("LOVABLE_API_KEY"));\n    expect(consumers.length).toBeGreaterThan(0);\n\n    for (const path of consumers) {\n      const source = readFileSync(path, "utf8");\n      const directReads = source.match(/Deno\\.env\\.get\\(["']LOVABLE_API_KEY["']\\)/g) ?? [];\n      expect(source, path).toContain("IRHA_ENABLE_LOVABLE_RUNTIME");\n      expect(source, path).toContain("function irhaLovableRuntimeKey()");\n      expect(directReads.length, path).toBe(1);\n      expect(source, path).toContain('Deno.env.get("IRHA_ENABLE_LOVABLE_RUNTIME") !== "true"');\n    }\n  });\n\n  it("keeps sitemap queue/finalizer architecture and locks implementation RPCs", () => {\n    const scheduler = readFileSync("supabase/functions/scheduled-sitemap-submit/index.ts", "utf8");\n    const migration = readFileSync("supabase/migrations/20260716036000_lock_sitemap_scheduler_rpcs.sql", "utf8");\n    expect(scheduler).toContain("SCHEDULER_TOKEN_HASH");\n    expect(scheduler).toContain("constantTimeEqual");\n    expect(scheduler).toContain("IRHA_ENABLE_LOVABLE_RUNTIME");\n    expect(migration).toContain("FROM anon, authenticated");\n    expect(migration).toContain("TO service_role");\n    expect(migration).toContain("queue_sitemap_submission");\n    expect(migration).toContain("finalize_sitemap_submission");\n  });\n});\n''')

          Path('supabase/migrations/20260716036000_lock_sitemap_scheduler_rpcs.sql').write_text('''-- Sitemap scheduler SECURITY DEFINER functions are internal implementation details.\n-- The Vault-backed queue/finalizer and protected Edge Function remain intact,\n-- while browsers and generic signed-in sessions lose direct execution rights.\n\nBEGIN;\n\nREVOKE EXECUTE ON FUNCTION public.claim_sitemap_submission(text)\n  FROM anon, authenticated;\nREVOKE EXECUTE ON FUNCTION public.record_sitemap_submission_result(text, boolean, integer, text)\n  FROM anon, authenticated;\nREVOKE EXECUTE ON FUNCTION public.queue_sitemap_submission(text, boolean)\n  FROM anon, authenticated;\nREVOKE EXECUTE ON FUNCTION public.finalize_sitemap_submission()\n  FROM anon, authenticated;\n\nGRANT EXECUTE ON FUNCTION public.claim_sitemap_submission(text) TO service_role;\nGRANT EXECUTE ON FUNCTION public.record_sitemap_submission_result(text, boolean, integer, text) TO service_role;\nGRANT EXECUTE ON FUNCTION public.queue_sitemap_submission(text, boolean) TO service_role;\nGRANT EXECUTE ON FUNCTION public.finalize_sitemap_submission() TO service_role;\n\nCOMMIT;\n''')

          Path('docs/LOVABLE_RUNTIME_LOCK_CURRENT_20260716.md').write_text(
              '# Lovable runtime default-deny lock — current main — 2026-07-16\n\n'
              '- Existing Edge Function provider fallbacks remain intact.\n'
              '- `LOVABLE_API_KEY` resolves only when `IRHA_ENABLE_LOVABLE_RUNTIME=true` is explicitly added.\n'
              '- The new opt-in flag is absent from normal production configuration.\n'
              '- Sitemap Vault token, queue and finalizer architecture is preserved.\n'
              '- All scheduler SECURITY DEFINER RPCs become service-role-only.\n\n'
              f'Patched function sources: {len(changed)}\n'
          )

          workflow = Path('.github/workflows/lovable-runtime-current-bootstrap-20260716.yml')
          workflow.unlink()
          PY
      - name: Validate source contracts
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/lovable-runtime-current-bootstrap-20260716.yml
          test -f src/lib/__checks__/lovableRuntimeDefaultDeny.test.ts
          test -f supabase/migrations/20260716036000_lock_sitemap_scheduler_rpcs.sql
          grep -RIl 'IRHA_ENABLE_LOVABLE_RUNTIME' supabase/functions | grep -q .
      - name: Commit lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security(runtime): make Lovable providers default deny"
          git push origin HEAD:fix/lovable-free-runtime-current-20260716
