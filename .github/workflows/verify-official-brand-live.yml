name: Verify Official Brand Live

on:
  workflow_run:
    workflows: ["IndexNow After Verified Production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: verify-official-brand-live-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  verify-brand:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Resolve exact search-verified production SHA
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'success' }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name || github.repository }}
          DISPATCH_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          origin="https://irha-apparels.pages.dev"
          source_sha=""

          for attempt in $(seq 1 18); do
            cache_bust="brand-source-$GITHUB_RUN_ID-$attempt-$RANDOM"
            status="$(curl -sSL --connect-timeout 10 --max-time 40 \
              -H 'Cache-Control: no-cache' \
              -o /tmp/build.json -w '%{http_code}' \
              "$origin/build.json?brand_check=$cache_bust" || true)"

            if [ "$status" = "200" ] \
              && jq -e '.source_identity_state == "verified" and (.source_commit | type == "string" and test("^[0-9a-f]{40}$"))' /tmp/build.json >/dev/null 2>&1; then
              source_sha="$(jq -r '.source_commit' /tmp/build.json)"
              break
            fi

            echo "Production identity not ready: status=$status attempt=$attempt/18"
            sleep 10
          done

          latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          relevant=false
          exact_search_success=0

          if [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              if [ "$source_sha" = "$latest_main" ] && [ "$source_sha" = "$DISPATCH_SOURCE_SHA" ]; then
                status_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$source_sha/status")"
                exact_search_success="$(printf '%s' "$status_json" | jq '[.statuses[] | select(.context == "Irha Search Discovery" and .state == "success")] | length')"
                [ "$exact_search_success" -gt 0 ] && relevant=true
              fi
            else
              expected_target="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID"
              status_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$source_sha/status")"
              exact_search_success="$(printf '%s' "$status_json" | jq \
                --arg target "$expected_target" \
                '[.statuses[] | select(.context == "Irha Search Discovery" and .state == "success" and .target_url == $target)] | length')"
              if [ "$UPSTREAM_CONCLUSION" = "success" ] \
                && [ "$UPSTREAM_REPOSITORY" = "$GITHUB_REPOSITORY" ] \
                && [ "$source_sha" = "$latest_main" ] \
                && [ "$exact_search_success" -gt 0 ]; then
                relevant=true
              fi
            fi
          fi

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "search_status_matches=$exact_search_success" >> "$GITHUB_OUTPUT"

          if [ "$relevant" = "true" ]; then
            echo "Resolved exact Search Discovery-verified production source: $source_sha"
          else
            echo "Brand verification skipped safely: live_source=${source_sha:-missing} current_main=$latest_main search_status=$exact_search_success"
          fi

      - name: Record ignored non-release completion
        if: steps.source.outputs.relevant != 'true'
        shell: bash
        run: |
          {
            echo "## Brand Live"
            echo "- Live source: \`${{ steps.source.outputs.source_sha || 'missing' }}\`"
            echo "- Exact Search Discovery status matches: \`${{ steps.source.outputs.search_status_matches }}\`"
            echo "- Verification attempted: \`false\`"
            echo "- Result: upstream completion was not the exact search-verified current-main release"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish pending live-brand status
        if: steps.source.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state=pending \
            -f context="Irha Brand Live" \
            -f description="Checking official brand and buyer routes on production" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null

      - name: Verify official logo and favicon on production
        if: steps.source.outputs.relevant == 'true'
        id: verify
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          expected_master="32eee79bc7038c53cff36bab46193c77e78702d7eef7883e8f94b145999a1b87"
          pages_origin="https://irha-apparels.pages.dev"
          apex_origin="https://irhaapparels.com"

          cloudflare_challenge() {
            headers="$1"
            body="$2"
            if grep -Fqi 'cf-mitigated: challenge' "$headers" 2>/dev/null; then return 0; fi
            if grep -Fqi 'server: cloudflare' "$headers" 2>/dev/null && grep -Fqi 'Just a moment...' "$body" 2>/dev/null; then return 0; fi
            return 1
          }

          png_dimensions() {
            python3 -c 'import struct,sys; d=open(sys.argv[1],"rb").read(24); assert d[:8] == bytes.fromhex("89504e470d0a1a0a"); assert struct.unpack(">II", d[16:24]) == (int(sys.argv[2]), int(sys.argv[3]))' "$1" "$2" "$3"
          }

          verify_origin() {
            origin="$1"
            label="$2"
            allow_challenge="$3"
            ready=false

            for attempt in $(seq 1 18); do
              cache_bust="${SOURCE_SHA::12}-$label-$attempt-$RANDOM"
              prefix="/tmp/brand-$label"
              master_status="$(curl -sS --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' -D "$prefix-master.headers" -o "$prefix-master.png" -w '%{http_code}' "$origin/brand/irha-apparels-official-master.png?brand_check=$cache_bust" || true)"
              if [ "$master_status" = "403" ] && cloudflare_challenge "$prefix-master.headers" "$prefix-master.png"; then
                if [ "$allow_challenge" = "true" ]; then
                  echo "::warning::GitHub-hosted $label brand observer received a verified Cloudflare challenge; independent public verification remains required."
                  echo "${label}_challenged=true" >> "$GITHUB_OUTPUT"
                  return 0
                fi
              fi

              runtime_status="$(curl -sSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' -o "$prefix-runtime.png" -w '%{http_code}' "$origin/brand/irha-apparels-official-runtime-512.png?brand_check=$cache_bust" || true)"
              favicon_status="$(curl -sSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' -o "$prefix-favicon.svg" -w '%{http_code}' "$origin/favicon.svg?brand_check=$cache_bust" || true)"
              legacy_status="$(curl -sSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' -D "$prefix-favicon-ico.headers" -o "$prefix-favicon.ico" -w '%{http_code}' "$origin/favicon.ico?brand_check=$cache_bust" || true)"
              icon192_status="$(curl -sSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' -o "$prefix-icon192.png" -w '%{http_code}' "$origin/icon-192x192.png?brand_check=$cache_bust" || true)"
              icon512_status="$(curl -sSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' -o "$prefix-icon512.png" -w '%{http_code}' "$origin/icon-512x512.png?brand_check=$cache_bust" || true)"
              apple_status="$(curl -sSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' -o "$prefix-apple.png" -w '%{http_code}' "$origin/apple-touch-icon.png?brand_check=$cache_bust" || true)"
              manifest_status="$(curl -sSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' -o "$prefix-manifest.json" -w '%{http_code}' "$origin/manifest.webmanifest?brand_check=$cache_bust" || true)"
              provenance_status="$(curl -sSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' -o "$prefix-provenance.json" -w '%{http_code}' "$origin/brand/brand-master.json?brand_check=$cache_bust" || true)"
              home_status="$(curl -sSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' -o "$prefix-home.html" -w '%{http_code}' "$origin/?brand_check=$cache_bust" || true)"
              master_hash="$(sha256sum "$prefix-master.png" 2>/dev/null | awk '{print $1}' || true)"
              favicon_source="$(awk 'BEGIN{IGNORECASE=1} /^x-irha-favicon-source:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print}' "$prefix-favicon-ico.headers" | tail -n 1)"

              echo "Brand proof $label attempt $attempt/18: master=$master_status/$master_hash runtime=$runtime_status favicon=$favicon_status legacy=$legacy_status 192=$icon192_status 512=$icon512_status apple=$apple_status manifest=$manifest_status provenance=$provenance_status home=$home_status"

              if [ "$master_status" = "200" ] && [ "$master_hash" = "$expected_master" ] \
                && [ "$runtime_status" = "200" ] && [ "$favicon_status" = "200" ] && [ "$legacy_status" = "200" ] \
                && [ "$icon192_status" = "200" ] && [ "$icon512_status" = "200" ] && [ "$apple_status" = "200" ] \
                && [ "$manifest_status" = "200" ] && [ "$provenance_status" = "200" ] && [ "$home_status" = "200" ] \
                && png_dimensions "$prefix-master.png" 1024 1024 \
                && png_dimensions "$prefix-runtime.png" 512 512 \
                && png_dimensions "$prefix-icon192.png" 192 192 \
                && png_dimensions "$prefix-icon512.png" 512 512 \
                && png_dimensions "$prefix-apple.png" 180 180 \
                && grep -Fq "data-master-sha256=\"$expected_master\"" "$prefix-favicon.svg" \
                && grep -Fq 'data:image/png;base64,' "$prefix-favicon.svg" \
                && grep -Fq "$expected_master" "$prefix-favicon.ico" \
                && jq -e --arg sha "$expected_master" '.master.sha256 == $sha and .master.width == 1024 and .master.height == 1024 and .generation.crop == false and .generation.stretch == false' "$prefix-provenance.json" >/dev/null \
                && jq -e '.icons | any(.src | startswith("/icon-192x192.png")) and any(.src | startswith("/icon-512x512.png"))' "$prefix-manifest.json" >/dev/null \
                && grep -Fq '/brand/irha-apparels-official-runtime-512.png' "$prefix-home.html"; then
                if [ "$label" = "apex" ]; then
                  test -z "$favicon_source" || test "$favicon_source" = "official-owner-crest"
                fi
                ready=true
                echo "Exact owner-uploaded master and all normal brand derivatives verified at $label."
                break
              fi
              sleep 10
            done

            test "$ready" = "true" || {
              echo "::error title=Official Irha brand not verified::$label did not serve the exact owner-uploaded master and required derivatives."
              return 1
            }
          }

          verify_origin "$pages_origin" pages false
          verify_origin "$apex_origin" apex true

      - name: Verify canonical buyer routes on production
        if: steps.source.outputs.relevant == 'true'
        id: routes
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          origin="https://irhaapparels.com"
          ready=false

          for attempt in $(seq 1 18); do
            cache_bust="${SOURCE_SHA::12}-routes-$attempt-$RANDOM"
            manifest_status="$(curl -sSL --connect-timeout 10 --max-time 40 \
              -H 'Cache-Control: no-cache' \
              -o /tmp/catalog-route-manifest.json -w '%{http_code}' \
              "$origin/catalog-route-manifest.json?route_check=$cache_bust" || true)"
            manifest_ok=false
            valid_path=""
            if [ "$manifest_status" = "200" ] \
              && jq -e '.schemaVersion == 1 and .productCount == 254 and (.products | length) == 254' /tmp/catalog-route-manifest.json >/dev/null 2>&1; then
              valid_path="$(jq -r '.products[0].canonical_path // empty' /tmp/catalog-route-manifest.json)"
              if [[ "$valid_path" == /products/* ]]; then manifest_ok=true; fi
            fi

            valid_status="000"
            if [ "$manifest_ok" = "true" ]; then
              valid_status="$(curl -sS --connect-timeout 10 --max-time 40 \
                -H 'Cache-Control: no-cache' \
                -o /tmp/valid-product.html -w '%{http_code}' \
                "$origin$valid_path?route_check=$cache_bust" || true)"
            fi

            legacy_status="$(curl -sS --max-redirs 0 --connect-timeout 10 --max-time 40 \
              -H 'Cache-Control: no-cache' \
              -D /tmp/catalogue-headers.txt -o /dev/null -w '%{http_code}' \
              "$origin/catalogue?route_check=$cache_bust" || true)"
            legacy_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print}' /tmp/catalogue-headers.txt | tail -n 1)"

            missing_status="$(curl -sS --max-redirs 0 --connect-timeout 10 --max-time 40 \
              -H 'Cache-Control: no-cache' \
              -D /tmp/missing-headers.txt -o /tmp/missing.html -w '%{http_code}' \
              "$origin/products/not-a-real-irha-product-$cache_bust" || true)"
            missing_marker="$(awk 'BEGIN{IGNORECASE=1} /^x-irha-route-status:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print}' /tmp/missing-headers.txt | tail -n 1)"

            echo "Route proof attempt $attempt/18: manifest=$manifest_status valid=$valid_status legacy=$legacy_status location=${legacy_location:-none} missing=$missing_status marker=${missing_marker:-none}"

            if [ "$manifest_ok" = "true" ] \
              && [ "$valid_status" = "200" ] \
              && [ "$legacy_status" = "301" ] \
              && [[ "$legacy_location" == *"/products"* ]] \
              && [ "$missing_status" = "404" ] \
              && [ "$missing_marker" = "not-found" ]; then
              ready=true
              echo "Canonical product, legacy redirect and real missing-route 404 verified live."
              break
            fi

            sleep 10
          done

          test "$ready" = "true" || {
            echo "::error title=Buyer route verification failed::Production did not satisfy canonical 200, one-hop 301 and real 404 contracts."
            exit 1
          }

      - name: Publish final live-brand status
        if: always() && steps.source.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_SHA" ]; then
            echo "No verified production SHA was resolved; no commit status can be published."
            exit 0
          fi

          state=failure
          description="Official brand or buyer route verification failed"
          if [ "$JOB_STATUS" = "success" ]; then
            state=success
            description="Official brand and canonical buyer routes verified live"
          fi

          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state="$state" \
            -f context="Irha Brand Live" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null
