name: Verify Official Brand Live

on:
  workflow_run:
    workflows: ["Cloudflare Production Status"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: verify-official-brand-live-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  verify-brand:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Resolve exact deployed production SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          origin="https://irhaapparels.com"
          source_sha=""

          for attempt in $(seq 1 18); do
            cache_bust="brand-source-$GITHUB_RUN_ID-$attempt-$RANDOM"
            status="$(curl -sSL --connect-timeout 10 --max-time 40 \
              -H 'Cache-Control: no-cache' \
              -o /tmp/build.json -w '%{http_code}' \
              "$origin/build.json?brand_check=$cache_bust" || true)"

            if [ "$status" = "200" ] \
              && jq -e '.source_identity_state == "verified" and (.source_commit | type == "string" and test("^[0-9a-f]{40}$"))' /tmp/build.json >/dev/null 2>&1; then
              source_sha="$(jq -r '.source_commit' /tmp/build.json)"
              break
            fi

            echo "Production identity not ready: status=$status attempt=$attempt/18"
            sleep 10
          done

          test "$source_sha" != "" || {
            echo "::error title=Brand verification source unavailable::Production build.json did not expose a verified source SHA."
            exit 1
          }

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Resolved live production source: $source_sha"

      - name: Publish pending live-brand status
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state=pending \
            -f context="Irha Brand Live" \
            -f description="Checking official brand and buyer routes on production" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null

      - name: Verify official logo and favicon on production
        id: verify
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          origin="https://irhaapparels.com"
          ready=false

          for attempt in $(seq 1 18); do
            cache_bust="${SOURCE_SHA::12}-$attempt-$RANDOM"
            brand_status="$(curl -sSL --connect-timeout 10 --max-time 40 \
              -H 'Cache-Control: no-cache' \
              -o /tmp/irha-brand-mark.svg -w '%{http_code}' \
              "$origin/irha-brand-mark.svg?brand_check=$cache_bust" || true)"
            favicon_status="$(curl -sSL --connect-timeout 10 --max-time 40 \
              -H 'Cache-Control: no-cache' \
              -o /tmp/favicon.svg -w '%{http_code}' \
              "$origin/favicon.svg?brand_check=$cache_bust" || true)"
            legacy_status="$(curl -sS --connect-timeout 10 --max-time 40 \
              -H 'Cache-Control: no-cache' \
              -D /tmp/favicon-headers.txt \
              -o /tmp/favicon.ico -w '%{http_code}' \
              "$origin/favicon.ico?brand_check=$cache_bust" || true)"
            home_status="$(curl -sSL --connect-timeout 10 --max-time 40 \
              -H 'Cache-Control: no-cache' \
              -o /tmp/home.html -w '%{http_code}' \
              "$origin/?brand_check=$cache_bust" || true)"

            brand_hash="$(sha256sum /tmp/irha-brand-mark.svg 2>/dev/null | awk '{print $1}' || true)"
            favicon_hash="$(sha256sum /tmp/favicon.svg 2>/dev/null | awk '{print $1}' || true)"
            legacy_hash="$(sha256sum /tmp/favicon.ico 2>/dev/null | awk '{print $1}' || true)"
            favicon_source="$(awk 'BEGIN{IGNORECASE=1} /^x-irha-favicon-source:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print}' /tmp/favicon-headers.txt | tail -n 1)"

            echo "Brand proof attempt $attempt/18: brand=$brand_status favicon=$favicon_status legacy=$legacy_status home=$home_status source=${favicon_source:-none} hashes=$brand_hash/$favicon_hash/$legacy_hash"

            if [ "$brand_status" = "200" ] \
              && [ "$favicon_status" = "200" ] \
              && [ "$legacy_status" = "200" ] \
              && [ "$home_status" = "200" ] \
              && grep -Fq 'Official owner-supplied Irha Apparels Manufacturing Specialists logo' /tmp/irha-brand-mark.svg \
              && grep -Fq 'data:image/webp;base64,' /tmp/irha-brand-mark.svg \
              && grep -Fq 'Official Irha Apparels Manufacturing Specialists crest supplied by the owner' /tmp/favicon.svg \
              && grep -Fq 'data:image/webp;base64,' /tmp/favicon.svg \
              && ! grep -Fiq 'lovable' /tmp/favicon.svg \
              && grep -Fq 'Official Irha Apparels Manufacturing Specialists crest supplied by the owner' /tmp/favicon.ico \
              && grep -Fq 'data:image/webp;base64,' /tmp/favicon.ico \
              && ! grep -Fiq 'lovable' /tmp/favicon.ico \
              && grep -Fq 'href="/favicon.svg"' /tmp/home.html; then
              ready=true
              echo "Official Irha header logo and favicon content verified live."
              break
            fi

            sleep 10
          done

          test "$ready" = "true" || {
            echo "::error title=Official Irha brand not verified::Production did not serve the owner-supplied logo on all required favicon paths."
            echo "--- favicon headers ---"
            head -c 1000 /tmp/favicon-headers.txt 2>/dev/null || true
            echo
            echo "--- favicon.svg head ---"
            head -c 500 /tmp/favicon.svg 2>/dev/null || true
            echo
            echo "--- favicon.ico head ---"
            head -c 500 /tmp/favicon.ico 2>/dev/null || true
            echo
            exit 1
          }

      - name: Verify canonical buyer routes on production
        id: routes
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          origin="https://irhaapparels.com"
          ready=false

          for attempt in $(seq 1 18); do
            cache_bust="${SOURCE_SHA::12}-routes-$attempt-$RANDOM"
            manifest_status="$(curl -sSL --connect-timeout 10 --max-time 40 \
              -H 'Cache-Control: no-cache' \
              -o /tmp/catalog-route-manifest.json -w '%{http_code}' \
              "$origin/catalog-route-manifest.json?route_check=$cache_bust" || true)"
            manifest_ok=false
            valid_path=""
            if [ "$manifest_status" = "200" ] \
              && jq -e '.schemaVersion == 1 and .productCount == 254 and (.products | length) == 254' /tmp/catalog-route-manifest.json >/dev/null 2>&1; then
              valid_path="$(jq -r '.products[0].canonical_path // empty' /tmp/catalog-route-manifest.json)"
              if [[ "$valid_path" == /products/* ]]; then manifest_ok=true; fi
            fi

            valid_status="000"
            if [ "$manifest_ok" = "true" ]; then
              valid_status="$(curl -sS --connect-timeout 10 --max-time 40 \
                -H 'Cache-Control: no-cache' \
                -o /tmp/valid-product.html -w '%{http_code}' \
                "$origin$valid_path?route_check=$cache_bust" || true)"
            fi

            legacy_status="$(curl -sS --max-redirs 0 --connect-timeout 10 --max-time 40 \
              -H 'Cache-Control: no-cache' \
              -D /tmp/catalogue-headers.txt -o /dev/null -w '%{http_code}' \
              "$origin/catalogue?route_check=$cache_bust" || true)"
            legacy_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print}' /tmp/catalogue-headers.txt | tail -n 1)"

            missing_status="$(curl -sS --max-redirs 0 --connect-timeout 10 --max-time 40 \
              -H 'Cache-Control: no-cache' \
              -D /tmp/missing-headers.txt -o /tmp/missing.html -w '%{http_code}' \
              "$origin/products/not-a-real-irha-product-$cache_bust" || true)"
            missing_marker="$(awk 'BEGIN{IGNORECASE=1} /^x-irha-route-status:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print}' /tmp/missing-headers.txt | tail -n 1)"

            echo "Route proof attempt $attempt/18: manifest=$manifest_status valid=$valid_status legacy=$legacy_status location=${legacy_location:-none} missing=$missing_status marker=${missing_marker:-none}"

            if [ "$manifest_ok" = "true" ] \
              && [ "$valid_status" = "200" ] \
              && [ "$legacy_status" = "301" ] \
              && [[ "$legacy_location" == *"/products"* ]] \
              && [ "$missing_status" = "404" ] \
              && [ "$missing_marker" = "not-found" ]; then
              ready=true
              echo "Canonical product, legacy redirect and real missing-route 404 verified live."
              break
            fi

            sleep 10
          done

          test "$ready" = "true" || {
            echo "::error title=Buyer route verification failed::Production did not satisfy canonical 200, one-hop 301 and real 404 contracts."
            exit 1
          }

      - name: Publish final live-brand status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_SHA" ]; then
            echo "No verified production SHA was resolved; no commit status can be published."
            exit 0
          fi

          state=failure
          description="Official brand or buyer route verification failed"
          if [ "$JOB_STATUS" = "success" ]; then
            state=success
            description="Official brand and canonical buyer routes verified live"
          fi

          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state="$state" \
            -f context="Irha Brand Live" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null
