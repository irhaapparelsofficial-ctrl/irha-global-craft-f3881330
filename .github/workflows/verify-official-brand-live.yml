name: Verify Official Brand Live

on:
  workflow_run:
    workflows: ["IndexNow After Verified Production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: verify-official-brand-live-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  verify-brand:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Resolve exact search-verified production SHA
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'success' }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name || github.repository }}
          DISPATCH_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          origin="https://irha-apparels.pages.dev"
          source_sha=""

          exact_current_source() {
            local observed="$1"
            local current="$2"
            local expected_dispatch="${3:-}"
            [ "$observed" = "$current" ] || return 1
            [ -z "$expected_dispatch" ] || [ "$observed" = "$expected_dispatch" ]
          }

          for attempt in $(seq 1 18); do
            cache_bust="brand-source-$GITHUB_RUN_ID-$attempt-$RANDOM"
            status="$(curl -sSL --connect-timeout 10 --max-time 40 \
              -H 'Cache-Control: no-cache' \
              -o /tmp/build.json -w '%{http_code}' \
              "$origin/build.json?brand_check=$cache_bust" || true)"

            if [ "$status" = "200" ] \
              && jq -e '.source_branch == "main"
                and .source_identity_state == "verified"
                and .expected_origin == "https://irhaapparels.com"
                and (.source_commit | type == "string" and test("^[0-9a-f]{40}$"))
                and (.build_fingerprint | type == "string" and test("^[0-9a-f]{64}$"))' \
                /tmp/build.json >/dev/null 2>&1; then
              source_sha="$(jq -r '.source_commit' /tmp/build.json)"
              break
            fi

            echo "Production identity not ready: status=$status attempt=$attempt/18"
            sleep 10
          done

          latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          relevant=false
          exact_search_success=0

          if [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              if exact_current_source "$source_sha" "$latest_main" "$DISPATCH_SOURCE_SHA"; then
                status_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$source_sha/status")"
                exact_search_success="$(printf '%s' "$status_json" | jq '[.statuses[] | select(.context == "Irha Search Discovery" and .state == "success")] | length')"
                [ "$exact_search_success" -gt 0 ] && relevant=true
              fi
            else
              expected_target="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID"
              status_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$source_sha/status")"
              exact_search_success="$(printf '%s' "$status_json" | jq \
                --arg target "$expected_target" \
                '[.statuses[] | select(.context == "Irha Search Discovery" and .state == "success" and .target_url == $target)] | length')"
              if [ "$UPSTREAM_CONCLUSION" = "success" ] \
                && [ "$UPSTREAM_REPOSITORY" = "$GITHUB_REPOSITORY" ] \
                && exact_current_source "$source_sha" "$latest_main" \
                && [ "$exact_search_success" -gt 0 ]; then
                relevant=true
              fi
            fi
          fi

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "search_status_matches=$exact_search_success" >> "$GITHUB_OUTPUT"

          if [ "$relevant" = "true" ]; then
            echo "Resolved exact Search Discovery-verified production source: $source_sha"
          else
            echo "Brand verification skipped safely: live_source=${source_sha:-missing} current_main=$latest_main search_status=$exact_search_success"
          fi

      - name: Record ignored non-release completion
        if: steps.source.outputs.relevant != 'true'
        shell: bash
        run: |
          {
            echo "## Brand Live"
            echo "- Live source: \`${{ steps.source.outputs.source_sha || 'missing' }}\`"
            echo "- Exact Search Discovery status matches: \`${{ steps.source.outputs.search_status_matches }}\`"
            echo "- Verification attempted: \`false\`"
            echo "- Result: upstream completion was not the exact search-verified current-main release"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish pending live-brand status
        if: steps.source.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state=pending \
            -f context="Irha Brand Live" \
            -f description="Checking official brand and buyer routes on production" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null

      - name: Verify official logo and favicon on production
        if: steps.source.outputs.relevant == 'true'
        id: verify
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          expected_master="32eee79bc7038c53cff36bab46193c77e78702d7eef7883e8f94b145999a1b87"
          pages_origin="https://irha-apparels.pages.dev"
          apex_origin="https://irhaapparels.com"

          cloudflare_challenge() {
            local status="$1"
            local headers="$2"
            local body="$3"
            [ "$status" = "403" ] || return 1
            if grep -Eqi '^cf-mitigated:[[:space:]]*challenge' "$headers" 2>/dev/null; then return 0; fi
            if grep -Eqi '^server:[[:space:]]*cloudflare' "$headers" 2>/dev/null \
              && grep -Fqi 'Just a moment...' "$body" 2>/dev/null; then return 0; fi
            return 1
          }

          challenge_evidence() {
            local headers="$1"
            awk 'BEGIN{IGNORECASE=1}
              /^(server|cf-ray|cf-mitigated|content-type|cache-control|cf-cache-status):/ {
                sub(/\r$/, "");
                printf "%s%s", sep, $0;
                sep="; "
              }
              END{print ""}' "$headers" 2>/dev/null
          }

          png_dimensions() {
            local image_path="$1"
            local expected_width="$2"
            local expected_height="$3"
            python3 -c 'import struct,sys; d=open(sys.argv[1],"rb").read(24); assert d[:8] == bytes.fromhex("89504e470d0a1a0a"); assert struct.unpack(">II", d[16:24]) == (int(sys.argv[2]), int(sys.argv[3]))' "$image_path" "$expected_width" "$expected_height"
          }

          resolve_observation() {
            local status="$1"
            local headers="$2"
            local body="$3"
            local fallback="$4"
            local effective_path="$5"
            local route="$6"
            local allow_challenge="$7"
            local evidence=""

            if [ "$status" = "200" ]; then
              cp "$body" "$effective_path"
              return 0
            fi

            if [ "$allow_challenge" = "true" ] && cloudflare_challenge "$status" "$headers" "$body"; then
              test -s "$fallback"
              cp "$fallback" "$effective_path"
              challenge_seen=true
              challenged_routes+=("$route")
              evidence="$(challenge_evidence "$headers")"
              echo "::warning::GitHub-hosted $label observer challenge on $route; exact Pages fallback is required. ${evidence:-challenge markers verified}"
              return 0
            fi

            echo "::error title=Non-challenge production response::$label $route returned status=$status without explicit Cloudflare challenge evidence."
            return 1
          }

          brand_payload_contract() {
            local contract_prefix="$1"
            local master_hash="$2"
            local expected="$3"

            [ "$master_hash" = "$expected" ] \
              && png_dimensions "$contract_prefix-master.png" 1024 1024 \
              && png_dimensions "$contract_prefix-runtime.png" 512 512 \
              && png_dimensions "$contract_prefix-icon192.png" 192 192 \
              && png_dimensions "$contract_prefix-icon512.png" 512 512 \
              && png_dimensions "$contract_prefix-apple.png" 180 180 \
              && grep -Fq "data-master-sha256=\"$expected\"" "$contract_prefix-favicon.svg" \
              && grep -Fq 'data:image/png;base64,' "$contract_prefix-favicon.svg" \
              && grep -Fq "$expected" "$contract_prefix-favicon.ico" \
              && jq -e --arg sha "$expected" \
                '.master.sha256 == $sha and .master.width == 1024 and .master.height == 1024 and .generation.crop == false and .generation.stretch == false' \
                "$contract_prefix-provenance.json" >/dev/null \
              && jq -e \
                '.icons | any(.src | startswith("/icon-192x192.png")) and any(.src | startswith("/icon-512x512.png"))' \
                "$contract_prefix-manifest.json" >/dev/null \
              && grep -Fq '/brand/irha-apparels-official-runtime-512.png' "$contract_prefix-home.html"
          }

          verify_origin() {
            local origin="$1"
            local label="$2"
            local allow_challenge="$3"
            local prefix="/tmp/brand-$label"
            local effective="$prefix-effective"
            local fallback="/tmp/brand-pages-effective"
            local challenge_seen=false
            local -a challenged_routes=()
            local attempt cache_bust
            local master_status runtime_status favicon_status legacy_status icon192_status icon512_status apple_status manifest_status provenance_status home_status
            local master_ok runtime_ok favicon_ok legacy_ok icon192_ok icon512_ok apple_ok manifest_ok provenance_ok home_ok
            local master_hash favicon_source routes_csv

            for attempt in $(seq 1 18); do
              cache_bust="${SOURCE_SHA::12}-$label-$attempt-$RANDOM"

              master_status="$(curl -sSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' -D "$prefix-master.headers" -o "$prefix-master.png" -w '%{http_code}' "$origin/brand/irha-apparels-official-master.png?brand_check=$cache_bust" || true)"
              runtime_status="$(curl -sSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' -D "$prefix-runtime.headers" -o "$prefix-runtime.png" -w '%{http_code}' "$origin/brand/irha-apparels-official-runtime-512.png?brand_check=$cache_bust" || true)"
              favicon_status="$(curl -sSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' -D "$prefix-favicon.headers" -o "$prefix-favicon.svg" -w '%{http_code}' "$origin/favicon.svg?brand_check=$cache_bust" || true)"
              legacy_status="$(curl -sSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' -D "$prefix-favicon-ico.headers" -o "$prefix-favicon.ico" -w '%{http_code}' "$origin/favicon.ico?brand_check=$cache_bust" || true)"
              icon192_status="$(curl -sSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' -D "$prefix-icon192.headers" -o "$prefix-icon192.png" -w '%{http_code}' "$origin/icon-192x192.png?brand_check=$cache_bust" || true)"
              icon512_status="$(curl -sSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' -D "$prefix-icon512.headers" -o "$prefix-icon512.png" -w '%{http_code}' "$origin/icon-512x512.png?brand_check=$cache_bust" || true)"
              apple_status="$(curl -sSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' -D "$prefix-apple.headers" -o "$prefix-apple.png" -w '%{http_code}' "$origin/apple-touch-icon.png?brand_check=$cache_bust" || true)"
              manifest_status="$(curl -sSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' -D "$prefix-manifest.headers" -o "$prefix-manifest.json" -w '%{http_code}' "$origin/manifest.webmanifest?brand_check=$cache_bust" || true)"
              provenance_status="$(curl -sSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' -D "$prefix-provenance.headers" -o "$prefix-provenance.json" -w '%{http_code}' "$origin/brand/brand-master.json?brand_check=$cache_bust" || true)"
              home_status="$(curl -sSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' -D "$prefix-home.headers" -o "$prefix-home.html" -w '%{http_code}' "$origin/?brand_check=$cache_bust" || true)"

              set +e
              resolve_observation "$master_status" "$prefix-master.headers" "$prefix-master.png" "$fallback-master.png" "$effective-master.png" "/brand/irha-apparels-official-master.png" "$allow_challenge"
              master_ok=$?
              resolve_observation "$runtime_status" "$prefix-runtime.headers" "$prefix-runtime.png" "$fallback-runtime.png" "$effective-runtime.png" "/brand/irha-apparels-official-runtime-512.png" "$allow_challenge"
              runtime_ok=$?
              resolve_observation "$favicon_status" "$prefix-favicon.headers" "$prefix-favicon.svg" "$fallback-favicon.svg" "$effective-favicon.svg" "/favicon.svg" "$allow_challenge"
              favicon_ok=$?
              resolve_observation "$legacy_status" "$prefix-favicon-ico.headers" "$prefix-favicon.ico" "$fallback-favicon.ico" "$effective-favicon.ico" "/favicon.ico" "$allow_challenge"
              legacy_ok=$?
              resolve_observation "$icon192_status" "$prefix-icon192.headers" "$prefix-icon192.png" "$fallback-icon192.png" "$effective-icon192.png" "/icon-192x192.png" "$allow_challenge"
              icon192_ok=$?
              resolve_observation "$icon512_status" "$prefix-icon512.headers" "$prefix-icon512.png" "$fallback-icon512.png" "$effective-icon512.png" "/icon-512x512.png" "$allow_challenge"
              icon512_ok=$?
              resolve_observation "$apple_status" "$prefix-apple.headers" "$prefix-apple.png" "$fallback-apple.png" "$effective-apple.png" "/apple-touch-icon.png" "$allow_challenge"
              apple_ok=$?
              resolve_observation "$manifest_status" "$prefix-manifest.headers" "$prefix-manifest.json" "$fallback-manifest.json" "$effective-manifest.json" "/manifest.webmanifest" "$allow_challenge"
              manifest_ok=$?
              resolve_observation "$provenance_status" "$prefix-provenance.headers" "$prefix-provenance.json" "$fallback-provenance.json" "$effective-provenance.json" "/brand/brand-master.json" "$allow_challenge"
              provenance_ok=$?
              resolve_observation "$home_status" "$prefix-home.headers" "$prefix-home.html" "$fallback-home.html" "$effective-home.html" "/" "$allow_challenge"
              home_ok=$?
              set -e

              echo "Brand proof $label attempt $attempt/18: master=$master_status runtime=$runtime_status favicon=$favicon_status legacy=$legacy_status 192=$icon192_status 512=$icon512_status apple=$apple_status manifest=$manifest_status provenance=$provenance_status home=$home_status"

              if [ "$master_ok" -eq 0 ] && [ "$runtime_ok" -eq 0 ] && [ "$favicon_ok" -eq 0 ] \
                && [ "$legacy_ok" -eq 0 ] && [ "$icon192_ok" -eq 0 ] && [ "$icon512_ok" -eq 0 ] \
                && [ "$apple_ok" -eq 0 ] && [ "$manifest_ok" -eq 0 ] && [ "$provenance_ok" -eq 0 ] \
                && [ "$home_ok" -eq 0 ]; then
                master_hash="$(sha256sum "$effective-master.png" 2>/dev/null | awk '{print $1}' || true)"
                if brand_payload_contract "$effective" "$master_hash" "$expected_master"; then
                  if [ "$label" = "apex" ] && [ "$legacy_status" = "200" ]; then
                    favicon_source="$(awk 'BEGIN{IGNORECASE=1} /^x-irha-favicon-source:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print}' "$prefix-favicon-ico.headers" | tail -n 1)"
                    test -z "$favicon_source" || test "$favicon_source" = "official-owner-crest"
                  fi

                  routes_csv="none"
                  if [ "${#challenged_routes[@]}" -gt 0 ]; then
                    routes_csv="$(IFS=,; echo "${challenged_routes[*]}")"
                  fi
                  echo "${label}_challenged=$challenge_seen" >> "$GITHUB_OUTPUT"
                  echo "${label}_challenge_routes=$routes_csv" >> "$GITHUB_OUTPUT"
                  if [ "$challenge_seen" = "true" ]; then
                    echo "Exact official brand verified from strict Pages release plus challenge-classified $label observations: $routes_csv"
                  else
                    echo "Exact owner-uploaded master and all normal brand derivatives verified at $label."
                  fi
                  return 0
                fi
              fi

              challenge_seen=false
              challenged_routes=()
              sleep 10
            done

            echo "::error title=Official Irha brand not verified::$label did not serve the exact owner-uploaded master or an explicitly challenge-classified equivalent backed by exact Pages evidence."
            return 1
          }

          verify_origin "$pages_origin" pages false
          verify_origin "$apex_origin" apex true

      - name: Verify canonical buyer routes on production
        if: steps.source.outputs.relevant == 'true'
        id: routes
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          pages_origin="https://irha-apparels.pages.dev"
          apex_origin="https://irhaapparels.com"

          cloudflare_challenge() {
            local status="$1"
            local headers="$2"
            local body="$3"
            [ "$status" = "403" ] || return 1
            if grep -Eqi '^cf-mitigated:[[:space:]]*challenge' "$headers" 2>/dev/null; then return 0; fi
            if grep -Eqi '^server:[[:space:]]*cloudflare' "$headers" 2>/dev/null \
              && grep -Fqi 'Just a moment...' "$body" 2>/dev/null; then return 0; fi
            return 1
          }

          route_challenge_or_fail() {
            local status="$1"
            local headers="$2"
            local body="$3"
            local route="$4"
            local allow_challenge="$5"
            local evidence=""

            if [ "$allow_challenge" = "true" ] && cloudflare_challenge "$status" "$headers" "$body"; then
              apex_challenged=true
              challenged_routes+=("$route")
              evidence="$(awk 'BEGIN{IGNORECASE=1}
                /^(server|cf-ray|cf-mitigated|content-type|cache-control|cf-cache-status):/ {
                  sub(/\r$/, "");
                  printf "%s%s", sep, $0;
                  sep="; "
                }
                END{print ""}' "$headers" 2>/dev/null)"
              echo "::warning::GitHub-hosted apex route observer challenge on $route. ${evidence:-challenge markers verified}"
              return 0
            fi

            echo "::error title=Buyer route non-challenge failure::$route returned status=$status without explicit Cloudflare challenge evidence."
            return 1
          }

          verify_route_origin() {
            local origin="$1"
            local label="$2"
            local allow_challenge="$3"
            local known_valid_path="${4:-}"
            local prefix="/tmp/routes-$label"
            local apex_challenged=false
            local -a challenged_routes=()
            local attempt cache_bust
            local manifest_status manifest_ok valid_path observed_path valid_status valid_ok
            local legacy_status legacy_location legacy_ok missing_route missing_status missing_marker missing_ok routes_csv

            for attempt in $(seq 1 18); do
              cache_bust="${SOURCE_SHA::12}-$label-routes-$attempt-$RANDOM"

              manifest_status="$(curl -sSL --connect-timeout 10 --max-time 40 \
                -H 'Cache-Control: no-cache' \
                -D "$prefix-manifest.headers" -o "$prefix-manifest.json" -w '%{http_code}' \
                "$origin/catalog-route-manifest.json?route_check=$cache_bust" || true)"

              manifest_ok=false
              valid_path="$known_valid_path"
              if [ "$manifest_status" = "200" ]; then
                if jq -e '.schemaVersion == 1 and .productCount == 254 and (.products | length) == 254' "$prefix-manifest.json" >/dev/null 2>&1; then
                  observed_path="$(jq -r '.products[0].canonical_path // empty' "$prefix-manifest.json")"
                  if [[ "$observed_path" == /products/* ]]; then
                    manifest_ok=true
                    valid_path="$observed_path"
                  fi
                fi
              elif route_challenge_or_fail "$manifest_status" "$prefix-manifest.headers" "$prefix-manifest.json" "/catalog-route-manifest.json" "$allow_challenge"; then
                manifest_ok=true
              fi

              if [ "$manifest_ok" != "true" ] || [[ "$valid_path" != /products/* ]]; then
                if [ "$manifest_status" = "200" ]; then
                  echo "::error title=Buyer route manifest invalid::$label manifest did not expose the exact 254-product contract."
                fi
                sleep 10
                continue
              fi

              valid_status="$(curl -sSL --connect-timeout 10 --max-time 40 \
                -H 'Cache-Control: no-cache' \
                -D "$prefix-valid.headers" -o "$prefix-valid.html" -w '%{http_code}' \
                "$origin$valid_path?route_check=$cache_bust" || true)"
              valid_ok=false
              if [ "$valid_status" = "200" ]; then
                valid_ok=true
              elif route_challenge_or_fail "$valid_status" "$prefix-valid.headers" "$prefix-valid.html" "$valid_path" "$allow_challenge"; then
                valid_ok=true
              fi

              legacy_status="$(curl -sS --max-redirs 0 --connect-timeout 10 --max-time 40 \
                -H 'Cache-Control: no-cache' \
                -D "$prefix-legacy.headers" -o "$prefix-legacy.html" -w '%{http_code}' \
                "$origin/catalogue?route_check=$cache_bust" || true)"
              legacy_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print}' "$prefix-legacy.headers" | tail -n 1)"
              legacy_ok=false
              if [ "$legacy_status" = "301" ] && [[ "$legacy_location" == *"/products"* ]]; then
                legacy_ok=true
              elif route_challenge_or_fail "$legacy_status" "$prefix-legacy.headers" "$prefix-legacy.html" "/catalogue" "$allow_challenge"; then
                legacy_ok=true
              fi

              missing_route="/products/not-a-real-irha-product-$cache_bust"
              missing_status="$(curl -sS --max-redirs 0 --connect-timeout 10 --max-time 40 \
                -H 'Cache-Control: no-cache' \
                -D "$prefix-missing.headers" -o "$prefix-missing.html" -w '%{http_code}' \
                "$origin$missing_route" || true)"
              missing_marker="$(awk 'BEGIN{IGNORECASE=1} /^x-irha-route-status:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print}' "$prefix-missing.headers" | tail -n 1)"
              missing_ok=false
              if [ "$missing_status" = "404" ] && [ "$missing_marker" = "not-found" ]; then
                missing_ok=true
              elif route_challenge_or_fail "$missing_status" "$prefix-missing.headers" "$prefix-missing.html" "$missing_route" "$allow_challenge"; then
                missing_ok=true
              fi

              echo "Route proof $label attempt $attempt/18: manifest=$manifest_status valid=$valid_status legacy=$legacy_status location=${legacy_location:-none} missing=$missing_status marker=${missing_marker:-none}"

              if [ "$manifest_ok" = "true" ] && [ "$valid_ok" = "true" ] \
                && [ "$legacy_ok" = "true" ] && [ "$missing_ok" = "true" ]; then
                routes_csv="none"
                if [ "${#challenged_routes[@]}" -gt 0 ]; then
                  routes_csv="$(IFS=,; echo "${challenged_routes[*]}")"
                fi
                echo "${label}_challenged=$apex_challenged" >> "$GITHUB_OUTPUT"
                echo "${label}_challenge_routes=$routes_csv" >> "$GITHUB_OUTPUT"
                ROUTE_VALID_PATH="$valid_path"
                echo "Canonical buyer route contract verified at $label; challenge routes=$routes_csv"
                return 0
              fi

              apex_challenged=false
              challenged_routes=()
              sleep 10
            done

            echo "::error title=Buyer route verification failed::$label did not satisfy canonical 200, one-hop 301 and real 404 contracts or explicit challenge classification."
            return 1
          }

          ROUTE_VALID_PATH=""
          verify_route_origin "$pages_origin" pages false ""
          pages_valid_path="$ROUTE_VALID_PATH"
          verify_route_origin "$apex_origin" apex true "$pages_valid_path"

      - name: Publish final live-brand status
        if: always() && steps.source.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          JOB_STATUS: ${{ job.status }}
          BRAND_APEX_CHALLENGED: ${{ steps.verify.outputs.apex_challenged }}
          BRAND_CHALLENGE_ROUTES: ${{ steps.verify.outputs.apex_challenge_routes }}
          ROUTES_APEX_CHALLENGED: ${{ steps.routes.outputs.apex_challenged }}
          ROUTE_CHALLENGE_ROUTES: ${{ steps.routes.outputs.apex_challenge_routes }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_SHA" ]; then
            echo "No verified production SHA was resolved; no commit status can be published."
            exit 0
          fi

          state=failure
          description="Official brand or buyer route verification failed"
          if [ "$JOB_STATUS" = "success" ]; then
            state=success
            if [ "${BRAND_APEX_CHALLENGED:-false}" = "true" ] || [ "${ROUTES_APEX_CHALLENGED:-false}" = "true" ]; then
              description="Exact brand/Pages route contract verified; apex GitHub observer challenge-classified"
            else
              description="Official brand and canonical buyer routes verified live"
            fi
          fi

          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state="$state" \
            -f context="Irha Brand Live" \
            -f description="$description" \
