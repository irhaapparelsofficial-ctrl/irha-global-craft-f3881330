name: GP1 refresh Supabase public types

on:
  push:
    branches:
      - phase-1-supabase-types-parity-20260809
    paths:
      - .github/workflows/gp1-refresh-supabase-types.yml

permissions:
  contents: write

concurrency:
  group: gp1-refresh-supabase-types-parity
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: pvzjiozismyxqrzmtfbi

jobs:
  refresh:
    name: refresh exact public-schema types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate exact production public-schema types
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${SUPABASE_ACCESS_TOKEN:-}" | tr -d '[:space:]')"
          test -n "$token" || { echo "SUPABASE_ACCESS_TOKEN is missing"; exit 1; }
          echo "::add-mask::$token"
          npx --yes supabase@2.39.2 gen types typescript \
            --project-id "$SUPABASE_PROJECT_ID" \
            --schema public > /tmp/supabase-types.ts
          test -s /tmp/supabase-types.ts
          ! grep -E '(sb_secret_|service_role[^A-Za-z0-9]|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,})' /tmp/supabase-types.ts
          cp /tmp/supabase-types.ts src/integrations/supabase/types.ts
          node scripts/ci/verify-supabase-type-supplement.mjs /tmp/supabase-types.ts

      - name: Commit only exact generated types and remove helper
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          latest="$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')"
          test "$latest" = "$GITHUB_SHA" || {
            echo "Branch advanced concurrently; refusing to overwrite newer work."
            exit 1
          }
          git diff --exit-code -- . \
            ':(exclude)src/integrations/supabase/types.ts'
          rm .github/workflows/gp1-refresh-supabase-types.yml
          git add src/integrations/supabase/types.ts .github/workflows/gp1-refresh-supabase-types.yml
          git diff --cached --name-only | sort > /tmp/staged.txt
          printf '%s\n' '.github/workflows/gp1-refresh-supabase-types.yml' 'src/integrations/supabase/types.ts' | sort > /tmp/expected.txt
          cmp -s /tmp/staged.txt /tmp/expected.txt
          git diff --cached --quiet && {
            echo "No generated type drift remains."
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(supabase): refresh exact public schema types"
          git push origin "HEAD:$branch"
