name: Diagnose live edge overrides

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-live-edge-overrides-20260715.yml"
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: >-
      github.event_name == 'push' ||
      (github.event.issue.number == 375 &&
       github.event.comment.body == '/diagnose-live-edge-overrides' &&
       github.event.comment.user.login == 'irhaapparelsofficial-ctrl')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Compare apex and Pages responses
        shell: bash
        run: |
          set -euo pipefail
          path='/de/bekleidungshersteller-deutschland'
          nonce="${GITHUB_SHA::12}-$RANDOM"
          for target in apex pages; do
            if [ "$target" = apex ]; then origin='https://irhaapparels.com'; else origin='https://irha-apparels.pages.dev'; fi
            curl -sS --connect-timeout 10 --max-time 40 -D "/tmp/${target}-page.headers" -o "/tmp/${target}-page.html" "$origin$path?edge_diag=$nonce"
            curl -sS --connect-timeout 10 --max-time 40 -D "/tmp/${target}-robots.headers" -o "/tmp/${target}-robots.txt" "$origin/robots.txt?edge_diag=$nonce"
          done

          node <<'NODE'
          const fs = require('fs');
          const read = (p) => fs.readFileSync(p, 'utf8');
          const statusChain = (h) => [...h.matchAll(/^HTTP\/\S+\s+(\d+)/gmi)].map(m => Number(m[1]));
          const headers = (h, name) => {
            const re = new RegExp(`^${name}:\\s*(.+)$`, 'gmi');
            return [...h.matchAll(re)].map(m => m[1].trim());
          };
          const row = (target) => {
            const pageHeaders = read(`/tmp/${target}-page.headers`);
            const pageHtml = read(`/tmp/${target}-page.html`);
            const robotsHeaders = read(`/tmp/${target}-robots.headers`);
            const robots = read(`/tmp/${target}-robots.txt`);
            return {
              target,
              pageStatus: statusChain(pageHeaders).join(' → '),
              csp: headers(pageHeaders, 'content-security-policy'),
              cfRay: headers(pageHeaders, 'cf-ray').at(-1) || 'none',
              server: headers(pageHeaders, 'server').at(-1) || 'none',
              staticMarker: headers(pageHeaders, 'x-irha-static-buyer-shell').at(-1) || 'none',
              cloudflareBeaconInHtml: /static\.cloudflareinsights\.com\/beacon\.min\.js/i.test(pageHtml),
              robotsStatus: statusChain(robotsHeaders).join(' → '),
              robotsMarker: headers(robotsHeaders, 'x-irha-robots-source').at(-1) || 'none',
              robotsCache: headers(robotsHeaders, 'cache-control'),
              robotsContentSignalLines: robots.split(/\r?\n/).filter(line => /^Content-Signal:/i.test(line)),
              robotsBytes: Buffer.byteLength(robots),
            };
          };
          const rows = [row('apex'), row('pages')];
          let md = '## Live edge override diagnostic — apex vs Pages\n\n';
          md += 'No credentials or private configuration were accessed.\n\n';
          for (const r of rows) {
            md += `### ${r.target === 'apex' ? 'irhaapparels.com' : 'irha-apparels.pages.dev'}\n\n`;
            md += `- Page status: \`${r.pageStatus}\`\n`;
            md += `- Static buyer marker: \`${r.staticMarker}\`\n`;
            md += `- Server: \`${r.server}\`\n`;
            md += `- CSP header count: ${r.csp.length}\n`;
            md += r.csp.length ? r.csp.map((v, i) => `  - CSP ${i + 1}: \`${v}\``).join('\n') + '\n' : '- CSP: none\n';
            md += `- Cloudflare beacon injected in HTML: ${r.cloudflareBeaconInHtml}\n`;
            md += `- robots status: \`${r.robotsStatus}\`\n`;
            md += `- robots worker marker: \`${r.robotsMarker}\`\n`;
            md += `- robots Cache-Control: \`${r.robotsCache.join(' | ') || 'none'}\`\n`;
            md += `- robots Content-Signal lines: \`${r.robotsContentSignalLines.join(' | ') || 'none'}\`\n`;
            md += `- robots bytes: ${r.robotsBytes}\n\n`;
          }
          fs.writeFileSync('/tmp/edge-diagnostic.md', md);
          console.log(md);
          NODE

      - name: Record diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 375 --repo "$GITHUB_REPOSITORY" --body-file /tmp/edge-diagnostic.md
