name: GP1 lint-clean Tumblr sources

on:
  push:
    branches:
      - production-parity-tumblr-phase1-20260809
    paths:
      - .github/workflows/gp1-lint-clean-tumblr.yml

permissions:
  contents: write

concurrency:
  group: gp1-lint-clean-tumblr
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Apply semantics-preserving lint cleanup
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          function replaceExact(text, from, to, label) {
            const count = text.split(from).length - 1;
            if (count !== 1) throw new Error(`${label}: expected exactly one match, found ${count}`);
            return text.replace(from, to);
          }

          const callbackPath = 'supabase/functions/tumblr-oauth-callback/index.ts';
          let callback = readFileSync(callbackPath, 'utf8');
          callback = replaceExact(
            callback,
            'map(([k,v])=>`${pct(k)}=\\"${pct(v)}\\"`).join(", ")',
            'map(([k,v])=>`${pct(k)}="${pct(v)}"`).join(", ")',
            'callback oauth header quoting',
          );
          callback = replaceExact(
            callback,
            'async function saveCredential(tokens:any){',
            'type TumblrTokenPayload={access_token:string;refresh_token?:string;token_type?:string;scope?:string;expires_in?:number|string};\nasync function saveCredential(tokens:TumblrTokenPayload){',
            'callback token payload typing',
          );
          writeFileSync(callbackPath, callback, 'utf8');

          const operatorPath = 'supabase/functions/tumblr-operator/index.ts';
          let operator = readFileSync(operatorPath, 'utf8');
          operator = replaceExact(
            operator,
            'map(([k,v])=>`${pct(k)}=\\"${pct(v)}\\"`).join(", ")',
            'map(([k,v])=>`${pct(k)}="${pct(v)}"`).join(", ")',
            'operator oauth header quoting',
          );
          operator = replaceExact(
            operator,
            'async function saveCredential(tokens:any){',
            'type TumblrTokenPayload={access_token:string;refresh_token?:string;token_type?:string;scope?:string;expires_in?:number|string};\nasync function saveCredential(tokens:TumblrTokenPayload){',
            'operator token payload typing',
          );
          operator = replaceExact(
            operator,
            'const blogs=Array.isArray(user.blogs)?user.blogs:[];const primary=blogs.find((b:any)=>b.primary)||blogs[0]||null;return{verified:true,user_name:user.name||null,primary_blog:primary?{name:primary.name||null,title:primary.title||null,uuid:primary.uuid||null,url:primary.url||null}:null,blogs:blogs.map((b:any)=>({name:b.name||null,title:b.title||null,uuid:b.uuid||null,url:b.url||null,primary:Boolean(b.primary)}))}',
            'const blogs=(Array.isArray(user.blogs)?user.blogs:[]) as Array<{name?:string;title?:string;uuid?:string;url?:string;primary?:boolean}>;const primary=blogs.find((b)=>b.primary)||blogs[0]||null;return{verified:true,user_name:user.name||null,primary_blog:primary?{name:primary.name||null,title:primary.title||null,uuid:primary.uuid||null,url:primary.url||null}:null,blogs:blogs.map((b)=>({name:b.name||null,title:b.title||null,uuid:b.uuid||null,url:b.url||null,primary:Boolean(b.primary)}))}',
            'operator blog typing',
          );
          operator = replaceExact(
            operator,
            'if(action==="probe"){let connected=false;try{connected=Boolean(await getCredential())}catch{}return json(',
            'if(action==="probe"){let connected=false;try{connected=Boolean(await getCredential())}catch{/* credential lookup failure means disconnected */}return json(',
            'operator empty catch',
          );
          writeFileSync(operatorPath, operator, 'utf8');
          NODE

          git diff --name-only | sort > /tmp/changed.txt
          printf '%s\n' \
            supabase/functions/tumblr-oauth-callback/index.ts \
            supabase/functions/tumblr-operator/index.ts | sort > /tmp/expected.txt
          cmp -s /tmp/changed.txt /tmp/expected.txt || { echo 'Unexpected lint-clean diff'; cat /tmp/changed.txt; exit 1; }

      - name: Prove focused and repository lint gates
        shell: bash
        run: |
          set -euo pipefail
          npx eslint \
            supabase/functions/tumblr-oauth-callback/index.ts \
            supabase/functions/tumblr-operator/index.ts \
            supabase/functions/tumblr-operator-get/index.ts
          set +e
          npx eslint . --format json > /tmp/eslint-full.json
          lint_status=$?
          set -e
          node - <<'NODE'
          const fs=require('node:fs');
          const report=JSON.parse(fs.readFileSync('/tmp/eslint-full.json','utf8'));
          const totals=report.reduce((sum,file)=>({errors:sum.errors+file.errorCount,warnings:sum.warnings+file.warningCount}),{errors:0,warnings:0});
          console.log(JSON.stringify(totals));
          if(totals.errors>445||totals.warnings>30)throw new Error(`repository lint debt worsened: ${totals.errors} errors, ${totals.warnings} warnings`);
          NODE
          test "$lint_status" -ne 0 || true

      - name: Commit only lint-clean Tumblr sources
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$latest" = "$GITHUB_SHA" || { echo 'Branch advanced concurrently'; exit 1; }
          git add supabase/functions/tumblr-oauth-callback/index.ts supabase/functions/tumblr-operator/index.ts
          git diff --cached --name-only | sort > /tmp/staged.txt
          printf '%s\n' \
            supabase/functions/tumblr-oauth-callback/index.ts \
            supabase/functions/tumblr-operator/index.ts | sort > /tmp/staged-expected.txt
          cmp -s /tmp/staged.txt /tmp/staged-expected.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(tumblr): remove recovered-source lint debt"
          git push origin "HEAD:${GITHUB_REF_NAME}"
