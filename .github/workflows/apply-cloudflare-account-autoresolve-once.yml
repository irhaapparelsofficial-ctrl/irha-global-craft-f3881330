name: Apply Cloudflare Account Autoresolution Once

on:
  push:
    branches:
      - fix/cloudflare-account-id-autoresolve-20260714
    paths:
      - ".github/workflows/apply-cloudflare-account-autoresolve-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-account-id-autoresolve-20260714
          fetch-depth: 0

      - name: Patch production workflow deterministically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/cloudflare-pages-production.yml")
          lines = path.read_text().splitlines()

          def locate(value: str, start: int = 0) -> int:
              for index in range(start, len(lines)):
                  if lines[index] == value:
                      return index
              raise SystemExit(f"required line not found: {value}")

          output_line = "      resolved_account_id: ${{ steps.cloudflare.outputs.resolved_account_id }}"
          if output_line not in lines:
              domain_output = locate("      domain_count: ${{ steps.cloudflare.outputs.domain_count }}")
              lines.insert(domain_output + 1, output_line)

          credential_start = locate('          test -n "$token" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }')
          verify_start = locate('          verify_json="$(curl -sS \\', credential_start)
          credential_block = [
              '          test -n "$token" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }',
              '          test -n "$project_name" || { echo "CLOUDFLARE_PROJECT_NAME is missing"; exit 1; }',
              '',
              '          [[ "$project_name" =~ ^[a-z0-9][a-z0-9-]*[a-z0-9]$ ]] || {',
              '            echo "CLOUDFLARE_PROJECT_NAME contains invalid characters"',
              '            exit 1',
              '          }',
              '',
              '          echo "::add-mask::$token"',
              '',
          ]
          lines[credential_start:verify_start] = credential_block

          project_start = locate('          project_json="$(curl -sS \\')
          resolution_marker = '          if ! [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then'
          if resolution_marker not in lines:
              resolution_block = [
                  resolution_marker,
                  '            embedded_account_id="$(printf \'%s\' "$account_id" | grep -Eo \'[0-9a-fA-F]{32}\' | head -n 1 || true)"',
                  '            if [[ "$embedded_account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then',
                  '              account_id="$embedded_account_id"',
                  '              echo "Normalized Account ID from the configured secret value"',
                  '            else',
                  '              accounts_json="$(curl -sS \\',
                  '                -H "Authorization: Bearer $token" \\',
                  "                -H 'Content-Type: application/json' \\",
                  "                'https://api.cloudflare.com/client/v4/accounts?per_page=50')\"",
                  '',
                  '              if [ "$(printf \'%s\' "$accounts_json" | jq -r \'.success // false\')" != "true" ]; then',
                  '                echo "Cloudflare account discovery failed; set CLOUDFLARE_ACCOUNT_ID to the exact 32-character Account ID"',
                  '                printf \'%s\' "$accounts_json" | jq -r \'.errors[]? | "Cloudflare error \\(.code // "unknown"): \\(.message // "unknown")"\'',
                  '                exit 1',
                  '              fi',
                  '',
                  '              account_count="$(printf \'%s\' "$accounts_json" | jq -r \'(.result // []) | length\')"',
                  '              if [ "$account_count" != "1" ]; then',
                  '                echo "Cloudflare token can access $account_count accounts; set CLOUDFLARE_ACCOUNT_ID to the exact 32-character Account ID"',
                  '                exit 1',
                  '              fi',
                  '              account_id="$(printf \'%s\' "$accounts_json" | jq -r \'.result[0].id // empty\')"',
                  '              echo "Resolved the only Cloudflare account accessible to this token"',
                  '            fi',
                  '          fi',
                  '',
                  '          [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]] || {',
                  '            echo "Cloudflare Account ID could not be resolved safely"',
                  '            exit 1',
                  '          }',
                  '          echo "::add-mask::$account_id"',
                  '',
              ]
              lines[project_start:project_start] = resolution_block

          resolved_value = '          echo "resolved_account_id=$account_id" >> "$GITHUB_OUTPUT"'
          if resolved_value not in lines:
              previous_value = locate('          echo "previous_deployment_id=$previous_deployment_id" >> "$GITHUB_OUTPUT"')
              lines.insert(previous_value, resolved_value)

          deploy_index = locate("  deploy:")
          deploy_account = locate('      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}', deploy_index)
          lines[deploy_account] = '      CLOUDFLARE_ACCOUNT_ID: ${{ needs.preflight.outputs.resolved_account_id }}'

          required = [
              output_line,
              resolution_marker,
              "                'https://api.cloudflare.com/client/v4/accounts?per_page=50')\"",
              resolved_value,
              '      CLOUDFLARE_ACCOUNT_ID: ${{ needs.preflight.outputs.resolved_account_id }}',
          ]
          missing = [value for value in required if value not in lines]
          if missing:
              raise SystemExit(f"autoresolution verification failed: {missing}")

          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-cloudflare-account-autoresolve-once.yml
          git config user.name "irhaapparelsofficial-ctrl"
          git config user.email "irhaapparelsofficial@gmail.com"
          git add .github/workflows/cloudflare-pages-production.yml .github/workflows/apply-cloudflare-account-autoresolve-once.yml
          git commit -m "fix(ci): resolve Cloudflare account ID safely"
          git push origin HEAD:fix/cloudflare-account-id-autoresolve-20260714
