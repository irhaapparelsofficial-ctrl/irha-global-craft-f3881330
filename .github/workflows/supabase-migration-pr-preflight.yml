name: Supabase Migration PR Preflight

run-name: Supabase advisory · ${{ github.event_name }} · ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/repository-migrations.json"
      - "scripts/verify-migration-order.mjs"
      - "scripts/ci/reconcile-repository-migrations.mjs"
      - "scripts/ci/sql-transaction-body.mjs"
      - ".github/workflows/supabase-migration-pr-preflight.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to inspect manually
        required: false
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-migration-advisory-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  SUPABASE_PROJECT_ID: pvzjiozismyxqrzmtfbi
  REPO_MIGRATION_MODE: plan
  REPO_MIGRATION_PLAN_PATH: /tmp/repository-migration-plan.json
  REPO_MIGRATION_EVIDENCE_PATH: /tmp/repository-migration-evidence.json

jobs:
  pr-advisory:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Allow PR to continue
        run: |
          {
            echo "## Supabase migration advisory"
            echo "- Automatic transactional dry-run: disabled"
            echo "- Merge blocking: disabled"
            echo "- Database apply remains limited to relevant changes after merge"
            echo "- Full inspection can be started manually when needed"
          } >> "$GITHUB_STEP_SUMMARY"

  manual-dry-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Detect manual credential readiness
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${SUPABASE_ACCESS_TOKEN:-}" | tr -d '[:space:]')"
          if [ -n "$token" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_ACCESS_TOKEN is unavailable; manual remote dry-run skipped without failure."
          fi

      - name: Verify migration ordering and repository manifest
        if: steps.credentials.outputs.ready == 'true'
        run: node scripts/verify-migration-order.mjs

      - name: Transactionally dry-run pending migrations
        if: steps.credentials.outputs.ready == 'true'
        run: node scripts/ci/reconcile-repository-migrations.mjs

      - name: Preserve manual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-manual-preflight-${{ github.run_id }}
          path: |
            /tmp/repository-migration-plan.json
            /tmp/repository-migration-evidence.json
          if-no-files-found: ignore
          retention-days: 2

      - name: Record manual result
        if: always()
        run: |
          {
            echo "## Manual Supabase migration inspection"
            echo "- Requested ref: \`${{ inputs.ref }}\`"
            echo "- Credentials ready: \`${{ steps.credentials.outputs.ready || 'unknown' }}\`"
            echo "- Production mutation: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"
