name: Supabase Migration PR Preflight

run-name: Supabase dry-run · PR #${{ github.event.pull_request.number }} · ${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/repository-migrations.json"
      - "scripts/verify-migration-order.mjs"
      - "scripts/ci/reconcile-repository-migrations.mjs"
      - "scripts/ci/sql-transaction-body.mjs"
      - ".github/workflows/supabase-migration-pr-preflight.yml"

permissions:
  contents: read

concurrency:
  group: supabase-migration-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SUPABASE_PROJECT_ID: pvzjiozismyxqrzmtfbi
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  REPO_MIGRATION_MODE: plan
  REPO_MIGRATION_PLAN_PATH: /tmp/repository-migration-plan.json
  REPO_MIGRATION_EVIDENCE_PATH: /tmp/repository-migration-evidence.json

jobs:
  transactional-dry-run:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify owner Supabase preflight credentials
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${SUPABASE_ACCESS_TOKEN:-}" | tr -d '[:space:]')"
          test -n "$token" || {
            echo "::error title=Supabase migration preflight unavailable::SUPABASE_ACCESS_TOKEN is missing, so this database-changing PR cannot be proven safe before merge."
            exit 1
          }
          echo "Owner Supabase transactional dry-run credentials are available."

      - name: Verify migration ordering and repository manifest
        run: node scripts/verify-migration-order.mjs

      - name: Transactionally dry-run every pending migration
        run: node scripts/ci/reconcile-repository-migrations.mjs

      - name: Preserve exact preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-pr-preflight-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/repository-migration-plan.json
            /tmp/repository-migration-evidence.json
          if-no-files-found: warn
          retention-days: 3

      - name: Record no-mutation contract
        if: always()
        shell: bash
        run: |
          {
            echo "## Supabase Migration PR Preflight"
            echo "- PR head: \`${SOURCE_SHA}\`"
            echo "- Owner project: \`${SUPABASE_PROJECT_ID}\`"
            echo "- Mode: transactional plan and rollback"
            echo "- Production mutation: \`false\`"
            echo "- Merge eligibility: only after manifest validation and every pending migration dry-run passes"
          } >> "$GITHUB_STEP_SUMMARY"
