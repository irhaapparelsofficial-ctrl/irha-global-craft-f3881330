name: Apply Lead Outreach Safety Guards

on:
  push:
    branches:
      - feat/lead-file-outreach-approval

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/lead-file-outreach-approval
          fetch-depth: 0

      - name: Apply exact safety patches
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exact match once, found {count}")
              file.write_text(text.replace(old, new, 1))

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f"{path}: start marker not found: {start}")
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f"{path}: end marker not found: {end}")
              file.write_text(text[:start_index] + replacement + text[end_index:])

          activation_path = "supabase/functions/lead-activation-channel-v2/index.ts"
          replace_once(activation_path, "const MAX_BATCH = 50;", "const MAX_BATCH = 25;")

          activation_function = r'''async function activate(service: any, userId: string, body: JsonRecord) {
            const ids = stringArray(body.candidate_ids).slice(0, MAX_BATCH);
            if (!ids.length) return json({ error: "candidate_ids[] required" }, 400);
            if (body.owner_confirmed !== true) return json({ error: "Explicit owner confirmation is required" }, 400);

            const batch = await service.from("lead_activation_batches").insert({
              status: "running",
              requested_by: userId,
              candidate_ids: ids,
              strict_ready_count: 0,
              summary: { mode: "channel_activation_v2", started_at: new Date().toISOString(), sends_external_messages: false, max_batch: MAX_BATCH },
            }).select("*").single();
            if (batch.error || !batch.data) throw batch.error || new Error("Activation batch could not be created");

            const claimToken = crypto.randomUUID();
            const candidateResult = await service.rpc("claim_lead_candidates_for_activation", {
              p_candidate_ids: ids,
              p_claim_token: claimToken,
              p_limit: MAX_BATCH,
            });
            if (candidateResult.error) {
              await service.from("lead_activation_batches").update({
                status: "failed",
                failed_count: ids.length,
                errors: [{ phase: "candidate_claim", error: candidateResult.error.message }],
                completed_at: new Date().toISOString(),
              }).eq("id", batch.data.id);
              throw candidateResult.error;
            }

            const claimedCandidates = candidateResult.data || [];
            const claimedIds = new Set(claimedCandidates.map((candidate: any) => candidate.id));
            const outcomes: JsonRecord[] = ids
              .filter((id) => !claimedIds.has(id))
              .map((id) => ({
                candidate_id: id,
                status: "busy",
                reason: "Candidate is already imported, no longer eligible, or locked by another activation run",
              }));
            const importedLeadIds: string[] = [];

            try {
              const known = await loadKnown(service);

              for (const candidate of claimedCandidates) {
                if (candidate.imported_lead_id) {
                  outcomes.push({ candidate_id: candidate.id, company: candidate.company_name, status: "duplicate", lead_id: candidate.imported_lead_id, reason: "Already imported" });
                  await audit(service, batch.data.id, candidate.id, candidate.imported_lead_id, "duplicate", { reason: "Already imported" }, userId);
                  continue;
                }
                const email = validEmail(candidate.email);
                const whatsapp = normalizePhone(candidate.whatsapp || candidate.phone);
                const blockers = candidateBlockers(candidate, email, whatsapp);
                if (blockers.length) {
                  outcomes.push({ candidate_id: candidate.id, company: candidate.company_name, status: "blocked", blockers });
                  await service.from("lead_candidates").update({ verification_status: "needs_review", reviewed_by: userId, reviewed_at: new Date().toISOString() }).eq("id", candidate.id).eq("activation_claim_token", claimToken);
                  await audit(service, batch.data.id, candidate.id, null, "blocked", { blockers }, userId);
                  continue;
                }

                const website = safeUrl(candidate.website || candidate.source_url);
                const websiteDomain = domain(candidate.website_domain || website);
                const companyKey = companyCountryKey(candidate.company_name, candidate.country);
                const existing = (websiteDomain && known.domains.get(websiteDomain))
                  || (email && known.emails.get(email))
                  || (whatsapp && known.whatsapps.get(phoneKey(whatsapp)))
                  || known.companies.get(companyKey);
                if (existing) {
                  await service.from("lead_candidates").update({
                    verification_status: "duplicate",
                    duplicate_reason: "Already exists in Buyer CRM",
                    imported_lead_id: existing,
                    reviewed_by: userId,
                    reviewed_at: new Date().toISOString(),
                  }).eq("id", candidate.id).eq("activation_claim_token", claimToken);
                  outcomes.push({ candidate_id: candidate.id, company: candidate.company_name, status: "duplicate", lead_id: existing, reason: "Already exists in Buyer CRM" });
                  await audit(service, batch.data.id, candidate.id, existing, "duplicate", { reason: "Already exists in Buyer CRM" }, userId);
                  continue;
                }

                const now = new Date().toISOString();
                const leadResult = await service.from("b2b_leads").insert({
                  company_name: clean(candidate.company_name, 240),
                  country: clean(candidate.country, 100),
                  email,
                  phone: normalizePhone(candidate.phone || candidate.whatsapp),
                  whatsapp,
                  website,
                  website_domain: websiteDomain,
                  apparel_segment: Array.isArray(candidate.product_fit) ? candidate.product_fit.join(", ") : null,
                  lead_status: "New",
                  crm_status: "new",
                  priority: Number(candidate.verification_score || 0) >= 85 ? "high" : "normal",
                  notes: `Owner-approved candidate activation\nSource: ${candidate.source_url}\nVerification: ${candidate.verification_score}/100\nContact route: ${email ? "email" : "WhatsApp"}\nBatch: ${batch.data.id}`,
                  crm_history: [{ event: "candidate_imported", at: now, batch_id: batch.data.id, candidate_id: candidate.id, actor: userId, source: candidate.source_url, contact_route: email ? "email" : "whatsapp" }],
                  lead_campaign_id: candidate.campaign_id,
                  buyer_type: candidate.buyer_type,
                  linkedin_url: candidate.linkedin_url,
                  instagram_url: candidate.instagram_url,
                  facebook_url: candidate.facebook_url,
                  source_url: candidate.source_url,
                  source_provider: candidate.source_provider,
                  verification_score: candidate.verification_score,
                  verification_evidence: {
                    ...(isRecord(candidate.evidence) ? candidate.evidence : {}),
                    activation_batch_id: batch.data.id,
                    activated_at: now,
                    activated_by: userId,
                    accepted_contact_route: email ? "email" : "whatsapp",
                    automatic_message_sent: false,
                  },
                }).select("id").single();
                if (leadResult.error || !leadResult.data) {
                  const reason = leadResult.error?.message || "CRM insert failed";
                  outcomes.push({ candidate_id: candidate.id, company: candidate.company_name, status: "failed", error: reason });
                  await audit(service, batch.data.id, candidate.id, null, "failed", { phase: "crm_insert", error: reason }, userId);
                  continue;
                }

                const candidateSaved = await service.from("lead_candidates").update({
                  verification_status: "imported",
                  imported_lead_id: leadResult.data.id,
                  reviewed_by: userId,
                  reviewed_at: now,
                  activation_claim_token: null,
                  activation_claimed_at: null,
                  evidence: {
                    ...(isRecord(candidate.evidence) ? candidate.evidence : {}),
                    activation: { batch_id: batch.data.id, lead_id: leadResult.data.id, at: now, actor: userId, contact_route: email ? "email" : "whatsapp" },
                  },
                }).eq("id", candidate.id).eq("activation_claim_token", claimToken).select("id").maybeSingle();
                if (candidateSaved.error || !candidateSaved.data) {
                  await service.from("b2b_leads").delete().eq("id", leadResult.data.id);
                  const reason = `Candidate link failed; CRM insert rolled back: ${candidateSaved.error?.message || "activation claim was lost"}`;
                  outcomes.push({ candidate_id: candidate.id, company: candidate.company_name, status: "failed", error: reason });
                  await audit(service, batch.data.id, candidate.id, null, "failed", { phase: "candidate_link", error: reason }, userId);
                  continue;
                }

                const sourceFiles = await service.from("lead_import_files").select("id").eq("campaign_id", candidate.campaign_id).in("status", ["uploaded", "staged", "failed"]);
                if (!sourceFiles.error && sourceFiles.data?.length) {
                  await service.from("lead_source_file_links").upsert(sourceFiles.data.map((file: any) => ({ import_file_id: file.id, lead_id: leadResult.data.id, candidate_id: candidate.id, created_by: userId })), { onConflict: "import_file_id,lead_id", ignoreDuplicates: true });
                }

                importedLeadIds.push(leadResult.data.id);
                if (websiteDomain) known.domains.set(websiteDomain, leadResult.data.id);
                if (email) known.emails.set(email, leadResult.data.id);
                if (whatsapp) known.whatsapps.set(phoneKey(whatsapp), leadResult.data.id);
                known.companies.set(companyKey, leadResult.data.id);
                outcomes.push({ candidate_id: candidate.id, company: candidate.company_name, status: "imported", lead_id: leadResult.data.id, contact_route: email ? "email" : "whatsapp" });
                await audit(service, batch.data.id, candidate.id, leadResult.data.id, "imported", { contact_route: email ? "email" : "whatsapp", automatic_message_sent: false }, userId);
              }

              const summary = summarize(outcomes);
              const imported = Number(summary.imported || 0);
              const failed = Number(summary.failed || 0);
              const skipped = outcomes.length - imported - failed;
              await service.from("lead_activation_batches").update({
                status: failed ? (imported ? "partial" : "failed") : "completed",
                imported_lead_ids: importedLeadIds,
                strict_ready_count: imported + Number(summary.duplicate || 0),
                imported_count: imported,
                skipped_count: skipped,
                failed_count: failed,
                summary: { mode: "channel_activation_v2", ...summary, sends_external_messages: false, claim_token: claimToken, max_batch: MAX_BATCH },
                errors: outcomes.filter((item) => item.error),
                completed_at: new Date().toISOString(),
              }).eq("id", batch.data.id);
              return json({ ok: true, batch_id: batch.data.id, outcomes, summary, imported_lead_ids: importedLeadIds, sends_external_messages: false });
            } finally {
              const release = await service.from("lead_candidates").update({
                activation_claim_token: null,
                activation_claimed_at: null,
              }).eq("activation_claim_token", claimToken);
              if (release.error) console.error("lead activation claim release failed", release.error.message);
            }
          }

          '''
          replace_between(
              activation_path,
              "async function activate(service: any, userId: string, body: JsonRecord) {",
              "function candidateBlockers",
              activation_function,
          )

          ui_path = "src/components/admin/ChannelCandidateActivationPanel.tsx"
          replace_once(ui_path, "const ids = [...selected].slice(0, 50);", "const ids = [...selected].slice(0, 25);")
          replace_once(ui_path, "filtered.slice(0, 50)", "filtered.slice(0, 25)")
          replace_once(
              ui_path,
              'function toggleSet(current: Set<string>, id: string) { const next = new Set(current); if (next.has(id)) next.delete(id); else next.add(id); return next; }',
              'function toggleSet(current: Set<string>, id: string) { const next = new Set(current); if (next.has(id)) next.delete(id); else if (next.size < 25) next.add(id); return next; }',
          )

          bulk_path = "supabase/functions/lead-bulk-stage/index.ts"
          replace_once(
              bulk_path,
              '''    if (row.campaign_id === campaignId && row.import_fingerprint) {
                currentFingerprints.set(String(row.import_fingerprint), row.id);
                continue;
              }''',
              '''    if (row.campaign_id === campaignId && row.import_fingerprint) {
                currentFingerprints.set(String(row.import_fingerprint), row.id);
              }''',
          )

          outreach_path = "supabase/functions/outreach-workflow-v2/index.ts"
          approve_function = r'''async function approveAndSend(service: Db, userId: string, body: JsonRecord) {
            const messageId = clean(body.message_id, 80);
            if (!messageId) return json({ error: "message_id required" }, 400);
            if (body.owner_confirmed !== true) return json({ error: "Explicit owner confirmation is required before dispatch" }, 400);

            const current = await service.from("outreach_messages").select("*,b2b_leads(id,email,phone,whatsapp,outreach_opt_out,crm_status,verification_score)").eq("id", messageId).maybeSingle();
            if (current.error || !current.data) return json({ error: "Message not found" }, 404);
            const message = current.data;
            if (message.status === "sent" || message.status === "replied") return json({ ok: true, status: message.status, already_dispatched: true, message_id: message.id });
            if (message.status === "sending") return json({ error: "This message is already being processed. Automatic retry is blocked to prevent duplicate delivery." }, 409);
            if (!EDITABLE.has(message.status)) return json({ error: `Message cannot be approved from status ${message.status}` }, 409);
            if (message.b2b_leads?.outreach_opt_out === true) return await markManual(service, message, userId, "Lead opted out of outreach");
            if (!eligibleLead(message.b2b_leads || {})) return await markManual(service, message, userId, "Lead is no longer verified or qualified");
            if (commercialCommitment(message.body_text)) return await markManual(service, message, userId, "Draft contains pricing, MOQ, certification, guarantee or delivery commitments requiring manual review");

            const approvedAt = new Date().toISOString();
            const approval = await service.from("outreach_messages").update({
              status: "sending",
              approved_by: userId,
              approved_at: approvedAt,
              dispatched_by: userId,
              manual_reason: null,
              error: null,
            })
              .eq("id", message.id)
              .eq("status", message.status)
              .eq("updated_at", message.updated_at)
              .select("*")
              .maybeSingle();
            if (approval.error) throw approval.error;
            if (!approval.data) {
              const latest = await service.from("outreach_messages").select("id,status").eq("id", message.id).maybeSingle();
              if (latest.data && ["sent", "replied"].includes(latest.data.status)) {
                return json({ ok: true, status: latest.data.status, already_dispatched: true, message_id: message.id });
              }
              return json({ error: "Message state changed before dispatch. Refresh before trying again; no duplicate send was attempted." }, 409);
            }

            await outreachEvent(service, approval.data, "approved", { channel: approval.data.channel, approve_and_send: true, atomic_claim: true }, userId);
            const outcome = approval.data.channel === "whatsapp"
              ? await dispatchWhatsApp(service, approval.data, userId)
              : await dispatchEmail(service, approval.data, userId);
            await refreshCampaign(service, approval.data.campaign_id);
            return json(outcome, outcome.ok ? 200 : outcome.status === "manual_required" ? 422 : 500);
          }

          '''
          replace_between(
              outreach_path,
              "async function approveAndSend(service: Db, userId: string, body: JsonRecord) {",
              "async function dispatchEmail",
              approve_function,
          )

          whatsapp_function = r'''async function dispatchWhatsApp(service: Db, message: any, userId: string): Promise<any> {
            const config = whatsappConfig();
            if (!config.ok) return await markManual(service, message, userId, config.error);
            const phone = normalizePhone(message.recipient_whatsapp);
            if (!phone) return await markManual(service, message, userId, "Valid WhatsApp number is missing");
            const waId = phone.replace(/\D/g, "");

            if (message.whatsapp_message_id) {
              const prior = await service.from("whatsapp_messages").select("id,status,wa_message_id,raw_payload").eq("id", message.whatsapp_message_id).maybeSingle();
              if (prior.error) throw prior.error;
              const priorPayload = record(prior.data?.raw_payload);
              if (prior.data?.wa_message_id || priorPayload.primary_attempted === true) {
                return await markManual(
                  service,
                  message,
                  userId,
                  "A primary WhatsApp delivery was already attempted for this draft. Automatic retry is blocked to prevent duplicate text. Review the provider record and create a separate follow-up if needed.",
                );
              }
            }

            let contact = await service.from("whatsapp_contacts").select("*").eq("crm_lead_id", message.lead_id).maybeSingle();
            if (contact.error) throw contact.error;
            if (!contact.data) {
              const byWa = await service.from("whatsapp_contacts").select("*").eq("wa_id", waId).maybeSingle();
              if (byWa.error) throw byWa.error;
              contact = byWa;
            }
            if (!contact.data) return await markManual(service, message, userId, "WhatsApp contact is not opted in or linked to this CRM lead");
            if (!["opted_in", "inbound_contact"].includes(contact.data.opt_in_status)) return await markManual(service, message, userId, `WhatsApp contact status is ${contact.data.opt_in_status}`);
            const withinWindow = contact.data.last_inbound_at && Date.now() - new Date(contact.data.last_inbound_at).getTime() <= config.windowHours * 3_600_000;
            if (!withinWindow) return await markManual(service, message, userId, "WhatsApp customer-service window is closed. An approved Meta template is required before sending.");

            let conversation = await service.from("whatsapp_conversations").select("*").eq("contact_id", contact.data.id).eq("status", "open").order("updated_at", { ascending: false }).limit(1).maybeSingle();
            if (conversation.error) throw conversation.error;
            if (!conversation.data) {
              conversation = await service.from("whatsapp_conversations").insert({ contact_id: contact.data.id, status: "open", qualification_status: "unreviewed", unread_count: 0 }).select("*").single();
              if (conversation.error || !conversation.data) throw conversation.error || new Error("WhatsApp conversation could not be created");
            }

            const attachments = await loadAttachments(service, message.id);
            if (attachments.length > MAX_WHATSAPP_ATTACHMENTS) return await markManual(service, message, userId, `WhatsApp attachment limit is ${MAX_WHATSAPP_ATTACHMENTS}`);
            const unsupported = attachments.find((item) => !WA_MEDIA_TYPES.has(item.file.mime_type) || Number(item.file.size_bytes || 0) > MAX_WHATSAPP_ATTACHMENT_BYTES);
            if (unsupported) return await markManual(service, message, userId, `WhatsApp attachment ${unsupported.file.file_name} is unsupported or larger than 5 MB`);

            const draft = await service.from("whatsapp_messages").insert({
              conversation_id: conversation.data.id,
              contact_id: contact.data.id,
              direction: "outbound",
              message_type: "text",
              body: cleanLines(message.body_text, 8000),
              status: "queued",
              requires_owner_approval: true,
              approved_by: userId,
              approved_at: new Date().toISOString(),
              created_by: userId,
              raw_payload: { outreach_message_id: message.id, owner_approved: true, external_execution: true, primary_attempted: false },
            }).select("*").single();
            if (draft.error || !draft.data) throw draft.error || new Error("WhatsApp audit draft could not be created");
            await service.from("outreach_messages").update({ status: "sending", whatsapp_message_id: draft.data.id, error: null }).eq("id", message.id);
            await outreachEvent(service, message, "send_started", { channel: "whatsapp", whatsapp_message_id: draft.data.id, attachment_count: attachments.length }, userId);

            let primaryAttempted = false;
            let primaryId: string | null = null;
            try {
              const attemptRecorded = await service.from("whatsapp_messages").update({
                raw_payload: { outreach_message_id: message.id, owner_approved: true, external_execution: true, primary_attempted: true, attempted_at: new Date().toISOString() },
              }).eq("id", draft.data.id);
              if (attemptRecorded.error) throw attemptRecorded.error;
              primaryAttempted = true;

              const textResult = await graphSend(config, { messaging_product: "whatsapp", recipient_type: "individual", to: waId, type: "text", text: { preview_url: false, body: cleanLines(message.body_text, 8000) } });
              primaryId = graphMessageId(textResult);
              const primarySentAt = new Date().toISOString();
              await service.from("whatsapp_messages").update({
                status: "sent",
                wa_message_id: primaryId,
                sent_at: primarySentAt,
                error: null,
                raw_payload: { response: textResult, outreach_message_id: message.id, primary_attempted: true, primary_sent: true },
              }).eq("id", draft.data.id);
              await service.from("outreach_messages").update({
                connector_response: {
                  ...record(message.connector_response),
                  provider: "meta_whatsapp",
                  wa_message_id: primaryId,
                  whatsapp_message_id: draft.data.id,
                  primary_text_sent: true,
                  primary_text_sent_at: primarySentAt,
                },
              }).eq("id", message.id);

              for (const item of attachments) {
                await service.from("outreach_message_attachments").update({ status: "sending", error: null }).eq("id", item.link.id);
                const downloaded = await service.storage.from(item.file.bucket).download(item.file.object_path);
                if (downloaded.error || !downloaded.data) throw downloaded.error || new Error(`Could not read ${item.file.file_name}`);
                const mediaId = await uploadWhatsAppMedia(config, downloaded.data, item.file.mime_type, item.file.file_name);
                const type = WA_MEDIA_TYPES.get(item.file.mime_type)!;
                const payload = type === "image"
                  ? { messaging_product: "whatsapp", to: waId, type: "image", image: { id: mediaId } }
                  : { messaging_product: "whatsapp", to: waId, type: "document", document: { id: mediaId, filename: item.file.file_name } };
                const mediaResult = await graphSend(config, payload);
                await service.from("outreach_message_attachments").update({ status: "sent", provider_file_id: mediaId, error: null, metadata: { media_message_id: graphMessageId(mediaResult), provider: "meta_whatsapp" } }).eq("id", item.link.id);
              }

              const sentAt = new Date().toISOString();
              await service.from("whatsapp_contacts").update({ last_outbound_at: sentAt }).eq("id", contact.data.id);
              await service.from("whatsapp_conversations").update({ last_message_at: sentAt }).eq("id", conversation.data.id);
              await markOutreachSent(service, message, userId, { provider: "meta_whatsapp", wa_message_id: primaryId, whatsapp_message_id: draft.data.id, attachment_count: attachments.length });
              return { ok: true, status: "sent", channel: "whatsapp", message_id: message.id, wa_message_id: primaryId, attachment_count: attachments.length };
            } catch (error) {
              const reason = errorText(error);
              if (primaryAttempted) {
                await service.from("whatsapp_messages").update({
                  status: primaryId ? "sent" : "failed",
                  wa_message_id: primaryId,
                  error: primaryId ? null : reason,
                  raw_payload: {
                    outreach_message_id: message.id,
                    primary_attempted: true,
                    primary_sent: Boolean(primaryId),
                    uncertain_delivery: !primaryId,
                    error: reason,
                  },
                }).eq("id", draft.data.id);
                await service.from("outreach_message_attachments").update({
                  status: "manual_required",
                  error: `Automatic attachment delivery stopped: ${reason}`.slice(0, 4000),
                }).eq("message_id", message.id).in("status", ["selected", "sending", "failed"]);
                await service.from("outreach_messages").update({
                  connector_response: {
                    ...record(message.connector_response),
                    provider: "meta_whatsapp",
                    wa_message_id: primaryId,
                    whatsapp_message_id: draft.data.id,
                    primary_attempted: true,
                    uncertain_delivery: !primaryId,
                    partial_delivery: true,
                  },
                }).eq("id", message.id);
                const manualReason = primaryId
                  ? `Primary WhatsApp text was sent (${primaryId}), but attachment delivery stopped safely: ${reason}. Automatic retry is blocked; use a separate reviewed follow-up.`
                  : `Primary WhatsApp delivery was attempted but provider acceptance is uncertain: ${reason}. Automatic retry is blocked to prevent duplicate text.`;
                return await markManual(service, message, userId, manualReason);
              }

              await service.from("whatsapp_messages").update({ status: "failed", error: reason }).eq("id", draft.data.id);
              await markFailed(service, message, userId, reason, "whatsapp");
              return { ok: false, status: "failed", channel: "whatsapp", message_id: message.id, error: reason };
            }
          }

          '''
          replace_between(
              outreach_path,
              "async function dispatchWhatsApp(service: Db, message: any, userId: string): Promise<any> {",
              "async function loadAttachments",
              whatsapp_function,
          )

          panel_path = "src/components/admin/OutreachApprovalPanel.tsx"
          replace_once(
              panel_path,
              'const dispatched = await supabase.functions.invoke("outreach-workflow-v2", { body: { action: "approve_and_send", message_id: message.id } });',
              'const dispatched = await supabase.functions.invoke("outreach-workflow-v2", { body: { action: "approve_and_send", message_id: message.id, owner_confirmed: true } });',
          )

          migration_path = Path("supabase/migrations/20260714122000_lead_activation_claims.sql")
          if migration_path.exists():
              raise SystemExit(f"{migration_path}: already exists")
          migration_path.write_text(r'''begin;

          alter table public.lead_candidates
            add column if not exists activation_claim_token uuid,
            add column if not exists activation_claimed_at timestamptz;

          create index if not exists lead_candidates_activation_claim_idx
            on public.lead_candidates (activation_claim_token)
            where activation_claim_token is not null;

          create index if not exists lead_candidates_activation_claimed_at_idx
            on public.lead_candidates (activation_claimed_at)
            where activation_claimed_at is not null;

          create or replace function public.claim_lead_candidates_for_activation(
            p_candidate_ids uuid[],
            p_claim_token uuid,
            p_limit integer default 25
          )
          returns setof public.lead_candidates
          language plpgsql
          security definer
          set search_path = public, pg_temp
          as $$
          begin
            if p_claim_token is null then
              raise exception 'claim token is required' using errcode = '22023';
            end if;

            update public.lead_candidates
            set activation_claim_token = null,
                activation_claimed_at = null
            where imported_lead_id is null
              and activation_claim_token is not null
              and activation_claimed_at < now() - interval '15 minutes';

            return query
            with requested as (
              select input.candidate_id
              from unnest(coalesce(p_candidate_ids, '{}'::uuid[])) with ordinality as input(candidate_id, position)
              where input.candidate_id is not null
              order by input.position
              limit least(greatest(coalesce(p_limit, 25), 1), 25)
            ),
            claimed as (
              update public.lead_candidates candidate
              set activation_claim_token = p_claim_token,
                  activation_claimed_at = now()
              from requested
              where candidate.id = requested.candidate_id
                and candidate.imported_lead_id is null
                and candidate.verification_status in ('verified', 'needs_review')
                and candidate.activation_claim_token is null
              returning candidate.*
            )
            select claimed.*
            from claimed;
          end;
          $$;

          revoke all on function public.claim_lead_candidates_for_activation(uuid[], uuid, integer) from public;
          revoke all on function public.claim_lead_candidates_for_activation(uuid[], uuid, integer) from anon;
          revoke all on function public.claim_lead_candidates_for_activation(uuid[], uuid, integer) from authenticated;
          grant execute on function public.claim_lead_candidates_for_activation(uuid[], uuid, integer) to service_role;

          commit;
          ''')

          test_path = Path("src/test/leadOutreachSafetyContracts.test.ts")
          test_path.write_text(r'''import { readFileSync } from "node:fs";
          import { resolve } from "node:path";
          import { describe, expect, it } from "vitest";

          const read = (path: string) => readFileSync(resolve(process.cwd(), path), "utf8");

          describe("lead and outreach safety contracts", () => {
            it("caps owner activation at 25 in backend and UI", () => {
              const backend = read("supabase/functions/lead-activation-channel-v2/index.ts");
              const panel = read("src/components/admin/ChannelCandidateActivationPanel.tsx");
              expect(backend).toContain("const MAX_BATCH = 25;");
              expect(panel).toContain("slice(0, 25)");
              expect(panel).not.toContain("slice(0, 50)");
              expect(panel).toContain("next.size < 25");
            });

            it("atomically claims candidates and releases stale locks", () => {
              const backend = read("supabase/functions/lead-activation-channel-v2/index.ts");
              const migration = read("supabase/migrations/20260714122000_lead_activation_claims.sql");
              expect(backend).toContain('service.rpc("claim_lead_candidates_for_activation"');
              expect(backend).toContain('.eq("activation_claim_token", claimToken)');
              expect(migration).toContain("activation_claim_token uuid");
              expect(migration).toContain("interval '15 minutes'");
              expect(migration).toContain("limit least(greatest(coalesce(p_limit, 25), 1), 25)");
            });

            it("keeps current-campaign identity maps active after fingerprint checks", () => {
              const staging = read("supabase/functions/lead-bulk-stage/index.ts");
              expect(staging).not.toMatch(/currentFingerprints\.set\([^;]+;\s*continue;/);
            });

            it("requires backend owner confirmation and an optimistic dispatch claim", () => {
              const backend = read("supabase/functions/outreach-workflow-v2/index.ts");
              const panel = read("src/components/admin/OutreachApprovalPanel.tsx");
              expect(backend).toContain("body.owner_confirmed !== true");
              expect(backend).toContain('.eq("status", message.status)');
              expect(backend).toContain('.eq("updated_at", message.updated_at)');
              expect(panel).toContain("owner_confirmed: true");
            });

            it("blocks automatic WhatsApp retry after any primary delivery attempt", () => {
              const backend = read("supabase/functions/outreach-workflow-v2/index.ts");
              expect(backend).toContain("primary_attempted: true");
              expect(backend).toContain("Automatic retry is blocked to prevent duplicate text");
              expect(backend).toContain("Primary WhatsApp text was sent");
              expect(backend).toContain('status: "manual_required"');
            });
          });
          ''')

          verification = Path("docs/verification/LEAD_OUTREACH_SAFETY_GUARDS_20260714.md")
          verification.parent.mkdir(parents=True, exist_ok=True)
          verification.write_text('''# Lead and Outreach Safety Guards — 2026-07-14

          - Buyer CRM activation is capped at 25 candidates per owner-confirmed checkpoint.
          - Candidate activation uses short-lived atomic claims with stale-lock recovery.
          - Same-campaign staging keeps fingerprint and contact-route duplicate checks active.
          - External dispatch requires server-side owner confirmation and an optimistic state claim.
          - WhatsApp primary-send attempts are never automatically retried; partial or uncertain delivery becomes manual-required.
          - No migrations were applied, no candidates were activated, and no external message was sent by this commit.
          ''')
          PY

