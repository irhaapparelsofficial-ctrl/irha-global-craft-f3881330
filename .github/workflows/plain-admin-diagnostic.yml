name: Plain Admin Test Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture test output
        shell: bash
        run: |
          set +e
          npm test -- --run > plain-admin-test.log 2>&1
          code=$?
          echo "$code" > plain-admin-test-exit-code.txt
          tail -n 400 plain-admin-test.log
          exit 0
      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: plain-admin-test-log
          path: |
            plain-admin-test.log
            plain-admin-test-exit-code.txt
          retention-days: 1
