name: Generate P0 Sports Product Media

on:
  push:
    branches:
      - catalog-media-p0-sports-2026-07-17
    paths:
      - .github/workflows/generate-p0-sports-media.yml
      - scripts/generate_p0_sports_media.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/generate-p0-sports-media.yml
      - scripts/generate_p0_sports_media.py

permissions:
  contents: write

concurrency:
  group: generate-p0-sports-media-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact media branch
        uses: actions/checkout@v4
        with:
          ref: catalog-media-p0-sports-2026-07-17
          fetch-depth: 2
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install locked image dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'Pillow==11.3.0'

      - name: Generate clean, branded and web assets
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_p0_sports_media.py 2>&1 | tee p0-sports-generator.log

      - name: Verify generated media
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          slugs = [
              "baseball-jersey",
              "basketball-mesh-jersey",
              "cricket-match-jersey",
              "rugby-match-jersey",
          ]
          for slug in slugs:
              base = Path("public/product-media") / slug
              manifest = json.loads((base / "media-manifest.json").read_text())
              assert len(manifest["views"]) == 4
              assert len(list((base / "clean").glob("*.png"))) == 4
              assert len(list((base / "branded").glob("*.png"))) == 4
              assert len(list((base / "web").glob("*.webp"))) == 4
              for row in manifest["views"]:
                  with Image.open(row["clean_path"]) as image:
                      assert image.size == (2048, 2048)
                  with Image.open(row["branded_path"]) as image:
                      assert image.size == (2048, 2048)
                  with Image.open(row["web_path"]) as image:
                      assert image.size == (1600, 1600)
          print("All four P0 sports image packs passed verification.")
          PY

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-sports-media-${{ github.run_id }}
          path: |
            p0-sports-generator.log
            public/product-media/p0-sports-media-manifest.json
          if-no-files-found: warn
          retention-days: 1

      - name: Commit generated assets to media branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git add public/product-media/baseball-jersey \
                  public/product-media/basketball-mesh-jersey \
                  public/product-media/cricket-match-jersey \
                  public/product-media/rugby-match-jersey \
                  public/product-media/p0-sports-media-manifest.json
          if git diff --cached --quiet; then
            echo "Media already matches committed outputs."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(media): add four P0 sports image packs [generated]"
          git push origin HEAD:catalog-media-p0-sports-2026-07-17
