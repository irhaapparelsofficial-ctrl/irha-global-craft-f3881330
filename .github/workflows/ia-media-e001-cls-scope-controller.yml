name: IA Media E001 Product Media Clearance Controller

on:
  pull_request:
    branches:
      - codex/ia-media-e001-recovery-base-v4
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-product-media-clearance:
    if: github.event.pull_request.head.ref == 'codex/ia-media-e001-cls-scope-controller'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_MAIN: 770569e087badea7d38e60b3582426264c514bdf
      EXPECTED_CLEAN: 4da1974734d801fbd2576d6fcb914f307cf5b0e7
      CLEAN_BRANCH: codex/ia-media-e001-clean-recovery
      OUTPUT_BRANCH: codex/ia-media-e001-media-clearance-content-v3

    steps:
      - name: Checkout exact clean recovery commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_CLEAN }}
          fetch-depth: 0

      - name: Verify immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$CLEAN_BRANCH" --no-tags
          test "$(git rev-parse HEAD)" = "$EXPECTED_CLEAN"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse "origin/$CLEAN_BRANCH")" = "$EXPECTED_CLEAN"

      - name: Keep transient fixed controls clear of product media
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          chat = Path("src/components/LiveChat.tsx")
          text = chat.read_text(encoding="utf-8")

          state_anchor = '  const [mobileViewportStyle, setMobileViewportStyle] = useState<CSSProperties>();\n'
          state_replacement = state_anchor + '  const [productMediaVisible, setProductMediaVisible] = useState(false);\n'
          if text.count(state_anchor) != 1:
              raise SystemExit("LiveChat state anchor changed")
          text = text.replace(state_anchor, state_replacement, 1)

          messages_effect_anchor = '  useEffect(() => {\n    messagesRef.current = messages;\n'
          media_effect = '\n'.join([
              '  useEffect(() => {',
              '    let observedRegion: Element | null = null;',
              '    const observer = new IntersectionObserver(([entry]) => {',
              '      setProductMediaVisible(Boolean(entry?.isIntersecting));',
              '    }, { threshold: 0.01 });',
              '',
              '    const syncObservedRegion = () => {',
              '      const gallery = document.querySelector(\'[aria-label="Product reference gallery"]\');',
              '      const nextRegion = gallery?.parentElement ?? null;',
              '      if (nextRegion === observedRegion) return;',
              '      if (observedRegion) observer.unobserve(observedRegion);',
              '      observedRegion = nextRegion;',
              '      if (observedRegion) observer.observe(observedRegion);',
              '      else setProductMediaVisible(false);',
              '    };',
              '',
              '    const mutationObserver = new MutationObserver(syncObservedRegion);',
              '    syncObservedRegion();',
              '    mutationObserver.observe(document.body, { childList: true, subtree: true });',
              '',
              '    return () => {',
              '      mutationObserver.disconnect();',
              '      observer.disconnect();',
              '    };',
              '  }, []);',
              '',
              '',
          ])
          if text.count(messages_effect_anchor) != 1:
              raise SystemExit("LiveChat messages effect anchor changed")
          text = text.replace(messages_effect_anchor, media_effect + messages_effect_anchor, 1)

          render_anchor = '      {!open && (\n'
          render_replacement = '      {!open && !productMediaVisible && (\n'
          if text.count(render_anchor) != 1:
              raise SystemExit("LiveChat launcher render anchor changed")
          text = text.replace(render_anchor, render_replacement, 1)
          chat.write_text(text, encoding="utf-8")

          script = Path("scripts/capture-ia-media-e001-visual-evidence.mjs")
          text = script.read_text(encoding="utf-8")

          wait_anchor = '''async function waitForApp(page) {
            await page.waitForLoadState("domcontentloaded");
            await page.locator("body").waitFor({ state: "visible" });
            await page.waitForTimeout(1000);
          }
          '''
          wait_replacement = wait_anchor + '''
          async function verifyAndDismissCookieConsent(page) {
            const dialog = page.locator('[aria-labelledby="cookie-consent-title"]');
            if (await dialog.count() === 0 || !(await dialog.isVisible())) {
              return { visible: false, choice: null };
            }

            const privacy = dialog.locator('a[href="/privacy-policy"]');
            const essential = dialog.getByRole("button", { name: /essential only/i });
            const optional = dialog.getByRole("button", { name: /accept optional/i });
            if (!(await privacy.isVisible()) || !(await essential.isVisible()) || !(await optional.isVisible())) {
              throw new Error("Cookie consent controls are incomplete");
            }

            await essential.click();
            await dialog.waitFor({ state: "hidden", timeout: 10_000 });
            return { visible: true, choice: "essential-only" };
          }
          '''
          if text.count(wait_anchor) != 1:
              raise SystemExit("visual waitForApp anchor changed")
          text = text.replace(wait_anchor, wait_replacement, 1)

          capture_function = '''async function captureStrictProduct(browser, origin, label, product, viewport) {
            const { context, page } = await createPage(browser, viewport);
            try {
              await page.goto(`${origin}${productPath(product.slug)}?ia_media_e001=${Date.now()}`, {
                waitUntil: "domcontentloaded",
                timeout: 45_000,
              });
              await waitForApp(page);
              const evidence = await inspectProduct(page, product, viewport);
              await page.screenshot({
                path: resolve(OUTPUT_ROOT, label, `${product.sku.toLowerCase()}-${viewport.name}.png`),
                fullPage: viewport.width >= 1280,
              });
              return evidence;
            } finally {
              await context.close();
            }
          }
          '''
          patched_capture = '''async function captureStrictProduct(browser, origin, label, product, viewport) {
            const { context, page } = await createPage(browser, viewport);
            try {
              await page.goto(`${origin}${productPath(product.slug)}?ia_media_e001=${Date.now()}`, {
                waitUntil: "domcontentloaded",
                timeout: 45_000,
              });
              await waitForApp(page);
              const consent = await verifyAndDismissCookieConsent(page);
              const evidence = await inspectProduct(page, product, viewport);
              await page.screenshot({
                path: resolve(OUTPUT_ROOT, label, `${product.sku.toLowerCase()}-${viewport.name}.png`),
                fullPage: viewport.width >= 1280,
              });
              return { ...evidence, consent };
            } finally {
              await context.close();
            }
          }
          '''
          if text.count(capture_function) != 1:
              raise SystemExit("visual captureStrictProduct anchor changed")
          text = text.replace(capture_function, patched_capture, 1)
          script.write_text(text, encoding="utf-8")
          PY

          node --check scripts/capture-ia-media-e001-visual-evidence.mjs
          grep -Fq 'if (layoutShift > 0.25)' scripts/capture-ia-media-e001-visual-evidence.mjs
          grep -Fq 'fixed UI overlaps product media' scripts/capture-ia-media-e001-visual-evidence.mjs
          grep -Fq 'choice: "essential-only"' scripts/capture-ia-media-e001-visual-evidence.mjs
          grep -Fq '!open && !productMediaVisible' src/components/LiveChat.tsx
          grep -Fq 'Product reference gallery' src/components/LiveChat.tsx
          git diff --check
          git diff --name-only | sort > /tmp/actual.txt
          printf '%s\n' \
            scripts/capture-ia-media-e001-visual-evidence.mjs \
            src/components/LiveChat.tsx | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Install exact dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Verify changed source
        shell: bash
        run: |
          set -euo pipefail
          npx eslint src/components/LiveChat.tsx scripts/capture-ia-media-e001-visual-evidence.mjs
          npx tsc --noEmit

      - name: Publish verified content-only commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$OUTPUT_BRANCH"
          git add \
            scripts/capture-ia-media-e001-visual-evidence.mjs \
            src/components/LiveChat.tsx
          git commit -m "fix(media): keep support clear while product media is visible"
          git push origin "HEAD:refs/heads/$OUTPUT_BRANCH"
          {
            echo "## IA-MEDIA-E001 product media clearance"
            echo "- Source clean SHA: \`$EXPECTED_CLEAN\`"
            echo "- Output commit: \`$(git rev-parse HEAD)\`"
            echo "- Visual overlap assertion retained"
            echo "- CLS threshold retained: \`0.25\`"
            echo "- Production mutation: **none**"
          } >> "$GITHUB_STEP_SUMMARY"
