name: Diagnose static Lighthouse audits

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-static-lighthouse-audits-20260715.yml"
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: >-
      github.event_name == 'push' ||
      (github.event.issue.number == 375 &&
       github.event.comment.body == '/diagnose-static-lighthouse' &&
       github.event.comment.user.login == 'irhaapparelsofficial-ctrl')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run Lighthouse and capture exact failed audit payloads
        shell: bash
        run: |
          set -euo pipefail
          npx --yes lighthouse@12.8.2 \
            "https://irhaapparels.com/de/bekleidungshersteller-deutschland?audit_payload=${GITHUB_SHA::12}" \
            --output=json \
            --output-path=/tmp/lighthouse.json \
            --only-categories=seo,best-practices,accessibility,performance \
            --form-factor=mobile \
            --screenEmulation.mobile=true \
            --throttling-method=simulate \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"

          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/lighthouse.json', 'utf8'));
          const ids = ['robots-txt', 'errors-in-console', 'inspector-issues'];
          const clean = (value) => String(value ?? '').replace(/```/g, '').replace(/\r/g, '');
          let markdown = '## Exact remaining Lighthouse audit payloads\n\n';
          for (const id of ids) {
            const audit = report.audits?.[id];
            markdown += `### \`${id}\`\n\n`;
            markdown += `- Score: ${audit?.score}\n`;
            markdown += `- Title: ${clean(audit?.title)}\n`;
            markdown += `- Display: ${clean(audit?.displayValue || 'none')}\n`;
            markdown += `- Explanation: ${clean(audit?.explanation || 'none')}\n\n`;
            markdown += '```json\n';
            markdown += JSON.stringify(audit?.details || null, null, 2).slice(0, 12000);
            markdown += '\n```\n\n';
          }
          fs.writeFileSync('/tmp/audit-payloads.md', markdown);
          console.log(markdown);
          NODE

      - name: Record diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 375 --repo "$GITHUB_REPOSITORY" --body-file /tmp/audit-payloads.md
