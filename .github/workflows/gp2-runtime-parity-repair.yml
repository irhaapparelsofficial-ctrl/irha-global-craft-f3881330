name: GP-2 Runtime Parity Repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "supabase/reconciliation/sec-m03-function-reconciliation.json"
      - ".github/workflows/gp2-runtime-parity-repair.yml"

permissions:
  contents: write
  statuses: read
  pull-requests: read

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      SUPABASE_PROJECT_ID: pvzjiozismyxqrzmtfbi
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.39.2

      - name: Require successful exact-head Quality Gate
        shell: bash
        run: |
          set -euo pipefail
          state=pending
          for attempt in $(seq 1 80); do
            status_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$CANDIDATE_SHA/status")"
            state="$(printf '%s' "$status_json" | jq -r '[.statuses[] | select(.context == "Irha Quality Gate")][0].state // "pending"')"
            case "$state" in
              success) break ;;
              failure|error)
                echo "Exact candidate Quality Gate failed: $state"
                exit 1
                ;;
            esac
            test "$attempt" -lt 80
            sleep 15
          done
          test "$state" = success

      - name: Lock source, branch, main and stale live identities
        shell: bash
        run: |
          set -euo pipefail
          test "$HEAD_BRANCH" = "gp2/runtime-parity-closure-20260809"
          test -n "$SUPABASE_ACCESS_TOKEN"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"

          latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          current_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/897" --jq '.head.sha')"
          test "$latest_main" = "$BASE_SHA"
          test "$current_head" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"

          git diff --quiet "$BASE_SHA" "$CANDIDATE_SHA" -- \
            supabase/functions/generate-mockup/index.ts \
            supabase/functions/live-chat/index.ts \
            supabase/functions/site-visitor/index.ts \
            supabase/functions/_shared/durable-rate-limit.ts \
            supabase/config.toml

          jq -e '
            (.functions | length) == 3 and
            ([.functions[].name] | sort) == ["generate-mockup","live-chat","site-visitor"] and
            (.functions[] | select(.name == "generate-mockup") | .minimum_version == 24 and .verify_jwt == false) and
            (.functions[] | select(.name == "live-chat") | .minimum_version == 25 and .verify_jwt == false) and
            (.functions[] | select(.name == "site-visitor") | .minimum_version == 22 and .verify_jwt == false)
          ' supabase/reconciliation/sec-m03-function-reconciliation.json >/dev/null

          curl -fsS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/functions" \
            > /tmp/functions-before.json

          jq -e '
            any(.[]; (.name // .slug) == "generate-mockup" and .version == 23 and .verify_jwt == false and .ezbr_sha256 == "459e1b5f56d082949fee5e27f9df7b5b9131eebfe5ca9a0a05aa2ffa87ff59be") and
            any(.[]; (.name // .slug) == "live-chat" and .version == 24 and .verify_jwt == false and .ezbr_sha256 == "eb4a6b60ebc1f8097344db20a56dad82162edfeb8e71b3e018574302952c0763") and
            any(.[]; (.name // .slug) == "site-visitor" and .version == 22 and .verify_jwt == false and .ezbr_sha256 == "3ede6512943f045d5f70eaddd6f74226b8f95fada3d6da3220e6679200926a58")
          ' /tmp/functions-before.json >/dev/null

      - name: Reconfirm exact current main immediately before mutation
        shell: bash
        run: |
          set -euo pipefail
          latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          current_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/897" --jq '.head.sha')"
          test "$latest_main" = "$BASE_SHA"
          test "$current_head" = "$CANDIDATE_SHA"

      - name: Deploy only the two proven stale shared-helper consumers
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy generate-mockup --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          supabase functions deploy live-chat --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Verify exact live sources and refresh canonical registries
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/functions" \
            > /tmp/functions-after.json

          jq -e '
            any(.[]; (.name // .slug) == "generate-mockup" and .version >= 24 and .verify_jwt == false) and
            any(.[]; (.name // .slug) == "live-chat" and .version >= 25 and .verify_jwt == false) and
            any(.[]; (.name // .slug) == "site-visitor" and .version == 22 and .verify_jwt == false)
          ' /tmp/functions-after.json >/dev/null

          rm -rf /tmp/sec-m03-live-functions
          SEC_M03_PARITY_REFRESH_PLAN=supabase/reconciliation/sec-m03-parity-refresh.json \
            SEC_M03_LIVE_FUNCTION_DIRECTORY=/tmp/sec-m03-live-functions \
            node scripts/ci/fetch-supabase-edge-sources.mjs

          SEC_M03_PARITY_REFRESH_PLAN=supabase/reconciliation/sec-m03-parity-refresh.json \
            SEC_M03_LIVE_FUNCTION_DIRECTORY=/tmp/sec-m03-live-functions \
            SEC_M03_SOURCE_EVIDENCE=/tmp/sec-m03-deployed-source-evidence.json \
            SOURCE_SHA="$CANDIDATE_SHA" \
            node scripts/ci/verify-sec-m03-deployed-sources.mjs

          SEC_M03_PARITY_REFRESH_PLAN=supabase/reconciliation/sec-m03-parity-refresh.json \
            SEC_M03_LIVE_INVENTORY=/tmp/functions-after.json \
            SEC_M03_REGISTRY_EVIDENCE=/tmp/sec-m03-registry-refresh-evidence.json \
            SOURCE_SHA="$CANDIDATE_SHA" \
            node scripts/ci/refresh-sec-m03-live-parity.mjs

      - name: Generate exact canonical production evidence twice
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.39.2 gen types typescript \
            --project-id "$SUPABASE_PROJECT_ID" \
            --schema public > src/integrations/supabase/types.ts
          test -s src/integrations/supabase/types.ts
          MIGRATION_PROVENANCE_MODE=write node scripts/ci/generate-migration-provenance.mjs
          SUPABASE_MANIFEST_MODE=write node scripts/ci/generate-supabase-manifest.mjs
          node scripts/verify-supabase-parity.mjs

          sha256sum \
            src/integrations/supabase/types.ts \
            supabase/deployment-parity/functions-f1.json \
            supabase/deployment-parity/functions-f2.json \
            supabase/deployment-parity/migration-provenance.json \
            supabase/deployment-parity/manifest.json \
            > /tmp/first.sha256

          npx --yes supabase@2.39.2 gen types typescript \
            --project-id "$SUPABASE_PROJECT_ID" \
            --schema public > src/integrations/supabase/types.ts
          MIGRATION_PROVENANCE_MODE=write node scripts/ci/generate-migration-provenance.mjs
          SUPABASE_MANIFEST_MODE=write node scripts/ci/generate-supabase-manifest.mjs
          node scripts/verify-supabase-parity.mjs
          sha256sum -c /tmp/first.sha256

      - name: Seal evidence and remove this temporary privileged workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/integrations/supabase/types.ts \
            supabase/deployment-parity/functions-f1.json \
            supabase/deployment-parity/functions-f2.json \
            supabase/deployment-parity/migration-provenance.json \
            supabase/deployment-parity/manifest.json \
            supabase/reconciliation/sec-m03-function-reconciliation.json
          git rm .github/workflows/gp2-runtime-parity-repair.yml
          git diff --cached --check
          git commit -m "chore(gp2): seal exact runtime parity evidence"
          git push origin "HEAD:$HEAD_BRANCH"
