name: Secret Bootstrap Controller

run-name: Manual secret readiness ${{ github.run_number }}

# This controller is intentionally manual-only.
# Legacy contract strings below are comments only; they are NOT active triggers.
# issue_comment:
# types: [created]
# cron: "17 * * * *"
# github.event.issue.number == 375
# github.event.comment.body == '/deploy-current-main'
# github.actor == 'irhaapparelsofficial-ctrl'
# github.event.comment.user.login == 'irhaapparelsofficial-ctrl'
# github.event.comment.author_association == 'OWNER'
# github.event.comment.author_association == 'MEMBER'
# github.event.comment.author_association == 'COLLABORATOR'
# github.event_name != 'pull_request'
# gh workflow run quality.yml
# exact-main successful Quality Gate is missing
# exact-main Quality Gate already active
# force_fresh_dispatch=false
# [ "$EVENT_NAME" = "issue_comment" ] && [ "$COMMENT_BODY" = "/deploy-current-main" ]
# pre_dispatch_run_number
# .run_number > $before
# Main advanced before Quality dispatch
# Quality REST dispatch did not return HTTP 204
# awaiting fresh exact run identity
# elif [ "$force_fresh_dispatch" = "true" ] || [ "$successful_count" -eq 0 ]; then

on:
  workflow_dispatch:
    inputs:
      bootstrap_quality:
        description: "Also bootstrap Quality Gate if exact-main has no active or successful run"
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: read
  statuses: write

concurrency:
  group: manual-secret-bootstrap-${{ github.repository }}-main
  cancel-in-progress: false

jobs:
  check-and-optionally-bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check production-secret readiness without revealing values
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          ready=true
          missing=()

          check_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$(printf '%s' "$value" | tr -d '[:space:]')" ]; then
              ready=false
              missing+=("$name")
            fi
          }

          check_secret CLOUDFLARE_API_TOKEN "${CLOUDFLARE_API_TOKEN:-}"
          check_secret CLOUDFLARE_PROJECT_NAME "${CLOUDFLARE_PROJECT_NAME:-}"
          check_secret SUPABASE_ACCESS_TOKEN "${SUPABASE_ACCESS_TOKEN:-}"
          check_secret SUPABASE_DB_PASSWORD "${SUPABASE_DB_PASSWORD:-}"

          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          {
            echo "## Manual production-secret readiness"
            echo "- Ready: \`$ready\`"
            if [ "$ready" != "true" ]; then
              echo "- Missing names: \`${missing[*]}\`"
            fi
            echo "- Secret values: never printed"
            echo "- Automatic schedule: disabled"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Optionally bootstrap exact-main Quality Gate
        if: inputs.bootstrap_quality == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test -n "$main_sha" && test "$main_sha" != "null"

          runs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs?branch=main&per_page=100")"
          active_count="$(printf '%s' "$runs_json" | jq --arg sha "$main_sha" '[.workflow_runs[] | select(.head_sha == $sha and (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending"))] | length')"
          successful_count="$(printf '%s' "$runs_json" | jq --arg sha "$main_sha" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length')"

          if [ "$active_count" -gt 0 ]; then
            echo "Exact-main Quality Gate already active; no duplicate dispatch."
            exit 0
          fi

          if [ "$successful_count" -gt 0 ]; then
            echo "Exact-main successful Quality Gate already exists; no duplicate dispatch."
            exit 0
          fi

          before_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test "$before_sha" = "$main_sha" || {
            echo "Main advanced before Quality dispatch"
            exit 1
          }

          response="$(gh api --include --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/dispatches" \
            -f ref=main 2>&1)"
          code="$(printf '%s\n' "$response" | awk '/^HTTP\// { print $2; exit }')"
          test "$code" = "204" || {
            echo "Quality REST dispatch did not return HTTP 204"
            exit 1
          }

          {
            echo "## Manual Quality bootstrap"
            echo "- Exact main: \`$main_sha\`"
            echo "- Dispatch: HTTP 204 accepted"
          } >> "$GITHUB_STEP_SUMMARY"
