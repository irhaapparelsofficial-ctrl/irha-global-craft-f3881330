name: Secret Bootstrap Controller

run-name: Secret bootstrap readiness · ${{ github.run_number }}

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: secret-bootstrap-controller
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Detect complete core secret set
        id: readiness
        shell: bash
        run: |
          set -euo pipefail
          ready=true
          missing=()

          check_secret() {
            name="$1"
            value="$2"
            if [ -z "$(printf '%s' "$value" | tr -d '[:space:]')" ]; then
              ready=false
              missing+=("$name")
            fi
          }

          check_secret CLOUDFLARE_API_TOKEN "${CLOUDFLARE_API_TOKEN:-}"
          check_secret CLOUDFLARE_PROJECT_NAME "${CLOUDFLARE_PROJECT_NAME:-}"
          check_secret SUPABASE_ACCESS_TOKEN "${SUPABASE_ACCESS_TOKEN:-}"
          check_secret SUPABASE_DB_PASSWORD "${SUPABASE_DB_PASSWORD:-}"

          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" = "true" ]; then
            echo "All core secrets are present."
          else
            printf 'Missing core secret names: %s\n' "${missing[*]}"
          fi

          {
            echo "## Secret Bootstrap Controller"
            echo "- Core secret set ready: \`$ready\`"
            if [ "$ready" != "true" ]; then
              echo "- Missing names: \`${missing[*]}\`"
              echo "- Verification/deployment state: intentionally deferred"
              echo "- Result: success; no workflow dispatch and no red failure"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout controller utilities
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Decide whether exact-main full verification must be dispatched
        if: steps.readiness.outputs.ready == 'true'
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          runs_json="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs?branch=main&per_page=30")"

          active_count="$(printf '%s' "$runs_json" | jq --arg sha "$main_sha" '[.workflow_runs[] | select(.head_sha == $sha and (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending"))] | length')"
          artifact_json="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=production-dist-$main_sha&per_page=10")"
          artifact_count="$(printf '%s' "$artifact_json" | jq '[.artifacts[] | select(.expired == false)] | length')"

          cloudflare_json="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cloudflare-pages-auto-production.yml/runs?branch=main&per_page=30")"
          cloudflare_success="$(printf '%s' "$cloudflare_json" | jq --arg sha "$main_sha" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length')"

          supabase_json="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/actions/workflows/supabase-functions-auto.yml/runs?branch=main&per_page=30" 2>/dev/null || printf '{"workflow_runs":[]}')"
          supabase_success="$(printf '%s' "$supabase_json" | jq --arg sha "$main_sha" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length')"

          should_dispatch=false
          reason="already synchronized"
          if [ "$active_count" -gt 0 ]; then
            reason="exact-main Quality Gate already active"
          elif [ "$artifact_count" -eq 0 ]; then
            should_dispatch=true
            reason="exact-main full-verification artifact is missing"
          elif [ "$cloudflare_success" -eq 0 ] || [ "$supabase_success" -eq 0 ]; then
            should_dispatch=true
            reason="one or more secret-dependent sync workflows still need an exact-main trigger"
          fi

          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "should_dispatch=$should_dispatch" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

          {
            echo "- Exact current main: \`$main_sha\`"
            echo "- Full-verification artifact count: \`$artifact_count\`"
            echo "- Cloudflare success count: \`$cloudflare_success\`"
            echo "- Supabase functions success count: \`$supabase_success\`"
            echo "- Dispatch required: \`$should_dispatch\`"
            echo "- Reason: $reason"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start exact-main full verification and automatic sync chain
        if: steps.readiness.outputs.ready == 'true' && steps.dispatch.outputs.should_dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/retry.sh 3 5 -- gh workflow run quality.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "- Action: exact-main Quality Gate dispatched; downstream Cloudflare and Supabase sync workflows will follow automatically" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep synchronized state quiet
        if: steps.readiness.outputs.ready == 'true' && steps.dispatch.outputs.should_dispatch != 'true'
        shell: bash
        run: echo "- Action: no duplicate dispatch" >> "$GITHUB_STEP_SUMMARY"
