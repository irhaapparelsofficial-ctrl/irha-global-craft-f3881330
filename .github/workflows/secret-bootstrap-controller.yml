name: GP-4 Temporary Route Parity Dispatch

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/secret-bootstrap-controller.yml"

permissions:
  actions: write
  contents: read
  statuses: read

jobs:
  dispatch-current-main-route-parity:
    if: github.event.pull_request.head.ref == 'ops/gp4-route-parity-dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Dispatch authoritative Production Route Parity for exact current main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          main_sha="$(gh api "repos/$repo/commits/main" --jq '.sha')"
          test "$main_sha" = '8b0e0f3fab6f2319f3f9f129e27174c9c04480b0' || {
            echo "Current main advanced to $main_sha; refusing stale GP-4 dispatch"
            exit 1
          }

          status_json="$(gh api "repos/$repo/commits/$main_sha/status")"
          required=(
            "Irha Quality Gate"
            "Irha Cloudflare Production"
            "Irha Search Discovery"
            "Irha Cache Consistency"
            "Irha Brand Live"
          )
          for context in "${required[@]}"; do
            state="$(printf '%s' "$status_json" | jq -r --arg context "$context" '[.statuses[] | select(.context == $context)][0].state // "missing"')"
            test "$state" = success || {
              echo "Required exact-main status not green: $context=$state"
              exit 1
            }
          done

          runs_json="$(gh api "repos/$repo/actions/workflows/318310796/runs?branch=main&per_page=50")"
          active="$(printf '%s' "$runs_json" | jq --arg sha "$main_sha" '[.workflow_runs[] | select(.head_sha == $sha and .event == "workflow_dispatch" and (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending"))] | length')"
          success="$(printf '%s' "$runs_json" | jq --arg sha "$main_sha" '[.workflow_runs[] | select(.head_sha == $sha and .event == "workflow_dispatch" and .conclusion == "success")] | length')"
          if [ "$success" -gt 0 ]; then
            echo "Exact-main Production Route Parity already succeeded; no duplicate dispatch."
            exit 0
          fi
          if [ "$active" -gt 0 ]; then
            echo "Exact-main Production Route Parity already active; no duplicate dispatch."
            exit 0
          fi

          gh api --method POST "repos/$repo/actions/workflows/318310796/dispatches" -f ref=main
          echo "Production Route Parity dispatch accepted for $main_sha"
