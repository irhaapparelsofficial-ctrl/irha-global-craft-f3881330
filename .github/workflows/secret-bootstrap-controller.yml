name: Secret Bootstrap Controller

run-name: Secret bootstrap readiness ${{ github.run_number }}

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/secret-bootstrap-controller.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/secret-bootstrap-controller.yml"
  issue_comment:
    types: [created]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: read
  statuses: read

concurrency:
  group: secret-bootstrap-controller
  cancel-in-progress: true

jobs:
  activate:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.number == 375 &&
        github.event.comment.body == '/deploy-current-main' &&
        (
          github.actor == 'irhaapparelsofficial-ctrl' ||
          github.event.comment.user.login == 'irhaapparelsofficial-ctrl' ||
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Record authorized owner command
        if: github.event_name == 'issue_comment'
        shell: bash
        run: |
          {
            echo "## Authorized exact-main command"
            echo "- Issue: #${{ github.event.issue.number }}"
            echo "- Actor: \`${{ github.actor }}\`"
            echo "- Comment login: \`${{ github.event.comment.user.login }}\`"
            echo "- Association: \`${{ github.event.comment.author_association }}\`"
            echo "- Command: \`${{ github.event.comment.body }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Detect complete core secret set
        id: readiness
        shell: bash
        run: |
          set -euo pipefail
          ready=true
          missing=()

          check_secret() {
            name="$1"
            value="$2"
            if [ -z "$(printf '%s' "$value" | tr -d '[:space:]')" ]; then
              ready=false
              missing+=("$name")
            fi
          }

          check_secret CLOUDFLARE_API_TOKEN "${CLOUDFLARE_API_TOKEN:-}"
          check_secret CLOUDFLARE_PROJECT_NAME "${CLOUDFLARE_PROJECT_NAME:-}"
          check_secret SUPABASE_ACCESS_TOKEN "${SUPABASE_ACCESS_TOKEN:-}"
          check_secret SUPABASE_DB_PASSWORD "${SUPABASE_DB_PASSWORD:-}"

          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" = "true" ]; then
            echo "All core secret names are populated."
          else
            printf 'Missing core secret names: %s\n' "${missing[*]}"
          fi

          {
            echo "## Secret Bootstrap Controller"
            echo "- Core secret set ready: \`$ready\`"
            if [ "$ready" != "true" ]; then
              echo "- Missing names: \`${missing[*]}\`"
              echo "- Deployment state: intentionally waiting"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout controller utilities
        if: steps.readiness.outputs.ready == 'true' && github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Decide whether exact-main verification must be dispatched
        if: steps.readiness.outputs.ready == 'true' && github.event_name != 'pull_request'
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          quality_runs="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs?branch=main&per_page=30")"
          active_count="$(printf '%s' "$quality_runs" | jq --arg sha "$main_sha" '[.workflow_runs[] | select(.head_sha == $sha and (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending"))] | length')"
          successful_count="$(printf '%s' "$quality_runs" | jq --arg sha "$main_sha" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length')"

          should_dispatch=false
          reason="exact current main already verified"
          if [ "$active_count" -gt 0 ]; then
            reason="exact-main Quality Gate already active"
          elif [ "$successful_count" -eq 0 ]; then
            should_dispatch=true
            reason="exact-main successful Quality Gate is missing"
          fi

          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "should_dispatch=$should_dispatch" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

          {
            echo "- Exact current main: \`$main_sha\`"
            echo "- Active exact-main Quality Gate count: \`$active_count\`"
            echo "- Successful exact-main Quality Gate count: \`$successful_count\`"
            echo "- Dispatch required: \`$should_dispatch\`"
            echo "- Reason: $reason"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start exact-main verification and automatic sync chain
        if: steps.readiness.outputs.ready == 'true' && github.event_name != 'pull_request' && steps.dispatch.outputs.should_dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/retry.sh 3 5 -- gh workflow run quality.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "- Action: exact-main Quality Gate dispatched" >> "$GITHUB_STEP_SUMMARY"

      - name: Record pull-request validation outcome
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          echo "- Pull-request validation only; no production workflow dispatched" >> "$GITHUB_STEP_SUMMARY"

  route-parity:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 375 &&
      github.event.comment.body == '/run-production-route-parity' &&
      (
        github.actor == 'irhaapparelsofficial-ctrl' ||
        github.event.comment.user.login == 'irhaapparelsofficial-ctrl' ||
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout exact current main utilities
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact deployed current-main release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          checked_out="$(git rev-parse HEAD)"
          test "$checked_out" = "$main_sha" || {
            echo "Checked out $checked_out instead of current main $main_sha"
            exit 1
          }

          status_json="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/commits/$main_sha/status")"
          required_contexts=(
            "Irha Quality Gate"
            "Irha Cloudflare Production"
            "Irha Search Discovery"
            "Irha Brand Live"
          )

          for context in "${required_contexts[@]}"; do
            state="$(printf '%s' "$status_json" | jq -r --arg context "$context" '[.statuses[] | select(.context == $context)][0].state // "missing"')"
            test "$state" = "success" || {
              echo "Required exact-main status is not green: $context=$state"
              exit 1
            }
          done

          cache_bust="${main_sha::12}-$GITHUB_RUN_ID-$RANDOM"
          bash scripts/ci/retry.sh 3 5 -- curl -fsSL --connect-timeout 10 --max-time 40 \
            -H 'Cache-Control: no-cache' \
            "https://irhaapparels.com/build.json?route_parity_dispatch=$cache_bust" \
            -o /tmp/live-build.json

          jq -e --arg sha "$main_sha" \
            '.source_branch == "main" and .source_commit == $sha and .source_identity_state == "verified"' \
            /tmp/live-build.json >/dev/null

          echo "source_sha=$main_sha" >> "$GITHUB_OUTPUT"
          {
            echo "## Authorized Production Route Parity dispatch"
            echo "- Exact current main: \`$main_sha\`"
            echo "- Required release statuses: all green"
            echo "- Live build identity: exact and verified"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch exact-main Production Route Parity once
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          latest_main="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test "$latest_main" = "$SOURCE_SHA" || {
            echo "Main advanced from $SOURCE_SHA to $latest_main; parity dispatch refused"
            exit 1
          }

          runs_json="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/actions/workflows/production-route-parity.yml/runs?branch=main&per_page=50")"
          active_count="$(printf '%s' "$runs_json" | jq --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.head_sha == $sha and (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending"))] | length')"
          successful_count="$(printf '%s' "$runs_json" | jq --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length')"

          if [ "$successful_count" -gt 0 ]; then
            echo "- Action: skipped; exact-main Production Route Parity already succeeded" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$active_count" -gt 0 ]; then
            echo "- Action: skipped; exact-main Production Route Parity already active" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          bash scripts/ci/retry.sh 3 5 -- gh workflow run production-route-parity.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "- Action: exact-main Production Route Parity dispatched" >> "$GITHUB_STEP_SUMMARY"
