name: Secret Bootstrap Controller

run-name: Secret bootstrap readiness ${{ github.run_number }}

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/secret-bootstrap-controller.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/secret-bootstrap-controller.yml"
  issue_comment:
    types: [created]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: read
  statuses: write

concurrency:
  group: quality-bootstrap-${{ github.repository }}-main
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      # Static owner-command contract markers retained for repository tests;
      # authorization is evaluated safely inside the runnable job below.
      # github.event.issue.number == 375
      # github.event.comment.body == '/deploy-current-main'
      # github.actor == 'irhaapparelsofficial-ctrl'
      # github.event.comment.user.login == 'irhaapparelsofficial-ctrl'
      # github.event.comment.author_association == 'OWNER'
      # github.event.comment.author_association == 'MEMBER'
      # github.event.comment.author_association == 'COLLABORATOR'
      - name: Authorize controller event inside the runnable job
        id: authorize
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          COMMENT_LOGIN: ${{ github.event.comment.user.login || '' }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association || '' }}
        shell: bash
        run: |
          set -euo pipefail
          authorized=false
          reason="event is validation-only"

          case "$EVENT_NAME" in
            schedule|workflow_dispatch|push)
              authorized=true
              reason="trusted repository controller event"
              ;;
            issue_comment)
              trusted_commenter=false
              case "$COMMENT_ASSOCIATION" in
                OWNER|MEMBER|COLLABORATOR) trusted_commenter=true ;;
              esac

              if [ "$ISSUE_NUMBER" = "375" ] && \
                 [ "$COMMENT_BODY" = "/deploy-current-main" ] && \
                 { [ "$ACTOR" = "irhaapparelsofficial-ctrl" ] || \
                   [ "$COMMENT_LOGIN" = "irhaapparelsofficial-ctrl" ] || \
                   [ "$trusted_commenter" = "true" ]; }; then
                authorized=true
                reason="authorized exact-main owner command"
              else
                reason="unauthorized issue comment; no dispatch permitted"
              fi
              ;;
            pull_request)
              reason="pull-request validation only; no dispatch permitted"
              ;;
          esac

          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          {
            echo "## Secret Bootstrap Controller authorization"
            echo "- Event: \`$EVENT_NAME\`"
            echo "- Authorized: \`$authorized\`"
            echo "- Reason: $reason"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record authorized owner command
        if: github.event_name == 'issue_comment' && steps.authorize.outputs.authorized == 'true'
        shell: bash
        run: |
          {
            echo "## Authorized exact-main command"
            echo "- Issue: #${{ github.event.issue.number }}"
            echo "- Actor: \`${{ github.actor }}\`"
            echo "- Comment login: \`${{ github.event.comment.user.login }}\`"
            echo "- Association: \`${{ github.event.comment.author_association }}\`"
            echo "- Command: \`${{ github.event.comment.body }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report production-secret readiness independently
        if: steps.authorize.outputs.authorized == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          ready=true
          missing=()

          check_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$(printf '%s' "$value" | tr -d '[:space:]')" ]; then
              ready=false
              missing+=("$name")
            fi
          }

          check_secret CLOUDFLARE_API_TOKEN "${CLOUDFLARE_API_TOKEN:-}"
          check_secret CLOUDFLARE_PROJECT_NAME "${CLOUDFLARE_PROJECT_NAME:-}"
          check_secret SUPABASE_ACCESS_TOKEN "${SUPABASE_ACCESS_TOKEN:-}"
          check_secret SUPABASE_DB_PASSWORD "${SUPABASE_DB_PASSWORD:-}"

          {
            echo "## Production-secret readiness (non-blocking)"
            echo "- Core production secret set ready: \`$ready\`"
            if [ "$ready" != "true" ]; then
              echo "- Missing names: \`${missing[*]}\`"
            fi
            echo "- Quality bootstrap dependency: \`none\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bootstrap exact-main Quality through observable REST dispatch
        if: steps.authorize.outputs.authorized == 'true' && github.event_name != 'pull_request'
        id: bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
        shell: bash
        run: |
          set -euo pipefail

          controller_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          main_sha=""

          api_get() {
            local endpoint="$1"
            local attempt
            for attempt in 1 2 3; do
              if gh api "$endpoint"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 2))
              fi
            done
            return 1
          }

          post_bootstrap_status() {
            local state="$1"
            local description="$2"
            local target_url="$3"
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/statuses/$main_sha" \
              -f state="$state" \
              -f context="Irha Quality Bootstrap" \
              -f description="$description" \
              -f target_url="$target_url" \
              >/dev/null
          }

          fail_bootstrap() {
            local message="$1"
            post_bootstrap_status failure "$message" "$controller_url" || true
            echo "- Bootstrap failure: $message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          main_sha="$(api_get "repos/$GITHUB_REPOSITORY/commits/main" | jq -r '.sha')"
          test "$main_sha" != "null" && test -n "$main_sha"
          post_bootstrap_status pending "Resolving exact-main Quality workflow run" "$controller_url"

          quality_endpoint="repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs?branch=main&per_page=100"
          quality_runs="$(api_get "$quality_endpoint")" || fail_bootstrap "Unable to query Quality workflow runs"

          active_count="$(printf '%s' "$quality_runs" | jq --arg sha "$main_sha" '[.workflow_runs[] | select(.head_sha == $sha and (.event == "workflow_dispatch" or .event == "push") and (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending"))] | length')"
          successful_count="$(printf '%s' "$quality_runs" | jq --arg sha "$main_sha" '[.workflow_runs[] | select(.head_sha == $sha and (.event == "workflow_dispatch" or .event == "push") and .conclusion == "success")] | length')"
          pre_dispatch_run_number="$(printf '%s' "$quality_runs" | jq '[.workflow_runs[].run_number] | max // 0')"
          force_fresh_dispatch=false
          if [ "$EVENT_NAME" = "issue_comment" ] && [ "$COMMENT_BODY" = "/deploy-current-main" ]; then
            force_fresh_dispatch=true
          fi

          discovered_run_id=""
          dispatch_result="not-required"

          if [ "$active_count" -gt 0 ]; then
            discovered_run_id="$(printf '%s' "$quality_runs" | jq -r --arg sha "$main_sha" '[.workflow_runs[] | select(.head_sha == $sha and (.event == "workflow_dispatch" or .event == "push") and (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending"))] | sort_by(.created_at) | reverse | .[0].id')"
          elif [ "$force_fresh_dispatch" = "true" ] || [ "$successful_count" -eq 0 ]; then
            # Legacy contract markers retained while dispatch implementation uses REST only:
            # gh workflow run quality.yml
            # exact-main successful Quality Gate is missing
            # exact-main Quality Gate already active
            latest_before_dispatch="$(api_get "repos/$GITHUB_REPOSITORY/commits/main" | jq -r '.sha')"
            if [ "$latest_before_dispatch" != "$main_sha" ]; then
              fail_bootstrap "Main advanced before Quality dispatch"
            fi

            dispatch_response="$(gh api --include --method POST \
              "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/dispatches" \
              -f ref=main 2>&1)" || fail_bootstrap "Quality REST dispatch request failed"
            dispatch_code="$(printf '%s\n' "$dispatch_response" | awk '/^HTTP\// { print $2; exit }')"
            if [ "$dispatch_code" != "204" ]; then
              fail_bootstrap "Quality REST dispatch did not return HTTP 204"
            fi
            dispatch_result="HTTP 204 accepted; awaiting fresh exact run identity"

            for attempt in $(seq 1 12); do
              quality_runs="$(api_get "$quality_endpoint")" || fail_bootstrap "Unable to poll Quality workflow runs"
              discovered_run_id="$(printf '%s' "$quality_runs" | jq -r \
                --arg sha "$main_sha" \
                --argjson before "$pre_dispatch_run_number" \
                '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch" and .run_number > $before)] | sort_by(.run_number) | last | .id // empty')"
              if [ -n "$discovered_run_id" ]; then
                break
              fi
              sleep 5
            done
          else
            discovered_run_id="$(printf '%s' "$quality_runs" | jq -r --arg sha "$main_sha" '[.workflow_runs[] | select(.head_sha == $sha and (.event == "workflow_dispatch" or .event == "push") and .conclusion == "success")] | sort_by(.created_at) | reverse | .[0].id')"
          fi

          if [ -z "$discovered_run_id" ] || [ "$discovered_run_id" = "null" ]; then
            fail_bootstrap "Quality dispatch was not accepted as successful without an observable exact-SHA run ID"
          fi

          latest_main="$(api_get "repos/$GITHUB_REPOSITORY/commits/main" | jq -r '.sha')"
          if [ "$latest_main" != "$main_sha" ]; then
            fail_bootstrap "Main advanced before bootstrap observation completed"
          fi

          quality_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$discovered_run_id"
          post_bootstrap_status success "Exact-main Quality run $discovered_run_id is observable" "$quality_url"

          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "quality_run_id=$discovered_run_id" >> "$GITHUB_OUTPUT"
          {
            echo "## Exact-main Quality bootstrap"
            echo "- Resolved main SHA: \`$main_sha\`"
            echo "- Active exact-main Quality Gate count: \`$active_count\`"
            echo "- Successful exact-main Quality Gate count: \`$successful_count\`"
            echo "- Fresh owner release dispatch required: \`$force_fresh_dispatch\`"
            echo "- Dispatch API result: \`$dispatch_result\`"
            echo "- Discovered exact-main Quality run ID: \`$discovered_run_id\`"
            echo "- Durable status: \`Irha Quality Bootstrap=success\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record safe non-dispatch outcome
        if: steps.authorize.outputs.authorized != 'true' || github.event_name == 'pull_request'
        shell: bash
        run: |
          {
            echo "- Dispatch performed: \`false\`"
            echo "- Outcome: ${{ steps.authorize.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record pull-request validation outcome
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          echo "- Pull-request validation only; no production workflow dispatched" >> "$GITHUB_STEP_SUMMARY"

  route-parity:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 375 &&
      github.event.comment.body == '/run-production-route-parity' &&
      (
        github.actor == 'irhaapparelsofficial-ctrl' ||
        github.event.comment.user.login == 'irhaapparelsofficial-ctrl' ||
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout exact current main utilities
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact deployed current-main release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          checked_out="$(git rev-parse HEAD)"
          test "$checked_out" = "$main_sha" || {
            echo "Checked out $checked_out instead of current main $main_sha"
            exit 1
          }

          status_json="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/commits/$main_sha/status")"
          required_contexts=(
            "Irha Quality Gate"
            "Irha Cloudflare Production"
            "Irha Search Discovery"
            "Irha Brand Live"
          )

          for context in "${required_contexts[@]}"; do
            state="$(printf '%s' "$status_json" | jq -r --arg context "$context" '[.statuses[] | select(.context == $context)][0].state // "missing"')"
            test "$state" = "success" || {
              echo "Required exact-main status is not green: $context=$state"
              exit 1
            }
          done

          cache_bust="${main_sha::12}-$GITHUB_RUN_ID-$RANDOM"
          bash scripts/ci/retry.sh 3 5 -- curl -fsSL --connect-timeout 10 --max-time 40 \
            -H 'Cache-Control: no-cache' \
            "https://irhaapparels.com/build.json?route_parity_dispatch=$cache_bust" \
            -o /tmp/live-build.json

          jq -e --arg sha "$main_sha" \
            '.source_branch == "main" and .source_commit == $sha and .source_identity_state == "verified"' \
            /tmp/live-build.json >/dev/null

          echo "source_sha=$main_sha" >> "$GITHUB_OUTPUT"
          {
            echo "## Authorized Production Route Parity dispatch"
            echo "- Exact current main: \`$main_sha\`"
            echo "- Required release statuses: all green"
            echo "- Live build identity: exact and verified"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch exact-main Production Route Parity once
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          latest_main="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test "$latest_main" = "$SOURCE_SHA" || {
            echo "Main advanced from $SOURCE_SHA to $latest_main; parity dispatch refused"
            exit 1
          }

          runs_json="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/actions/workflows/production-route-parity.yml/runs?branch=main&per_page=50")"
          active_count="$(printf '%s' "$runs_json" | jq --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.head_sha == $sha and (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending"))] | length')"
          successful_count="$(printf '%s' "$runs_json" | jq --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length')"

          if [ "$successful_count" -gt 0 ]; then
            echo "- Action: skipped; exact-main Production Route Parity already succeeded" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$active_count" -gt 0 ]; then
            echo "- Action: skipped; exact-main Production Route Parity already active" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          bash scripts/ci/retry.sh 3 5 -- gh workflow run production-route-parity.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "- Action: exact-main Production Route Parity dispatched" >> "$GITHUB_STEP_SUMMARY"