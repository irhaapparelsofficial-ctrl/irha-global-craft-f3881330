name: Temporary Regenerate Search Route State

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  regenerate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/indexnow-material-change-parity-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/indexnow-material-change-parity-20260730
          fetch-depth: 2
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Preserve localized gateway canonical policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old = '''function canonicalPathname(url) {
            return url.pathname === "/" ? "/" : url.pathname.replace(/\\/+$/, "");
          }'''
          new = '''function canonicalPathname(url) {
            if (url.pathname === "/" || /^\\/(?:de|fr|nl)\\/$/.test(url.pathname)) return url.pathname;
            return url.pathname.replace(/\\/+$/, "");
          }'''

          for file_name in ["scripts/generate-search-route-state.mjs", "scripts/ping-search-engines.mjs"]:
              path = Path(file_name)
              content = path.read_text()
              if old not in content:
                  raise SystemExit(f"Canonical pathname marker missing in {file_name}")
              path.write_text(content.replace(old, new, 1))

          test_path = Path("src/test/indexNowCanonicalSitemap.test.ts")
          test_content = test_path.read_text()
          marker = '''  it("retains the legacy sitemap diff only as an explicit compatibility fallback", async () => {'''
          addition = '''  it("preserves localized gateway trailing-slash canonicals", async () => {
            const { resolveChangedUrls } = await loadIndexNowModule();
            const { buildSearchRouteState } = await loadSearchRouteStateModule();
            const gateways = [
              "https://irhaapparels.com/de/",
              "https://irhaapparels.com/fr/",
              "https://irhaapparels.com/nl/",
            ];
            const sitemapPath = writeSitemap(gateways);
            const routes = gateways.map((canonicalUrl, index) => ({
              routeType: "localized-market",
              path: new URL(canonicalUrl).pathname,
              locale: ["de-DE", "fr-FR", "nl-NL"][index],
              indexable: true,
              sitemap: true,
              title: `Gateway ${index}`,
              description: `Localized gateway ${index}`,
              h1: `Gateway ${index}`,
              lastmod: null,
              canonicalUrl,
            }));
            const state = buildSearchRouteState({
              schemaVersion: 1,
              canonicalOrigin: "https://irhaapparels.com",
              routeCount: routes.length,
              sitemapCount: routes.length,
              routes,
            });

            expect(resolveChangedUrls({ args: [], env: {}, sitemapPath })).toEqual(gateways);
            expect(state.routes.map((route) => route.url)).toEqual(gateways);
          });

'''
          if addition.strip() not in test_content:
              if marker not in test_content:
                  raise SystemExit("Localized gateway test insertion marker missing")
              test_path.write_text(test_content.replace(marker, addition + marker, 1))
          PY

      - name: Generate authoritative manifest and material route state
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/generate-buyer-ready-catalog-manifest.ts
          NODE_OPTIONS=--import=./scripts/patch-supabase-rpc-pagination.mjs npx tsx scripts/generate-buyer-ready-redirects.ts
          npx tsx scripts/finalize-seo-route-manifest.ts
          npx tsx scripts/align-seo-manifest-taxonomy-runtime.ts
          node scripts/seal-seo-manifest-determinism.mjs
          node scripts/generate-search-route-state.mjs --write

      - name: Verify deterministic 436-route state
        shell: bash
        run: |
          set -euo pipefail
          cp seo/search-route-state.json /tmp/search-route-state.first.json
          first_sha="$(sha256sum seo/search-route-state.json | awk '{print $1}')"
          node scripts/generate-search-route-state.mjs --write
          second_sha="$(sha256sum seo/search-route-state.json | awk '{print $1}')"
          test "$first_sha" = "$second_sha"
          cmp -s /tmp/search-route-state.first.json seo/search-route-state.json
          jq -e '.schemaVersion == 1 and .canonicalOrigin == "https://irhaapparels.com" and .routeCount == 436 and (.routes | length) == 436' seo/search-route-state.json >/dev/null
          jq -e '.schemaVersion == 1 and .canonicalOrigin == "https://irhaapparels.com" and .sitemapCount == 436 and (.routes | map(select(.indexable == true and .sitemap == true)) | length) == 436' public/seo-route-manifest.json >/dev/null
          jq -r '.routes[].url' seo/search-route-state.json | sort -u > /tmp/state-urls.txt
          jq -r '.routes[] | select(.indexable == true and .sitemap == true) | .canonicalUrl' public/seo-route-manifest.json | sort -u > /tmp/manifest-urls.txt
          cmp -s /tmp/state-urls.txt /tmp/manifest-urls.txt
          ! grep -q '"lastmod"' seo/search-route-state.json
          test "$(jq -r '.routes[].url' seo/search-route-state.json | sort -u | wc -l | tr -d ' ')" = "436"
          test "$(jq -r '[.routes[].url | select(. == "https://irhaapparels.com/de/" or . == "https://irhaapparels.com/fr/" or . == "https://irhaapparels.com/nl/")] | length' seo/search-route-state.json)" = "3"
          echo "route_state_sha256=$second_sha"

      - name: Commit focused canonical-state correction
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --exit-code -- . \
            ':(exclude)scripts/generate-search-route-state.mjs' \
            ':(exclude)scripts/ping-search-engines.mjs' \
            ':(exclude)src/test/indexNowCanonicalSitemap.test.ts' \
            ':(exclude)seo/search-route-state.json' \
            ':(exclude)public/seo-route-manifest.json' \
            ':(exclude)public/sitemap.xml' \
            ':(exclude)public/catalog-route-manifest.json' \
            ':(exclude)public/buyer-ready-catalog.json' \
            ':(exclude)public/_redirects' || {
              echo "Unexpected generated repository changes outside focused correction" >&2
              exit 1
            }
          git checkout -- public/seo-route-manifest.json public/sitemap.xml public/catalog-route-manifest.json public/buyer-ready-catalog.json public/_redirects 2>/dev/null || true
          git add \
            scripts/generate-search-route-state.mjs \
            scripts/ping-search-engines.mjs \
            src/test/indexNowCanonicalSitemap.test.ts \
            seo/search-route-state.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(seo): preserve localized canonical route state"
          git push origin HEAD:codex/indexnow-material-change-parity-20260730
