name: Supabase Functions After Quality Gate

run-name: Guarded functions sync · ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Quality Gate"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: irha-production-mutation
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: pvzjiozismyxqrzmtfbi

jobs:
  preflight:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      should_sync: ${{ steps.ready.outputs.should_sync }}
      source_sha: ${{ steps.ready.outputs.source_sha }}
      secrets_ready: ${{ steps.ready.outputs.secrets_ready }}
      changed_functions_json: ${{ steps.changes.outputs.changed_functions_json }}
      changed_count: ${{ steps.changes.outputs.changed_count }}

    steps:
      - name: Checkout exact green main source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve and validate changed Edge Functions
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          source_sha='${{ github.event.workflow_run.head_sha }}'
          mapfile -t changed < <(
            git diff-tree --root --no-commit-id --name-only -r "$source_sha" \
              | sed -nE 's#^supabase/functions/([^/]+)/.*#\1#p' \
              | sort -u
          )

          printf '%s\n' "${changed[@]:-}" | sed '/^$/d' > /tmp/changed-functions.txt
          changed_count="$(wc -l < /tmp/changed-functions.txt | tr -d ' ')"
          changed_json="$(jq -Rsc 'split("\n") | map(select(length > 0))' /tmp/changed-functions.txt)"
          echo "changed_count=$changed_count" >> "$GITHUB_OUTPUT"
          echo "changed_functions_json=$changed_json" >> "$GITHUB_OUTPUT"

          if [ "$changed_count" -eq 0 ]; then
            echo "No Edge Function source changed."
            exit 0
          fi

          jq -r '.functions[][0]' supabase/deployment-parity/functions-f3.json | sort -u > /tmp/blocked-f3.txt
          jq -r '.functions[][0]' supabase/deployment-parity/functions-f6.json | sort -u > /tmp/blocked-f6.txt
          jq -r '.functions[][0]' supabase/deployment-parity/functions-f4.json | sort -u > /tmp/repository-only.txt
          cat /tmp/blocked-f3.txt /tmp/blocked-f6.txt /tmp/repository-only.txt | sort -u > /tmp/blocked-functions.txt

          while IFS= read -r function_name; do
            test -n "$function_name"
            grep -Fqx "[functions.$function_name]" supabase/config.toml
            if grep -Fqx "$function_name" /tmp/blocked-functions.txt; then
              echo "::error title=Blocked Edge Function deployment::$function_name is F3, F6, or repository-only and cannot be deployed by the broad control plane"
              exit 1
            fi
          done < /tmp/changed-functions.txt

          echo "Approved changed Edge Functions: $changed_json"

      - name: Confirm current main and secret readiness
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          CHANGED_COUNT: ${{ steps.changes.outputs.changed_count }}
        shell: bash
        run: |
          set -euo pipefail
          latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          token="$(printf '%s' "${SUPABASE_ACCESS_TOKEN:-}" | tr -d '[:space:]')"
          secrets_ready=false
          [ -n "$token" ] && secrets_ready=true

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "secrets_ready=$secrets_ready" >> "$GITHUB_OUTPUT"

          if [ "$latest_main" != "$SOURCE_SHA" ]; then
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            echo "Superseded green run skipped safely."
          elif [ "$CHANGED_COUNT" -eq 0 ]; then
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            echo "No Edge Function source changed."
          elif [ "$secrets_ready" != true ]; then
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            echo "Supabase token unavailable; no mutation attempted."
          else
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record clean non-sync state
        if: steps.ready.outputs.should_sync != 'true'
        shell: bash
        run: |
          {
            echo "## Supabase functions control plane"
            echo "- Quality Gate: green"
            echo "- Source: \`${{ steps.ready.outputs.source_sha }}\`"
            echo "- Changed functions: \`${{ steps.changes.outputs.changed_functions_json }}\`"
            echo "- Secrets ready: \`${{ steps.ready.outputs.secrets_ready }}\`"
            echo "- Result: no backend mutation attempted"
          } >> "$GITHUB_STEP_SUMMARY"

  sync-functions:
    needs: preflight
    if: needs.preflight.outputs.should_sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      CHANGED_FUNCTIONS_JSON: ${{ needs.preflight.outputs.changed_functions_json }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Checkout exact green main source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.39.2

      - name: Validate source, project, and parity evidence
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${SUPABASE_ACCESS_TOKEN:-}" | tr -d '[:space:]')"
          test -n "$token"
          echo "::add-mask::$token"
          grep -Fx 'project_id = "pvzjiozismyxqrzmtfbi"' supabase/config.toml
          bash scripts/ci/retry.sh 3 5 -- npm ci --legacy-peer-deps --no-audit --no-fund
          npm run verify:deployment-source
          npm run verify:secrets
          npm run verify:migrations
          node scripts/verify-supabase-parity.mjs
          project_json="$(bash scripts/ci/retry.sh 3 5 -- curl -fsS \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID")"
          test "$(printf '%s' "$project_json" | jq -r '.id // empty')" = "$SUPABASE_PROJECT_ID"

      - name: Reconfirm exact current main after production lock
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest_main="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [ "$latest_main" = "$SOURCE_SHA" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "Source superseded while waiting for production lock; sync skipped."
          fi

      - name: Deploy only explicitly changed approved Edge Functions
        if: steps.freshness.outputs.fresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t functions < <(jq -r '.[]' <<<"$CHANGED_FUNCTIONS_JSON")
          test "${#functions[@]}" -gt 0
          : > /tmp/functions-deployed.txt
          for function_name in "${functions[@]}"; do
            bash scripts/ci/retry.sh 3 8 -- supabase functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_ID"
            printf '%s\n' "$function_name" >> /tmp/functions-deployed.txt
          done
          bash scripts/ci/retry.sh 3 5 -- supabase functions list --project-ref "$SUPABASE_PROJECT_ID" | tee /tmp/functions-live.txt
          test -s /tmp/functions-live.txt

      - name: Preserve scoped sync evidence
        if: steps.freshness.outputs.fresh == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: supabase-functions-evidence-${{ env.SOURCE_SHA }}
          path: |
            /tmp/functions-deployed.txt
            /tmp/functions-live.txt
          if-no-files-found: error
          retention-days: 3

      - name: Record control-plane outcome
        if: always()
        shell: bash
        run: |
          {
            echo "## Supabase functions control plane"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Project: \`$SUPABASE_PROJECT_ID\`"
            echo "- Shared production lock: \`irha-production-mutation\`"
            echo "- Changed function allowlist: \`$CHANGED_FUNCTIONS_JSON\`"
            echo "- Fresh at mutation time: \`${{ steps.freshness.outputs.fresh || 'not-reached' }}\`"
            echo "- Broad function deployment: disabled"
            echo "- F3/F6/repository-only deployment: blocked"
            echo "- Database migrations: not auto-applied by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
