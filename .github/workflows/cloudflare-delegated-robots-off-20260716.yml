name: Delegated Cloudflare managed robots disable

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-delegated-robots-off-20260716.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-delegated-robots-off
  cancel-in-progress: false

jobs:
  disable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE_NAME: irhaapparels.com
    steps:
      - name: Create short-lived zone token and disable managed robots
        shell: bash
        run: |
          set -euo pipefail
          parent="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '[:space:]')"
          test -n "$parent"
          echo "::add-mask::$parent"
          parent_auth=(-H "Authorization: Bearer $parent" -H 'Content-Type: application/json')

          zones="$(curl -fsS "${parent_auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME&status=active&per_page=10")"
          test "$(jq -r '.success // false' <<<"$zones")" = true
          test "$(jq -r '(.result // []) | length' <<<"$zones")" = 1
          zone_id="$(jq -r '.result[0].id' <<<"$zones")"
          [[ "$zone_id" =~ ^[0-9a-fA-F]{32}$ ]]
          echo "::add-mask::$zone_id"

          pg_status="$(curl -sS -o /tmp/permission-groups.json -w '%{http_code}' \
            "${parent_auth[@]}" "https://api.cloudflare.com/client/v4/user/tokens/permission_groups")"
          test "$pg_status" = 200
          test "$(jq -r '.success // false' /tmp/permission-groups.json)" = true

          jq '[.result[] | select(
              ((.name // "") | test("AI Crawl Control Write"; "i")) or
              ((.name // "") | test("Bot Management.*(Edit|Write)"; "i"))
            ) | {id}] | unique_by(.id)' /tmp/permission-groups.json > /tmp/write-groups.json
          test "$(jq 'length' /tmp/write-groups.json)" -gt 0

          not_before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          expires_on="$(date -u -d '+15 minutes' +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg name "Irha one-time managed robots disable" \
            --arg resource "com.cloudflare.api.account.zone.$zone_id" \
            --arg not_before "$not_before" \
            --arg expires_on "$expires_on" \
            --slurpfile groups /tmp/write-groups.json \
            '{name:$name,not_before:$not_before,expires_on:$expires_on,policies:[{effect:"allow",resources:{($resource):"*"},permission_groups:$groups[0]}]}' \
            > /tmp/create-token.json

          create_status="$(curl -sS -o /tmp/created-token.json -w '%{http_code}' -X POST \
            "${parent_auth[@]}" --data @/tmp/create-token.json \
            "https://api.cloudflare.com/client/v4/user/tokens")"
          test "$create_status" = 200
          test "$(jq -r '.success // false' /tmp/created-token.json)" = true

          child_id="$(jq -r '.result.id // empty' /tmp/created-token.json)"
          child="$(jq -r 'if (.result.value|type)=="string" then .result.value elif (.result.value.value|type)=="string" then .result.value.value else empty end' /tmp/created-token.json)"
          [[ "$child_id" =~ ^[0-9a-fA-F]{32}$ ]]
          test -n "$child"
          echo "::add-mask::$child_id"
          echo "::add-mask::$child"

          cleanup() {
            curl -sS -o /dev/null -X DELETE "${parent_auth[@]}" \
              "https://api.cloudflare.com/client/v4/user/tokens/$child_id" || true
            rm -f /tmp/created-token.json /tmp/create-token.json /tmp/write-groups.json /tmp/permission-groups.json
          }
          trap cleanup EXIT

          child_auth=(-H "Authorization: Bearer $child" -H 'Content-Type: application/json')
          update_status="$(curl -sS -o /tmp/update.json -w '%{http_code}' -X PUT \
            "${child_auth[@]}" \
            --data '{"is_robots_txt_managed":false,"cf_robots_variant":"off"}' \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/bot_management")"
          test "$update_status" = 200
          test "$(jq -r '.success // false' /tmp/update.json)" = true
          test "$(jq -r '.result.is_robots_txt_managed // false' /tmp/update.json)" = false
          test "$(jq -r '.result.cf_robots_variant // "off"' /tmp/update.json)" = off
          rm -f /tmp/update.json

      - name: Verify live robots is clean
        shell: bash
        run: |
          set -euo pipefail
          clean=0
          for attempt in $(seq 1 30); do
            url="https://irhaapparels.com/robots.txt?verify=delegated-off-${GITHUB_SHA::12}-$attempt-$RANDOM"
            if curl -fsSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' "$url" -o /tmp/robots.txt; then
              if ! grep -qiE 'content-signal|BEGIN Cloudflare Managed|content signals policy' /tmp/robots.txt \
                 && grep -Fq 'Sitemap: https://irhaapparels.com/sitemap.xml' /tmp/robots.txt; then
                clean=1
                break
              fi
            fi
            sleep 10
          done
          test "$clean" = 1
          echo "Managed robots disabled and live robots.txt verified clean." >> "$GITHUB_STEP_SUMMARY"
