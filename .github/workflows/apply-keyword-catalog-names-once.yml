name: Apply keyword-led catalog names once

on:
  push:
    branches:
      - seo/keyword-led-catalog-names-20260716
    paths:
      - .github/workflows/apply-keyword-catalog-names-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keyword-led-catalog-names-20260716
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated SEO branch
        uses: actions/checkout@v4
        with:
          ref: seo/keyword-led-catalog-names-20260716
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply stable-slug naming patch
        run: |
          python scripts/apply_keyword_catalog_names_once.py
          mkdir -p /tmp/irha-seo-patch/src/hooks
          cp src/hooks/usePublicCatalog.ts /tmp/irha-seo-patch/src/hooks/usePublicCatalog.ts
          cp src/hooks/usePublicCategoryData.ts /tmp/irha-seo-patch/src/hooks/usePublicCategoryData.ts

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Full test suite
        run: npm test

      - name: Production build and source-lock verification
        run: npm run build

      - name: Restore only validated source changes
        run: |
          git reset --hard HEAD
          cp /tmp/irha-seo-patch/src/hooks/usePublicCatalog.ts src/hooks/usePublicCatalog.ts
          cp /tmp/irha-seo-patch/src/hooks/usePublicCategoryData.ts src/hooks/usePublicCategoryData.ts
          rm -f scripts/apply_keyword_catalog_names_once.py
          rm -f .github/workflows/apply-keyword-catalog-names-once.yml
          git diff --check

      - name: Commit validated SEO catalog naming change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/usePublicCatalog.ts \
            src/hooks/usePublicCategoryData.ts \
            scripts/apply_keyword_catalog_names_once.py \
            .github/workflows/apply-keyword-catalog-names-once.yml
          git diff --cached --check
          git commit -m "feat(seo): apply keyword-led catalog names with stable slugs"
          git push origin HEAD:seo/keyword-led-catalog-names-20260716
