name: Live B2B Polish Screenshot

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Capture current live homepage
        shell: bash
        run: |
          cat > capture-live.mjs <<'EOF'
          import { chromium, devices } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            ...devices['iPhone 13'],
            locale: 'en-GB',
          });
          const page = await context.newPage();
          const response = await page.goto('https://irhaapparels.com/', { waitUntil: 'networkidle', timeout: 90000 });
          await page.screenshot({ path: 'live-polished-viewport.png' });
          await page.screenshot({ path: 'live-polished-full.png', fullPage: true });
          const info = {
            status: response?.status(),
            finalUrl: page.url(),
            title: await page.title(),
            h1: await page.locator('h1').first().textContent(),
            logoVisible: await page.locator('img[src="/irha-brand-mark.svg"]').first().isVisible().catch(() => false),
            cookieVisible: await page.getByText('Your privacy choice', { exact: true }).isVisible().catch(() => false),
            viewport: await page.viewportSize(),
          };
          await writeFile('live-view.json', JSON.stringify(info, null, 2));
          console.log(JSON.stringify(info, null, 2));
          await browser.close();
          EOF
          node capture-live.mjs
      - name: Record live release identity
        run: |
          curl -fsSL -H 'Cache-Control: no-cache' "https://irhaapparels.com/build.json?audit=${GITHUB_SHA::12}" -o live-build.json
          cat live-build.json
      - name: Capture live robots and CSP evidence
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -D live-robots-headers.txt -H 'Cache-Control: no-cache' "https://irhaapparels.com/robots.txt?audit=${GITHUB_SHA::12}" -o live-robots.txt
          curl -fsSI -H 'Cache-Control: no-cache' "https://irhaapparels.com/de/bekleidungshersteller-deutschland?audit=${GITHUB_SHA::12}" > live-germany-headers.txt
          grep -F 'User-agent: *' live-robots.txt
          grep -F 'Sitemap: https://irhaapparels.com/sitemap.xml' live-robots.txt
          if grep -F 'Content-Signal' live-robots.txt; then
            echo 'Cloudflare managed Content-Signal injection is present; continuing to collect full diagnostics.'
          else
            echo 'No Content-Signal directive present.'
          fi
          grep -i '^content-security-policy:' live-germany-headers.txt
          grep -i 'static.cloudflareinsights.com' live-germany-headers.txt
      - name: Discover Cloudflare robots and AI controls read-only
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -u
          mkdir -p cloudflare-discovery
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '[:space:]')"
          if [ -z "$token" ]; then
            echo '{"error":"CLOUDFLARE_API_TOKEN unavailable in this audit context"}' > cloudflare-discovery/error.json
            exit 0
          fi
          auth=(-H "Authorization: Bearer $token" -H 'Content-Type: application/json')
          curl -fsS "${auth[@]}" 'https://api.cloudflare.com/client/v4/zones?name=irhaapparels.com&per_page=50' > cloudflare-discovery/zones.json
          zone_id="$(jq -r '.result[]? | select(.name=="irhaapparels.com") | .id' cloudflare-discovery/zones.json | head -n1)"
          if ! [[ "$zone_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo '{"error":"zone id not resolved"}' > cloudflare-discovery/error.json
            exit 0
          fi
          echo "::add-mask::$zone_id"
          jq -n --arg zone_id "$zone_id" '{zone_id:$zone_id}' > cloudflare-discovery/zone.json
          curl -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/settings" > cloudflare-discovery/zone-settings.json
          jq '[.result[]? | select((.id // "" | ascii_downcase) | test("ai|bot|crawl|robot|signal|content"))]' cloudflare-discovery/zone-settings.json > cloudflare-discovery/zone-settings-relevant.json
          curl -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/bot_management" > cloudflare-discovery/bot-management.json
          for endpoint in \
            ai-crawl-control \
            ai_crawl_control \
            content-signals \
            content_signals \
            robots-txt \
            robots_txt \
            settings/ai_bots_protection \
            settings/ai_crawl_control \
            settings/content_signals; do
            safe="$(printf '%s' "$endpoint" | tr '/-' '__')"
            code="$(curl -sS -o "cloudflare-discovery/$safe.json" -w '%{http_code}' "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/$endpoint")"
            jq -n --arg endpoint "$endpoint" --arg code "$code" '{endpoint:$endpoint,http_status:($code|tonumber)}' > "cloudflare-discovery/$safe.status.json"
          done
          account_id="$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID:-}" | grep -Eo '[0-9a-fA-F]{32}' | head -n1 || true)"
          if [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::add-mask::$account_id"
            for endpoint in ai-crawl-control ai_crawl_control content-signals content_signals; do
              safe="account_$(printf '%s' "$endpoint" | tr '/-' '__')"
              code="$(curl -sS -o "cloudflare-discovery/$safe.json" -w '%{http_code}' "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$account_id/$endpoint")"
              jq -n --arg endpoint "$endpoint" --arg code "$code" '{endpoint:$endpoint,http_status:($code|tonumber)}' > "cloudflare-discovery/$safe.status.json"
            done
          fi
          cat cloudflare-discovery/zone-settings-relevant.json
          cat cloudflare-discovery/bot-management.json
      - name: Run current live mobile Lighthouse audit
        shell: bash
        run: |
          set -euo pipefail
          npx --yes lighthouse@12.8.2 \
            "https://irhaapparels.com/de/bekleidungshersteller-deutschland?audit_artifact=${GITHUB_SHA::12}" \
            --output=json \
            --output-path=live-lighthouse.json \
            --only-categories=seo,best-practices,accessibility,performance \
            --form-factor=mobile \
            --screenEmulation.mobile=true \
            --throttling-method=simulate \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --quiet
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('live-lighthouse.json', 'utf8'));
          const categoryScore = (id) => Math.round((report.categories?.[id]?.score ?? 0) * 100);
          const auditSummary = (id) => {
            const audit = report.audits?.[id] || {};
            return {
              score: audit.score,
              displayValue: audit.displayValue || null,
              explanation: audit.explanation || null,
              details: audit.details || null,
            };
          };
          const summary = {
            requestedUrl: report.requestedUrl,
            finalUrl: report.finalUrl,
            fetchTime: report.fetchTime,
            scores: {
              performance: categoryScore('performance'),
              accessibility: categoryScore('accessibility'),
              bestPractices: categoryScore('best-practices'),
              seo: categoryScore('seo'),
            },
            metrics: {
              firstContentfulPaint: report.audits?.['first-contentful-paint']?.displayValue || null,
              largestContentfulPaint: report.audits?.['largest-contentful-paint']?.displayValue || null,
              totalBlockingTime: report.audits?.['total-blocking-time']?.displayValue || null,
              cumulativeLayoutShift: report.audits?.['cumulative-layout-shift']?.displayValue || null,
              speedIndex: report.audits?.['speed-index']?.displayValue || null,
            },
            selectedAudits: {
              robotsTxt: auditSummary('robots-txt'),
              errorsInConsole: auditSummary('errors-in-console'),
              inspectorIssues: auditSummary('inspector-issues'),
            },
          };
          fs.writeFileSync('live-lighthouse-summary.json', JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          NODE
      - name: Upload live audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-b2b-polish
          path: |
            live-polished-viewport.png
            live-polished-full.png
            live-view.json
            live-build.json
            live-robots.txt
            live-robots-headers.txt
            live-germany-headers.txt
            live-lighthouse.json
            live-lighthouse-summary.json
            cloudflare-discovery/
          if-no-files-found: warn
          retention-days: 1
