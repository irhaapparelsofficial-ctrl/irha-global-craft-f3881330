name: Cloudflare Pages Production

run-name: Controlled Cloudflare production · ${{ github.ref_name }} · #${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to publish the current main commit to irha-apparels.pages.dev
        required: true
        default: "NO"
        type: string
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

env:
  PRODUCTION_BRANCH: main
  PRODUCTION_URL: https://irha-apparels.pages.dev
  CUSTOM_DOMAIN_URL: https://irhaapparels.com
  WWW_CUSTOM_DOMAIN_URL: https://www.irhaapparels.com

jobs:
  deploy:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}

    steps:
      - name: Resolve Cloudflare account and verify project
        id: cloudflare
        shell: bash
        run: |
          set -euo pipefail

          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '[:space:]')"
          raw_account_id="$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID:-}" | tr -d '[:space:]')"
          project_name="$(printf '%s' "${CLOUDFLARE_PROJECT_NAME:-}" | tr -d '[:space:]')"

          test -n "$token" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$project_name" || { echo "CLOUDFLARE_PROJECT_NAME is missing"; exit 1; }
          [[ "$project_name" =~ ^[a-z0-9][a-z0-9-]*[a-z0-9]$ ]] || {
            echo "CLOUDFLARE_PROJECT_NAME contains invalid characters"
            exit 1
          }

          echo "::add-mask::$token"

          verify_json="$(curl -sS \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          if [ "$(printf '%s' "$verify_json" | jq -r '.success // false')" != "true" ]; then
            echo "Cloudflare API token verification failed"
            printf '%s' "$verify_json" | jq -r '.errors[]? | "Cloudflare error \(.code // "unknown"): \(.message // "unknown")"'
            exit 1
          fi

          account_id="$raw_account_id"
          if ! [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            embedded_account_id="$(printf '%s' "$raw_account_id" | grep -Eo '[0-9a-fA-F]{32}' | head -n 1 || true)"
            if [[ "$embedded_account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
              account_id="$embedded_account_id"
              echo "Normalized Account ID from the configured secret value"
            else
              accounts_json="$(curl -sS \
                -H "Authorization: Bearer $token" \
                -H 'Content-Type: application/json' \
                'https://api.cloudflare.com/client/v4/accounts?per_page=50')"
              if [ "$(printf '%s' "$accounts_json" | jq -r '.success // false')" != "true" ]; then
                echo "Cloudflare account discovery failed. Set CLOUDFLARE_ACCOUNT_ID to the exact 32-character Account ID."
                printf '%s' "$accounts_json" | jq -r '.errors[]? | "Cloudflare error \(.code // "unknown"): \(.message // "unknown")"'
                exit 1
              fi

              account_count="$(printf '%s' "$accounts_json" | jq -r '(.result // []) | length')"
              if [ "$account_count" != "1" ]; then
                echo "Cloudflare token can access $account_count accounts. Set CLOUDFLARE_ACCOUNT_ID to the exact 32-character Account ID."
                exit 1
              fi
              account_id="$(printf '%s' "$accounts_json" | jq -r '.result[0].id // empty')"
              echo "Resolved the only Cloudflare account accessible to this token"
            fi
          fi

          [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]] || {
            echo "Cloudflare Account ID could not be resolved safely"
            exit 1
          }
          echo "::add-mask::$account_id"

          project_json="$(curl -sS \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$account_id/pages/projects/$project_name")"
          if [ "$(printf '%s' "$project_json" | jq -r '.success // false')" != "true" ]; then
            echo "Cloudflare Pages project lookup failed"
            printf '%s' "$project_json" | jq -r '.errors[]? | "Cloudflare error \(.code // "unknown"): \(.message // "unknown")"'
            exit 1
          fi

          actual_name="$(printf '%s' "$project_json" | jq -r '.result.name // empty')"
          production_branch="$(printf '%s' "$project_json" | jq -r '.result.production_branch // empty')"
          previous_deployment_id="$(printf '%s' "$project_json" | jq -r '.result.latest_deployment.id // "none"')"
          initial_domain_count="$(printf '%s' "$project_json" | jq -r '(.result.domains // []) | length')"

          test "$actual_name" = "$project_name" || {
            echo "Cloudflare project mismatch: expected $project_name, got $actual_name"
            exit 1
          }
          test "$production_branch" = "$PRODUCTION_BRANCH" || {
            echo "Cloudflare production branch mismatch: expected $PRODUCTION_BRANCH, got ${production_branch:-unset}"
            exit 1
          }

          {
            echo "CLOUDFLARE_API_TOKEN=$token"
            echo "CLOUDFLARE_ACCOUNT_ID=$account_id"
            echo "CLOUDFLARE_PROJECT_NAME=$project_name"
            echo "PREVIOUS_DEPLOYMENT_ID=$previous_deployment_id"
            echo "INITIAL_DOMAIN_COUNT=$initial_domain_count"
          } >> "$GITHUB_ENV"

          echo "Cloudflare project confirmed: $actual_name"
          echo "Production branch confirmed: $production_branch"
          echo "Existing domain count: $initial_domain_count"

      - name: Checkout exact approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Re-run deterministic release checks
        run: |
          npm run verify:deployment-source
          npm run verify:secrets
          npm run verify:migrations
          npx tsc --noEmit
          npm test -- --passWithNoTests

      - name: Build exact source
        run: npm run build

      - name: Verify release-safe build output
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:release-identity
          test -s dist/index.html
          test -s dist/build.json
          test -s dist/release.txt
          grep -F 'name="x-irha-release" content="frontend-live-2026-07-13-r11"' dist/index.html
          grep -F '"repository": "irhaapparelsofficial-ctrl/irha-global-craft-f3881330"' dist/build.json
          grep -F '"supabase_project_id": "pvzjiozismyxqrzmtfbi"' dist/build.json
          grep -F '"expected_origin": "https://irhaapparels.com"' dist/build.json

          if grep -R -nF --include='*.html' --include='*.js' --include='*.json' --include='*.txt' --include='*.xml' 'mlefxgyaqoisvdmoiapq' dist; then
            echo "Built frontend references the retired Lovable Cloud database"
            exit 1
          fi

          if grep -R -nE --include='*.html' --include='*.js' --include='*.json' --include='*.txt' --include='*.xml' \
            'Since 2014|MOQ 50|45-Day Delivery|45-day delivery|reply within 12 hours|BSCI Audited|ISO 9001:2015|SEDEX Member' dist; then
            echo "Built output contains blocked legacy production claims"
            exit 1
          fi

          build_fingerprint="$(jq -r '.build_fingerprint // empty' dist/build.json)"
          [[ "$build_fingerprint" =~ ^[0-9a-f]{64}$ ]] || {
            echo "Built output is missing a valid deterministic fingerprint"
            exit 1
          }

          jq -n \
            --arg source_sha "$GITHUB_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$PRODUCTION_BRANCH" \
            --arg build_fingerprint "$build_fingerprint" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{source_sha: $source_sha, repository: $repository, branch: $branch, build_fingerprint: $build_fingerprint, generated_at: $generated_at}' \
            > dist/cloudflare-deployment.json

      - name: Deploy Cloudflare production branch
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist \
            --project-name="$CLOUDFLARE_PROJECT_NAME" \
            --branch="$PRODUCTION_BRANCH"

      - name: Verify exact production deployment on pages.dev
        shell: bash
        run: |
          set -euo pipefail
          ready=0

          for attempt in $(seq 1 24); do
            cache_bust="${GITHUB_SHA::12}-$attempt"
            if curl -fsS --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' \
              "$PRODUCTION_URL/?release_check=$cache_bust" -o /tmp/production-home.html -D /tmp/production-headers \
              && curl -fsS --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' \
              "$PRODUCTION_URL/build.json?release_check=$cache_bust" -o /tmp/production-build.json \
              && curl -fsS --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' \
              "$PRODUCTION_URL/cloudflare-deployment.json?release_check=$cache_bust" -o /tmp/cloudflare-deployment.json; then

              build_fingerprint="$(jq -r '.build_fingerprint // empty' /tmp/production-build.json)"
              if grep -Eiq '^HTTP/[0-9.]+ 200' /tmp/production-headers \
                && grep -Fq 'name="x-irha-release" content="frontend-live-2026-07-13-r11"' /tmp/production-home.html \
                && [[ "$build_fingerprint" =~ ^[0-9a-f]{64}$ ]] \
                && jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" --arg supabase 'pvzjiozismyxqrzmtfbi' \
                  '.source_commit == $sha and .source_identity_state == "verified" and .repository == $repo and .supabase_project_id == $supabase and .build_fingerprint_algorithm == "sha256"' \
                  /tmp/production-build.json >/dev/null \
                && jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" --arg fingerprint "$build_fingerprint" \
                  '.source_sha == $sha and .repository == $repo and .branch == "main" and .build_fingerprint == $fingerprint' \
                  /tmp/cloudflare-deployment.json >/dev/null; then
                ready=1
                echo "Exact Cloudflare production deployment verified on attempt $attempt"
                break
              fi
            fi

            echo "Production deployment not ready yet (attempt $attempt/24)"
            sleep 10
          done

          test "$ready" = "1" || {
            echo "Cloudflare production deployment did not converge safely"
            exit 1
          }

      - name: Verify custom domain serves exact release
        shell: bash
        run: |
          set -euo pipefail
          expected_fingerprint="$(jq -r '.build_fingerprint // empty' /tmp/production-build.json)"
          [[ "$expected_fingerprint" =~ ^[0-9a-f]{64}$ ]]

          for base_url in "$CUSTOM_DOMAIN_URL" "$WWW_CUSTOM_DOMAIN_URL"; do
            ready=0
            host="${base_url#https://}"
            safe_host="$(printf '%s' "$host" | tr -c 'A-Za-z0-9._-' '_')"

            for attempt in $(seq 1 24); do
              cache_bust="${GITHUB_SHA::12}-$attempt-$RANDOM"
              home_file="/tmp/${safe_host}-home.html"
              header_file="/tmp/${safe_host}-headers"
              build_file="/tmp/${safe_host}-build.json"
              deployment_file="/tmp/${safe_host}-cloudflare-deployment.json"

              if curl -fsSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' \
                "$base_url/?release_check=$cache_bust" -o "$home_file" -D "$header_file" \
                && curl -fsSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' \
                "$base_url/build.json?release_check=$cache_bust" -o "$build_file" \
                && curl -fsSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' \
                "$base_url/cloudflare-deployment.json?release_check=$cache_bust" -o "$deployment_file"; then

                if grep -Eiq '^HTTP/[0-9.]+ (200|301|302|307|308)' "$header_file" \
                  && grep -Fq 'name="x-irha-release" content="frontend-live-2026-07-13-r11"' "$home_file" \
                  && grep -Eiq 'Custom Apparel Manufacturer for Global B2B Buyers|Custom Apparel Manufacturing for Global B2B Buyers' "$home_file" \
                  && jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" --arg supabase 'pvzjiozismyxqrzmtfbi' --arg fingerprint "$expected_fingerprint" \
                    '.source_commit == $sha and .source_identity_state == "verified" and .repository == $repo and .supabase_project_id == $supabase and .build_fingerprint == $fingerprint' \
                    "$build_file" >/dev/null \
                  && jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" --arg fingerprint "$expected_fingerprint" \
                    '.source_sha == $sha and .repository == $repo and .branch == "main" and .build_fingerprint == $fingerprint' \
                    "$deployment_file" >/dev/null; then
                  ready=1
                  echo "$base_url verified on attempt $attempt"
                  break
                fi
              fi

              echo "$base_url not converged yet (attempt $attempt/24)"
              sleep 10
            done

            test "$ready" = "1" || {
              echo "Custom domain did not converge to the exact production release: $base_url"
              exit 1
            }

            if grep -Eiq 'Since 2014|MOQ 50|45-Day Delivery|45-day delivery|reply within 12 hours|BSCI Audited|ISO 9001:2015|SEDEX Member' "/tmp/${safe_host}-home.html"; then
              echo "Blocked legacy production claims are present on $base_url"
              exit 1
            fi
          done

      - name: Verify domain configuration was not changed
        shell: bash
        run: |
          set -euo pipefail

          project_json="$(curl -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT_NAME")"
          test "$(printf '%s' "$project_json" | jq -r '.success // false')" = "true"

          final_domain_count="$(printf '%s' "$project_json" | jq -r '(.result.domains // []) | length')"
          latest_deployment_id="$(printf '%s' "$project_json" | jq -r '.result.latest_deployment.id // "unknown"')"
          test "$final_domain_count" = "$INITIAL_DOMAIN_COUNT" || {
            echo "Domain count changed unexpectedly: before $INITIAL_DOMAIN_COUNT, after $final_domain_count"
            exit 1
          }

          {
            echo "## Cloudflare Pages production deployment"
            echo "- Status: verified"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Production URL: $PRODUCTION_URL"
            echo "- Previous deployment ID: \`$PREVIOUS_DEPLOYMENT_ID\`"
            echo "- New deployment ID: \`$latest_deployment_id\`"
            echo "- Build fingerprint: \`$(jq -r '.build_fingerprint' /tmp/production-build.json)\`"
            echo "- Domain count unchanged: $final_domain_count"
            echo "- Custom domain verified: $CUSTOM_DOMAIN_URL"
            echo "- WWW domain verified: $WWW_CUSTOM_DOMAIN_URL"
            echo "- DNS/custom domains were not modified by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
