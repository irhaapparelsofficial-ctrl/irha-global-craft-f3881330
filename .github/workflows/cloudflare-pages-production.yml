name: Cloudflare Pages Staging

run-name: Guarded Cloudflare staging · ${{ github.ref_name }} · #${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY_STAGING to publish the exact current main commit to pages.dev only
        required: true
        default: "NO"
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-staging
  cancel-in-progress: false

env:
  PAGES_BRANCH: main
  STAGING_URL: https://irha-apparels.pages.dev
  PRODUCTION_ROUTING_REPOSITORY: irhaapparelsofficial-ctrl/irha-global-craft
  PRODUCTION_ROUTING_POLICY: approved-lovable-r11

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY_STAGING'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}

    steps:
      - name: Checkout exact approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve Cloudflare account and verify project
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '[:space:]')"
          raw_account_id="$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID:-}" | tr -d '[:space:]')"
          project_name="$(printf '%s' "${CLOUDFLARE_PROJECT_NAME:-}" | tr -d '[:space:]')"

          test -n "$token" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$project_name" || { echo "CLOUDFLARE_PROJECT_NAME is missing"; exit 1; }
          [[ "$project_name" =~ ^[a-z0-9][a-z0-9-]*[a-z0-9]$ ]] || {
            echo "CLOUDFLARE_PROJECT_NAME contains invalid characters"
            exit 1
          }

          echo "::add-mask::$token"
          verify_json="$(curl -fsS \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          test "$(printf '%s' "$verify_json" | jq -r '.success // false')" = "true" || {
            echo "Cloudflare API token verification failed"
            exit 1
          }

          account_id="$raw_account_id"
          if ! [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            account_id="$(printf '%s' "$raw_account_id" | grep -Eo '[0-9a-fA-F]{32}' | head -n 1 || true)"
          fi
          if ! [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            accounts_json="$(curl -fsS \
              -H "Authorization: Bearer $token" \
              -H 'Content-Type: application/json' \
              'https://api.cloudflare.com/client/v4/accounts?per_page=50')"
            test "$(printf '%s' "$accounts_json" | jq -r '.success // false')" = "true"
            test "$(printf '%s' "$accounts_json" | jq -r '(.result // []) | length')" = "1" || {
              echo "Set CLOUDFLARE_ACCOUNT_ID to the exact 32-character account ID"
              exit 1
            }
            account_id="$(printf '%s' "$accounts_json" | jq -r '.result[0].id // empty')"
          fi
          [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]] || {
            echo "Cloudflare Account ID could not be resolved safely"
            exit 1
          }

          echo "::add-mask::$account_id"
          project_json="$(curl -fsS \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$account_id/pages/projects/$project_name")"
          test "$(printf '%s' "$project_json" | jq -r '.success // false')" = "true"
          test "$(printf '%s' "$project_json" | jq -r '.result.name // empty')" = "$project_name"
          test "$(printf '%s' "$project_json" | jq -r '.result.production_branch // empty')" = "$PAGES_BRANCH"

          {
            echo "CLOUDFLARE_API_TOKEN=$token"
            echo "CLOUDFLARE_ACCOUNT_ID=$account_id"
            echo "CLOUDFLARE_PROJECT_NAME=$project_name"
          } >> "$GITHUB_ENV"

      - name: Install exact lockfile dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run deterministic release checks
        run: |
          set -euo pipefail
          npm run verify:deployment-source
          npm run verify:secrets
          npm run verify:migrations
          npx tsc --noEmit
          npm test -- --passWithNoTests
          npm run build
          npm run verify:release-identity

      - name: Verify release-safe build output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/build.json
          test -s dist/release.txt
          grep -F 'name="x-irha-release" content="frontend-live-2026-07-13-r11"' dist/index.html
          grep -F '"repository": "irhaapparelsofficial-ctrl/irha-global-craft-f3881330"' dist/build.json
          grep -F '"supabase_project_id": "pvzjiozismyxqrzmtfbi"' dist/build.json
          grep -F '"expected_origin": "https://irhaapparels.com"' dist/build.json

          if grep -R -nF --include='*.html' --include='*.js' --include='*.json' --include='*.txt' --include='*.xml' 'mlefxgyaqoisvdmoiapq' dist; then
            echo "Built frontend references the retired Lovable Cloud database"
            exit 1
          fi

          if grep -R -nE --include='*.html' --include='*.js' --include='*.json' --include='*.txt' --include='*.xml' \
            'Since 2014|MOQ 50|45-Day Delivery|45-day delivery|reply within 12 hours|BSCI Audited|ISO 9001:2015|SEDEX Member' dist; then
            echo "Built output contains blocked legacy production claims"
            exit 1
          fi

          fingerprint="$(jq -r '.build_fingerprint // empty' dist/build.json)"
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]] || {
            echo "Built output is missing a valid deterministic fingerprint"
            exit 1
          }

          jq -n \
            --arg source_sha "$GITHUB_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$PAGES_BRANCH" \
            --arg build_fingerprint "$fingerprint" \
            --arg purpose "staging-only" \
            --arg production_routing_repository "$PRODUCTION_ROUTING_REPOSITORY" \
            --arg production_routing_policy "$PRODUCTION_ROUTING_POLICY" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{source_sha: $source_sha, repository: $repository, branch: $branch, build_fingerprint: $build_fingerprint, purpose: $purpose, production_routing_repository: $production_routing_repository, production_routing_policy: $production_routing_policy, generated_at: $generated_at}' \
            > dist/cloudflare-deployment.json

      - name: Deploy exact build to Cloudflare Pages staging
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist \
            --project-name="$CLOUDFLARE_PROJECT_NAME" \
            --branch="$PAGES_BRANCH"

      - name: Verify pages.dev serves the exact staging release
        shell: bash
        run: |
          set -euo pipefail
          expected_fingerprint="$(jq -r '.build_fingerprint // empty' dist/build.json)"
          [[ "$expected_fingerprint" =~ ^[0-9a-f]{64}$ ]]
          ready=0

          for attempt in $(seq 1 24); do
            cache_bust="${GITHUB_SHA::12}-$attempt-$RANDOM"
            if curl -fsSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' \
                 "$STAGING_URL/?release_check=$cache_bust" -o /tmp/staging-home.html \
              && curl -fsSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' \
                 "$STAGING_URL/build.json?release_check=$cache_bust" -o /tmp/staging-build.json \
              && curl -fsSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' \
                 "$STAGING_URL/cloudflare-deployment.json?release_check=$cache_bust" -o /tmp/staging-deployment.json \
              && grep -Fq 'name="x-irha-release" content="frontend-live-2026-07-13-r11"' /tmp/staging-home.html \
              && jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" \
                   --arg supabase 'pvzjiozismyxqrzmtfbi' --arg fingerprint "$expected_fingerprint" \
                   '.source_commit == $sha and .source_identity_state == "verified" and .repository == $repo and .supabase_project_id == $supabase and .build_fingerprint == $fingerprint' \
                   /tmp/staging-build.json >/dev/null \
              && jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" \
                   --arg fingerprint "$expected_fingerprint" \
                   '.source_sha == $sha and .repository == $repo and .branch == "main" and .build_fingerprint == $fingerprint and .purpose == "staging-only"' \
                   /tmp/staging-deployment.json >/dev/null; then
              ready=1
              echo "$STAGING_URL verified on attempt $attempt"
              break
            fi

            echo "$STAGING_URL not converged yet (attempt $attempt/24)"
            sleep 10
          done

          test "$ready" = "1" || {
            echo "Exact staging release verification failed for $STAGING_URL"
            exit 1
          }

          if grep -Eiq 'Since 2014|MOQ 50|45-Day Delivery|45-day delivery|reply within 12 hours|BSCI Audited|ISO 9001:2015|SEDEX Member' /tmp/staging-home.html; then
            echo "Blocked legacy production claims are present on $STAGING_URL"
            exit 1
          fi

      - name: Record deployment authority separation
        shell: bash
        run: |
          {
            echo "## Cloudflare Pages staging deployment"
            echo "- Status: verified"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Staging URL: $STAGING_URL"
            echo "- Custom domain deployment: intentionally not performed"
            echo "- Production routing owner: \`$PRODUCTION_ROUTING_REPOSITORY\`"
            echo "- Production policy: \`$PRODUCTION_ROUTING_POLICY\`"
            echo "- DNS and custom-domain configuration were not modified"
          } >> "$GITHUB_STEP_SUMMARY"
