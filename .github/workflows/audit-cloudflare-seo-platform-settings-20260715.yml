name: Audit Cloudflare SEO platform settings

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-cloudflare-seo-platform-settings-20260715.yml"
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: >-
      github.event_name == 'push' ||
      (github.event.issue.number == 375 &&
       github.event.comment.body == '/audit-cloudflare-seo-platform' &&
       github.event.comment.user.login == 'irhaapparelsofficial-ctrl')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
      ZONE_NAME: irhaapparels.com
    steps:
      - name: Resolve zone and collect read-only settings
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '[:space:]')"
          raw_account="$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID:-}" | tr -d '[:space:]')"
          project="$(printf '%s' "${CLOUDFLARE_PROJECT_NAME:-}" | tr -d '[:space:]')"
          test -n "$token"
          test -n "$project"
          echo "::add-mask::$token"

          auth=(-H "Authorization: Bearer $token" -H 'Content-Type: application/json')
          verify="$(curl -fsS "${auth[@]}" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          test "$(jq -r '.success // false' <<<"$verify")" = true

          zones="$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME&status=active&per_page=10")"
          test "$(jq -r '.success // false' <<<"$zones")" = true
          test "$(jq -r '(.result // []) | length' <<<"$zones")" = 1
          zone_id="$(jq -r '.result[0].id' <<<"$zones")"
          account_id="$(jq -r '.result[0].account.id // empty' <<<"$zones")"
          if ! [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            account_id="$(printf '%s' "$raw_account" | grep -Eo '[0-9a-fA-F]{32}' | head -n1 || true)"
          fi
          [[ "$zone_id" =~ ^[0-9a-fA-F]{32}$ ]]
          [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]
          echo "::add-mask::$zone_id"
          echo "::add-mask::$account_id"

          : > /tmp/endpoint-status.tsv
          capture() {
            name="$1"
            url="$2"
            status="$(curl -sS -o "/tmp/$name.json" -w '%{http_code}' "${auth[@]}" "$url" || true)"
            printf '%s\t%s\n' "$name" "$status" >> /tmp/endpoint-status.tsv
          }

          capture zone_settings "https://api.cloudflare.com/client/v4/zones/$zone_id/settings"
          capture pages_project "https://api.cloudflare.com/client/v4/accounts/$account_id/pages/projects/$project"
          capture browser_insights "https://api.cloudflare.com/client/v4/zones/$zone_id/settings/browser_insights"
          capture bot_management "https://api.cloudflare.com/client/v4/zones/$zone_id/bot_management"
          capture ai_crawl_control "https://api.cloudflare.com/client/v4/zones/$zone_id/ai-crawl-control"
          capture ai_crawl_control_settings "https://api.cloudflare.com/client/v4/zones/$zone_id/ai-crawl-control/settings"
          capture content_signals "https://api.cloudflare.com/client/v4/zones/$zone_id/content-signals"
          capture content_signals_settings "https://api.cloudflare.com/client/v4/zones/$zone_id/content-signals/settings"

          node <<'NODE'
          const fs = require('fs');
          const parse = (path) => {
            try { return JSON.parse(fs.readFileSync(path, 'utf8')); } catch { return null; }
          };
          const zone = parse('/tmp/zone_settings.json');
          const pages = parse('/tmp/pages_project.json');
          const matches = (zone?.result || []).filter((setting) =>
            /(browser|insight|analytic|robot|content|signal|ai|bot)/i.test(`${setting.id} ${setting.title || ''}`)
          ).map((s) => ({
            id: s.id,
            value: s.value,
            editable: s.editable,
            modified_on: s.modified_on || null,
          }));
          const project = pages?.result || {};
          const safeProject = pages?.success ? {
            name: project.name,
            production_branch: project.production_branch,
            subdomain: project.subdomain,
            source_type: project.source?.type || null,
            deployment_configs: project.deployment_configs ? {
              production: {
                compatibility_date: project.deployment_configs.production?.compatibility_date || null,
                compatibility_flags: project.deployment_configs.production?.compatibility_flags || [],
                always_use_latest_compatibility_date: project.deployment_configs.production?.always_use_latest_compatibility_date || false,
              },
            } : null,
          } : null;

          const statuses = fs.readFileSync('/tmp/endpoint-status.tsv', 'utf8').trim().split('\n').filter(Boolean);
          let md = '## Cloudflare SEO platform override audit\n\n';
          md += 'Read-only audit; no Cloudflare setting was changed.\n\n';
          md += '### Matching zone settings\n\n```json\n';
          md += JSON.stringify(matches, null, 2);
          md += '\n```\n\n### Pages project summary\n\n```json\n';
          md += JSON.stringify(safeProject, null, 2);
          md += '\n```\n\n### Endpoint status and sanitized result\n\n| Endpoint | HTTP | Result |\n|---|---:|---|\n';
          for (const line of statuses) {
            const [name, status] = line.split('\t');
            const raw = parse(`/tmp/${name}.json`);
            let summary = raw
              ? JSON.stringify(raw.result ?? { success: raw.success, errors: raw.errors }, null, 0)
              : 'unreadable response';
            summary = summary.replace(/\|/g, '\\|').replace(/`/g, '').slice(0, 1200);
            md += `| \`${name}\` | ${status} | \`${summary}\` |\n`;
          }
          fs.writeFileSync('/tmp/cloudflare-seo-audit.md', md);
          console.log(md);
          NODE

      - name: Record sanitized audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 375 --repo "$GITHUB_REPOSITORY" --body-file /tmp/cloudflare-seo-audit.md
