name: Phase 2 incident gateway smoke once

on:
  push:
    branches: [ops/external-hardening-20260716]
    paths:
      - ".github/workflows/edge-incident-phase2-smoke-once-20260716.yml"

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/external-hardening-20260716
          fetch-depth: 0

      - name: Verify public gateway after direct RPC revocation
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://pvzjiozismyxqrzmtfbi.supabase.co/functions/v1/report-app-incident'
          incident="IRHA-PHASE2$(date +%H%M%S)-C4D5E6"
          payload="$(jq -nc --arg id "$incident" '{_incident_id:$id,_route:"/phase2-smoke",_error_name:"Phase2Smoke",_error_message:"synthetic service role gateway verification",_component_stack:null,_user_agent:"github-actions-phase2-smoke",_source_sha:"48180f558dbddedd2b5c724c5e82724657af5092"}')"

          invalid_http="$(curl -sS -o /tmp/invalid-body -w '%{http_code}' -X POST \
            -H 'Origin: https://invalid.example' -H 'Content-Type: application/json' \
            --data "$payload" "$endpoint")"
          valid_http="$(curl -sS -o /tmp/valid-body -w '%{http_code}' -X POST \
            -H 'Origin: https://irhaapparels.com' -H 'Content-Type: application/json' \
            --data "$payload" "$endpoint")"
          valid_body="$(tr -d '[:space:]' < /tmp/valid-body)"

          test "$invalid_http" = "403"
          test "$valid_http" = "200"
          test "$valid_body" = "true"

          mkdir -p docs
          cat > docs/EDGE_GATEWAY_PHASE2_SMOKE_20260716.md <<EOF
          # Runtime incident gateway Phase 2 smoke — 2026-07-16

          - Incident reference: \`$incident\`
          - Invalid origin: \`403\` and blocked
          - Valid production origin: \`200\` and accepted
          - Direct RPC grants expected: anon \`false\`, authenticated \`false\`, service_role \`true\`
          - Verified frontend source: \`48180f558dbddedd2b5c724c5e82724657af5092\`

          Synthetic database rows must be verified and removed after this run.
          EOF
          rm -f /tmp/invalid-body /tmp/valid-body
          rm .github/workflows/edge-incident-phase2-smoke-once-20260716.yml

      - name: Commit sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(ops): record Phase 2 gateway smoke"
          git push origin HEAD:ops/external-hardening-20260716
