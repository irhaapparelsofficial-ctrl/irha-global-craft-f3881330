name: Cloudflare Custom Domain Cutover V2

run-name: Guarded Cloudflare cutover · ${{ github.ref_name }} · #${{ github.run_number }}

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-custom-domain-cutover-v2.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-custom-domain-cutover
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: e19c2d5d71d7b9c3759704007055fc702b7eaf09
  ZONE_NAME: irhaapparels.com
  WWW_NAME: www.irhaapparels.com
  PAGES_TARGET: irha-apparels.pages.dev
  PAGES_URL: https://irha-apparels.pages.dev

jobs:
  cutover:
    if: github.event.pull_request.head.ref == 'ops/cloudflare-custom-domain-cutover-20260714-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}

    steps:
      - name: Checkout exact operational source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preflight, backup, cutover and verify
        shell: bash
        run: |
          set -eEuo pipefail

          base_sha="$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")"
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$base_sha" = "$EXPECTED_MAIN_SHA" || { echo "PR base moved: $base_sha"; exit 1; }
          test "$current_main" = "$EXPECTED_MAIN_SHA" || { echo "main advanced: $current_main"; exit 1; }

          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          account_id="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          project_name="$(printf '%s' "$CLOUDFLARE_PROJECT_NAME" | tr -d '[:space:]')"
          test -n "$token"
          [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]
          test -n "$project_name"
          echo "::add-mask::$token"
          echo "::add-mask::$account_id"

          cf_get() {
            curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' "$1"
          }

          verify_json="$(cf_get https://api.cloudflare.com/client/v4/user/tokens/verify)"
          test "$(printf '%s' "$verify_json" | jq -r '.success // false')" = true

          project_url="https://api.cloudflare.com/client/v4/accounts/$account_id/pages/projects/$project_name"
          domains_url="$project_url/domains"
          project_json="$(cf_get "$project_url")"
          test "$(printf '%s' "$project_json" | jq -r '.success // false')" = true
          test "$(printf '%s' "$project_json" | jq -r '.result.name // empty')" = "$project_name"
          test "$(printf '%s' "$project_json" | jq -r '.result.production_branch // empty')" = main
          printf '%s' "$project_json" | jq -e --arg default "$PAGES_TARGET" '(.result.domains // []) == [$default]' >/dev/null || {
            echo 'Unexpected existing custom-domain state'; printf '%s' "$project_json" | jq '.result.domains'; exit 1;
          }

          pages_release="$(curl -fsS --connect-timeout 10 --max-time 45 -H 'Cache-Control: no-cache' "$PAGES_URL/cloudflare-deployment.json?precutover=${EXPECTED_MAIN_SHA::12}")"
          printf '%s' "$pages_release" | jq -e --arg sha "$EXPECTED_MAIN_SHA" --arg repo "$GITHUB_REPOSITORY" '.source_sha == $sha and .repository == $repo and .branch == "main"' >/dev/null || {
            echo 'Pages production is not exact current main'; exit 1;
          }

          zones_json="$(curl -fsS -G -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            --data-urlencode "name=$ZONE_NAME" --data-urlencode "account.id=$account_id" \
            --data-urlencode 'status=active' --data-urlencode 'per_page=10' \
            https://api.cloudflare.com/client/v4/zones)"
          test "$(printf '%s' "$zones_json" | jq -r '.success // false')" = true
          test "$(printf '%s' "$zones_json" | jq -r '.result | length')" = 1
          zone_id="$(printf '%s' "$zones_json" | jq -r '.result[0].id')"
          echo "::add-mask::$zone_id"

          records_json="$(curl -fsS -G -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            --data-urlencode 'per_page=100' "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records")"
          test "$(printf '%s' "$records_json" | jq -r '.success // false')" = true
          printf '%s' "$records_json" | jq --arg apex "$ZONE_NAME" --arg www "$WWW_NAME" \
            '[.result[] | select((.name == $apex or .name == $www) and .type == "CNAME") | {id,type,name,content,proxied,ttl,comment}] | sort_by(.name)' \
            > /tmp/original-web-cnames.json
          jq -e 'length == 2 and all(.[]; .content == "cname.lovable.app" and .proxied == true)' /tmp/original-web-cnames.json >/dev/null || {
            echo 'Apex/www no longer match expected Lovable rollback baseline'; exit 1;
          }

          apex_code="$(curl -LsS --connect-timeout 10 --max-time 45 -o /tmp/pre-apex.html -w '%{http_code}' "https://$ZONE_NAME/")"
          www_effective="$(curl -LsS --connect-timeout 10 --max-time 45 -o /tmp/pre-www.html -w '%{url_effective}' "https://$WWW_NAME/")"
          test "$apex_code" = 200
          case "$www_effective" in https://irhaapparels.com/*) ;; *) echo "Pre-cutover www redirect failed: $www_effective"; exit 1;; esac

          jq -n --arg expected_main_sha "$EXPECTED_MAIN_SHA" --arg account_id "$account_id" \
            --arg project_name "$project_name" --arg zone_id "$zone_id" \
            --arg latest_deployment_id "$(printf '%s' "$project_json" | jq -r '.result.latest_deployment.id // empty')" \
            --slurpfile records /tmp/original-web-cnames.json --argjson pages_release "$(printf '%s' "$pages_release" | jq -c '.')" \
            '{expected_main_sha:$expected_main_sha,account_id:$account_id,project_name:$project_name,zone_id:$zone_id,latest_deployment_id:$latest_deployment_id,original_web_cnames:$records[0],pages_release:$pages_release,created_at:(now|todateiso8601)}' \
            > /tmp/cloudflare-cutover-backup-private.json

          created_apex=0
          created_www=0
          switched_apex=0
          switched_www=0

          restore_record() {
            local name="$1"
            local record record_id payload
            record="$(jq -c --arg name "$name" '.original_web_cnames[] | select(.name == $name)' /tmp/cloudflare-cutover-backup-private.json)"
            record_id="$(printf '%s' "$record" | jq -r '.id')"
            payload="$(printf '%s' "$record" | jq '{type,name,content,ttl,proxied}')"
            curl -sS -X PUT -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data "$payload" \
              "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records/$record_id" | jq -e '.success == true' >/dev/null
          }

          delete_domain() {
            local domain="$1"
            curl -sS -X DELETE -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
              "$domains_url/$domain" >/dev/null || true
          }

          rollback() {
            local rc=$?
            trap - ERR INT TERM
            set +e
            echo "Cutover failed with exit $rc; restoring original state"
            [ "$switched_apex" = 1 ] && restore_record "$ZONE_NAME"
            [ "$switched_www" = 1 ] && restore_record "$WWW_NAME"
            [ "$created_www" = 1 ] && delete_domain "$WWW_NAME"
            [ "$created_apex" = 1 ] && delete_domain "$ZONE_NAME"
            restored=0
            for attempt in $(seq 1 30); do
              code="$(curl -LsS --connect-timeout 10 --max-time 40 -o /tmp/rollback-apex.html -w '%{http_code}' "https://$ZONE_NAME/" 2>/dev/null || true)"
              effective="$(curl -LsS --connect-timeout 10 --max-time 40 -o /tmp/rollback-www.html -w '%{url_effective}' "https://$WWW_NAME/" 2>/dev/null || true)"
              if [ "$code" = 200 ]; then case "$effective" in https://irhaapparels.com/*) restored=1; break;; esac; fi
              sleep 10
            done
            jq -n --arg status rollback --argjson original_exit "$rc" --argjson restored "$restored" \
              '{status:$status,original_exit:$original_exit,live_restored:($restored == 1),finished_at:(now|todateiso8601)}' \
              > /tmp/cloudflare-cutover-result.json
            exit "$rc"
          }
          trap rollback ERR INT TERM

          create_domain() {
            local domain="$1" response
            response="$(curl -sS -X POST -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
              --data "$(jq -nc --arg name "$domain" '{name:$name}')" "$domains_url")"
            test "$(printf '%s' "$response" | jq -r '.success // false')" = true || {
              printf '%s' "$response" | jq -r '.errors[]? | "Create domain error \(.code): \(.message)"'; return 1;
            }
          }

          update_record() {
            local name="$1" record record_id payload response
            record="$(jq -c --arg name "$name" '.original_web_cnames[] | select(.name == $name)' /tmp/cloudflare-cutover-backup-private.json)"
            record_id="$(printf '%s' "$record" | jq -r '.id')"
            payload="$(jq -nc --arg name "$name" --arg target "$PAGES_TARGET" '{type:"CNAME",name:$name,content:$target,ttl:1,proxied:true}')"
            response="$(curl -sS -X PUT -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data "$payload" \
              "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records/$record_id")"
            test "$(printf '%s' "$response" | jq -r '.success // false')" = true || {
              printf '%s' "$response" | jq -r '.errors[]? | "DNS update error \(.code): \(.message)"'; return 1;
            }
          }

          create_domain "$ZONE_NAME"; created_apex=1
          create_domain "$WWW_NAME"; created_www=1
          update_record "$ZONE_NAME"; switched_apex=1
          update_record "$WWW_NAME"; switched_www=1

          ready=0
          for attempt in $(seq 1 72); do
            project_now="$(cf_get "$project_url")"
            domains_ok="$(printf '%s' "$project_now" | jq -r --arg apex "$ZONE_NAME" --arg www "$WWW_NAME" '((.result.domains // []) | index($apex)) != null and ((.result.domains // []) | index($www)) != null')"
            bust="${EXPECTED_MAIN_SHA::12}-$attempt"
            code="$(curl -LsS --connect-timeout 10 --max-time 45 -o /tmp/live-apex.html -w '%{http_code}' "https://$ZONE_NAME/?cutover=$bust" 2>/dev/null || true)"
            effective="$(curl -LsS --connect-timeout 10 --max-time 45 -o /tmp/live-www.html -w '%{url_effective}' "https://$WWW_NAME/?cutover=$bust" 2>/dev/null || true)"
            curl -fsS --connect-timeout 10 --max-time 45 -H 'Cache-Control: no-cache' "https://$ZONE_NAME/build.json?cutover=$bust" -o /tmp/live-build.json 2>/dev/null || true
            curl -fsS --connect-timeout 10 --max-time 45 -H 'Cache-Control: no-cache' "https://$ZONE_NAME/cloudflare-deployment.json?cutover=$bust" -o /tmp/live-deployment.json 2>/dev/null || true
            home_ok=false; build_ok=false; deployment_ok=false; www_ok=false
            grep -Fq 'name="x-irha-release" content="frontend-live-2026-07-13-r11"' /tmp/live-apex.html 2>/dev/null && home_ok=true
            jq -e --arg repo "$GITHUB_REPOSITORY" --arg supabase pvzjiozismyxqrzmtfbi '.repository == $repo and .supabase_project_id == $supabase' /tmp/live-build.json >/dev/null 2>&1 && build_ok=true
            jq -e --arg sha "$EXPECTED_MAIN_SHA" --arg repo "$GITHUB_REPOSITORY" '.source_sha == $sha and .repository == $repo and .branch == "main"' /tmp/live-deployment.json >/dev/null 2>&1 && deployment_ok=true
            case "$effective" in https://irhaapparels.com/*) www_ok=true;; esac
            if [ "$domains_ok" = true ] && [ "$code" = 200 ] && [ "$home_ok" = true ] && [ "$build_ok" = true ] && [ "$deployment_ok" = true ] && [ "$www_ok" = true ]; then ready=1; break; fi
            echo "Waiting: domains=$domains_ok code=$code home=$home_ok build=$build_ok deployment=$deployment_ok www=$www_ok ($attempt/72)"
            sleep 10
          done
          test "$ready" = 1 || { echo 'Cutover did not converge'; false; }

          final_records="$(curl -fsS -G -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data-urlencode 'per_page=100' "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records")"
          printf '%s' "$final_records" | jq -e --arg apex "$ZONE_NAME" --arg www "$WWW_NAME" --arg target "$PAGES_TARGET" \
            '([.result[] | select((.name == $apex or .name == $www) and .type == "CNAME" and .content == $target and .proxied == true)] | length) == 2' >/dev/null

          trap - ERR INT TERM
          jq -n --arg status success --arg source_sha "$EXPECTED_MAIN_SHA" --arg target "$PAGES_TARGET" \
            '{status:$status,source_sha:$source_sha,dns_target:$target,verified:true,finished_at:(now|todateiso8601)}' \
            > /tmp/cloudflare-cutover-result.json

      - name: Upload rollback checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-cutover-backup-private-v2
          path: /tmp/cloudflare-cutover-backup-private.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload cutover result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-cutover-result-v2
          path: /tmp/cloudflare-cutover-result.json
          if-no-files-found: warn
          retention-days: 14
