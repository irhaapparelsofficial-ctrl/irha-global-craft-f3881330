name: IA Media E001 Recovery Builder

on:
  push:
    branches:
      - codex/ia-media-e001-recovery-builder
    paths:
      - ".github/workflows/ia-media-e001-recovery-builder.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: ia-media-e001-recovery-builder
  cancel-in-progress: false

jobs:
  build-clean-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPECTED_MAIN: 770569e087badea7d38e60b3582426264c514bdf
      SOURCE_SHA: ca03213251658ae91a9f525011170225829ee19f
      SOURCE_BRANCH: codex/official-logo-p001-p007-media-recovery
      CLEAN_BRANCH: codex/ia-media-e001-clean-recovery
    steps:
      - name: Checkout recovery controller
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable source heads
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$SOURCE_BRANCH" --no-tags
          actual_main="$(git rev-parse origin/main)"
          actual_source="$(git rev-parse "origin/$SOURCE_BRANCH")"
          test "$actual_main" = "$EXPECTED_MAIN" || {
            echo "main moved: expected $EXPECTED_MAIN, got $actual_main"
            exit 1
          }
          test "$actual_source" = "$SOURCE_SHA" || {
            echo "source branch moved: expected $SOURCE_SHA, got $actual_source"
            exit 1
          }
          if git ls-remote --exit-code --heads origin "$CLEAN_BRANCH" >/dev/null 2>&1; then
            echo "clean recovery branch already exists; refusing to overwrite"
            exit 1
          fi

      - name: Assemble exact IA-MEDIA-E001 scope
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$EXPECTED_MAIN"
          selected=(
            ".github/workflows/ia-media-e001-remediation.yml"
            ".github/workflows/ia-media-e001-visual-acceptance.yml"
            "docs/IA_MEDIA_E001_STAGED_EVIDENCE.md"
            "ops/ia-media-e001/media-plan.mjs"
            "package.json"
            "scripts/capture-ia-media-e001-visual-evidence.mjs"
            "scripts/remediate-p001-p007-media.mjs"
            "scripts/resolve-cloudflare-preview-deployment.mjs"
            "scripts/stage-p001-p007-media.mjs"
            "scripts/version-official-brand-assets.mjs"
            "src/components/ThumbnailImage.tsx"
            "src/components/layout/Navbar.tsx"
            "src/hooks/usePublishedCatalogTaxonomy.ts"
            "src/lib/__checks__/productGalleryAuthority.test.ts"
            "src/lib/assetResolver.ts"
            "src/lib/brandAssets.ts"
            "src/lib/iaMediaE001Runtime.ts"
            "src/lib/imageLoading.ts"
            "src/lib/productGalleryAuthority.ts"
            "src/test/faviconBranding.test.ts"
            "src/test/iaMediaE001AuthorizationContract.test.ts"
            "src/test/iaMediaE001Plan.test.ts"
            "src/test/iaMediaE001TaxonomyFallback.test.ts"
            "src/test/iaUxE001.test.tsx"
            "src/test/publicBrandingSanitation.test.ts"
            "supabase/migrations/20260731151915_align_drive_gallery_with_selected_media.sql"
            "supabase/repository-migrations.json"
          )
          git checkout "$SOURCE_SHA" -- "${selected[@]}"
          echo " bicK    " | base64 -d > /tmp/ia-media-patch.py
          python /tmp/ia-media-patch.py
          mkdir -p scripts/lib
          echo " Ake3JlZmVyZW5jZVByZWZpeH0tYCkgJiYgTEVHQUNZX0ZST05UX0ZJTEVOQU1FLnRlc3QoZmlsZW5hbWUpOwogIH0KCiAgcmV0dXJuIElBX01FRElBX0UwMDFfUkVGRVJFTkNFX0NPRE VTLmhhcyhyZWZlcmVuY2UpCiAgICAmJiB0YWlsLmxlbmd0aCA9PT0gMgogICAgJiYgdGFpbFswXSA9PT0gSUFfTUVESUFfRTAwMV9SRUxFQVNF CiAgICAmJiBJQV9NRURJQV9FMDAxX0hFUk9fRklMRU5BTUUudGVzdCh0YWlsWzFdKTsKfQo=" | base64 -d > scripts/lib/product-primary-image-path.mjs
          echo " k u " | base64 -d > src/test/iaMediaE001ImageSeoPath.test.mjs
          git diff --check
          test ! -e .semgrep.yml
          test "$(git diff --name-only "$EXPECTED_MAIN" -- .github/workflows/quality.yml | wc -l)" -eq 0
          test "$(git diff --name-only "$EXPECTED_MAIN" -- src/components/CookieConsent.tsx | wc -l)" -eq 0
          test "$(git diff --name-only "$EXPECTED_MAIN" -- src/components/ui/toaster.tsx | wc -l)" -eq 0
          test "$(git diff --name-only "$EXPECTED_MAIN" -- src/index.css | wc -l)" -eq 0

      - name: Install exact dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run changed-file lint
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t lint_files < <(git diff --name-only "$EXPECTED_MAIN" -- '*.ts' '*.tsx' '*.mjs')
          test "${#lint_files[@]}" -gt 0
          npx eslint "${lint_files[@]}"

      - name: Run full tests
        run: npm test -- --run

      - name: Run production build
        run: npm run build

      - name: Record clean recovery evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ia-media-e001-recovery
          {
            echo "expected_main=$EXPECTED_MAIN"
            echo "source_sha=$SOURCE_SHA"
            echo "clean_branch=$CLEAN_BRANCH"
            echo "changed_files=$(git diff --name-only "$EXPECTED_MAIN" | wc -l)"
            echo "tests=passed"
            echo "build=passed"
          } > artifacts/ia-media-e001-recovery/pre-push-verification.txt
          git diff --name-status "$EXPECTED_MAIN" > artifacts/ia-media-e001-recovery/changed-files.txt
          git diff --stat "$EXPECTED_MAIN" > artifacts/ia-media-e001-recovery/diff-stat.txt

      - name: Create and push one clean commit
        id: push
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          actual_source="$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)"
          test "$actual_main" = "$EXPECTED_MAIN"
          test "$actual_source" = "$SOURCE_SHA"
          git switch -c "$CLEAN_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(media): recover official logo and P001-P007 verified media"
          clean_sha="$(git rev-parse HEAD)"
          echo "clean_sha=$clean_sha" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:refs/heads/$CLEAN_BRANCH"
          echo "$clean_sha" > artifacts/ia-media-e001-recovery/clean-head-sha.txt

      - name: Upload immutable pre-push evidence
        uses: actions/upload-artifact@v4
        with:
          name: ia-media-e001-clean-recovery-${{ steps.push.outputs.clean_sha }}
          path: artifacts/ia-media-e001-recovery
          if-no-files-found: error
          retention-days: 90

      - name: Publish recovery summary
        run: |
          {
            echo "## IA-MEDIA-E001 clean recovery"
            echo "- Main: \`$EXPECTED_MAIN\`"
            echo "- Contaminated source inspected: \`$SOURCE_SHA\`"
            echo "- Clean head: \`${{ steps.push.outputs.clean_sha }}\`"
            echo "- Clean branch: \`$CLEAN_BRANCH\`"
            echo "- Changed-file lint, full tests and production build passed before branch push."
            echo "- Generic Semgrep/Quality Gate, cookie, toaster and broad CSS changes were excluded."
          } >> "$GITHUB_STEP_SUMMARY"
