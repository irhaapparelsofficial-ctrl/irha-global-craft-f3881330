name: Diagnose Plain Owner Tests

on:
  push:
    branches: [feat/plain-owner-admin-20260715]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Run tests and capture JSON
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm test -- --passWithNoTests --reporter=json --outputFile=vitest-results.json
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          test -s vitest-results.json || printf '{"success":false,"error":"vitest did not produce JSON","exitCode":%s}\n' "$status" > vitest-results.json
          exit 0
      - name: Upload test result
        uses: actions/upload-artifact@v4
        with:
          name: plain-owner-vitest-results
          path: vitest-results.json
          if-no-files-found: error
          retention-days: 1
      - name: Preserve test conclusion
        shell: bash
        run: test "${{ steps.tests.outputs.exit_code }}" = "0"
