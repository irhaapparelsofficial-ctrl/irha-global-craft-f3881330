name: Capture TypeScript diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  capture:
    if: github.head_ref == 'fix/static-route-shells-20260713'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Capture exact app typecheck output
        shell: bash
        run: |
          set +e
          npx tsc --noEmit -p tsconfig.app.json > .tsc-diagnostic.txt 2>&1
          code=$?
          echo "exit_code=$code" >> .tsc-diagnostic.txt
          cat .tsc-diagnostic.txt
          exit 0
      - name: Commit diagnostic once
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tsc-diagnostic.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(ci): capture Node 22 TypeScript diagnostic'
          git push origin HEAD:${{ github.head_ref }}
