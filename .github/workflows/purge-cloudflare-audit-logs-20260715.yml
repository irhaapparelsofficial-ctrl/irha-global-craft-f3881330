name: Purge Cloudflare audit logs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/purge-cloudflare-audit-logs-20260715.yml"

permissions:
  contents: read
  actions: write

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete all Cloudflare SEO audit workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          gh api --paginate "repos/$repo/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.name == "Audit Cloudflare SEO platform settings") | .id' \
            | sort -u > /tmp/run-ids.txt

          count=0
          while IFS= read -r run_id; do
            test -n "$run_id" || continue
            gh api --method DELETE "repos/$repo/actions/runs/$run_id"
            count=$((count + 1))
          done < /tmp/run-ids.txt

          echo "Deleted $count Cloudflare audit workflow run(s) and their logs." >> "$GITHUB_STEP_SUMMARY"
