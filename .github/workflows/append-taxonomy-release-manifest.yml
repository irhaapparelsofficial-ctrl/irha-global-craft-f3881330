name: Assemble taxonomy release manifest

on:
  push:
    branches:
      - release/catalog-taxonomy-public-runtime-current-main

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/catalog-taxonomy-public-runtime-current-main
          fetch-depth: 0
      - name: Append exact migration entries and remove assembler
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'supabase/repository-migrations.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          const additions = [
            {
              version: '20260717235000',
              name: 'catalog_taxonomy_owner_release_controls',
              path: 'supabase/migrations/20260717235000_catalog_taxonomy_owner_release_controls.sql',
              git_blob_sha: 'beadb515c6888cd77b8aba5b4bf4aed437e99d3b',
              execution_mode: 'transactional',
              transactional_dry_run: true
            },
            {
              version: '20260717235100',
              name: 'catalog_taxonomy_verified_review_approval',
              path: 'supabase/migrations/20260717235100_catalog_taxonomy_verified_review_approval.sql',
              git_blob_sha: '9b331ea6da3dc60ec783098301b5691c3c295654',
              execution_mode: 'transactional',
              transactional_dry_run: true
            }
          ];
          for (const entry of additions) {
            const existing = manifest.migrations.find((item) => item.version === entry.version);
            if (existing && JSON.stringify(existing) !== JSON.stringify(entry)) {
              throw new Error(`conflicting manifest entry ${entry.version}`);
            }
            if (!existing) manifest.migrations.push(entry);
          }
          manifest.migrations.sort((a, b) => a.version.localeCompare(b.version));
          if (manifest.migrations.length < 24) throw new Error('manifest count did not grow safely');
          fs.writeFileSync(path, JSON.stringify(manifest) + '\n');
          NODE
          rm .github/workflows/append-taxonomy-release-manifest.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/repository-migrations.json .github/workflows/append-taxonomy-release-manifest.yml
          git commit -m "chore(db): register taxonomy release migrations"
          git push origin HEAD:release/catalog-taxonomy-public-runtime-current-main
