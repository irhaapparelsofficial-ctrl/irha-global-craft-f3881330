name: Temporary Finalize Search Route State

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-finalize-search-route-state.yml"

permissions:
  contents: write

concurrency:
  group: temp-final-search-route-state
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build exact immutable production artifact
        shell: bash
        run: |
          set -euo pipefail
          npm --ignore-scripts run build

      - name: Generate deterministic state from final deployed manifest
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-search-route-state.mjs \
            --input dist/seo-route-manifest.json \
            --output /tmp/final-search-route-state-1.json \
            --write
          node scripts/generate-search-route-state.mjs \
            --input dist/seo-route-manifest.json \
            --output /tmp/final-search-route-state-2.json \
            --write
          cmp -s /tmp/final-search-route-state-1.json /tmp/final-search-route-state-2.json
          jq -e '.schemaVersion == 1 and .canonicalOrigin == "https://irhaapparels.com" and .routeCount == 436 and (.routes | length) == 436' /tmp/final-search-route-state-1.json >/dev/null
          jq -e '.schemaVersion == 1 and .canonicalOrigin == "https://irhaapparels.com" and .sitemapCount == 436 and (.routes | map(select(.indexable == true and .sitemap == true)) | length) == 436' dist/seo-route-manifest.json >/dev/null
          jq -r '.routes[].url' /tmp/final-search-route-state-1.json | sort -u > /tmp/state-urls.txt
          jq -r '.routes[] | select(.indexable == true and .sitemap == true) | .canonicalUrl' dist/seo-route-manifest.json | sort -u > /tmp/manifest-urls.txt
          cmp -s /tmp/state-urls.txt /tmp/manifest-urls.txt
          ! grep -q '"lastmod"' /tmp/final-search-route-state-1.json
          cp /tmp/final-search-route-state-1.json /tmp/final-search-route-state-sealed.json
          echo "route_state_sha256=$(sha256sum /tmp/final-search-route-state-sealed.json | awk '{print $1}')"
          jq -r '.contentDigest' /tmp/final-search-route-state-sealed.json

      - name: Commit final route state and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          cp /tmp/final-search-route-state-sealed.json seo/search-route-state.json
          git add seo/search-route-state.json
          git rm .github/workflows/temp-finalize-search-route-state.yml
          printf '%s\n' \
            .github/workflows/temp-finalize-search-route-state.yml \
            seo/search-route-state.json \
            | sort > /tmp/expected-changed-files.txt
          git diff --name-only HEAD | sort > /tmp/actual-changed-files.txt
          cmp -s /tmp/expected-changed-files.txt /tmp/actual-changed-files.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(seo): seal final deployed material route state"
          git push origin HEAD:main
