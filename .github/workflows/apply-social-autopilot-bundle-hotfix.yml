name: Apply Social Autopilot Bundle Hotfix

on:
  push:
    branches:
      - hotfix/social-autopilot-bundle-syntax

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/social-autopilot-bundle-syntax
          fetch-depth: 0

      - name: Apply one-character source fix and regression test
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('supabase/functions/social-autopilot/index.ts')
          source = source_path.read_text()
          old = "  media_status: slot.mediaStatus,\n}))}\n\nSTRICT RULES:"
          new = "  media_status: slot.mediaStatus,\n}))) }\n\nSTRICT RULES:"
          new = new.replace('  }', '}')
          if source.count(old) != 1:
              raise SystemExit(f'expected exact broken expression once; found {source.count(old)}')
          source_path.write_text(source.replace(old, new))

          test_path = Path('src/test/socialAutopilotEdgeSyntax.test.ts')
          test_path.write_text('''import { readFileSync } from "node:fs";
          import { resolve } from "node:path";
          import * as ts from "typescript";
          import { describe, expect, it } from "vitest";

          describe("social-autopilot Edge Function source", () => {
            it("has no TypeScript syntax diagnostics before Supabase bundling", () => {
              const filePath = resolve(process.cwd(), "supabase/functions/social-autopilot/index.ts");
              const source = readFileSync(filePath, "utf8");
              const sourceFile = ts.createSourceFile(filePath, source, ts.ScriptTarget.ES2022, true, ts.ScriptKind.TS);
              const result = ts.transpileModule(source, {
                fileName: filePath,
                reportDiagnostics: true,
                compilerOptions: {
                  target: ts.ScriptTarget.ES2022,
                  module: ts.ModuleKind.ESNext,
                },
              });

              const errors = (result.diagnostics ?? [])
                .filter((diagnostic) => diagnostic.category === ts.DiagnosticCategory.Error)
                .map((diagnostic) => {
                  const message = ts.flattenDiagnosticMessageText(diagnostic.messageText, "\\n");
                  if (diagnostic.start === undefined) return message;
                  const position = sourceFile.getLineAndCharacterOfPosition(diagnostic.start);
                  return `${position.line + 1}:${position.character + 1} ${message}`;
                });

              expect(errors).toEqual([]);
            });
          });
          ''')
          PY

      - name: Verify exact patched syntax locally
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import ts from 'typescript';
          const path = 'supabase/functions/social-autopilot/index.ts';
          const source = readFileSync(path, 'utf8');
          const result = ts.transpileModule(source, {
            fileName: path,
            reportDiagnostics: true,
            compilerOptions: { target: ts.ScriptTarget.ES2022, module: ts.ModuleKind.ESNext },
          });
          const errors = (result.diagnostics ?? []).filter((item) => item.category === ts.DiagnosticCategory.Error);
          if (errors.length) {
            console.error(errors.map((item) => ts.flattenDiagnosticMessageText(item.messageText, '\n')).join('\n'));
            process.exit(1);
          }
          console.log('social-autopilot TypeScript syntax check passed');
          NODE

      - name: Remove one-time workflow and commit verified patch
        run: |
          set -euo pipefail
          rm .github/workflows/apply-social-autopilot-bundle-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/social-autopilot/index.ts src/test/socialAutopilotEdgeSyntax.test.ts .github/workflows/apply-social-autopilot-bundle-hotfix.yml
          git commit -m "fix(social): make autopilot Edge Function bundleable"
          git push origin HEAD:hotfix/social-autopilot-bundle-syntax
