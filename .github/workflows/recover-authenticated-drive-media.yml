name: Recover authenticated Drive media

on:
  push:
    branches:
      - fix/authenticated-drive-media-recovery
    paths:
      - recovery-input/READY

permissions:
  contents: write

concurrency:
  group: authenticated-drive-media-recovery
  cancel-in-progress: false

jobs:
  recover-media:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image dependencies
        run: python -m pip install --upgrade Pillow

      - name: Verify and reconstruct recovered assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(find recovery-input/assets -maxdepth 1 -name '*.b64' | wc -l)" -eq 42
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path
          from PIL import Image

          package = Path('recovery-input')
          manifest_bytes = gzip.decompress(base64.b64decode(
              (package / 'authenticated-recovery-manifest.json.gz.b64').read_text().strip(),
              validate=True,
          ))
          manifest = json.loads(manifest_bytes)
          mapping = json.loads((package / 'recovery-map.json').read_text())
          records = manifest['records']
          items = mapping['items']
          parts = sorted((package / 'assets').glob('*.b64'))

          assert manifest['accepted_count'] == 42, manifest
          assert mapping['count'] == 42, mapping
          assert len(records) == len(items) == len(parts) == 42

          manifest_path = Path('public/media/bavarian-drive/batches/authenticated-recovery.json')
          manifest_path.parent.mkdir(parents=True, exist_ok=True)
          manifest_path.write_bytes(manifest_bytes)

          for index, (record, item, part) in enumerate(zip(records, items, parts)):
              assert item['i'] == index, item
              assert record['output_path'] == item['output_path'], (record, item)
              data = base64.b64decode(part.read_text().strip(), validate=True)
              assert len(data) == item['bytes'], (part, len(data), item)
              assert hashlib.sha256(data).hexdigest() == item['sha256'], part
              target = Path('public') / record['output_path'].lstrip('/')
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              with Image.open(target) as image:
                  image.verify()
              with Image.open(target) as image:
                  assert image.size == (item['width'], item['height']), (target, image.size, item)
          print(json.dumps({'reconstructed_assets': len(parts)}, indent=2))
          PY

      - name: Clear recovered public-download failures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          targets = ('copy-socks', 'women-dirndl-blouses')
          for slug in targets:
              for root in (
                  Path('public/media/bavarian-drive/batches'),
                  Path('docs/import-evidence/bavarian-drive-batches'),
              ):
                  path = root / f'{slug}.json'
                  payload = json.loads(path.read_text(encoding='utf-8'))
                  payload['downloaded_count'] = payload['inventory_count']
                  payload['download_failure_count'] = 0
                  payload['download_failures'] = []
                  path.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Finalize complete deduplicated library
        run: |
          python tools/finalize_bavarian_drive_media.py \
            --expected-count 30 \
            --sql-output supabase/manual/20260713_bavarian_drive_media_import.sql

      - name: Verify recovered assets and final evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          report = json.loads(Path('public/media/bavarian-drive/scan-report.json').read_text())
          failures = json.loads(Path('docs/import-evidence/bavarian-drive-download-failures.json').read_text())
          recovery = json.loads(Path('public/media/bavarian-drive/batches/authenticated-recovery.json').read_text())

          assert report['batch_count'] == 30, report
          assert report['inventory_count'] == 1516, report
          assert report['downloaded_count'] == 1516, report
          assert report['download_failure_count'] == 0, report
          assert report['missing_asset_count'] == 0, report
          assert report['uncategorized_path_count'] == 0, report
          assert report['materially_oversized_count'] == 0, report
          assert report['accepted_count'] >= 1470, report
          assert failures['failure_count'] == 0, failures
          assert failures['downloaded_count'] == 1516, failures
          assert recovery['accepted_count'] == 42, recovery

          files = sorted(Path('public/media/bavarian-drive/assets/authenticated-recovery').rglob('*.webp'))
          assert len(files) == recovery['finalized_record_count'], (len(files), recovery)
          for path in files:
              with Image.open(path) as image:
                  image.verify()
          print(json.dumps({
              'accepted_unique': report['accepted_count'],
              'recovered_final': recovery['finalized_record_count'],
              'download_failures': failures['failure_count'],
          }, indent=2))
          PY

      - name: Commit verified recovery and remove staging payloads
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r recovery-input
          git add -A -- \
            public/media/bavarian-drive \
            docs/import-evidence \
            supabase/manual/20260713_bavarian_drive_media_import.sql \
            recovery-input
          git commit -m "fix(media): recover all authenticated Drive images [skip ci]"
          git push origin HEAD:fix/authenticated-drive-media-recovery
