name: Recover authenticated Drive media

on:
  push:
    branches:
      - fix/authenticated-drive-media-recovery
    paths:
      - recovery-input/READY

permissions:
  contents: write

concurrency:
  group: authenticated-drive-media-recovery
  cancel-in-progress: false

jobs:
  recover-media:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image dependencies
        run: python -m pip install --upgrade Pillow

      - name: Verify and reconstruct recovery archive
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find recovery-input -maxdepth 1 -name 'archive.part-*.b64' -print | sort)
          test "${#parts[@]}" -eq 15
          cat "${parts[@]}" | base64 --decode > /tmp/authenticated-recovery.tar.gz
          echo "fedacfc8c137c041eda44b5938228b699ceea4f2f231e900f1a15c4311a96396  /tmp/authenticated-recovery.tar.gz" | sha256sum -c -
          tar -tzf /tmp/authenticated-recovery.tar.gz | grep -q '^public/media/bavarian-drive/batches/authenticated-recovery.json$'
          test "$(tar -tzf /tmp/authenticated-recovery.tar.gz | grep -c '\.webp$')" -eq 42
          if tar -tzf /tmp/authenticated-recovery.tar.gz | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "::error::Unsafe archive path detected"
            exit 1
          fi
          tar -xzf /tmp/authenticated-recovery.tar.gz

      - name: Clear recovered public-download failures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          targets = (
              'copy-socks',
              'women-dirndl-blouses',
          )
          for slug in targets:
              for root in (
                  Path('public/media/bavarian-drive/batches'),
                  Path('docs/import-evidence/bavarian-drive-batches'),
              ):
                  path = root / f'{slug}.json'
                  payload = json.loads(path.read_text(encoding='utf-8'))
                  payload['download_failure_count'] = 0
                  payload['download_failures'] = []
                  path.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Finalize complete deduplicated library
        run: |
          python tools/finalize_bavarian_drive_media.py \
            --expected-count 30 \
            --sql-output supabase/manual/20260713_bavarian_drive_media_import.sql

      - name: Verify recovered assets and final evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          report = json.loads(Path('public/media/bavarian-drive/scan-report.json').read_text())
          failures = json.loads(Path('docs/import-evidence/bavarian-drive-download-failures.json').read_text())
          recovery = json.loads(Path('public/media/bavarian-drive/batches/authenticated-recovery.json').read_text())

          assert report['batch_count'] == 30, report
          assert report['inventory_count'] == 1516, report
          assert report['downloaded_count'] == 1516, report
          assert report['download_failure_count'] == 0, report
          assert report['missing_asset_count'] == 0, report
          assert report['uncategorized_path_count'] == 0, report
          assert report['materially_oversized_count'] == 0, report
          assert report['accepted_count'] >= 1470, report
          assert failures['failure_count'] == 0, failures
          assert failures['downloaded_count'] == 1516, failures
          assert recovery['accepted_count'] == 42, recovery

          files = sorted(Path('public/media/bavarian-drive/assets/authenticated-recovery').rglob('*.webp'))
          assert len(files) == recovery['finalized_record_count'], (len(files), recovery)
          for path in files:
              with Image.open(path) as image:
                  image.verify()
          print(json.dumps({
              'accepted_unique': report['accepted_count'],
              'recovered_final': recovery['finalized_record_count'],
              'download_failures': failures['failure_count'],
          }, indent=2))
          PY

      - name: Commit verified recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            public/media/bavarian-drive \
            docs/import-evidence \
            supabase/manual/20260713_bavarian_drive_media_import.sql
          if git diff --cached --quiet; then
            echo "No recovery changes to commit"
            exit 0
          fi
          git commit -m "fix(media): recover all authenticated Drive images [skip ci]"
          git push origin HEAD:fix/authenticated-drive-media-recovery
