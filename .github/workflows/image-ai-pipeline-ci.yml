name: Image AI Pipeline CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-ai-manual
  cancel-in-progress: true

jobs:
  manual-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check image worker syntax
        run: python -m py_compile scripts/image-ai/process_image.py

      - name: Record manual-only policy
        run: |
          {
            echo "## Image pipeline check"
            echo "- Automatic PR blocking: disabled"
            echo "- Heavy model download and real-image processing: manual only"
            echo "- Current check: Python syntax"
          } >> "$GITHUB_STEP_SUMMARY"
