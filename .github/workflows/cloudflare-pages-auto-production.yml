name: Cloudflare Production After Quality Gate

run-name: Guarded production deploy · ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Quality Gate"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: irha-production-mutation
  cancel-in-progress: false

env:
  PAGES_BRANCH: main
  PAGES_URL: https://irha-apparels.pages.dev
  CANONICAL_ORIGIN: https://irhaapparels.com
  WWW_ORIGIN: https://www.irhaapparels.com

jobs:
  preflight:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
    outputs:
      should_deploy: ${{ steps.current.outputs.should_deploy }}
      source_sha: ${{ steps.current.outputs.source_sha }}
      quality_run_id: ${{ steps.current.outputs.quality_run_id }}
      secrets_ready: ${{ steps.current.outputs.secrets_ready }}

    steps:
      - name: Confirm exact current main and secret readiness
        id: current
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          QUALITY_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '[:space:]')"
          project_name="$(printf '%s' "${CLOUDFLARE_PROJECT_NAME:-}" | tr -d '[:space:]')"

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "quality_run_id=$QUALITY_RUN_ID" >> "$GITHUB_OUTPUT"

          secrets_ready=true
          [ -n "$token" ] || secrets_ready=false
          [ -n "$project_name" ] || secrets_ready=false
          echo "secrets_ready=$secrets_ready" >> "$GITHUB_OUTPUT"

          if [ "$latest_main" != "$SOURCE_SHA" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Superseded green run skipped safely: $SOURCE_SHA; current main is $latest_main"
          elif [ "$secrets_ready" != "true" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Exact current main is green, but Cloudflare secrets are not ready. Waiting without failure."
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Exact current main is green and Cloudflare secrets are available: $SOURCE_SHA"
          fi

      - name: Record waiting state without a red failure
        if: steps.current.outputs.secrets_ready != 'true'
        shell: bash
        run: |
          {
            echo "## Cloudflare production waiting state"
            echo "- Quality Gate: green"
            echo "- Source: \`${{ steps.current.outputs.source_sha }}\`"
            echo "- Status: waiting for repository secrets"
            echo "- Required names: \`CLOUDFLARE_API_TOKEN\`, \`CLOUDFLARE_PROJECT_NAME\`"
            echo "- Result: no deploy attempted and no failure raised"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: preflight
    if: needs.preflight.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      QUALITY_RUN_ID: ${{ needs.preflight.outputs.quality_run_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}

    steps:
      - name: Checkout exact green source utilities
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Download immutable Quality Gate artifact
        uses: actions/download-artifact@v4
        with:
          name: production-dist-${{ env.SOURCE_SHA }}
          path: dist
          run-id: ${{ env.QUALITY_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify immutable release artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/build.json
          test -s dist/release.txt
          test -s dist/_redirects
          test -s dist/_headers
          jq -e --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" \
            '.source_commit == $sha and .source_identity_state == "verified" and .repository == $repo and .supabase_project_id == "pvzjiozismyxqrzmtfbi" and .expected_origin == "https://irhaapparels.com"' \
            dist/build.json >/dev/null

          if grep -R -nF --include='*.html' --include='*.js' --include='*.json' --include='*.txt' --include='*.xml' 'mlefxgyaqoisvdmoiapq' dist; then
            echo "Retired Lovable Cloud database identity found in deployable output"
            exit 1
          fi
          if grep -R -nE --include='*.html' --include='*.js' --include='*.json' --include='*.txt' --include='*.xml' \
            'Since 2014|MOQ 50|45-Day Delivery|45-day delivery|reply within 12 hours|BSCI Audited|ISO 9001:2015|SEDEX Member' dist; then
            echo "Blocked legacy claim found"
            exit 1
          fi

          fingerprint="$(jq -r '.build_fingerprint // empty' dist/build.json)"
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]] || {
            echo "Built output is missing a valid deterministic fingerprint"
            exit 1
          }
          echo "RELEASE_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"

          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$PAGES_BRANCH" \
            --arg build_fingerprint "$fingerprint" \
            --arg purpose "automatic-production-after-green-main" \
            --arg quality_run_id "$QUALITY_RUN_ID" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{source_sha:$source_sha,repository:$repository,branch:$branch,build_fingerprint:$build_fingerprint,purpose:$purpose,quality_run_id:$quality_run_id,generated_at:$generated_at}' \
            > dist/cloudflare-deployment.json

      - name: Resolve Cloudflare account and project with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '[:space:]')"
          raw_account_id="$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID:-}" | tr -d '[:space:]')"
          project_name="$(printf '%s' "${CLOUDFLARE_PROJECT_NAME:-}" | tr -d '[:space:]')"

          test -n "$token" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$project_name" || { echo "CLOUDFLARE_PROJECT_NAME is missing"; exit 1; }
          [[ "$project_name" =~ ^[a-z0-9][a-z0-9-]*[a-z0-9]$ ]] || {
            echo "CLOUDFLARE_PROJECT_NAME contains invalid characters"
            exit 1
          }

          echo "::add-mask::$token"
          verify_json="$(bash scripts/ci/retry.sh 3 5 -- curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' https://api.cloudflare.com/client/v4/user/tokens/verify)"
          test "$(printf '%s' "$verify_json" | jq -r '.success // false')" = "true"

          account_id="$raw_account_id"
          if ! [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            account_id="$(printf '%s' "$raw_account_id" | grep -Eo '[0-9a-fA-F]{32}' | head -n 1 || true)"
          fi
          if ! [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            accounts_json="$(bash scripts/ci/retry.sh 3 5 -- curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/accounts?per_page=50')"
            test "$(printf '%s' "$accounts_json" | jq -r '.success // false')" = "true"
            test "$(printf '%s' "$accounts_json" | jq -r '(.result // []) | length')" = "1"
            account_id="$(printf '%s' "$accounts_json" | jq -r '.result[0].id // empty')"
          fi
          [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]] || {
            echo "Cloudflare Account ID could not be resolved safely"
            exit 1
          }

          echo "::add-mask::$account_id"
          project_json="$(bash scripts/ci/retry.sh 3 5 -- curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/$account_id/pages/projects/$project_name")"
          test "$(printf '%s' "$project_json" | jq -r '.success // false')" = "true"
          test "$(printf '%s' "$project_json" | jq -r '.result.name // empty')" = "$project_name"
          test "$(printf '%s' "$project_json" | jq -r '.result.production_branch // empty')" = "$PAGES_BRANCH"

          {
            echo "CLOUDFLARE_API_TOKEN=$token"
            echo "CLOUDFLARE_ACCOUNT_ID=$account_id"
            echo "CLOUDFLARE_PROJECT_NAME=$project_name"
          } >> "$GITHUB_ENV"

      - name: Reconfirm current main after acquiring production lock
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest_main="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [ "$latest_main" = "$SOURCE_SHA" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            echo "Exact current main reconfirmed: $SOURCE_SHA"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "Source $SOURCE_SHA was superseded by $latest_main while waiting for the production lock; deploy skipped without failure"
          fi

      - name: Deploy exact artifact to Cloudflare Pages
        if: steps.freshness.outputs.fresh == 'true'
        shell: bash
        run: |
          bash scripts/ci/retry.sh 3 10 -- npx --yes wrangler@4 pages deploy dist \
            --project-name="$CLOUDFLARE_PROJECT_NAME" \
            --branch="$PAGES_BRANCH"

      - name: Verify pages.dev and custom domain serve exact release
        if: steps.freshness.outputs.fresh == 'true'
        shell: bash
        run: |
          set -euo pipefail

          verify_origin() {
            origin="$1"
            ready=0
            for attempt in $(seq 1 36); do
              cache_bust="${SOURCE_SHA::12}-$attempt-$RANDOM"
              if curl -fsSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' \
                   "$origin/build.json?release_check=$cache_bust" -o /tmp/build.json \
                && curl -fsSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' \
                   "$origin/cloudflare-deployment.json?release_check=$cache_bust" -o /tmp/deployment.json \
                && jq -e --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" --arg fingerprint "$RELEASE_FINGERPRINT" \
                     '.source_commit==$sha and .source_identity_state=="verified" and .repository==$repo and .supabase_project_id=="pvzjiozismyxqrzmtfbi" and .build_fingerprint==$fingerprint' \
                     /tmp/build.json >/dev/null \
                && jq -e --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" --arg fingerprint "$RELEASE_FINGERPRINT" \
                     '.source_sha==$sha and .repository==$repo and .branch=="main" and .build_fingerprint==$fingerprint and .purpose=="automatic-production-after-green-main"' \
                     /tmp/deployment.json >/dev/null; then
                ready=1
                echo "$origin verified on attempt $attempt"
                break
              fi
              echo "$origin not converged yet (attempt $attempt/36)"
              sleep 10
            done
            test "$ready" = "1" || {
              echo "Exact release verification failed for $origin"
              exit 1
            }
          }

          verify_origin "$PAGES_URL"
          verify_origin "$CANONICAL_ORIGIN"

          www_headers="$(bash scripts/ci/retry.sh 3 3 -- curl -sSI --connect-timeout 10 --max-time 40 "$WWW_ORIGIN/")"
          www_status="$(printf '%s' "$www_headers" | awk 'NR==1 {print $2}')"
          www_location="$(printf '%s' "$www_headers" | awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}')"
          case "$www_status" in 301|308) ;; *) echo "Expected www redirect, got $www_status"; exit 1 ;; esac
          case "$www_location" in "$CANONICAL_ORIGIN"|"$CANONICAL_ORIGIN/"|"$CANONICAL_ORIGIN"/*) ;; *) echo "Unexpected www redirect: $www_location"; exit 1 ;; esac

          admin_headers="$(bash scripts/ci/retry.sh 3 3 -- curl -sSI --connect-timeout 10 --max-time 40 "$CANONICAL_ORIGIN/admin")"
          robots_value="$(printf '%s\n' "$admin_headers" | awk 'BEGIN{IGNORECASE=1} /^x-robots-tag:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}')"
          test "$robots_value" = "noindex, nofollow, noarchive" || {
            echo "Unexpected admin X-Robots-Tag: $robots_value"
            exit 1
          }

      - name: Notify IndexNow after verified production release
        if: steps.freshness.outputs.fresh == 'true'
        continue-on-error: true
        env:
          INDEXNOW_STRICT: "1"
        run: npm run notify:search

      - name: Preserve release evidence
        if: steps.freshness.outputs.fresh == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-evidence-${{ env.SOURCE_SHA }}
          path: |
            dist/build.json
            dist/cloudflare-deployment.json
            dist/release.txt
          if-no-files-found: error
          retention-days: 7

      - name: Record control-plane outcome
        if: always()
        shell: bash
        run: |
          {
            echo "## Cloudflare production control plane"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Quality run: \`$QUALITY_RUN_ID\`"
            echo "- Shared production lock: \`irha-production-mutation\`"
            echo "- Fresh at mutation time: \`${{ steps.freshness.outputs.fresh || 'not-reached' }}\`"
            echo "- Build reuse: immutable Quality Gate artifact; no duplicate build"
          } >> "$GITHUB_STEP_SUMMARY"
