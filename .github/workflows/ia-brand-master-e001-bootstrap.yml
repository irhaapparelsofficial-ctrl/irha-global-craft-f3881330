name: IA Brand Master E001 Bootstrap

on:
  push:
    branches:
      - fix/ia-brand-master-e001
    paths:
      - .github/workflows/ia-brand-master-e001-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: ia-brand-master-e001-bootstrap
  cancel-in-progress: false

jobs:
  import-owner-master:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout focused branch
        uses: actions/checkout@v4
        with:
          ref: fix/ia-brand-master-e001
          fetch-depth: 1

      - name: Import exact owner-uploaded master
        env:
          SOURCE_URL: https://at.adobe.com/4agurJOU6fFFZpej
          EXPECTED_SHA256: 32eee79bc7038c53cff36bab46193c77e78702d7eef7883e8f94b145999a1b87
          EXPECTED_SIZE: '1023183'
        shell: bash
        run: |
          set -euo pipefail
          target='public/brand/irha-apparels-official-master.png'
          mkdir -p "$(dirname "$target")"
          curl -fL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 "$SOURCE_URL" -o "$target"
          actual_size="$(wc -c < "$target" | tr -d ' ')"
          test "$actual_size" = "$EXPECTED_SIZE"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$target" | sha256sum -c -
          test "$(file --brief --mime-type "$target")" = 'image/png'
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p = Path('public/brand/irha-apparels-official-master.png')
          data = p.read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          assert data[12:16] == b'IHDR'
          width, height = struct.unpack('>II', data[16:24])
          assert (width, height) == (1024, 1024), (width, height)
          print(f'owner master verified: {width}x{height}, {len(data)} bytes')
          PY

      - name: Commit exact master and retire bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/brand/irha-apparels-official-master.png
          git rm .github/workflows/ia-brand-master-e001-bootstrap.yml
          git commit -m 'chore(brand): import exact owner master logo'
          git push origin HEAD:fix/ia-brand-master-e001
