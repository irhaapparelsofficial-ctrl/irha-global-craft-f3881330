name: IndexNow After Verified Production

run-name: IndexNow discovery · production-${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows: ["Cloudflare Production Status"]
    types: [completed]

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: indexnow-production-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

env:
  CANONICAL_ORIGIN: https://irhaapparels.com
  SEARCH_DISCOVERY_DIAGNOSTIC: /tmp/search-discovery-diagnostic.txt

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve exact proven-production source
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          expected_target="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID"
          status_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/status")"
          exact_production_success="$(printf '%s' "$status_json" | jq \
            --arg target "$expected_target" \
            '[.statuses[] | select(.context == "Irha Cloudflare Production" and .state == "success" and .target_url == $target)] | length')"

          relevant=false
          if [ "$UPSTREAM_CONCLUSION" = "success" ] \
            && [ "$UPSTREAM_REPOSITORY" = "$GITHUB_REPOSITORY" ] \
            && [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && [ "$SOURCE_SHA" = "$latest_main" ] \
            && [ "$exact_production_success" -gt 0 ]; then
            relevant=true
          fi

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "latest_main=$latest_main" >> "$GITHUB_OUTPUT"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "production_status_matches=$exact_production_success" >> "$GITHUB_OUTPUT"

          if [ "$relevant" = "true" ]; then
            echo "Exact current-main Cloudflare Production success resolved: $SOURCE_SHA"
          else
            echo "IndexNow skipped safely: source=$SOURCE_SHA current_main=$latest_main upstream=$UPSTREAM_CONCLUSION exact_status=$exact_production_success"
          fi

      - name: Record ignored non-release completion
        if: steps.resolve.outputs.relevant != 'true'
        shell: bash
        run: |
          {
            echo "## Search Discovery"
            echo "- Source: \`${{ steps.resolve.outputs.source_sha }}\`"
            echo "- Exact Cloudflare Production status matches: \`${{ steps.resolve.outputs.production_status_matches }}\`"
            echo "- Submission attempted: \`false\`"
            echo "- Result: upstream completion was not an exact proven-production release"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mark search discovery pending
        if: steps.resolve.outputs.relevant == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state=pending \
            -f context="Irha Search Discovery" \
            -f description="Verifying live canonical sitemap and material route state" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null

      - name: Checkout exact verified source
        if: steps.resolve.outputs.relevant == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.source_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Fetch and verify exact live canonical sitemap and route state
        if: steps.resolve.outputs.relevant == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          : > "$SEARCH_DISCOVERY_DIAGNOSTIC"
          verified=false

          for attempt in $(seq 1 12); do
            cache_bust="${SOURCE_SHA::12}-$attempt-$RANDOM"
            build_ok=false
            sitemap_ok=false
            manifest_ok=false
            key_ok=false
            reason=""

            if curl -fsSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' \
              "$CANONICAL_ORIGIN/build.json?search_discovery=$cache_bust" -o /tmp/live-build.json; then
              if jq -e --arg sha "$SOURCE_SHA" \
                '.source_commit == $sha and .source_identity_state == "verified" and .expected_origin == "https://irhaapparels.com"' \
                /tmp/live-build.json >/dev/null; then
                build_ok=true
              else
                live_sha="$(jq -r '.source_commit // "missing"' /tmp/live-build.json 2>/dev/null || echo invalid-json)"
                reason="live build source is $live_sha, expected $SOURCE_SHA"
              fi
            else
              reason="build.json unavailable"
            fi

            if [ "$build_ok" = "true" ]; then
              if curl -fsSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' \
                "$CANONICAL_ORIGIN/sitemap.xml?search_discovery=$cache_bust" -o /tmp/live-sitemap.xml; then
                url_count="$(grep -c '<loc>' /tmp/live-sitemap.xml || true)"
                if [ "$url_count" -gt 0 ] && [ "$url_count" -le 10000 ] && \
                  grep -F '<loc>https://irhaapparels.com/' /tmp/live-sitemap.xml >/dev/null && \
                  ! grep -F '<loc>https://www.irhaapparels.com/' /tmp/live-sitemap.xml >/dev/null && \
                  ! grep -F '<loc>https://irhaapparels.com/intl/' /tmp/live-sitemap.xml >/dev/null && \
                  ! grep -F '<loc>https://irhaapparels.com/studio' /tmp/live-sitemap.xml >/dev/null; then
                  sitemap_ok=true
                else
                  reason="canonical sitemap contract failed; urls=${url_count:-0}"
                fi
              else
                reason="sitemap.xml unavailable"
              fi
            fi

            if [ "$build_ok" = "true" ] && [ "$sitemap_ok" = "true" ]; then
              if curl -fsSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' \
                "$CANONICAL_ORIGIN/seo-route-manifest.json?search_discovery=$cache_bust" \
                -o /tmp/live-seo-route-manifest.json && \
                jq -e --arg origin "$CANONICAL_ORIGIN" '
                  .schemaVersion == 1 and
                  .canonicalOrigin == $origin and
                  (.routes | type == "array") and
                  .routeCount == (.routes | length) and
                  .sitemapCount == ([.routes[] | select(.indexable == true and .sitemap == true)] | length) and
                  all(.routes[] | select(.indexable == true and .sitemap == true); (.canonicalUrl | startswith($origin + "/")))
                ' /tmp/live-seo-route-manifest.json >/dev/null; then
                sed -n 's#.*<loc>\([^<]*\)</loc>.*#\1#p' /tmp/live-sitemap.xml | sort -u > /tmp/live-sitemap-urls.txt
                jq -r '.routes[] | select(.indexable == true and .sitemap == true) | .canonicalUrl' \
                  /tmp/live-seo-route-manifest.json | sort -u > /tmp/live-manifest-urls.txt
                node scripts/generate-search-route-state.mjs \
                  --input /tmp/live-seo-route-manifest.json \
                  --output /tmp/live-search-route-state.json

                if [ "$(wc -l < /tmp/live-sitemap-urls.txt | tr -d ' ')" = "$url_count" ] && \
                  cmp -s /tmp/live-sitemap-urls.txt /tmp/live-manifest-urls.txt && \
                  cmp -s seo/search-route-state.json /tmp/live-search-route-state.json; then
                  manifest_ok=true
                else
                  reason="live sitemap, route manifest or committed material state mismatch"
                fi
              else
                reason="seo-route-manifest.json unavailable or invalid"
              fi
            fi

            if [ "$build_ok" = "true" ] && [ "$sitemap_ok" = "true" ] && [ "$manifest_ok" = "true" ]; then
              if curl -fsSL --connect-timeout 10 --max-time 40 \
                "$CANONICAL_ORIGIN/19d2833c43fe6e05e2a4416f65a53cdc.txt?search_discovery=$cache_bust" \
                -o /tmp/indexnow-key.txt && \
                grep -Fx '19d2833c43fe6e05e2a4416f65a53cdc' /tmp/indexnow-key.txt >/dev/null; then
                key_ok=true
              else
                reason="IndexNow ownership key unavailable or invalid"
              fi
            fi

            printf 'attempt=%s build=%s sitemap=%s manifest=%s key=%s reason=%s\n' \
              "$attempt" "$build_ok" "$sitemap_ok" "$manifest_ok" "$key_ok" "$reason" | tee -a "$SEARCH_DISCOVERY_DIAGNOSTIC"

            if [ "$build_ok" = "true" ] && [ "$sitemap_ok" = "true" ] && \
              [ "$manifest_ok" = "true" ] && [ "$key_ok" = "true" ]; then
              verified=true
              echo "Verified live canonical sitemap and material route state: urls=$url_count source=$SOURCE_SHA" | tee -a "$SEARCH_DISCOVERY_DIAGNOSTIC"
              break
            fi

            sleep 5
          done

          if [ "$verified" != "true" ]; then
            echo "Live canonical sitemap and route state did not reach exact release parity after 12 attempts" | tee -a "$SEARCH_DISCOVERY_DIAGNOSTIC"
            exit 1
          fi

      - name: Resolve previous authoritative material route state
        id: previous
        if: steps.resolve.outputs.relevant == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          if git cat-file -e "${SOURCE_SHA}^:seo/search-route-state.json" 2>/dev/null; then
            git show "${SOURCE_SHA}^:seo/search-route-state.json" > /tmp/previous-search-route-state.json
            echo "initialized=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "${SOURCE_SHA}^" "$SOURCE_SHA" > /tmp/baseline-changed-files.txt
            unapproved=false
            while IFS= read -r changed_file; do
              case "$changed_file" in
                .github/workflows/indexnow-after-production.yml|\
                .github/workflows/quality.yml|\
                .github/workflows/supabase-functions-reconcile.yml|\
                package.json|\
                scripts/generate-search-route-state.mjs|\
                scripts/ping-search-engines.mjs|\
                seo/search-route-state.json|\
                src/test/indexNowCanonicalSitemap.test.ts|\
                src/test/indexNowPostdeployContract.test.ts|\
                src/test/searchDiscoveryWorkflow.test.ts)
                  ;;
                *)
                  echo "Unapproved route-state baseline file: $changed_file" >&2
                  unapproved=true
                  ;;
              esac
            done < /tmp/baseline-changed-files.txt
            [ "$unapproved" = "false" ]
            cp /tmp/live-search-route-state.json /tmp/previous-search-route-state.json
            echo "initialized=true" >> "$GITHUB_OUTPUT"
            echo "[indexnow] deterministic route-state baseline initialized; current release has no buyer-visible SEO changes" | tee -a "$SEARCH_DISCOVERY_DIAGNOSTIC"
          fi
          test -s /tmp/previous-search-route-state.json

      - name: Submit only materially changed canonical URLs to IndexNow
        if: steps.resolve.outputs.relevant == 'true'
        shell: bash
        env:
          INDEXNOW_STRICT: "1"
          INDEXNOW_ROUTE_STATE: /tmp/live-search-route-state.json
          INDEXNOW_PREVIOUS_ROUTE_STATE: /tmp/previous-search-route-state.json
        run: |
          set -euo pipefail
          bash scripts/ci/retry.sh 3 10 -- node scripts/ping-search-engines.mjs 2>&1 | tee -a "$SEARCH_DISCOVERY_DIAGNOSTIC"

      - name: Preserve search discovery diagnostics
        if: always() && steps.resolve.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: search-discovery-${{ steps.resolve.outputs.source_sha }}
          path: |
            /tmp/search-discovery-diagnostic.txt
            /tmp/live-sitemap.xml
            /tmp/live-seo-route-manifest.json
            /tmp/live-search-route-state.json
            /tmp/previous-search-route-state.json
          if-no-files-found: warn
          retention-days: 2
          compression-level: 0

      - name: Publish search discovery status
        if: always() && steps.resolve.outputs.relevant == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.resolve.outputs.source_sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          description="$(tail -n 1 "$SEARCH_DISCOVERY_DIAGNOSTIC" 2>/dev/null | tr '\r\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-140 || true)"
          [ -n "$description" ] || description="IndexNow material route-state verification failed"
          if [ "$JOB_STATUS" = "success" ]; then
            state=success
            if grep -Fq '[indexnow] no material canonical URL changes; submission skipped' "$SEARCH_DISCOVERY_DIAGNOSTIC"; then
              description="No material canonical URL changes; IndexNow skipped"
            else
              description="Verified changed canonical URLs accepted by IndexNow"
            fi
          fi

          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state="$state" \
            -f context="Irha Search Discovery" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null
