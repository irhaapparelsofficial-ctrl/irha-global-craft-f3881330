name: Thumbnail Build Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install quietly
        run: npm install --legacy-peer-deps --no-audit --no-fund >/tmp/install.log 2>&1 || { tail -n 50 /tmp/install.log; exit 1; }
      - name: Build with concise failure tail
        shell: bash
        run: |
          set -o pipefail
          npm run build >/tmp/thumbnail-build.log 2>&1 || {
            echo "--- BUILD FAILURE TAIL ---"
            tail -n 90 /tmp/thumbnail-build.log
            exit 1
          }
          tail -n 20 /tmp/thumbnail-build.log
