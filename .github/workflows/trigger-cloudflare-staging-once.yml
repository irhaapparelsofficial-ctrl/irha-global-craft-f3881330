name: Trigger Cloudflare Pages Staging Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trigger-cloudflare-staging-once.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: trigger-cloudflare-staging-once
  cancel-in-progress: false

jobs:
  dispatch:
    if: contains(github.event.head_commit.message, '[deploy-staging-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch guarded staging workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload='{"ref":"main","inputs":{"confirm":"DEPLOY_STAGING"}}'
          response_code="$(curl -sS -o /tmp/dispatch-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/cloudflare-pages-production.yml/dispatches" \
            -d "$payload")"
          test "$response_code" = "204" || {
            echo "Staging workflow dispatch failed with HTTP $response_code"
            cat /tmp/dispatch-response.json
            exit 1
          }
          echo "Cloudflare Pages Staging dispatched for exact main $GITHUB_SHA"
