name: Audit exact live desktop 07dccf54

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE_SHA: 07dccf5463cf77aa86b6715437764f82765c0cfd
      LIVE_ORIGIN: https://irhaapparels.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for exact production release
        shell: bash
        run: |
          set -euo pipefail
          matched=0
          for attempt in $(seq 1 90); do
            cache_bust="${EXPECTED_SOURCE_SHA::12}-$attempt-$RANDOM"
            if curl -fsSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' "$LIVE_ORIGIN/build.json?audit=$cache_bust" -o live-build.json \
              && jq -e --arg sha "$EXPECTED_SOURCE_SHA" '.source_commit==$sha and .source_identity_state=="verified"' live-build.json >/dev/null; then
              matched=1
              break
            fi
            sleep 10
          done
          test "$matched" = "1"
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Verify desktop buyer experience
        shell: bash
        run: |
          cat > audit-desktop.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const origin = process.env.LIVE_ORIGIN;
          const expectedSource = process.env.EXPECTED_SOURCE_SHA;
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 900 }, locale: 'en-GB' });
          const page = await context.newPage();
          const errors = [];
          page.on('pageerror', (error) => errors.push(error.message));

          const response = await page.goto(`${origin}/?desktop_audit=${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 90000 });
          await page.waitForTimeout(2500);

          const cookie = page.getByRole('dialog');
          const cookieVisible = await cookie.isVisible().catch(() => false);
          let cookieBackground = null;
          if (cookieVisible) {
            cookieBackground = await cookie.evaluate((el) => getComputedStyle(el).backgroundColor);
            await page.screenshot({ path: '01-desktop-cookie-visible.png', fullPage: false });
            await page.getByRole('button', { name: /essential only/i }).click();
            await page.waitForTimeout(500);
          }

          const navVisible = await page.getByRole('navigation').first().isVisible().catch(() => false);
          const logoVisible = await page.locator('img[src="/irha-brand-mark.svg"]').first().isVisible().catch(() => false);
          const quoteVisible = await page.getByText('Request quote', { exact: false }).first().isVisible().catch(() => false);
          const mobileDockVisible = await page.locator('.sticky-mobile-cta').isVisible().catch(() => false);
          const dimensions = await page.evaluate(() => ({
            innerWidth: window.innerWidth,
            scrollWidth: document.documentElement.scrollWidth,
            bodyWidth: document.body.scrollWidth,
            h1: document.querySelector('h1')?.textContent?.trim() || null,
          }));

          await page.screenshot({ path: '02-desktop-home-clean.png', fullPage: false });
          await page.screenshot({ path: '03-desktop-home-full.png', fullPage: true });

          const routeResults = {};
          for (const path of ['/products', '/inquiry', '/catalogue']) {
            const routeResponse = await page.goto(`${origin}${path}?desktop_audit=${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 90000 });
            await page.waitForTimeout(1200);
            routeResults[path] = { status: routeResponse?.status(), finalUrl: page.url() };
          }

          const result = {
            expectedSource,
            homeStatus: response?.status(),
            title: await page.title(),
            cookieVisible,
            cookieBackground,
            navVisible,
            logoVisible,
            quoteVisible,
            mobileDockVisible,
            dimensions,
            routeResults,
            pageErrors: errors.slice(0, 20),
          };
          await writeFile('desktop-audit.json', JSON.stringify(result, null, 2));
          console.log(JSON.stringify(result, null, 2));

          const darkCookie = !cookieVisible || /rgba?\((?:0|9),\s*(?:0|9),\s*(?:0|9)/.test(cookieBackground || '');
          const noOverflow = dimensions.scrollWidth <= dimensions.innerWidth + 2 && dimensions.bodyWidth <= dimensions.innerWidth + 2;
          if (result.homeStatus !== 200 || !darkCookie || !navVisible || !logoVisible || !quoteVisible || mobileDockVisible || !noOverflow || errors.length) process.exitCode = 1;
          for (const route of Object.values(routeResults)) if (route.status !== 200) process.exitCode = 1;
          await browser.close();
          EOF
          node audit-desktop.mjs
      - name: Upload desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-07dccf54-audit
          path: |
            live-build.json
            desktop-audit.json
            01-desktop-cookie-visible.png
            02-desktop-home-clean.png
            03-desktop-home-full.png
          if-no-files-found: warn
          retention-days: 2
