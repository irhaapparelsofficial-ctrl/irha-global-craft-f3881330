name: IA Media E001 Post-Merge Snapshot

on:
  pull_request:
    branches:
      - codex/ia-media-e001-recovery-base-v4
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

jobs:
  snapshot-production:
    if: github.event.pull_request.head.ref == 'codex/ia-media-e001-postmerge-monitor'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAIN_SHA: de04f0c4d380e094149493483b8113fa9d437b11
      PRODUCTION_ORIGIN: https://irhaapparels.com

    steps:
      - name: Capture exact post-merge state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=artifacts/ia-media-e001-postmerge-snapshot
          mkdir -p "$out"

          actual="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test "$actual" = "$MAIN_SHA"

          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$MAIN_SHA&per_page=100")"
          printf '%s\n' "$runs" > "$out/actions-runs.json"
          jq -r '.workflow_runs[] | [.name, .display_title, .event, .status, (.conclusion // "pending"), .id] | @tsv' <<<"$runs" | tee "$out/actions-runs.tsv"

          quality="$(jq -r '[.workflow_runs[] | select(.event == "push" and .name == "Quality Gate")][0].conclusion // empty' <<<"$runs")"
          media_status="$(jq -r '[.workflow_runs[] | select(.event == "push" and ((.name == "IA Media E001 Visual Acceptance") or ((.display_title // "") | startswith("IA-MEDIA-E001 visual"))))][0].status // empty' <<<"$runs")"
          media="$(jq -r '[.workflow_runs[] | select(.event == "push" and ((.name == "IA Media E001 Visual Acceptance") or ((.display_title // "") | startswith("IA-MEDIA-E001 visual"))))][0].conclusion // empty' <<<"$runs")"

          body="$(curl -fsS -H 'Cache-Control: no-cache, no-store' "${PRODUCTION_ORIGIN}/build.json?expected=${MAIN_SHA}&snapshot=${GITHUB_RUN_ID}" || true)"
          printf '%s\n' "$body" > "$out/production-build.json"
          live_sha="$(jq -r '.source_commit // empty' <<<"$body" 2>/dev/null || true)"

          printf 'main_sha=%s\nquality=%s\nmedia_status=%s\nmedia=%s\nlive_sha=%s\n' \
            "$actual" "${quality:-pending}" "${media_status:-pending}" "${media:-pending}" "${live_sha:-pending}" | tee "$out/status.txt"

      - name: Upload snapshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: ia-media-e001-postmerge-snapshot-${{ env.MAIN_SHA }}
          path: artifacts/ia-media-e001-postmerge-snapshot
          if-no-files-found: error
          retention-days: 30
