name: Live homepage speed audit latest deployed descendant

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/audit-live-home-speed-297e91a.yml"

permissions:
  contents: read

concurrency:
  group: live-home-speed-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for a verified deployed descendant of the performance release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PERFORMANCE_BASE_SHA: cc153c30219f94a57f12e5ed7cc1c8407bcb38e0
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 90); do
            cache_bust="${PERFORMANCE_BASE_SHA::12}-$attempt-$RANDOM"
            if curl -fsSL --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' \
                 "https://irhaapparels.com/build.json?speed_audit=$cache_bust" -o /tmp/build.json; then
              live_sha="$(jq -r '.source_commit // empty' /tmp/build.json)"
              identity="$(jq -r '.source_identity_state // empty' /tmp/build.json)"
              relation="unknown"
              if [[ "$live_sha" =~ ^[0-9a-f]{40}$ ]]; then
                relation="$(gh api "repos/$GITHUB_REPOSITORY/compare/$PERFORMANCE_BASE_SHA...$live_sha" --jq '.status' 2>/dev/null || true)"
              fi
              echo "attempt=$attempt live_sha=$live_sha identity=$identity relation=$relation"
              if [ "$identity" = "verified" ] && { [ "$relation" = "ahead" ] || [ "$relation" = "identical" ]; }; then
                ready=1
                echo "LIVE_SHA=$live_sha" >> "$GITHUB_ENV"
                break
              fi
            fi
            sleep 10
          done
          test "$ready" = "1" || { echo "A verified deployed descendant of the performance release was not found"; exit 1; }
          cat /tmp/build.json

      - name: Run three cold mobile Lighthouse audits
        shell: bash
        run: |
          set -euo pipefail
          for run in 1 2 3; do
            npx --yes lighthouse@12.8.2 \
              "https://irhaapparels.com/?speed_audit=${LIVE_SHA::12}-${GITHUB_RUN_ID}-$run" \
              --output=json \
              --output-path="/tmp/lighthouse-$run.json" \
              --only-categories=performance,accessibility,best-practices,seo \
              --form-factor=mobile \
              --screenEmulation.mobile=true \
              --throttling-method=simulate \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage --incognito"
          done

      - name: Print median performance evidence
        shell: bash
        env:
          PERFORMANCE_BASE_SHA: cc153c30219f94a57f12e5ed7cc1c8407bcb38e0
        run: |
          node <<'NODE'
          const fs = require('fs');
          const reports = [1, 2, 3].map(i => JSON.parse(fs.readFileSync(`/tmp/lighthouse-${i}.json`, 'utf8')));
          const score = (report, id) => Math.round((report.categories?.[id]?.score ?? 0) * 100);
          const audit = (report, id) => report.audits?.[id] ?? {};
          const numeric = (report, id) => audit(report, id).numericValue ?? null;
          const median = values => {
            const valid = values.filter(value => typeof value === 'number' && Number.isFinite(value)).sort((a, b) => a - b);
            return valid.length ? valid[Math.floor(valid.length / 2)] : null;
          };
          const runEvidence = reports.map((report, index) => ({
            run: index + 1,
            scores: {
              performance: score(report, 'performance'),
              accessibility: score(report, 'accessibility'),
              best_practices: score(report, 'best-practices'),
              seo: score(report, 'seo'),
            },
            timings_ms: {
              first_contentful_paint: numeric(report, 'first-contentful-paint'),
              largest_contentful_paint: numeric(report, 'largest-contentful-paint'),
              speed_index: numeric(report, 'speed-index'),
              total_blocking_time: numeric(report, 'total-blocking-time'),
              time_to_interactive: numeric(report, 'interactive'),
            },
            cumulative_layout_shift: numeric(report, 'cumulative-layout-shift'),
            total_byte_weight: audit(report, 'total-byte-weight').numericValue ?? null,
            unused_javascript_bytes: audit(report, 'unused-javascript').details?.overallSavingsBytes ?? 0,
            main_thread_work_ms: numeric(report, 'mainthread-work-breakdown'),
            bootup_time_ms: numeric(report, 'bootup-time'),
          }));
          const firstRequests = audit(reports[0], 'network-requests').details?.items ?? [];
          const scripts = firstRequests
            .filter(item => item.resourceType === 'Script')
            .map(item => ({ url: item.url, transferSize: item.transferSize ?? 0, resourceSize: item.resourceSize ?? 0 }))
            .sort((a, b) => b.transferSize - a.transferSize);
          const evidence = {
            source_commit: process.env.LIVE_SHA,
            performance_base_commit: process.env.PERFORMANCE_BASE_SHA,
            runs: runEvidence,
            median: {
              performance_score: median(runEvidence.map(run => run.scores.performance)),
              first_contentful_paint_ms: median(runEvidence.map(run => run.timings_ms.first_contentful_paint)),
              largest_contentful_paint_ms: median(runEvidence.map(run => run.timings_ms.largest_contentful_paint)),
              speed_index_ms: median(runEvidence.map(run => run.timings_ms.speed_index)),
              total_blocking_time_ms: median(runEvidence.map(run => run.timings_ms.total_blocking_time)),
              time_to_interactive_ms: median(runEvidence.map(run => run.timings_ms.time_to_interactive)),
              cumulative_layout_shift: median(runEvidence.map(run => run.cumulative_layout_shift)),
              total_byte_weight: median(runEvidence.map(run => run.total_byte_weight)),
              unused_javascript_bytes: median(runEvidence.map(run => run.unused_javascript_bytes)),
              main_thread_work_ms: median(runEvidence.map(run => run.main_thread_work_ms)),
              bootup_time_ms: median(runEvidence.map(run => run.bootup_time_ms)),
            },
            first_run_script_count: scripts.length,
            first_run_largest_scripts: scripts.slice(0, 12),
          };
          console.log('LIVE_HOME_SPEED_EVIDENCE_START');
          console.log(JSON.stringify(evidence, null, 2));
          console.log('LIVE_HOME_SPEED_EVIDENCE_END');
          fs.writeFileSync('/tmp/live-home-speed-evidence.json', JSON.stringify(evidence, null, 2));
          NODE

      - name: Upload Lighthouse evidence
        uses: actions/upload-artifact@v4
        with:
          name: live-home-speed-descendant
          path: |
            /tmp/build.json
            /tmp/lighthouse-1.json
            /tmp/lighthouse-2.json
            /tmp/lighthouse-3.json
            /tmp/live-home-speed-evidence.json
          retention-days: 7
