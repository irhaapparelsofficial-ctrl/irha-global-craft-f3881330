name: Cloudflare Current Main Reconcile

run-name: Cloudflare reconcile · ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Quality Gate"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: cloudflare-reconcile-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  PAGES_BRANCH: main
  PAGES_URL: https://irha-apparels.pages.dev
  CANONICAL_ORIGIN: https://irhaapparels.com
  WWW_ORIGIN: https://www.irhaapparels.com

jobs:
  preflight:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      quality_run_id: ${{ steps.resolve.outputs.quality_run_id }}
      should_reconcile: ${{ steps.resolve.outputs.should_reconcile }}
      secrets_ready: ${{ steps.resolve.outputs.secrets_ready }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
    steps:
      - name: Resolve exact current main and secret readiness
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          QUALITY_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '[:space:]')"
          project_name="$(printf '%s' "${CLOUDFLARE_PROJECT_NAME:-}" | tr -d '[:space:]')"

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "quality_run_id=$QUALITY_RUN_ID" >> "$GITHUB_OUTPUT"

          secrets_ready=true
          [ -n "$token" ] || secrets_ready=false
          [ -n "$project_name" ] || secrets_ready=false
          echo "secrets_ready=$secrets_ready" >> "$GITHUB_OUTPUT"

          if [ "$SOURCE_SHA" != "$latest_main" ]; then
            echo "should_reconcile=false" >> "$GITHUB_OUTPUT"
            echo "Superseded source skipped safely: $SOURCE_SHA; current main is $latest_main"
          elif [ "$secrets_ready" != "true" ]; then
            echo "should_reconcile=false" >> "$GITHUB_OUTPUT"
            echo "Exact current main is green, but Cloudflare secrets are unavailable. Waiting without failure."
          else
            echo "should_reconcile=true" >> "$GITHUB_OUTPUT"
            echo "Exact green current main is eligible for Cloudflare reconciliation: $SOURCE_SHA"
          fi

      - name: Record non-deploy state
        if: steps.resolve.outputs.should_reconcile != 'true'
        shell: bash
        run: |
          {
            echo "## Cloudflare reconciliation"
            echo "- Source: \`${{ steps.resolve.outputs.source_sha }}\`"
            echo "- Secrets ready: \`${{ steps.resolve.outputs.secrets_ready }}\`"
            echo "- Deploy attempted: \`false\`"
            echo "- Result: safely skipped without production mutation"
          } >> "$GITHUB_STEP_SUMMARY"

  reconcile:
    needs: preflight
    if: needs.preflight.outputs.should_reconcile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      QUALITY_RUN_ID: ${{ needs.preflight.outputs.quality_run_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
    steps:
      - name: Checkout exact green source utilities
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download immutable Quality Gate artifact
        uses: actions/download-artifact@v4
        with:
          name: production-dist-${{ env.SOURCE_SHA }}
          path: dist
          run-id: ${{ env.QUALITY_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify immutable release and prepare deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/build.json
          test -s dist/release.txt
          test -s dist/_redirects
          test -s dist/_headers

          jq -e --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" \
            '.source_commit == $sha and .source_identity_state == "verified" and .repository == $repo and .supabase_project_id == "pvzjiozismyxqrzmtfbi" and .expected_origin == "https://irhaapparels.com"' \
            dist/build.json >/dev/null

          if grep -R -nF --include='*.html' --include='*.js' --include='*.json' --include='*.txt' --include='*.xml' 'mlefxgyaqoisvdmoiapq' dist; then
            echo "Retired Lovable Cloud database identity found"
            exit 1
          fi

          fingerprint="$(jq -r '.build_fingerprint // empty' dist/build.json)"
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]
          echo "RELEASE_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"

          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$PAGES_BRANCH" \
            --arg build_fingerprint "$fingerprint" \
            --arg purpose "idempotent-current-main-reconcile" \
            --arg quality_run_id "$QUALITY_RUN_ID" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{source_sha:$source_sha,repository:$repository,branch:$branch,build_fingerprint:$build_fingerprint,purpose:$purpose,quality_run_id:$quality_run_id,generated_at:$generated_at}' \
            > dist/cloudflare-deployment.json

      - name: Check whether production already serves the exact release
        id: live
        shell: bash
        run: |
          set -euo pipefail
          exact=true
          for origin in "$PAGES_URL" "$CANONICAL_ORIGIN"; do
            cache_bust="${SOURCE_SHA::12}-$RANDOM"
            if ! curl -fsSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' \
                 "$origin/build.json?release_check=$cache_bust" -o /tmp/build.json \
              || ! jq -e --arg sha "$SOURCE_SHA" --arg fingerprint "$RELEASE_FINGERPRINT" \
                 '.source_commit == $sha and .source_identity_state == "verified" and .build_fingerprint == $fingerprint' \
                 /tmp/build.json >/dev/null; then
              exact=false
            fi
          done
          echo "exact=$exact" >> "$GITHUB_OUTPUT"
          echo "Production exact-source parity before reconcile: $exact"

      - name: Prepare normalized Cloudflare Pages credentials
        if: steps.live.outputs.exact != 'true'
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '[:space:]')"
          raw_account_id="$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID:-}" | tr -d '[:space:]')"
          project_name="$(printf '%s' "${CLOUDFLARE_PROJECT_NAME:-}" | tr -d '[:space:]')"
          test -n "$token"
          test -n "$project_name"
          echo "::add-mask::$token"

          account_id="$raw_account_id"
          if ! [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            account_id="$(printf '%s' "$raw_account_id" | grep -Eo '[0-9a-fA-F]{32}' | head -n 1 || true)"
          fi

          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_PROJECT_NAME=$project_name" >> "$GITHUB_ENV"
          if [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::add-mask::$account_id"
            echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
            echo "Using normalized Cloudflare account identity."
          else
            echo "CLOUDFLARE_ACCOUNT_ID=" >> "$GITHUB_ENV"
            echo "Cloudflare account secret is not a plain account id; Wrangler will resolve the token account directly."
          fi

      - name: Reconfirm exact current main before production mutation
        if: steps.live.outputs.exact != 'true'
        id: freshness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_main="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [ "$latest_main" = "$SOURCE_SHA" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            echo "Exact current main reconfirmed before production mutation."
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "Main advanced from $SOURCE_SHA to $latest_main; stale deploy skipped without failure"
          fi

      - name: Deploy exact immutable artifact
        if: steps.live.outputs.exact != 'true' && steps.freshness.outputs.fresh == 'true'
        shell: bash
        run: |
          bash scripts/ci/retry.sh 3 10 -- npx --yes wrangler@4 pages deploy dist \
            --project-name="$CLOUDFLARE_PROJECT_NAME" \
            --branch="$PAGES_BRANCH" \
            --commit-hash="$SOURCE_SHA" \
            --commit-dirty=false

      - name: Record superseded release without failure
        if: steps.live.outputs.exact != 'true' && steps.freshness.outputs.fresh == 'false'
        shell: bash
        run: |
          {
            echo "## Cloudflare current-main reconciliation"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Quality Gate run: \`$QUALITY_RUN_ID\`"
            echo "- Result: superseded release skipped without failure"
            echo "- Production mutation: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify pages.dev, apex and www canonical behavior
        id: verify
        if: steps.live.outputs.exact == 'true' || steps.freshness.outputs.fresh == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "verified=false" >> "$GITHUB_OUTPUT"
          echo "superseded=false" >> "$GITHUB_OUTPUT"
          echo "apex_challenged=false" >> "$GITHUB_OUTPUT"
          echo "www_challenged=false" >> "$GITHUB_OUTPUT"

          fail_or_skip_if_superseded() {
            message="$1"
            latest_main="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
            if [ "$latest_main" != "$SOURCE_SHA" ]; then
              echo "superseded=true" >> "$GITHUB_OUTPUT"
              echo "Superseded release verification skipped without failure: source=$SOURCE_SHA current_main=$latest_main"
              exit 0
            fi
            echo "$message"
            exit 1
          }

          verify_origin() {
            origin="$1"
            label="$2"
            build_file="/tmp/${label}-build.json"
            marker_file="/tmp/${label}-deployment.json"
            ready=false
            challenge_seen=false
            last_status="missing"
            last_commit="missing"
            last_fingerprint="missing"

            for attempt in $(seq 1 36); do
              cache_bust="${SOURCE_SHA::12}-$attempt-$RANDOM"
              last_status="$(curl -sSL --connect-timeout 10 --max-time 40 \
                -H 'Cache-Control: no-cache' \
                -o "$build_file" -w '%{http_code}' \
                "$origin/build.json?release_check=$cache_bust" || true)"
              last_commit="$(jq -r '.source_commit // "missing"' "$build_file" 2>/dev/null || echo missing)"
              last_fingerprint="$(jq -r '.build_fingerprint // "missing"' "$build_file" 2>/dev/null || echo missing)"

              if grep -Fqi 'Just a moment...' "$build_file" 2>/dev/null; then
                challenge_seen=true
                if [ "$label" = "apex" ]; then
                  break
                fi
              fi

              if [ "$last_status" = "200" ] \
                && jq -e --arg sha "$SOURCE_SHA" --arg fingerprint "$RELEASE_FINGERPRINT" \
                  '.source_commit == $sha and .source_identity_state == "verified" and .build_fingerprint == $fingerprint' \
                  "$build_file" >/dev/null 2>&1; then
                ready=true
                break
              fi
              sleep 10
            done

            if [ "$ready" != "true" ]; then
              if [ "$label" = "apex" ] && [ "$challenge_seen" = "true" ]; then
                echo "apex_challenged=true" >> "$GITHUB_OUTPUT"
                echo "::warning::GitHub-hosted apex observer received a Cloudflare challenge. Pages exact identity is authoritative for deployment; downstream cache/public verification remains required for apex."
                return 0
              fi

              echo "origin=$origin status=$last_status source_commit=$last_commit build_fingerprint=$last_fingerprint"
              echo "expected_source_commit=$SOURCE_SHA expected_build_fingerprint=$RELEASE_FINGERPRINT"
              head -c 500 "$build_file" 2>/dev/null || true
              echo
              fail_or_skip_if_superseded "$label did not serve the exact verified release after 36 attempts"
            fi

            echo "$label authoritative release parity verified: source=$SOURCE_SHA fingerprint=$RELEASE_FINGERPRINT"

            marker_status="$(curl -sSL --connect-timeout 10 --max-time 40 \
              -H 'Cache-Control: no-cache' \
              -o "$marker_file" -w '%{http_code}' \
              "$origin/cloudflare-deployment.json?release_check=${SOURCE_SHA::12}-$RANDOM" || true)"
            if [ "$marker_status" = "200" ] \
              && jq -e --arg sha "$SOURCE_SHA" --arg fingerprint "$RELEASE_FINGERPRINT" \
                '.source_sha == $sha and .branch == "main" and .build_fingerprint == $fingerprint' \
                "$marker_file" >/dev/null 2>&1; then
              echo "$label deployment marker matches the exact release."
            else
              echo "::warning::$label deployment marker is absent or was replaced by another valid same-source deploy; authoritative build identity already passed."
            fi
          }

          verify_origin "$PAGES_URL" pages
          verify_origin "$CANONICAL_ORIGIN" apex

          www_headers=/tmp/www-headers.txt
          www_body=/tmp/www-body.txt
          status="$(curl -sS --connect-timeout 10 --max-time 40 --max-redirs 0 \
            -D "$www_headers" -o "$www_body" -w '%{http_code}' \
            "$WWW_ORIGIN/products?release_check=${SOURCE_SHA::12}" || true)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); value=$0} END{print value}' "$www_headers")"
          www_challenge=false
          if [ "$status" = "403" ] && { grep -Eqi '^cf-mitigated:[[:space:]]*challenge' "$www_headers" 2>/dev/null || grep -Fqi 'Just a moment...' "$www_body" 2>/dev/null; }; then
            www_challenge=true
          fi

          if [ "$www_challenge" = "true" ]; then
            echo "www_challenged=true" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub-hosted www observer received a Cloudflare challenge. Canonical redirect remains subject to downstream independent public verification."
          else
            case "$status" in
              301|302|307|308) ;;
              *) cat "$www_headers"; fail_or_skip_if_superseded "Unexpected www GET status: $status" ;;
            esac
            case "$location" in
              https://irhaapparels.com/*) ;;
              *) cat "$www_headers"; fail_or_skip_if_superseded "Unexpected www redirect: $location" ;;
            esac
            echo "www canonical GET redirect verified: status=$status location=$location"
          fi
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Record reconciliation result
        if: steps.verify.outputs.verified == 'true'
        shell: bash
        run: |
          {
            echo "## Cloudflare current-main reconciliation"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Quality Gate run: \`$QUALITY_RUN_ID\`"
            echo "- Already exact before run: \`${{ steps.live.outputs.exact }}\`"
            if [ "${{ steps.verify.outputs.apex_challenged }}" = "true" ]; then
              echo "- Apex GitHub observer: challenged; downstream public verification required"
              echo "- Pages source parity: verified"
            else
              echo "- Apex and Pages source parity: verified"
            fi
            if [ "${{ steps.verify.outputs.www_challenged }}" = "true" ]; then
              echo "- www GitHub observer: challenged; downstream public verification required"
            else
              echo "- www canonical redirect: verified"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
