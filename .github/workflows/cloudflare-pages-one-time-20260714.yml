name: Cloudflare Pages One-Time Latest Main
# Registered trigger revision: 7

run-name: One-time guarded Cloudflare deploy · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-pages-one-time-20260714.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-staging
  cancel-in-progress: false

env:
  PAGES_BRANCH: main
  STAGING_URL: https://irha-apparels.pages.dev

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-cloudflare-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}

    steps:
      - name: Checkout exact latest main source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve Cloudflare account and verify project
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '[:space:]')"
          raw_account_id="$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID:-}" | tr -d '[:space:]')"
          project_name="$(printf '%s' "${CLOUDFLARE_PROJECT_NAME:-}" | tr -d '[:space:]')"
          test -n "$token" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$project_name" || { echo "CLOUDFLARE_PROJECT_NAME is missing"; exit 1; }
          [[ "$project_name" =~ ^[a-z0-9][a-z0-9-]*[a-z0-9]$ ]]
          echo "::add-mask::$token"
          verify_json="$(curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' https://api.cloudflare.com/client/v4/user/tokens/verify)"
          test "$(printf '%s' "$verify_json" | jq -r '.success // false')" = "true"
          account_id="$raw_account_id"
          if ! [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            account_id="$(printf '%s' "$raw_account_id" | grep -Eo '[0-9a-fA-F]{32}' | head -n 1 || true)"
          fi
          if ! [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            accounts_json="$(curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/accounts?per_page=50')"
            test "$(printf '%s' "$accounts_json" | jq -r '.success // false')" = "true"
            test "$(printf '%s' "$accounts_json" | jq -r '(.result // []) | length')" = "1"
            account_id="$(printf '%s' "$accounts_json" | jq -r '.result[0].id // empty')"
          fi
          [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]
          echo "::add-mask::$account_id"
          project_json="$(curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/$account_id/pages/projects/$project_name")"
          test "$(printf '%s' "$project_json" | jq -r '.success // false')" = "true"
          test "$(printf '%s' "$project_json" | jq -r '.result.name // empty')" = "$project_name"
          test "$(printf '%s' "$project_json" | jq -r '.result.production_branch // empty')" = "$PAGES_BRANCH"
          {
            echo "CLOUDFLARE_API_TOKEN=$token"
            echo "CLOUDFLARE_ACCOUNT_ID=$account_id"
            echo "CLOUDFLARE_PROJECT_NAME=$project_name"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run deterministic release checks
        run: |
          set -euo pipefail
          npm run verify:deployment-source
          npm run verify:secrets
          npm run verify:migrations
          npx tsc --noEmit
          npm test -- --passWithNoTests
          npm run build
          npm run verify:release-identity

      - name: Verify release-safe output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/build.json
          test -s dist/release.txt
          test -s dist/.well-known/agent-card.json
          test -s dist/.well-known/mcp/server-card.json
          test -s dist/.well-known/openid-configuration
          test ! -e dist/_worker.js
          grep -F 'name="x-irha-release" content="frontend-live-2026-07-13-r11"' dist/index.html
          grep -F '"repository": "irhaapparelsofficial-ctrl/irha-global-craft-f3881330"' dist/build.json
          grep -F '"supabase_project_id": "pvzjiozismyxqrzmtfbi"' dist/build.json
          grep -F '"expected_origin": "https://irhaapparels.com"' dist/build.json
          if grep -R -nF --include='*.html' --include='*.js' --include='*.json' --include='*.txt' --include='*.xml' 'mlefxgyaqoisvdmoiapq' dist; then
            echo "Retired Supabase identity found"
            exit 1
          fi
          if grep -R -nE --include='*.html' --include='*.js' --include='*.json' --include='*.txt' --include='*.xml' 'Since 2014|MOQ 50|45-Day Delivery|45-day delivery|reply within 12 hours|BSCI Audited|ISO 9001:2015|SEDEX Member' dist; then
            echo "Blocked legacy claim found"
            exit 1
          fi
          fingerprint="$(jq -r '.build_fingerprint // empty' dist/build.json)"
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]
          jq -n --arg source_sha "$GITHUB_SHA" --arg repository "$GITHUB_REPOSITORY" --arg branch "$PAGES_BRANCH" --arg build_fingerprint "$fingerprint" --arg purpose "one-time-latest-main" --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{source_sha:$source_sha,repository:$repository,branch:$branch,build_fingerprint:$build_fingerprint,purpose:$purpose,generated_at:$generated_at}' > dist/cloudflare-deployment.json

      - name: Deploy exact build to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name="$CLOUDFLARE_PROJECT_NAME" --branch="$PAGES_BRANCH"

      - name: Verify pages.dev serves exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          expected_fingerprint="$(jq -r '.build_fingerprint // empty' dist/build.json)"
          ready=0
          for attempt in $(seq 1 24); do
            cache_bust="${GITHUB_SHA::12}-$attempt-$RANDOM"
            if curl -fsSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' "$STAGING_URL/build.json?release_check=$cache_bust" -o /tmp/build.json \
              && curl -fsSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' "$STAGING_URL/cloudflare-deployment.json?release_check=$cache_bust" -o /tmp/deployment.json \
              && jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" --arg fingerprint "$expected_fingerprint" '.source_commit==$sha and .source_identity_state=="verified" and .repository==$repo and .supabase_project_id=="pvzjiozismyxqrzmtfbi" and .build_fingerprint==$fingerprint' /tmp/build.json >/dev/null \
              && jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" --arg fingerprint "$expected_fingerprint" '.source_sha==$sha and .repository==$repo and .branch=="main" and .build_fingerprint==$fingerprint and .purpose=="one-time-latest-main"' /tmp/deployment.json >/dev/null; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" = "1"
          echo "Exact Cloudflare Pages release verified: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify live MCP, A2A and OAuth discovery
        shell: bash
        run: |
          set -euo pipefail
          cache_bust="${GITHUB_SHA::12}-$RANDOM"
          curl -fsSL -H 'Cache-Control: no-cache' "$STAGING_URL/.well-known/agent-card.json?verify=$cache_bust" -o /tmp/agent-card.json
          jq -e '.name == "Irha Apparels Public Buyer Agent" and .supportedInterfaces[0].protocolBinding == "JSONRPC" and .supportedInterfaces[0].protocolVersion == "1.0" and (.skills | length) == 3' /tmp/agent-card.json >/dev/null

          curl -fsSL -H 'Cache-Control: no-cache' "$STAGING_URL/mcp?verify=$cache_bust" -o /tmp/mcp.json
          jq -e '.name == "irha-apparels-public" and .authentication == "none" and (.tools | length) >= 3' /tmp/mcp.json >/dev/null

          curl -fsSL -X POST "$STAGING_URL/a2a" \
            -H 'Content-Type: application/a2a+json' \
            -H 'A2A-Version: 1.0' \
            --data '{"jsonrpc":"2.0","id":"release-check","method":"SendMessage","params":{"message":{"messageId":"release-check-message","role":"ROLE_USER","parts":[{"text":"Show me your product collections"}]}}}' \
            -o /tmp/a2a.json
          jq -e '.jsonrpc == "2.0" and .id == "release-check" and .result.message.role == "ROLE_AGENT" and .result.message.metadata.readOnly == true and .result.message.metadata.submitted == false' /tmp/a2a.json >/dev/null

          curl -fsSL -H 'Cache-Control: no-cache' "$STAGING_URL/.well-known/openid-configuration?verify=$cache_bust" -o /tmp/oidc.json
          jq -e '(.issuer == "https://pvzjiozismyxqrzmtfbi.supabase.co/auth/v1") and ((.code_challenge_methods_supported | index("S256")) != null)' /tmp/oidc.json >/dev/null

          curl -fsSL -H 'Cache-Control: no-cache' "$STAGING_URL/.well-known/oauth-protected-resource?verify=$cache_bust" -o /tmp/resource.json
          jq -e '.resource == "https://pvzjiozismyxqrzmtfbi.supabase.co" and .authorization_servers == ["https://pvzjiozismyxqrzmtfbi.supabase.co/auth/v1"]' /tmp/resource.json >/dev/null

          echo "MCP, A2A and OAuth discovery verified live on pages.dev." >> "$GITHUB_STEP_SUMMARY"
