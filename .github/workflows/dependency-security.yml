name: Dependency Security

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# A locked install plus npm audit must remain clean before security changes merge.
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Generate dependency audit report
        run: npm audit --json > npm-audit.json || true
      - name: Upload dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce zero known vulnerabilities
        run: |
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const vulnerabilities = audit.vulnerabilities || {};
          const compact = Object.entries(vulnerabilities).map(([name, item]) => ({
            name,
            severity: item.severity,
            direct: item.isDirect,
            via: (item.via || []).map((entry) => typeof entry === 'string' ? entry : ({ title: entry.title, severity: entry.severity, range: entry.range, url: entry.url })),
            range: item.range,
            fixAvailable: item.fixAvailable,
          }));
          console.log(JSON.stringify({ summary: audit.metadata?.vulnerabilities, vulnerabilities: compact }, null, 2));
          if ((audit.metadata?.vulnerabilities?.total || 0) > 0) process.exit(1);
          NODE
