name: Dependency Security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit all locked dependencies
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          audit_exit=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const vulnerabilities = audit.vulnerabilities || {};
          const compact = Object.entries(vulnerabilities).map(([name, item]) => ({
            name,
            severity: item.severity,
            direct: item.isDirect,
            via: (item.via || []).map((entry) => typeof entry === 'string' ? entry : ({
              title: entry.title,
              severity: entry.severity,
              range: entry.range,
              url: entry.url,
            })),
            range: item.range,
            fixAvailable: item.fixAvailable,
          }));
          console.log(JSON.stringify({ summary: audit.metadata?.vulnerabilities, vulnerabilities: compact }, null, 2));
          if ((audit.metadata?.vulnerabilities?.total || 0) > 0) process.exit(1);
          NODE
          exit "$audit_exit"
