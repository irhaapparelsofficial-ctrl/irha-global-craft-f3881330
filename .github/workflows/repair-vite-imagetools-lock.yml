name: Repair Vite image-tools lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'fix/vite5-imagetools-compat-20260713'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate compatible lockfile
        run: npm install --package-lock-only --save-dev vite-imagetools@8.0.0
      - name: Verify clean install and production build
        run: |
          npm ci
          npm run build
      - name: Commit repaired package files
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Package files already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix(deps): use Vite 5 compatible image tools'
          git push origin HEAD:${{ github.head_ref }}
