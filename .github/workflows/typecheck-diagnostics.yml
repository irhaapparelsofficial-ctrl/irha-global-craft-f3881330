name: Typecheck Diagnostics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Capture application typecheck output
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit -p tsconfig.app.json 2>&1 | tee typecheck.log
      - name: Upload typecheck output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce typecheck
        if: always()
        run: test "${{ steps.typecheck.outcome }}" = "success"
