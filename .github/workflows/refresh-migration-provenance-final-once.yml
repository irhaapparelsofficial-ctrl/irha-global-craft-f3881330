name: Refresh Migration Provenance Final Once

on:
  push:
    branches: [fix/supabase-types-parity-final]
    paths:
      - .github/workflows/refresh-migration-provenance-final-once.yml

permissions:
  contents: write

concurrency:
  group: irha-migration-provenance-refresh-final-once
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: pvzjiozismyxqrzmtfbi

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout exact focused branch
        uses: actions/checkout@v4
        with:
          ref: fix/supabase-types-parity-final
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate exact authenticated migration provenance
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${SUPABASE_ACCESS_TOKEN:-}" | tr -d '[:space:]')"
          test -n "$token"
          echo "::add-mask::$token"
          SUPABASE_ACCESS_TOKEN="$token" \
          SUPABASE_PROJECT_ID="$SUPABASE_PROJECT_ID" \
          MIGRATION_PROVENANCE_MODE=write \
            node scripts/ci/generate-migration-provenance.mjs
          SUPABASE_ACCESS_TOKEN="$token" \
          SUPABASE_PROJECT_ID="$SUPABASE_PROJECT_ID" \
          MIGRATION_PROVENANCE_MODE=verify \
            node scripts/ci/generate-migration-provenance.mjs

      - name: Commit only refreshed provenance and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/refresh-migration-provenance-final-once.yml
          git add supabase/deployment-parity/migration-provenance.json
          if git diff --cached --quiet; then
            echo "No migration provenance drift remains."
            exit 1
          fi
          git config user.name "irhaapparelsofficial-ctrl"
          git config user.email "294838484+irhaapparelsofficial-ctrl@users.noreply.github.com"
          git commit -m "fix(parity): refresh verified migration provenance"
          git push origin HEAD:fix/supabase-types-parity-final
