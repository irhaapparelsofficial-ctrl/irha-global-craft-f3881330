name: Temporary Supabase Manifest Refresh 20260808

on:
  push:
    branches: [fix/public-types-parity-20260808]

permissions:
  contents: write

concurrency:
  group: temporary-supabase-manifest-refresh-20260808
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: pvzjiozismyxqrzmtfbi
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: fix/public-types-parity-20260808
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate exact authenticated deployment manifest
        env:
          SUPABASE_MANIFEST_MODE: write
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          node scripts/ci/generate-supabase-manifest.mjs

      - name: Reverify generated deployment manifest
        env:
          SUPABASE_MANIFEST_MODE: verify
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/generate-supabase-manifest.mjs
          node scripts/verify-supabase-parity.mjs

      - name: Commit exact generated manifest to recovery branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase/deployment-parity/manifest.json; then
            echo "Deployment manifest is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/deployment-parity/manifest.json
          git commit -m "fix(parity): refresh exact deployment manifest"
          git push origin HEAD:fix/public-types-parity-20260808
