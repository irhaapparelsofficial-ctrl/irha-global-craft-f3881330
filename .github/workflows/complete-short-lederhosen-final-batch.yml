name: Complete Short Lederhosen Final Batch

on:
  push:
    branches:
      - complete-short-lederhosen-final-batch
    paths:
      - "scripts/patch_complete_short_lederhosen.py"
      - ".github/workflows/complete-short-lederhosen-final-batch.yml"

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: complete-short-lederhosen-final-batch
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply exact product and gallery patch
        run: python scripts/patch_complete_short_lederhosen.py

      - name: Validate product manifests
        run: |
          python -m json.tool scripts/product-media-manifest.json >/dev/null
          python -m json.tool scripts/product-media-batch-02.json >/dev/null
          python -m json.tool scripts/product-media-batch-03.json >/dev/null

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Commit completed batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/complete-short-lederhosen-final-batch.yml
          git rm scripts/patch_complete_short_lederhosen.py
          git add scripts/product-media-manifest.json scripts/product-media-batch-02.json scripts/product-media-batch-03.json
          git add src/lib/productRealMedia.ts src/lib/supplementalCatalogBatch02.ts src/lib/supplementalCatalogBatch03.ts src/hooks/usePublicCatalog.ts package-lock.json
          git commit -m "Complete Short Lederhosen product range"
          git push origin HEAD:complete-short-lederhosen-final-batch
