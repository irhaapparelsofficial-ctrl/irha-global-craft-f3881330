name: Temporary public Supabase type refresh

on:
  push:
    branches: [fix/supabase-types-parity-drift]

permissions:
  contents: write

env:
  SUPABASE_PROJECT_ID: pvzjiozismyxqrzmtfbi

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[generated-types]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout refresh branch
        uses: actions/checkout@v4
        with:
          ref: fix/supabase-types-parity-drift

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.39.2

      - name: Generate exact public-schema types
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${SUPABASE_ACCESS_TOKEN:-}" | tr -d '[:space:]')"
          test -n "$token"
          echo "::add-mask::$token"
          supabase gen types typescript \
            --project-id "$SUPABASE_PROJECT_ID" \
            --schema public > /tmp/supabase-types.ts
          test -s /tmp/supabase-types.ts
          ! grep -E '(sb_secret_|service_role[^A-Za-z0-9]|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,})' /tmp/supabase-types.ts
          cp /tmp/supabase-types.ts src/integrations/supabase/types.ts

      - name: Commit generated types only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- . ':!src/integrations/supabase/types.ts'
          if git diff --quiet -- src/integrations/supabase/types.ts; then
            echo "Types are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/integrations/supabase/types.ts
          git commit -m "chore(db): refresh official public Supabase types [generated-types]"
          git push origin HEAD:fix/supabase-types-parity-drift
