name: IA-B2B-E002 Shell Bootstrap

on:
  push:
    branches:
      - feat/ia-b2b-e002-buyer-confidence
    paths:
      - .github/workflows/ia-b2b-e002-shell-bootstrap.yml

permissions:
  contents: write

jobs:
  patch-static-shell-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout focused branch
        uses: actions/checkout@v4
        with:
          ref: feat/ia-b2b-e002-buyer-confidence
          fetch-depth: 0

      - name: Add a safe base-shell fallback for new localized routes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/generate-buyer-confidence-route-shells.ts")
          source = path.read_text(encoding="utf-8")
          old = '  const html = await readFile(file, "utf8");'
          new = '''  const html = await readFile(file, "utf8").catch(async (error: NodeJS.ErrnoException) => {
    if (error.code != "ENOENT") throw error;
    return readFile(join(DIST_DIR, "index.html"), "utf8");
  });'''
          if old not in source:
              raise SystemExit("Expected static-shell read was not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit focused build correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate-buyer-confidence-route-shells.ts
          git diff --cached --check
          git commit -m "fix(build): bootstrap new buyer-confidence route shells"
          git push origin HEAD:feat/ia-b2b-e002-buyer-confidence
