name: Apply Lead Activation Failure Checkpoint

on:
  push:
    branches:
      - feat/lead-file-outreach-approval

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lead-file-outreach-approval
          fetch-depth: 0

      - name: Patch and verify failure checkpoint
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/lead-activation-channel-v2/index.ts')
          source = path.read_text()
          old = '''    return json({ ok: true, batch_id: batch.data.id, outcomes, summary, imported_lead_ids: importedLeadIds, sends_external_messages: false });
            } finally {
              const release = await service.from("lead_candidates").update({'''
          new = '''    return json({ ok: true, batch_id: batch.data.id, outcomes, summary, imported_lead_ids: importedLeadIds, sends_external_messages: false });
            } catch (error) {
              const reason = errorText(error);
              const failedBatch = await service.from("lead_activation_batches").update({
                status: importedLeadIds.length ? "partial" : "failed",
                imported_lead_ids: importedLeadIds,
                imported_count: importedLeadIds.length,
                skipped_count: Math.max(0, outcomes.length - importedLeadIds.length),
                failed_count: Math.max(1, outcomes.filter((item) => item.status === "failed").length),
                summary: { mode: "channel_activation_v2", recovery: "unexpected_error", sends_external_messages: false, claim_token: claimToken, max_batch: MAX_BATCH },
                errors: [...outcomes.filter((item) => item.error), { phase: "activation", error: reason }].slice(0, MAX_BATCH + 1),
                completed_at: new Date().toISOString(),
              }).eq("id", batch.data.id);
              if (failedBatch.error) console.error("lead activation batch failure checkpoint failed", failedBatch.error.message);
              throw error;
            } finally {
              const release = await service.from("lead_candidates").update({'''
          if source.count(old) != 1:
              raise SystemExit(f'expected checkpoint insertion point once; found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))

          test_path = Path('src/test/leadOutreachSafetyContracts.test.ts')
          test = test_path.read_text()
          old_test = '''      expect(backend).toContain('.eq("activation_claim_token", claimToken)');
              expect(migration).toContain("activation_claim_token uuid");'''
          new_test = '''      expect(backend).toContain('.eq("activation_claim_token", claimToken)');
              expect(backend).toContain('recovery: "unexpected_error"');
              expect(backend).toContain('lead activation batch failure checkpoint failed');
              expect(migration).toContain("activation_claim_token uuid");'''
          if test.count(old_test) != 1:
              raise SystemExit(f'expected test insertion point once; found {test.count(old_test)}')
          test_path.write_text(test.replace(old_test, new_test, 1))
          PY

          npm ci --ignore-scripts
          npx vitest run src/test/leadOutreachSafetyContracts.test.ts
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import ts from 'typescript';
          const path = 'supabase/functions/lead-activation-channel-v2/index.ts';
          const source = readFileSync(path, 'utf8');
          const result = ts.transpileModule(source, {
            fileName: path,
            reportDiagnostics: true,
            compilerOptions: { target: ts.ScriptTarget.ES2022, module: ts.ModuleKind.ESNext },
          });
          const errors = (result.diagnostics ?? []).filter((item) => item.category === ts.DiagnosticCategory.Error);
          if (errors.length) {
            console.error(errors.map((item) => ts.flattenDiagnosticMessageText(item.messageText, '\n')).join('\n'));
            process.exit(1);
          }
          NODE

      - name: Commit verified checkpoint
        run: |
          set -euo pipefail
          rm .github/workflows/apply-lead-activation-failure-checkpoint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/lead-activation-channel-v2/index.ts src/test/leadOutreachSafetyContracts.test.ts .github/workflows/apply-lead-activation-failure-checkpoint.yml
          git commit -m "fix(leads): checkpoint unexpected activation failures"
          git push origin HEAD:feat/lead-file-outreach-approval
