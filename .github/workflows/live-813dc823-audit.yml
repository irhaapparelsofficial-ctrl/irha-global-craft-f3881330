name: Live exact release audit 813dc823

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE_SHA: 813dc8235c2c8d6e74a1e2f5aede0c7fb625f2d0
      LIVE_ORIGIN: https://irhaapparels.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for exact live source
        shell: bash
        run: |
          set -euo pipefail
          matched=0
          for attempt in $(seq 1 90); do
            cache_bust="${EXPECTED_SOURCE_SHA::12}-$attempt-$RANDOM"
            if curl -fsSL --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' "$LIVE_ORIGIN/build.json?audit=$cache_bust" -o live-build.json \
              && jq -e --arg sha "$EXPECTED_SOURCE_SHA" '.source_commit==$sha and .source_identity_state=="verified"' live-build.json >/dev/null; then
              matched=1
              echo "Exact live source verified on attempt $attempt"
              break
            fi
            echo "Production not converged yet ($attempt/90)"
            sleep 10
          done
          test "$matched" = "1"
          cat live-build.json
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Capture live iPhone evidence
        shell: bash
        run: |
          cat > capture-live-audit.mjs <<'EOF'
          import { chromium, devices } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const origin = process.env.LIVE_ORIGIN;
          const expectedSource = process.env.EXPECTED_SOURCE_SHA;
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ ...devices['iPhone 13'], locale: 'en-GB' });
          const page = await context.newPage();
          const consoleErrors = [];
          const failures = [];
          page.on('console', (message) => {
            if (message.type() === 'error') consoleErrors.push(message.text());
          });

          async function open(path, label) {
            try {
              const response = await page.goto(`${origin}${path}${path.includes('?') ? '&' : '?'}live_audit=${Date.now()}`, {
                waitUntil: 'domcontentloaded',
                timeout: 90000,
              });
              await page.waitForTimeout(1600);
              return {
                status: response?.status() ?? null,
                finalUrl: page.url(),
                title: await page.title(),
              };
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              failures.push(`${label}: ${message}`);
              return { status: null, finalUrl: page.url(), error: message };
            }
          }

          let info;
          try {
            const home = await open('/', 'home');
            await page.screenshot({ path: 'live-813-viewport.png' });

            for (let step = 0; step < 40; step += 1) {
              const state = await page.evaluate(() => ({
                y: window.scrollY,
                height: document.body.scrollHeight,
                viewport: window.innerHeight,
              }));
              if (state.y + state.viewport >= state.height - 4) break;
              await page.evaluate((nextY) => window.scrollTo(0, nextY), Math.min(state.y + 600, state.height));
              await page.waitForTimeout(220);
            }
            await page.waitForTimeout(800);
            await page.screenshot({ path: 'live-813-full.png', fullPage: true });

            const routeResults = {};
            for (const path of ['/products', '/inquiry', '/catalogue']) {
              routeResults[path] = await open(path, path);
            }

            await open('/', 'home-summary');
            const h1 = await page.locator('h1').first().textContent().catch(() => null);
            const logoVisible = await page.locator('img[src="/irha-brand-mark.svg"]').first().isVisible().catch(() => false);
            const requestQuoteVisible = await page.getByText('Request quote', { exact: false }).first().isVisible().catch(() => false);
            const cookieVisible = await page.getByText('Optional cookies', { exact: true }).isVisible().catch(() => false);

            info = {
              expectedSource,
              home,
              h1,
              logoVisible,
              requestQuoteVisible,
              cookieVisible,
              viewport: page.viewportSize(),
              routeResults,
              consoleErrors: consoleErrors.slice(0, 20),
              failures,
            };

            if (home.status !== 200) failures.push(`home status ${home.status}`);
            if (!h1) failures.push('homepage H1 missing');
            if (!logoVisible) failures.push('brand mark not visible');
            if (!requestQuoteVisible) failures.push('request quote action not visible');
            for (const [path, result] of Object.entries(routeResults)) {
              if (result.status !== 200) failures.push(`${path} final status ${result.status}`);
            }
            info.failures = failures;
          } finally {
            if (!info) {
              info = {
                expectedSource,
                viewport: page.viewportSize(),
                consoleErrors: consoleErrors.slice(0, 20),
                failures: failures.length ? failures : ['audit ended before summary'],
              };
            }
            await writeFile('live-813-view.json', JSON.stringify(info, null, 2));
            console.log(JSON.stringify(info, null, 2));
            await browser.close();
          }

          if (failures.length) process.exitCode = 1;
          EOF
          node capture-live-audit.mjs
      - name: Upload exact live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-813dc823-audit
          if-no-files-found: warn
          path: |
            live-build.json
            live-813-view.json
            live-813-viewport.png
            live-813-full.png
          retention-days: 2
