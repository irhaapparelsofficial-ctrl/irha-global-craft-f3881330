name: Cloudflare Pages Preview

run-name: Safe Cloudflare preview · ${{ github.ref_name }} · #${{ github.run_number }}

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-pages-preview.yml"
      - ".github/workflows/production-route-parity.yml"
      - "scripts/crawl-production-route-parity.ts"
      - "scripts/evaluate-preview-route-parity.ts"
      - "scripts/reconcile-related-product-route-findings.ts"
      - "scripts/related-product-policy.ts"
      - "scripts/resolve-cloudflare-preview-deployment.mjs"
      - "scripts/wait-for-cloudflare-preview-propagation.ts"
      - "scripts/generate-buyer-ready-catalog-manifest.ts"
      - "scripts/generate-buyer-ready-redirects.ts"
      - "scripts/patch-supabase-rpc-pagination.mjs"
      - "scripts/generate-static-route-shells.ts"
      - "scripts/enrich-generic-static-route-shells.mjs"
      - "scripts/enhance-product-route-shells.ts"
      - "scripts/align-taxonomy-route-shells.ts"
      - "scripts/patch-worker-route-parity.mjs"
      - "scripts/install-i18n-worker-gateway.ts"
      - "scripts/verify-route-parity-build.ts"
      - "scripts/strengthen-brand-search-signals.mjs"
      - "public/_redirects"
      - "public/_worker.js"
      - "src/hooks/usePublicCatalog.ts"
      - "src/lib/buyerReadyProductContent.ts"
      - "src/pages/CategoryOrProductPage.tsx"
      - "src/pages/Home.tsx"
      - "src/components/HeroCarousel.tsx"
      - "src/test/productionRouteParityCrawler.test.ts"
      - "src/test/relatedProductRouteParity.test.ts"
      - "src/test/supabaseRpcPaginationGuard.test.ts"
      - "src/test/cloudflarePreviewPropagation.test.ts"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-preview
  cancel-in-progress: true

env:
  PREVIEW_BRANCH: github-preview
  PREVIEW_URL: https://github-preview.irha-apparels.pages.dev
  CANONICAL_ORIGIN: https://irhaapparels.com

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}

    steps:
      - name: Verify Cloudflare credentials and project
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          account_id="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          project_name="$(printf '%s' "$CLOUDFLARE_PROJECT_NAME" | tr -d '[:space:]')"
          test -n "$token" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$account_id" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$project_name" || { echo "CLOUDFLARE_PROJECT_NAME is missing"; exit 1; }
          [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]] || { echo "CLOUDFLARE_ACCOUNT_ID must be the 32-character Account ID only"; exit 1; }
          [[ "$project_name" =~ ^[a-z0-9][a-z0-9-]*[a-z0-9]$ ]] || { echo "CLOUDFLARE_PROJECT_NAME contains invalid characters"; exit 1; }
          echo "::add-mask::$token"
          echo "::add-mask::$account_id"
          verify_json="$(curl -sS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' https://api.cloudflare.com/client/v4/user/tokens/verify)"
          test "$(printf '%s' "$verify_json" | jq -r '.success // false')" = "true" || {
            printf '%s' "$verify_json" | jq -r '.errors[]? | "Cloudflare error \(.code // "unknown"): \(.message // "unknown")"'
            exit 1
          }
          project_json="$(curl -sS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/$account_id/pages/projects/$project_name")"
          test "$(printf '%s' "$project_json" | jq -r '.success // false')" = "true" || {
            printf '%s' "$project_json" | jq -r '.errors[]? | "Cloudflare error \(.code // "unknown"): \(.message // "unknown")"'
            exit 1
          }
          test "$(printf '%s' "$project_json" | jq -r '.result.name // empty')" = "$project_name"

  preview:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
      CRAWL_OUTPUT_DIR: artifacts/preview-route-parity

    steps:
      - name: Normalize Cloudflare environment
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          account_id="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          project_name="$(printf '%s' "$CLOUDFLARE_PROJECT_NAME" | tr -d '[:space:]')"
          expected_preview_url="https://${PREVIEW_BRANCH}.${project_name}.pages.dev"
          test "$PREVIEW_URL" = "$expected_preview_url" || {
            echo "Preview URL mismatch: expected $expected_preview_url, got $PREVIEW_URL"
            exit 1
          }
          echo "::add-mask::$token"
          echo "::add-mask::$account_id"
          {
            echo "CLOUDFLARE_API_TOKEN=$token"
            echo "CLOUDFLARE_ACCOUNT_ID=$account_id"
            echo "CLOUDFLARE_PROJECT_NAME=$project_name"
            echo "EXPECTED_SOURCE_SHA=$GITHUB_SHA"
            echo "PREVIEW_ALIAS_URL=$PREVIEW_URL"
          } >> "$GITHUB_ENV"

      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install exact lockfile dependencies
        run: npm ci --ignore-scripts

      - name: Build exact source
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BUILT_AT: ${{ github.event.pull_request.updated_at || github.event.repository.updated_at }}
          IRHA_SKIP_IMAGE_HTTP: "1"
        run: npm run build

      - name: Recheck release-safe build output
        run: |
          npx tsx scripts/verify-built-release-identity.ts
          npx tsx scripts/verify-route-parity-build.ts
          node scripts/verify-built-crawler-shell.mjs

      - name: Deploy preview branch only
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler pages deploy dist \
            --project-name "$CLOUDFLARE_PROJECT_NAME" \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$EXPECTED_SOURCE_SHA" \
            --commit-dirty=false \
            --commit-message "Preview ${GITHUB_REPOSITORY}@${EXPECTED_SOURCE_SHA}" \
            --no-bundle | tee preview-deploy.log

      - name: Resolve immutable preview deployment URL
        id: resolve_preview
        shell: bash
        run: node scripts/resolve-cloudflare-preview-deployment.mjs

      - name: Verify isolated preview deployment
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PREVIEW_DEPLOYMENT_URL"
          test "$PREVIEW_DEPLOYMENT_URL" != "$CANONICAL_ORIGIN"
          case "$PREVIEW_DEPLOYMENT_URL" in
            https://*.pages.dev) ;;
            *) echo "Unexpected preview origin: $PREVIEW_DEPLOYMENT_URL"; exit 1 ;;
          esac
          source_sha="$(curl -fsS "$PREVIEW_DEPLOYMENT_URL/build.json?preview=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | jq -r '.source_commit')"
          test "$source_sha" = "$EXPECTED_SOURCE_SHA" || {
            echo "Preview SHA mismatch: expected $EXPECTED_SOURCE_SHA, got $source_sha"
            exit 1
          }

      - name: Wait for full immutable preview propagation
        env:
          PREVIEW_URL: ${{ env.PREVIEW_DEPLOYMENT_URL }}
        run: npx tsx scripts/wait-for-cloudflare-preview-propagation.ts

      - name: Run complete preview route parity crawl
        env:
          PRODUCTION_ORIGIN: ${{ env.PREVIEW_DEPLOYMENT_URL }}
          EXPECTED_PRODUCTION_SHA: ${{ env.EXPECTED_SOURCE_SHA }}
          ROUTE_PARITY_OUTPUT_DIR: ${{ env.CRAWL_OUTPUT_DIR }}
        run: npx tsx scripts/crawl-production-route-parity.ts

      - name: Reconcile related-product route evidence
        env:
          ROUTE_PARITY_OUTPUT_DIR: ${{ env.CRAWL_OUTPUT_DIR }}
        run: npx tsx scripts/reconcile-related-product-route-findings.ts

      - name: Evaluate preview-only parity context
        env:
          PRODUCTION_PARITY_DIR: ${{ env.CRAWL_OUTPUT_DIR }}
          PREVIEW_PARITY_CONTEXT: "true"
        run: npx tsx scripts/evaluate-preview-route-parity.ts

      - name: Preserve preview route-parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-route-parity-${{ github.sha }}
          path: artifacts/preview-route-parity
          if-no-files-found: error
          retention-days: 7

      - name: Publish preview summary and enforce parity
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          const evidencePath = 'artifacts/preview-route-parity/preview-evaluation.json';
          const propagationPath = 'artifacts/preview-route-parity/preview-propagation.json';
          const propagationErrorPath = 'artifacts/preview-route-parity/preview-propagation-error.txt';
          const reconciliationPath = 'artifacts/preview-route-parity/related-product-reconciliation.json';
          const crawlPath = 'artifacts/preview-route-parity/production-route-parity.json';
          const lines = ['## Safe Cloudflare Preview'];
          let failed = false;
          if (process.env.PREVIEW_DEPLOYMENT_URL) lines.push(`- Immutable preview: ${process.env.PREVIEW_DEPLOYMENT_URL}`);
          if (fs.existsSync(propagationPath)) {
            const propagation = JSON.parse(fs.readFileSync(propagationPath, 'utf8'));
            lines.push(`- Propagation: ${propagation.pendingCount === 0 ? 'PASS' : 'FAIL'} (${propagation.routeCount - propagation.pendingCount}/${propagation.routeCount} canonical routes ready)`);
            lines.push(`- Propagation rounds: ${propagation.rounds}; transient Deployment Not Found responses: ${propagation.transientDeploymentNotFoundResponses}`);
            if (propagation.pendingCount !== 0) failed = true;
          } else if (fs.existsSync(propagationErrorPath)) {
            lines.push(`- Propagation: FAIL (${fs.readFileSync(propagationErrorPath, 'utf8').trim().split('\n')[0]})`);
            failed = true;
          } else {
            lines.push('- Propagation: FAIL (evidence missing)');
            failed = true;
          }
          if (fs.existsSync(crawlPath)) {
            const crawl = JSON.parse(fs.readFileSync(crawlPath, 'utf8'));
            lines.push(`- Complete crawl: ${crawl.summary?.pass ? 'PASS' : 'FAIL'} (${crawl.summary?.checkedRoutes ?? 0} routes; ${(crawl.summary?.failures || []).length} failures)`);
            if (!crawl.summary?.pass) failed = true;
          } else {
            lines.push('- Complete crawl: FAIL (evidence missing)');
            failed = true;
          }
          if (fs.existsSync(reconciliationPath)) {
            const reconciliation = JSON.parse(fs.readFileSync(reconciliationPath, 'utf8'));
            lines.push(`- Related-product reconciliation: ${reconciliation.summary?.pass ? 'PASS' : 'FAIL'} (${reconciliation.summary?.confirmedBrokenRoutes ?? 0} confirmed broken routes)`);
            if (!reconciliation.summary?.pass) failed = true;
          } else {
            lines.push('- Related-product reconciliation: FAIL (evidence missing)');
            failed = true;
          }
          if (fs.existsSync(evidencePath)) {
            const evidence = JSON.parse(fs.readFileSync(evidencePath, 'utf8'));
            lines.push(`- Preview parity: ${evidence.summary?.pass ? 'PASS' : 'FAIL'} (${evidence.summary?.blockingIssues ?? 0} blockers)`);
            lines.push(`- Production mutation: ${evidence.productionMutation === false ? 'none' : 'unexpected'}`);
            if (!evidence.summary?.pass || evidence.productionMutation !== false) failed = true;
          } else {
            lines.push('- Preview parity: FAIL (evidence missing)');
            failed = true;
          }
          fs.appendFileSync(summaryPath, `${lines.join('\n')}\n`);
          if (failed) process.exit(1);
          NODE
