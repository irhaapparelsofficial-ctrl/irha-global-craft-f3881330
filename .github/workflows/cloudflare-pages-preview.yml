name: Cloudflare Pages Preview

run-name: Safe Cloudflare preview · ${{ github.ref_name }} · #${{ github.run_number }}

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-pages-preview.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-preview
  cancel-in-progress: true

env:
  PREVIEW_BRANCH: github-preview
  PREVIEW_URL: https://github-preview.irha-apparels.pages.dev

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}

    steps:
      - name: Verify Cloudflare credentials and project
        shell: bash
        run: |
          set -euo pipefail

          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          account_id="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          project_name="$(printf '%s' "$CLOUDFLARE_PROJECT_NAME" | tr -d '[:space:]')"

          test -n "$token" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$account_id" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$project_name" || { echo "CLOUDFLARE_PROJECT_NAME is missing"; exit 1; }

          [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]] || {
            echo "CLOUDFLARE_ACCOUNT_ID must be the 32-character Account ID only"
            exit 1
          }
          [[ "$project_name" =~ ^[a-z0-9][a-z0-9-]*[a-z0-9]$ ]] || {
            echo "CLOUDFLARE_PROJECT_NAME contains invalid characters"
            exit 1
          }

          echo "::add-mask::$token"
          echo "::add-mask::$account_id"

          verify_json="$(curl -sS \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"

          if [ "$(printf '%s' "$verify_json" | jq -r '.success // false')" != "true" ]; then
            echo "Cloudflare API token verification failed"
            printf '%s' "$verify_json" | jq -r '.errors[]? | "Cloudflare error \(.code // "unknown"): \(.message // "unknown")"'
            exit 1
          fi

          project_json="$(curl -sS \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$account_id/pages/projects/$project_name")"

          if [ "$(printf '%s' "$project_json" | jq -r '.success // false')" != "true" ]; then
            echo "Cloudflare Pages project lookup failed"
            printf '%s' "$project_json" | jq -r '.errors[]? | "Cloudflare error \(.code // "unknown"): \(.message // "unknown")"'
            exit 1
          fi

          actual_name="$(printf '%s' "$project_json" | jq -r '.result.name // empty')"
          test "$actual_name" = "$project_name" || {
            echo "Cloudflare project mismatch: expected $project_name, got $actual_name"
            exit 1
          }

          echo "Cloudflare credentials valid and Pages project confirmed: $actual_name"

  preview:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}

    steps:
      - name: Normalize Cloudflare environment
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          account_id="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          project_name="$(printf '%s' "$CLOUDFLARE_PROJECT_NAME" | tr -d '[:space:]')"
          expected_preview_url="https://${PREVIEW_BRANCH}.${project_name}.pages.dev"
          test "$PREVIEW_URL" = "$expected_preview_url" || {
            echo "Preview URL mismatch: expected $expected_preview_url, got $PREVIEW_URL"
            exit 1
          }
          echo "::add-mask::$token"
          echo "::add-mask::$account_id"
          {
            echo "CLOUDFLARE_API_TOKEN=$token"
            echo "CLOUDFLARE_ACCOUNT_ID=$account_id"
            echo "CLOUDFLARE_PROJECT_NAME=$project_name"
          } >> "$GITHUB_ENV"

      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install exact lockfile dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build exact source
        run: npm run build

      - name: Recheck release-safe build output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/build.json
          test -s dist/release.txt
          grep -F 'name="x-irha-release" content="frontend-live-2026-07-13-r11"' dist/index.html
          grep -F 'Irha Apparels — Custom Apparel Manufacturer for Global B2B Buyers' dist/index.html
          grep -F '"repository": "irhaapparelsofficial-ctrl/irha-global-craft-f3881330"' dist/build.json
          grep -F '"supabase_project_id": "pvzjiozismyxqrzmtfbi"' dist/build.json
          grep -F "\"source_commit\": \"$GITHUB_SHA\"" dist/build.json
          grep -F '"source_identity_state": "verified"' dist/build.json
          if grep -R -nF --include='*.html' --include='*.js' --include='*.json' --include='*.txt' --include='*.xml' 'mlefxgyaqoisvdmoiapq' dist; then
            echo "Built frontend references the retired Lovable Cloud database"
            exit 1
          fi

      - name: Deploy preview branch only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist \
            --project-name="$CLOUDFLARE_PROJECT_NAME" \
            --branch="$PREVIEW_BRANCH" \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=false

      - name: Verify isolated preview deployment
        shell: bash
        run: |
          set -euo pipefail
          ready=0

          for attempt in $(seq 1 18); do
            if curl -fsS \
              --connect-timeout 10 --max-time 40 \
              -H 'Cache-Control: no-cache' \
              "$PREVIEW_URL/?release_check=${GITHUB_SHA::12}" \
              -o /tmp/preview-home.html \
              -D /tmp/preview-headers \
              && curl -fsS \
              --connect-timeout 10 --max-time 40 \
              -H 'Cache-Control: no-cache' \
              "$PREVIEW_URL/build.json?release_check=${GITHUB_SHA::12}" \
              -o /tmp/preview-build.json; then

              if grep -Eiq '^HTTP/[0-9.]+ 200' /tmp/preview-headers \
                && grep -Fq 'Irha Apparels — Custom Apparel Manufacturer for Global B2B Buyers' /tmp/preview-home.html \
                && jq -e \
                  --arg repo 'irhaapparelsofficial-ctrl/irha-global-craft-f3881330' \
                  --arg supabase 'pvzjiozismyxqrzmtfbi' \
                  --arg source "$GITHUB_SHA" \
                  '.repository == $repo and .supabase_project_id == $supabase and .source_commit == $source and .source_identity_state == "verified"' \
                  /tmp/preview-build.json >/dev/null; then
                ready=1
                echo "Preview verified on attempt $attempt"
                break
              fi
            fi

            echo "Preview not ready yet (attempt $attempt/18)"
            sleep 10
          done

          test "$ready" = "1" || {
            echo "Cloudflare preview did not converge safely"
            exit 1
          }

          if grep -Eiq 'Since 2014|MOQ 50|45-Day Delivery|reply within 12 hours|BSCI Audited|ISO 9001:2015' /tmp/preview-home.html; then
            echo "Legacy production claims are present in preview"
            exit 1
          fi

          echo "Preview URL: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview branch: $PREVIEW_BRANCH" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "No custom domain or production branch was changed." >> "$GITHUB_STEP_SUMMARY"
