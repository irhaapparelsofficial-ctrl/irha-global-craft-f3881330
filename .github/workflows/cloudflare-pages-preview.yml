name: Cloudflare Pages Preview

run-name: Safe Cloudflare preview · ${{ github.ref_name }} · #${{ github.run_number }}

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-pages-preview.yml"
      - ".github/workflows/production-route-parity.yml"
      - "scripts/crawl-production-route-parity.ts"
      - "scripts/evaluate-preview-route-parity.ts"
      - "scripts/reconcile-related-product-route-findings.ts"
      - "scripts/related-product-policy.ts"
      - "scripts/resolve-cloudflare-preview-deployment.mjs"
      - "scripts/wait-for-cloudflare-preview-propagation.ts"
      - "scripts/generate-buyer-ready-catalog-manifest.ts"
      - "scripts/generate-buyer-ready-redirects.ts"
      - "scripts/patch-supabase-rpc-pagination.mjs"
      - "scripts/generate-static-route-shells.ts"
      - "scripts/enrich-generic-static-route-shells.mjs"
      - "scripts/enhance-product-route-shells.ts"
      - "scripts/align-taxonomy-route-shells.ts"
      - "scripts/patch-worker-route-parity.mjs"
      - "scripts/install-i18n-worker-gateway.ts"
      - "scripts/verify-route-parity-build.ts"
      - "scripts/strengthen-brand-search-signals.mjs"
      - "public/_redirects"
      - "public/_worker.js"
      - "src/hooks/usePublicCatalog.ts"
      - "src/lib/buyerReadyProductContent.ts"
      - "src/pages/CategoryOrProductPage.tsx"
      - "src/pages/Home.tsx"
      - "src/components/HeroCarousel.tsx"
      - "src/test/productionRouteParityCrawler.test.ts"
      - "src/test/relatedProductRouteParity.test.ts"
      - "src/test/supabaseRpcPaginationGuard.test.ts"
      - "src/test/cloudflarePreviewPropagation.test.ts"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-preview
  cancel-in-progress: true

env:
  PREVIEW_BRANCH: github-preview
  PREVIEW_URL: https://github-preview.irha-apparels.pages.dev
  CANONICAL_ORIGIN: https://irhaapparels.com

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}

    steps:
      - name: Verify Cloudflare credentials and project
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          account_id="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          project_name="$(printf '%s' "$CLOUDFLARE_PROJECT_NAME" | tr -d '[:space:]')"
          test -n "$token" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$account_id" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$project_name" || { echo "CLOUDFLARE_PROJECT_NAME is missing"; exit 1; }
          [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]] || { echo "CLOUDFLARE_ACCOUNT_ID must be the 32-character Account ID only"; exit 1; }
          [[ "$project_name" =~ ^[a-z0-9][a-z0-9-]*[a-z0-9]$ ]] || { echo "CLOUDFLARE_PROJECT_NAME contains invalid characters"; exit 1; }
          echo "::add-mask::$token"
          echo "::add-mask::$account_id"
          verify_json="$(curl -sS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' https://api.cloudflare.com/client/v4/user/tokens/verify)"
          test "$(printf '%s' "$verify_json" | jq -r '.success // false')" = "true" || {
            printf '%s' "$verify_json" | jq -r '.errors[]? | "Cloudflare error \(.code // "unknown"): \(.message // "unknown")"'
            exit 1
          }
          project_json="$(curl -sS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/$account_id/pages/projects/$project_name")"
          test "$(printf '%s' "$project_json" | jq -r '.success // false')" = "true" || {
            printf '%s' "$project_json" | jq -r '.errors[]? | "Cloudflare error \(.code // "unknown"): \(.message // "unknown")"'
            exit 1
          }
          test "$(printf '%s' "$project_json" | jq -r '.result.name // empty')" = "$project_name"

  preview:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
      CRAWL_OUTPUT_DIR: artifacts/preview-route-parity

    steps:
      - name: Normalize Cloudflare environment
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          account_id="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          project_name="$(printf '%s' "$CLOUDFLARE_PROJECT_NAME" | tr -d '[:space:]')"
          expected_preview_url="https://${PREVIEW_BRANCH}.${project_name}.pages.dev"
          test "$PREVIEW_URL" = "$expected_preview_url" || {
            echo "Preview URL mismatch: expected $expected_preview_url, got $PREVIEW_URL"
            exit 1
          }
          echo "::add-mask::$token"
          echo "::add-mask::$account_id"
          {
            echo "CLOUDFLARE_API_TOKEN=$token"
            echo "CLOUDFLARE_ACCOUNT_ID=$account_id"
            echo "CLOUDFLARE_PROJECT_NAME=$project_name"
            echo "EXPECTED_SOURCE_SHA=$GITHUB_SHA"
            echo "PREVIEW_ALIAS_URL=$PREVIEW_URL"
          } >> "$GITHUB_ENV"

      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact lockfile dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build exact source
        run: npm run build

      - name: Recheck release-safe build output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/build.json
          test -s dist/release.txt
          test -s dist/catalog-route-manifest.json
          grep -F 'name="x-irha-release" content="frontend-live-2026-07-13-r11"' dist/index.html
          grep -F 'Irha Apparels — Custom Apparel Manufacturer for Global B2B Buyers' dist/index.html
          grep -F '"repository": "irhaapparelsofficial-ctrl/irha-global-craft-f3881330"' dist/build.json
          grep -F '"supabase_project_id": "pvzjiozismyxqrzmtfbi"' dist/build.json
          grep -F "\"source_commit\": \"$GITHUB_SHA\"" dist/build.json
          grep -F '"source_identity_state": "verified"' dist/build.json
          if grep -R -nF --include='*.html' --include='*.js' --include='*.json' --include='*.txt' --include='*.xml' 'mlefxgyaqoisvdmoiapq' dist; then
            echo "Built frontend references the retired Lovable Cloud database"
            exit 1
          fi

      - name: Deploy preview branch only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist \
            --project-name="$CLOUDFLARE_PROJECT_NAME" \
            --branch="$PREVIEW_BRANCH" \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=false

      - name: Resolve immutable preview deployment URL
        run: node scripts/resolve-cloudflare-preview-deployment.mjs

      - name: Verify isolated preview deployment
        shell: bash
        run: |
          set -euo pipefail
          test "$PREVIEW_URL" != "$PREVIEW_ALIAS_URL" || { echo "Immutable deployment URL was not resolved"; exit 1; }
          ready=0
          for attempt in $(seq 1 24); do
            if curl -fsS --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' \
              "$PREVIEW_URL/?release_check=${GITHUB_SHA::12}-$attempt" -o /tmp/preview-home.html -D /tmp/preview-headers \
              && curl -fsS --connect-timeout 10 --max-time 40 -H 'Cache-Control: no-cache' \
              "$PREVIEW_URL/build.json?release_check=${GITHUB_SHA::12}-$attempt" -o /tmp/preview-build.json; then
              if grep -Eiq '^HTTP/[0-9.]+ 200' /tmp/preview-headers \
                && grep -Fq 'Irha Apparels — Custom Apparel Manufacturer for Global B2B Buyers' /tmp/preview-home.html \
                && jq -e --arg repo 'irhaapparelsofficial-ctrl/irha-global-craft-f3881330' \
                  --arg supabase 'pvzjiozismyxqrzmtfbi' --arg source "$GITHUB_SHA" \
                  '.repository == $repo and .supabase_project_id == $supabase and .source_commit == $source and .source_identity_state == "verified"' \
                  /tmp/preview-build.json >/dev/null; then
                ready=1
                echo "Immutable preview verified on attempt $attempt"
                break
              fi
            fi
            echo "Immutable preview not ready yet (attempt $attempt/24)"
            sleep 10
          done
          test "$ready" = "1" || { echo "Cloudflare preview did not converge safely"; exit 1; }
          if grep -Eiq 'Since 2014|MOQ 50|45-Day Delivery|reply within 12 hours|BSCI Audited|ISO 9001:2015' /tmp/preview-home.html; then
            echo "Legacy production claims are present in preview"
            exit 1
          fi

      - name: Wait for full immutable preview propagation
        run: npx tsx scripts/wait-for-cloudflare-preview-propagation.ts

      - name: Run complete preview route parity crawl
        id: parity
        shell: bash
        run: |
          set +e
          mkdir -p "$CRAWL_OUTPUT_DIR"
          NODE_OPTIONS=--import=./scripts/patch-supabase-rpc-pagination.mjs npx tsx scripts/crawl-production-route-parity.ts 2>&1 | tee "$CRAWL_OUTPUT_DIR/run.log"
          parity_code="${PIPESTATUS[0]}"
          echo "$parity_code" > /tmp/preview-route-parity-raw-exit-code
          echo "parity_code=$parity_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Reconcile related-product route evidence
        run: npx tsx scripts/reconcile-related-product-route-findings.ts

      - name: Evaluate preview-only parity context
        id: evaluation
        shell: bash
        run: |
          set +e
          npx tsx scripts/evaluate-preview-route-parity.ts 2>&1 | tee "$CRAWL_OUTPUT_DIR/evaluation.log"
          evaluation_code="${PIPESTATUS[0]}"
          echo "$evaluation_code" > /tmp/preview-route-parity-exit-code
          echo "evaluation_code=$evaluation_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preserve preview route-parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-route-parity-${{ github.sha }}
          path: artifacts/preview-route-parity
          if-no-files-found: error
          retention-days: 7

      - name: Publish preview summary and enforce parity
        if: always()
        shell: bash
        run: |
          {
            echo "## Cloudflare Preview Route Parity"
            echo "- Immutable preview URL: $PREVIEW_URL"
            echo "- Branch alias: $PREVIEW_ALIAS_URL"
            echo "- Preview branch: $PREVIEW_BRANCH"
            echo "- Preview source: \`$GITHUB_SHA\`"
            echo "- Canonical origin: $CANONICAL_ORIGIN"
            echo "- Raw crawl exit: \`${{ steps.parity.outputs.parity_code || 'not-run' }}\`"
            echo "- Context-safe evaluation exit: \`${{ steps.evaluation.outputs.evaluation_code || 'not-run' }}\`"
            echo "- Production custom domain changed: no"
            echo
            if [ -s "$CRAWL_OUTPUT_DIR/preview-summary.md" ]; then
              cat "$CRAWL_OUTPUT_DIR/preview-summary.md"
            elif [ -s "$CRAWL_OUTPUT_DIR/summary.md" ]; then
              cat "$CRAWL_OUTPUT_DIR/summary.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          test -s /tmp/preview-route-parity-exit-code || { echo "Preview route evaluation did not run"; exit 1; }
          evaluation_code="$(cat /tmp/preview-route-parity-exit-code)"
          test "$evaluation_code" = "0" || {
            echo "Preview route parity retained blocking failures; inspect the artifact."
            exit "$evaluation_code"
          }
