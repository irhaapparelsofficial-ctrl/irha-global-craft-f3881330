name: Commit Secure Dependency Lock

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out security branch
        uses: actions/checkout@v4
        with:
          ref: security/lovable-scan-final
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare secure dependency versions
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.dependencies['@lovable.dev/mcp-js'] = '^0.21.0';
          pkg.devDependencies['vite'] = '8.1.4';
          pkg.devDependencies['@vitejs/plugin-react-swc'] = '4.3.1';
          pkg.devDependencies['vite-imagetools'] = '10.0.1';
          pkg.devDependencies['vitest'] = '4.1.10';
          pkg.overrides = { ...(pkg.overrides || {}), esbuild: '0.28.1' };
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
      - name: Generate and audit secure lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --audit-level=low
      - name: Commit dependency files and retire helper
        run: |
          git rm .github/workflows/dependency-update-artifact.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'security: upgrade vulnerable Vite toolchain'
          git push origin HEAD:security/lovable-scan-final
