name: Generate Secure Dependency Lock

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare secure dependency versions
        run: |
          npm pkg set 'dependencies.@lovable.dev/mcp-js=^0.21.0'
          npm pkg set 'devDependencies.vite=8.1.4'
          npm pkg set 'devDependencies.@vitejs/plugin-react-swc=4.3.1'
          npm pkg set 'devDependencies.vite-imagetools=10.0.1'
          npm pkg set 'devDependencies.vitest=4.1.10'
          npm pkg set 'overrides.esbuild=0.28.1'
      - name: Generate secure lockfile
        id: lock
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm install --package-lock-only --ignore-scripts 2>&1 | tee dependency-upgrade.log
      - name: Audit generated dependency tree
        if: steps.lock.outcome == 'success'
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm audit --audit-level=low 2>&1 | tee dependency-audit.log
      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-dependency-lock
          path: |
            package.json
            package-lock.json
            dependency-upgrade.log
            dependency-audit.log
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce successful secure lock
        if: always()
        shell: bash
        run: |
          test "${{ steps.lock.outcome }}" = "success"
          test "${{ steps.audit.outcome }}" = "success"
