name: Verify production build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Clean install
        shell: bash
        run: |
          npm ci --loglevel=error > npm-ci.log 2>&1 || {
            echo '--- npm ci error tail ---'
            tail -n 80 npm-ci.log
            exit 1
          }
      - name: Production build
        run: npm run build
        env:
          CI: true
