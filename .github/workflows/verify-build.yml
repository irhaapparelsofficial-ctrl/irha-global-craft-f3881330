name: Verify production build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate compatible image-tools lock
        run: npm install --package-lock-only --save-dev --exact vite-imagetools@8.0.0
      - name: Upload corrected package files
        uses: actions/upload-artifact@v4
        with:
          name: corrected-package-files
          path: |
            package.json
            package-lock.json
          retention-days: 1
      - name: Clean install
        run: npm ci
      - name: Production build
        run: npm run build
        env:
          CI: true
