name: Verify production build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Pin Vite 5 compatible image tools
        run: npm install --package-lock-only --save-dev vite-imagetools@8.0.0
      - name: Clean install
        run: npm ci
      - name: Production build
        run: npm run build
        env:
          CI: true
      - name: Commit corrected dependency lock
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Package files already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix(deps): use Vite 5 compatible image tools'
          git push origin HEAD:${{ github.head_ref }}
