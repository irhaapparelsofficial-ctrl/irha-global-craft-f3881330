name: GP1 refresh search route state

on:
  push:
    branches:
      - phase-1-trust-seo-cleanup-20260808
    paths:
      - .github/workflows/gp1-refresh-search-state.yml

permissions:
  contents: write

concurrency:
  group: gp1-refresh-search-route-state
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh deterministic search route state
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact lockfile dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Reproduce only the known stale-state build stop
        shell: bash
        run: |
          set -uo pipefail
          set +e
          npm run build 2>&1 | tee /tmp/gp1-build.log
          build_code=${PIPESTATUS[0]}
          set -e
          if [ "$build_code" -eq 0 ]; then
            echo "Build already passed; no stale-state recovery is needed."
          else
            grep -Fq "Committed material search route state is stale" /tmp/gp1-build.log || {
              echo "Build failed for a reason other than the known deterministic stale-state gate."
              exit "$build_code"
            }
          fi
          test -s dist/seo-route-manifest.json

      - name: Regenerate and verify exact material route state
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-search-route-state.mjs \
            --input dist/seo-route-manifest.json \
            --output seo/search-route-state.json \
            --write
          node scripts/generate-search-route-state.mjs \
            --input dist/seo-route-manifest.json \
            --output seo/search-route-state.json \
            --check
          jq -e '.schemaVersion == 1 and .canonicalOrigin == "https://irhaapparels.com" and .routeCount == 436 and (.routes | length) == 436' seo/search-route-state.json >/dev/null
          ! grep -q '"lastmod"' seo/search-route-state.json

      - name: Commit only the deterministic refresh and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          latest="$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')"
          test "$latest" = "$GITHUB_SHA" || {
            echo "Branch advanced concurrently; refusing to overwrite newer work."
            exit 1
          }

          cp seo/search-route-state.json /tmp/search-route-state.json
          git restore --source="$GITHUB_SHA" --staged --worktree .
          cp /tmp/search-route-state.json seo/search-route-state.json
          rm .github/workflows/gp1-refresh-search-state.yml

          git add seo/search-route-state.json .github/workflows/gp1-refresh-search-state.yml
          git diff --cached --name-only | sort > /tmp/staged.txt
          printf '%s\n' '.github/workflows/gp1-refresh-search-state.yml' 'seo/search-route-state.json' | sort > /tmp/expected.txt
          cmp -s /tmp/staged.txt /tmp/expected.txt || {
            echo "Unexpected staged files detected; refusing to commit."
            cat /tmp/staged.txt
            exit 1
          }
          git diff --cached --quiet -- seo/search-route-state.json && {
            echo "Search route state did not change; refusing an empty recovery commit."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(seo): refresh deterministic search route state"
          git push origin "HEAD:$branch"
