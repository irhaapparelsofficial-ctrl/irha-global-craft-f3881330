name: One-time Secure Dependency Upgrade

on:
  push:
    branches:
      - security/lovable-scan-final

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: security/lovable-scan-final
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Upgrade vulnerable build dependencies
        run: |
          npm pkg set 'dependencies.@lovable.dev/mcp-js=^0.21.0'
          npm pkg set 'devDependencies.vite=8.1.4'
          npm pkg set 'devDependencies.@vitejs/plugin-react-swc=4.3.1'
          npm pkg set 'devDependencies.vite-imagetools=10.0.1'
          npm pkg set 'devDependencies.vitest=4.1.10'
          npm pkg set 'overrides.esbuild=0.28.1'
          npm install --package-lock-only --ignore-scripts
          npm audit --audit-level=low
      - name: Commit locked dependency upgrade and retire this workflow
        run: |
          git rm .github/workflows/dependency-upgrade-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'security: upgrade vulnerable Vite toolchain'
          git push origin HEAD:security/lovable-scan-final
