name: Production Route Parity

run-name: Production crawl · ${{ github.ref_name }} · ${{ github.run_number }}

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-route-parity-main
  cancel-in-progress: true

env:
  CRAWL_ORIGIN: https://irhaapparels.com
  CANONICAL_ORIGIN: https://irhaapparels.com
  CRAWL_OUTPUT_DIR: artifacts/production-route-parity
  SOURCE_SHA: ${{ github.sha }}
  STATUS_CONTEXT: Irha Production Route Parity
  PRODUCTION_CONVERGENCE_ATTEMPTS: "180"
  PRODUCTION_CONVERGENCE_INTERVAL_MS: "8000"

jobs:
  crawl:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Publish pending crawl status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state='pending' \
            -f context="$STATUS_CONTEXT" \
            -f description='Full live production route crawl is running' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null

      - name: Checkout exact current-main source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm exact current main and release statuses
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest_main="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          checked_out="$(git rev-parse HEAD)"
          test "$checked_out" = "$SOURCE_SHA" || { echo "Checked out $checked_out instead of $SOURCE_SHA"; exit 1; }
          test "$SOURCE_SHA" = "$latest_main" || { echo "Refusing stale crawl: $SOURCE_SHA != $latest_main"; exit 1; }

          status_json="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/status")"
          required_contexts=(
            "Irha Quality Gate"
            "Irha Cloudflare Production"
            "Irha Search Discovery"
            "Irha Brand Live"
          )
          for context in "${required_contexts[@]}"; do
            state="$(printf '%s' "$status_json" | jq -r --arg context "$context" '[.statuses[] | select(.context == $context)][0].state // "missing"')"
            test "$state" = "success" || { echo "Required exact-SHA release status is not green: $context=$state"; exit 1; }
          done
          echo "EXPECTED_SOURCE_SHA=$latest_main" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact lockfile dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Verify repository release contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:deployment-source
          npm run verify:secrets
          npm run verify:migrations
          npx tsc --noEmit
          npx vitest run src/test/routeContentStaticFidelity.test.ts src/test/cloudflareRouteShellAssets.test.ts src/test/productionConvergenceBarrier.test.ts src/test/productionRouteParityCrawler.test.ts src/test/relatedProductRouteParity.test.ts src/test/supabaseRpcPaginationGuard.test.ts --reporter=verbose

      - name: Generate authoritative route, sitemap and redirect inputs
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/generate-buyer-ready-catalog-manifest.ts
          NODE_OPTIONS=--import=./scripts/patch-supabase-rpc-pagination.mjs npx tsx scripts/generate-buyer-ready-redirects.ts
          npx tsx scripts/finalize-seo-route-manifest.ts
          npx tsx scripts/align-seo-manifest-taxonomy-runtime.ts
          node scripts/seal-seo-manifest-determinism.mjs
          node scripts/enforce-public-index-policy.mjs sitemap
          test -s public/seo-route-manifest.json
          test -s public/sitemap.xml
          test -s public/_redirects

      - name: Wait for exact production convergence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CRAWL_OUTPUT_DIR"
          npx tsx scripts/wait-for-production-convergence.ts 2>&1 | tee "$CRAWL_OUTPUT_DIR/production-convergence.log"

      - name: Run complete live production crawl
        id: crawl
        shell: bash
        run: |
          set +e
          NODE_OPTIONS=--import=./scripts/patch-supabase-rpc-pagination.mjs npx tsx scripts/crawl-production-route-parity.ts 2>&1 | tee "$CRAWL_OUTPUT_DIR/run.log"
          crawl_code="${PIPESTATUS[0]}"
          echo "$crawl_code" > /tmp/production-route-parity-raw-exit-code
          echo "crawl_code=$crawl_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Reconcile related-product route evidence
        id: reconciliation
        if: always()
        shell: bash
        run: |
          set +e
          npx tsx scripts/reconcile-related-product-route-findings.ts 2>&1 | tee "$CRAWL_OUTPUT_DIR/reconciliation.log"
          reconciliation_code="${PIPESTATUS[0]}"
          echo "$reconciliation_code" > /tmp/production-route-parity-reconciliation-exit-code
          echo "reconciliation_code=$reconciliation_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Calculate authoritative production crawl result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$CRAWL_OUTPUT_DIR/production-route-parity.json" || { echo "Production route report is missing"; exit 1; }
          test "$(cat /tmp/production-route-parity-reconciliation-exit-code 2>/dev/null || printf '1')" = "0" || { echo "Related-product evidence could not be reconciled safely"; exit 1; }
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(`${process.env.CRAWL_OUTPUT_DIR}/production-route-parity.json`, 'utf8'));
          const critical = Number(report?.summary?.findings?.critical ?? -1);
          const high = Number(report?.summary?.findings?.high ?? -1);
          if (critical < 0 || high < 0) throw new Error('Production finding counts are missing');
          fs.writeFileSync('/tmp/production-route-parity-exit-code', critical || high ? '1\n' : '0\n');
          console.log(`Authoritative production findings: critical ${critical}, high ${high}`);
          NODE

      - name: Publish crawl summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Production Route Parity"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Origin: \`$CRAWL_ORIGIN\`"
            echo "- Run ID: \`$GITHUB_RUN_ID\`"
            echo "- Raw crawl exit: \`${{ steps.crawl.outputs.crawl_code || 'not-run' }}\`"
            echo "- Reconciliation exit: \`${{ steps.reconciliation.outputs.reconciliation_code || 'not-run' }}\`"
            echo
            if [ -s "$CRAWL_OUTPUT_DIR/summary.md" ]; then cat "$CRAWL_OUTPUT_DIR/summary.md"; else echo "No crawl summary was generated."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve machine-readable crawl evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-route-parity-${{ env.SOURCE_SHA }}
          path: artifacts/production-route-parity
          if-no-files-found: error
          retention-days: 14

      - name: Enforce crawl result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/production-route-parity-exit-code || { echo "Production crawl did not produce an authoritative exit code"; exit 1; }
          crawl_code="$(cat /tmp/production-route-parity-exit-code)"
          test "$crawl_code" = "0" || { echo "Production route parity found blocking failures"; exit "$crawl_code"; }

      - name: Publish exact commit crawl status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          state='failure'
          description='Production route parity did not complete successfully'
          if [ "${{ job.status }}" = 'success' ] && [ -s /tmp/production-route-parity-exit-code ] && [ "$(cat /tmp/production-route-parity-exit-code)" = '0' ]; then
            state='success'
            description='Full live route crawl passed with zero critical/high findings'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state="$state" \
            -f context="$STATUS_CONTEXT" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          test "$state" = 'success'
