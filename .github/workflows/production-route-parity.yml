name: Production Route Parity

run-name: Production crawl · ${{ github.event.pull_request.number || github.ref_name }} · ${{ github.run_number }}

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/production-route-parity.yml"
      - "scripts/crawl-production-route-parity.ts"
      - "scripts/generate-sitemap.ts"
      - "scripts/augment-sitemap-with-live-catalog.ts"
      - "scripts/generate-buyer-ready-catalog-manifest.ts"
      - "scripts/generate-buyer-ready-redirects.ts"
      - "scripts/generate-static-route-shells.ts"
      - "scripts/finalize-taxonomy-static-shells.ts"
      - "scripts/generate-static-redirect-shells.ts"
      - "scripts/enforce-public-index-policy.mjs"
      - "public/_redirects"
      - "public/robots.txt"
      - "src/test/productionRouteParityCrawler.test.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-route-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CRAWL_ORIGIN: https://irhaapparels.com
  CRAWL_OUTPUT_DIR: artifacts/production-route-parity
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact event source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CRAWL_OUTPUT_DIR"
          printf 'source_sha=%s\norigin=%s\n' "$SOURCE_SHA" "$CRAWL_ORIGIN" > "$CRAWL_OUTPUT_DIR/baseline.txt"

      - name: Confirm exact current-main production baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_main="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          checked_out="$(git rev-parse HEAD)"
          test "$checked_out" = "$SOURCE_SHA" || {
            echo "Checked out $checked_out instead of exact source $SOURCE_SHA"
            exit 1
          }

          compare_json="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/compare/${latest_main}...${SOURCE_SHA}")"
          merge_base="$(printf '%s' "$compare_json" | jq -r '.merge_base_commit.sha // empty')"
          compare_status="$(printf '%s' "$compare_json" | jq -r '.status // empty')"
          test "$merge_base" = "$latest_main" || {
            echo "Route-parity source is stale: merge base ${merge_base:-missing}, current main $latest_main"
            exit 1
          }
          case "$compare_status" in
            ahead|identical) ;;
            *)
              echo "Route-parity source has unsafe compare status: ${compare_status:-missing}"
              exit 1
              ;;
          esac

          echo "EXPECTED_PRODUCTION_SHA=$latest_main" >> "$GITHUB_ENV"
          printf 'expected_production_sha=%s\ncompare_status=%s\nmerge_base=%s\n' "$latest_main" "$compare_status" "$merge_base" >> "$CRAWL_OUTPUT_DIR/baseline.txt"
          echo "Exact green-main baseline: $latest_main"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact lockfile dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Verify repository release contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:deployment-source
          npm run verify:secrets
          npm run verify:migrations
          npx tsc --noEmit
          npx vitest run src/test/productionRouteParityCrawler.test.ts --reporter=verbose

      - name: Run complete live production crawl
        id: crawl
        shell: bash
        run: |
          set +e
          npx tsx scripts/crawl-production-route-parity.ts 2>&1 | tee "$CRAWL_OUTPUT_DIR/run.log"
          crawl_code="${PIPESTATUS[0]}"
          echo "$crawl_code" > /tmp/production-route-parity-exit-code
          echo "crawl_code=$crawl_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish crawl summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Production Route Parity"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Expected production baseline: \`${EXPECTED_PRODUCTION_SHA:-not-resolved}\`"
            echo "- Origin: \`$CRAWL_ORIGIN\`"
            echo "- Crawl exit code: \`${{ steps.crawl.outputs.crawl_code || 'not-run' }}\`"
            echo
            if [ -s "$CRAWL_OUTPUT_DIR/summary.md" ]; then
              cat "$CRAWL_OUTPUT_DIR/summary.md"
            elif [ -s "$CRAWL_OUTPUT_DIR/fatal-error.txt" ]; then
              echo '```text'
              cat "$CRAWL_OUTPUT_DIR/fatal-error.txt"
              echo '```'
            else
              echo "No crawl summary was generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve machine-readable crawl evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-route-parity-${{ env.SOURCE_SHA }}
          path: artifacts/production-route-parity
          if-no-files-found: error
          retention-days: 7

      - name: Enforce crawl result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/production-route-parity-exit-code || {
            echo "Production crawl did not produce an exit code"
            exit 1
          }
          crawl_code="$(cat /tmp/production-route-parity-exit-code)"
          test "$crawl_code" = "0" || {
            echo "Production route parity found blocking failures; inspect the preserved artifact."
            exit "$crawl_code"
          }
