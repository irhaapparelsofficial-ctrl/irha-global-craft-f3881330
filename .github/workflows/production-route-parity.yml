name: Production Route Parity

run-name: Production crawl · ${{ github.ref_name }} · ${{ github.run_number }}

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-route-parity.yml"
      - "scripts/crawl-production-route-parity.ts"
      - "scripts/wait-for-production-convergence.ts"
      - "scripts/reconcile-related-product-route-findings.ts"
      - "scripts/related-product-policy.ts"
      - "scripts/generate-buyer-ready-catalog-manifest.ts"
      - "scripts/generate-buyer-ready-redirects.ts"
      - "scripts/patch-supabase-rpc-pagination.mjs"
      - "src/lib/buyerReadyProductContent.ts"
      - "src/test/productionConvergenceBarrier.test.ts"
      - "src/test/productionRouteParityCrawler.test.ts"
      - "src/test/relatedProductRouteParity.test.ts"
      - "src/test/supabaseRpcPaginationGuard.test.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-route-parity-main
  cancel-in-progress: false

env:
  CRAWL_ORIGIN: https://irhaapparels.com
  CANONICAL_ORIGIN: https://irhaapparels.com
  CRAWL_OUTPUT_DIR: artifacts/production-route-parity
  SOURCE_SHA: ${{ github.sha }}
  STATUS_CONTEXT: Irha Production Route Parity
  PRODUCTION_CONVERGENCE_ATTEMPTS: "45"
  PRODUCTION_CONVERGENCE_INTERVAL_MS: "8000"

jobs:
  crawl:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Publish pending crawl status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state='pending' \
            -f context="$STATUS_CONTEXT" \
            -f description='Full live production route crawl is running' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null

      - name: Checkout exact current-main source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CRAWL_OUTPUT_DIR"
          printf 'source_sha=%s\norigin=%s\ncanonical_origin=%s\nrun_id=%s\n' \
            "$SOURCE_SHA" "$CRAWL_ORIGIN" "$CANONICAL_ORIGIN" "$GITHUB_RUN_ID" \
            > "$CRAWL_OUTPUT_DIR/baseline.txt"

      - name: Confirm exact current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_main="$(bash scripts/ci/retry.sh 3 3 -- gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          checked_out="$(git rev-parse HEAD)"
          test "$checked_out" = "$SOURCE_SHA" || {
            echo "Checked out $checked_out instead of dispatched source $SOURCE_SHA"
            exit 1
          }
          test "$SOURCE_SHA" = "$latest_main" || {
            echo "Refusing stale production crawl: dispatched $SOURCE_SHA, current main $latest_main"
            exit 1
          }
          echo "EXPECTED_SOURCE_SHA=$latest_main" >> "$GITHUB_ENV"
          printf 'expected_source_sha=%s\n' "$latest_main" >> "$CRAWL_OUTPUT_DIR/baseline.txt"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact lockfile dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Wait for exact production convergence
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/wait-for-production-convergence.ts 2>&1 | tee "$CRAWL_OUTPUT_DIR/production-convergence.log"

      - name: Verify repository release contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:deployment-source
          npm run verify:secrets
          npm run verify:migrations
          npx tsc --noEmit
          npx vitest run src/test/productionConvergenceBarrier.test.ts src/test/productionRouteParityCrawler.test.ts src/test/relatedProductRouteParity.test.ts src/test/supabaseRpcPaginationGuard.test.ts --reporter=verbose

      - name: Generate exact production catalogue and redirect manifests
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/generate-buyer-ready-catalog-manifest.ts
          NODE_OPTIONS=--import=./scripts/patch-supabase-rpc-pagination.mjs npx tsx scripts/generate-buyer-ready-redirects.ts

      - name: Run complete live production crawl
        id: crawl
        shell: bash
        run: |
          set +e
          NODE_OPTIONS=--import=./scripts/patch-supabase-rpc-pagination.mjs npx tsx scripts/crawl-production-route-parity.ts 2>&1 | tee "$CRAWL_OUTPUT_DIR/run.log"
          crawl_code="${PIPESTATUS[0]}"
          echo "$crawl_code" > /tmp/production-route-parity-raw-exit-code
          echo "crawl_code=$crawl_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Reconcile related-product route evidence
        id: reconciliation
        if: always()
        shell: bash
        run: |
          set +e
          npx tsx scripts/reconcile-related-product-route-findings.ts 2>&1 | tee "$CRAWL_OUTPUT_DIR/reconciliation.log"
          reconciliation_code="${PIPESTATUS[0]}"
          echo "$reconciliation_code" > /tmp/production-route-parity-reconciliation-exit-code
          echo "reconciliation_code=$reconciliation_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Calculate authoritative production crawl result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$CRAWL_OUTPUT_DIR/production-route-parity.json" || {
            echo "Production route report is missing"
            exit 1
          }
          test "$(cat /tmp/production-route-parity-reconciliation-exit-code 2>/dev/null || printf '1')" = "0" || {
            echo "Related-product route evidence could not be reconciled safely"
            exit 1
          }
          node - <<'NODE'
          const fs = require('node:fs');
          const path = `${process.env.CRAWL_OUTPUT_DIR}/production-route-parity.json`;
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          const critical = Number(report?.summary?.findings?.critical ?? -1);
          const high = Number(report?.summary?.findings?.high ?? -1);
          if (critical < 0 || high < 0) throw new Error('Production route finding counts are missing');
          fs.writeFileSync('/tmp/production-route-parity-exit-code', critical || high ? '1\n' : '0\n');
          console.log(`Authoritative production findings: critical ${critical}, high ${high}`);
          NODE

      - name: Publish crawl summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Production Route Parity"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Origin: \`$CRAWL_ORIGIN\`"
            echo "- Run ID: \`$GITHUB_RUN_ID\`"
            echo "- Raw crawl exit code: \`${{ steps.crawl.outputs.crawl_code || 'not-run' }}\`"
            echo "- Related-policy reconciliation exit: \`${{ steps.reconciliation.outputs.reconciliation_code || 'not-run' }}\`"
            echo
            if [ -s "$CRAWL_OUTPUT_DIR/summary.md" ]; then
              cat "$CRAWL_OUTPUT_DIR/summary.md"
            elif [ -s "$CRAWL_OUTPUT_DIR/fatal-error.txt" ]; then
              echo '```text'
              cat "$CRAWL_OUTPUT_DIR/fatal-error.txt"
              echo '```'
            else
              echo "No crawl summary was generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve machine-readable crawl evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-route-parity-${{ env.SOURCE_SHA }}
          path: artifacts/production-route-parity
          if-no-files-found: error
          retention-days: 14

      - name: Enforce crawl result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/production-route-parity-exit-code || {
            echo "Production crawl did not produce an authoritative exit code"
            exit 1
          }
          crawl_code="$(cat /tmp/production-route-parity-exit-code)"
          test "$crawl_code" = "0" || {
            echo "Production route parity found blocking failures; inspect the preserved artifact."
            exit "$crawl_code"
          }

      - name: Publish exact commit crawl status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          state='failure'
          description='Production route parity did not complete successfully'
          if [ "${{ job.status }}" = 'success' ] \
            && [ -s /tmp/production-route-parity-exit-code ] \
            && [ "$(cat /tmp/production-route-parity-exit-code)" = '0' ]; then
            state='success'
            description='Full live route crawl passed with zero critical/high findings'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state="$state" \
            -f context="$STATUS_CONTEXT" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          test "$state" = 'success'
