name: Refresh Supabase Types Final Once

on:
  push:
    branches: [fix/supabase-types-parity-final]
    paths:
      - .github/workflows/refresh-supabase-types-final-once.yml

permissions:
  contents: write

concurrency:
  group: irha-supabase-types-refresh-final-once
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: pvzjiozismyxqrzmtfbi

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout exact focused branch
        uses: actions/checkout@v4
        with:
          ref: fix/supabase-types-parity-final
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.39.2

      - name: Generate and verify official public-schema types
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${SUPABASE_ACCESS_TOKEN:-}" | tr -d '[:space:]')"
          test -n "$token"
          echo "::add-mask::$token"
          SUPABASE_ACCESS_TOKEN="$token" supabase gen types typescript \
            --project-id "$SUPABASE_PROJECT_ID" \
            --schema public \
            > /tmp/supabase-types.ts
          test -s /tmp/supabase-types.ts
          ! grep -E '(sb_secret_|service_role[^A-Za-z0-9]|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,})' /tmp/supabase-types.ts
          cp /tmp/supabase-types.ts src/integrations/supabase/types.ts
          node scripts/ci/verify-supabase-type-supplement.mjs /tmp/supabase-types.ts

      - name: Commit only canonical generated types and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/refresh-supabase-types-final-once.yml
          git add src/integrations/supabase/types.ts
          if git diff --cached --quiet; then
            echo "No generated type drift remains."
            exit 1
          fi
          git config user.name "irhaapparelsofficial-ctrl"
          git config user.email "294838484+irhaapparelsofficial-ctrl@users.noreply.github.com"
          git commit -m "fix(types): refresh official Supabase public schema"
          git push origin HEAD:fix/supabase-types-parity-final
